{
  id:"d13",
  title:"Dealing with Missing Values — ML Methods",
  subtitle:"Cap 4 (part 2 of 2) — machine-learning-based imputation (KNNI, WKNNI, KMI, FKMI, SVMI, EC, SVDI, LLSI), recent approaches & experimental comparative analysis",
  week:"w7",
  slides:[
    {n:1,title:"Dealing with Missing Values — Chapter Overview",blocks:[
      N("Week 7 continues the same Cap 4 deck (deck slides 30–59). Card N here = deck slide N+29."),
      B("Introduction",0,null,false),
      B("Assumptions and Missing Data Mechanisms",0,null,false),
      B("Simple Approaches to Missing Data",0,null,false),
      B("Maximum Likelihood Imputation Methods",0,null,false),
      B("Machine Learning Based Methods",0,null,false),
      B("Experimental Comparative Analysis",0,null,false)
    ],
      tr:"In the previous lecture we examined statistical approaches for handling missing values — expectation-maximization, multiple imputation, and Bayesian PCA. In this lecture we move into machine learning approaches. Instead of modeling probability distributions directly, these methods learn relationships among observations and attributes and use those relationships to estimate the missing information."},
    {n:2,title:"Machine Learning Based Methods",blocks:[
      B("The imputation methods presented in previous section originated from statistics application",0,null,false),
      B("they model the relationship between the values by searching for the hidden distribution probabilities.",1,null,false),
      B("In Artificial Intelligence modeling the unknown relationships between attributes and the inference of the implicit information contained in a sample data set has been done using Machine Learning models.",0,null,false)
    ],
      tr:"Traditional statistical approaches attempt to model the probability distribution that generated the data. Machine learning approaches take a different perspective: they focus on learning patterns, relationships, and structures directly from the observed data. The same techniques used for prediction, classification, and regression can also be adapted for missing value imputation."},
    {n:3,title:"Machine Learning Based Methods",blocks:[
      B("The same process used to predict a continuous or a nominal value from a previous learning process in regression or classification can be applied to predict the MVs.",0,null,false),
      B("The use of ML methods for imputation alleviates us from searching for the estimated underlying distribution of the data",0,null,false),
      B("but they are still subject to the MAR assumption in order to correctly apply them",1,null,false)
    ],
      tr:"Machine learning methods are an attractive alternative because they reduce the need to explicitly identify the underlying probability distribution. Instead of building a statistical model of the entire data set, we can train a learning algorithm to estimate the missing values directly. However, many of these methods still assume the data is missing at random."},
    {n:4,title:"Imputation with K-Nearest Neighbor (KNNI)",blocks:[
      B("Using this instance-based algorithm, every time a MV is found in a current instance, KNNI computes the KNN and a value from them is imputed",0,null,false),
      B("For nominal values, the most common value among all neighbors is taken",1,null,false),
      B("For numerical values the average value is used",1,null,false),
      B("A proximity measure between instances is needed for it to be defined.",0,null,false),
      B("The Euclidean distance (it is a case of a Lp norm distance) is the most commonly used in the literature.",1,null,false)
    ],
      tr:"K-nearest neighbor imputation is one of the most widely used machine learning approaches. When a missing value is encountered, the algorithm identifies the K most similar observations and uses those neighbors to estimate it: for categorical attributes the most frequent category among the neighbors is chosen, and for numerical attributes the mean of the neighbors is typically used. Quality depends heavily on how similar the observations are, measured with things like Euclidean distance — very similar to the K-means you looked at in CS320. For example, ask for the 15 closest neighbors: if it's categorical and 12 of the 15 have a category, use it; if it's numerical, use the average of the 15."},
    {n:5,title:"Weighted Imputation with K-Nearest Neighbour (WKNNI)",blocks:[
      DG("knn-wknn"),
      B("The Weighted KNN method selects the instances with similar values as KNNI does",0,null,false),
      B("The estimated value now takes into account the different distances to the neighbors",0,null,false),
      B("It uses a weighted mean or the most repeated value according to a similarity measure si(yj)",1,null,false),
      IMG("Formula: 1/sᵢ = Σ_{hᵢ ∈ Oᵢ ⋂ Oⱼ} (y_ih − y_jh)²")
    ],
      tr:"Weighted KNN improves on standard KNN by recognizing that not all neighbors should contribute equally — closer neighbors are generally more informative than distant ones. Instead of treating each neighbor equally, WKNNI assigns weights based on similarity, so more similar observations have greater influence. A formula based on distance says: you're pretty close, you have a big effect; a little further away, a little less; barely in range, even less. Those weights are used when computing the average and the categories."},
    {n:6,title:"Weighted Imputation with K-Nearest Neighbour (WKNNI)",blocks:[
      B("The missing entry yih is estimated as average weighted by the similarity measure",0,null,false),
      IMG("Formula: ŷ_ih = Σ_{j∈I_Kih} sᵢ(yⱼ) y_jh / Σ_{j∈I_Kih} sᵢ(yⱼ)"),
      B("where IKih is the index set of KNN examples of the ith example, and if yjh is missing the jth attribute is excluded from IKih",0,null,false)
    ],
      tr:"The mathematical expression on this slide formalizes the weighted average: each neighboring observation contributes proportionally to its similarity score, so highly similar observations dominate the estimate while less similar ones contribute relatively little. This often produces a more accurate imputation than standard KNN. We're not going through the formula in depth — basically, the further away you are, the less weight you have on the final answer."},
    {n:7,title:"K-means Clustering Imputation (KMI)",blocks:[
      B("In K-means clustering the overall objective is to divide the data set into groups based on the similarity of objects",0,null,false),
      B("A cluster centroid represents the mean value of the objects in the cluster",0,null,false),
      B("K-means measures the intra-cluster dissimilarity by the addition of distances among the objects and the centroid of the cluster",0,null,false)
    ],
      tr:"K-means imputation uses clustering rather than nearest neighbors. The data set is first partitioned into clusters of similar observations, each represented by a centroid that summarizes the characteristics of the observations in that cluster. The assumption is that observations in the same cluster are likely to exhibit similar attribute values — we make clusters of the observed values, and everything in a cluster should be very similar to one another."},
    {n:8,title:"K-means Clustering Imputation (KMI)",blocks:[
      B("In KMI, once the clusters have converged, the last process is to fill in all the non-reference attributes for each incomplete object based on the cluster information",0,null,false),
      B("Data objects that belong to the same cluster are taken to be nearest neighbors of each other, and KMI applies a nearest neighbor algorithm to replace MVs, in a similar way to KNNI",0,null,false)
    ],
      tr:"After the clustering converges, incomplete observations are assigned to the clusters, and missing values are estimated using information from the other observations in the same cluster. Because cluster members share similar characteristics, the estimates are often more meaningful than global averages. So once the clusters are made, we put the items with missing values into them and assume they're similar enough to the other members that we can use some of their values."},
    {n:9,title:"Fuzzy K-means Clustering (FKMI)",blocks:[
      DG("hard-vs-fuzzy"),
      B("In fuzzy clustering, each data object has a membership function U which describes the degree to which this data object belongs to a certain cluster",0,null,false),
      B("The original K-means clustering may be trapped in a local minimum status if the initial points are not selected properly",0,null,false),
      B("Continuous membership values in fuzzy clustering make the resulting algorithms less susceptible to get stuck in a local minimum situation",1,null,false)
    ],
      tr:"Traditional K-means assigns each observation to exactly one cluster, which can cause problems: an observation on the edge could be just barely in one cluster when it really should have been in another, so there's some margin of error. Fuzzy K-means lets observations belong partially to multiple clusters — instead of being only in cluster A because you're near the edge of B, you're now in both A and B. This flexibility addresses ambiguity near cluster boundaries, so fuzzy clustering often gives more robust results: when imputing, we can look at everyone in clusters A and B."},
    {n:10,title:"Fuzzy K-means Clustering (FKMI)",blocks:[
      B("The centroids are not obtained by the mean values.",0,null,false),
      B("We need to consider the membership degree of each data object to compute centroid vk",0,null,false),
      B("Since there are unavailable data in incomplete objects, we use only reference attributes to compute the cluster centroids.",0,null,false),
      IMG("Formula: v_k = Σ_{i=1..N} U(v_k, x_i) × x_i / Σ_{i=1..N} U(v_k, x_i)")
    ],
      tr:"In fuzzy clustering every observation receives a membership value indicating the strength of its association with each cluster. Cluster centroids are computed using these membership values rather than simple means, which lets the algorithm incorporate uncertainty directly into the clustering problem. If your membership is much stronger in A than in B, A is considered more your cluster."},
    {n:11,title:"Fuzzy K-means Clustering (FKMI)",blocks:[
      B("We replace attributes with MVs (non-reference attribute) based on the information about membership degrees and the centroids:",0,null,false),
      IMG("Formula: x_{i,j} = Σ_{k=1..K} U(x_i, v_k) × v_{k,j}, for any non-reference attribute j ∉ R")
    ],
      tr:"Once membership values are determined, missing values are estimated using weighted contributions from multiple clusters. Rather than relying on a single cluster, information is gathered from every cluster according to the observation's degree of membership. If you're 60% likely in A and 40% in B, give A more weight but don't discount B; if you're 99% A and 1% B, A gets far more weight — and those weighted items determine your value."},
    {n:12,title:"Support Vector Machines Imputation (SVMI)",blocks:[
      B("Support Vector Machines Imputation is an SVM regression based algorithm to fill in MVs",0,null,false),
      B("If the attribute with MVs is nominal it will act as a SVM classifier",1,null,false),
      B("It sets the decision attributes (output or classes) as the condition attributes (input attributes) and the condition attributes as the decision attributes",0,null,false),
      B("Only the instances without MVs are used to predict the MV currently being imputed",1,null,false)
    ],
      tr:"Next is Support Vector Machines Imputation (SVMI), which treats missing value estimation as prediction. If the missing attribute is numerical we use regression; if it is categorical we use a classification algorithm. Only complete observations are used to train the prediction model, and the trained model then generates the estimates for the missing values."},
    {n:13,title:"Event Covering (EC)",blocks:[
      B("In EC mixed-mode probability model is approximated by a discrete one",0,null,false),
      B("We discretize the continuous components using a minimum loss of information criterion",1,null,false),
      B("Treating a mixed-mode feature n-tuple as a discrete-valued one, the authors propose a new statistical approach for synthesis of knowledge based on cluster analysis",0,null,false)
    ],
      tr:"Event covering is a more specialized method. The basic idea is to model dependencies among attributes by converting the data set into a discrete representation — the continuous components are handled using a minimum loss of information criterion, finding some relationship between them. The method then identifies groups of observations that share similar dependency structures, and those relationships are used to fill in the missing values."},
    {n:14,title:"Event Covering (EC)",blocks:[
      DG("ec-steps"),
      B("EC consists of 3 steps:",0,null,false),
      B("detect from data patterns which indicate statistical interdependency",1,null,false),
      B("group the given data into clusters based ondetected interdependency",1,null,false),
      B("interpret the underlying patterns for each of the clusters identified",1,null,false)
    ],
      tr:"Event covering consists of three major stages: first, detect the data patterns that indicate interdependency; second, group the data into clusters based on that interdependency; third, interpret the underlying patterns for each cluster identified. The approach combines ideas from clustering and probabilistic modeling — use statistics to find patterns, cluster on them, then interpret each cluster."},
    {n:15,title:"Event Covering (EC)",blocks:[
      B("The cluster initiation process involves the analysis of the nearest neighbour distance distribution on a subset of samples, the selection of which is based on a mean probability criterion",0,null,false),
      B("The nearestneighbour distance d(xi, xj) (Hamming distance) of a sample xi to a set of examples S is defined as:",0,null,false),
      IMG("Formula: D(x_i, S) = min_{x_j∈S, x_i≠x_j} d(x_i, x_j)")
    ],
      tr:"Cluster formation begins by examining nearest-neighbor distances. Observations that appear highly similar are grouped together, and the Hamming distance is commonly used for this."},
    {n:16,title:"Event Covering (EC)",blocks:[
      B("Let C be a set of examples forming a simple cluster. We define the maximum within-cluster nearest-neighbour distance as",0,null,false),
      IMG("Formula: D*_c = max_{x_i∈C} D(x_i, C)"),
      B("the smaller the D∗c , the denser the cluster.",0,null,false)
    ],
      tr:"Once clusters are formed, their internal density is evaluated. Dense clusters generally indicate strong relationships among observations, while sparse clusters don't, and these relationships provide useful information for estimating values. A highly dense cluster tells us there is a major relationship between its values; a sparse cluster we can't really rely on, because there isn't much information to go on."},
    {n:17,title:"Event Covering (EC)",blocks:[
      B("Using a mean probability criterion to select a similar subset of examples, the isolated samples can be easily detected by observing the wide gaps in the nearest neighbour distance space",0,null,false),
      B("An estimation of P(x) known as the dependence tree product approximation can be expressed as:",0,null,false),
      IMG("Formula: P̂(x) = ∏_{j=1..n} P(x_mj | x_m k(j)), 0 < k(j) < 1")
    ],
      tr:"Event covering also estimates a probability for each observation — how likely it is to belong to a particular cluster. You may be in the cluster, but what's the probability you really belong there? If it's 99%, great; if you're only 20% likely to belong, we consider you a lot less. Higher-probability observations tend to play a larger role in the estimation."},
    {n:18,title:"Event Covering (EC)",blocks:[
      B("The probability defined above is known to be the best second-order approximation of the high-order probability distribution",0,null,false),
      B("Then corresponding to each x in the ensemble, a probability P(x) can be estimated",0,null,false),
      B("In general, it is more likely for samples of relatively high probability to form clusters",0,null,false),
      B("By introducing the mean probability below, samples can be divided into two subsets: those above the mean and those below",0,null,false),
      B("Samples above the mean will be considered first for cluster initiation.",1,null,false),
      IMG("Formula: μ_s = Σ_{x∈S} P(x)/|S|")
    ],
      tr:"The algorithm separates observations by whether their estimated probabilities are above or below the average probability. High-probability observations are used first when building clusters because they're considered more representative of the cluster — the further above the mean you are, the more likely you are to contribute, and we take you first."},
    {n:19,title:"Event Covering (EC)",blocks:[
      DG("ec-assign"),
      B("When distance is considered for cluster initiation, we can use the following criteria in assigning a sample x to a cluster.",0,null,false),
      B("If there exists more than one cluster, say Ck |k = 1, 2, . . ., such that D(x,Ck) ≤ D∗   for all k, then all these clusters can be merged together.",1,null,false),
      B("If exactly one cluster Ck exists, such that D(x,Ck) ≤ D∗, then x can be grouped into Ck.",1,null,false),
      B("If D(x,Ck) > D∗ for all clusters Ck , then x may not belong to any cluster",1,null,false)
    ],
      tr:"The final stage assigns observations to clusters based on the distance criteria. Depending on the relationships observed, clusters may be expanded, merged, or left unchanged, and these assignments ultimately determine how the missing values are estimated. Two smaller clusters with very similar criteria can be merged, a cluster can be expanded to include more items, or it can be left alone — repeating until we decide we've done enough."},
    {n:20,title:"Singular Value Decomposition Imputation (SVDI)",blocks:[
      DG("svdi-pipeline"),
      B("In this method, we employ singular value decomposition to obtain a set of mutually orthogonal expression patterns that can be linearly combined to approximate the values of all attributes in the data set",0,null,false),
      B("These patterns, which in this case are identical to the principle components of the data values’ matrix, are further referred to as eigenvalues",0,null,false),
      IMG("Formula: A_{m×m} = U_{m×m} Σ_{m×n} Vᵀ_{n×n}.")
    ],
      tr:"Next is Singular Value Decomposition (SVD) imputation, which is based on matrix factorization. The data set is decomposed into a set of orthogonal components that capture important patterns and structures in the data; these act similarly to the principal components identified by PCA. We decompose the data to find patterns, and we do it in a linear fashion."},
    {n:21,title:"Singular Value Decomposition Imputation (SVDI)",blocks:[
      B("Matrix VT now contains eigenvalues, whose contribution to the expression in the eigenspace is quantified by corresponding eigenvalues on the diagonal of matrix Σ",0,null,false),
      B("We then identify the most significant eigenvalues by sorting the eigenvalues based on their corresponding eigenvalue",0,null,false),
      B("the exact fraction of eigenvalues best for estimation needs to be determined empirically",1,null,false)
    ],
      tr:"Not all components contribute equally. The algorithm identifies the most important components by examining their associated singular values, and only the strongest components are retained for reconstruction and imputation — we don't consider everything the same; only the strongest relationships stay around."},
    {n:22,title:"Singular Value Decomposition Imputation (SVDI)",blocks:[
      B("Once k most significant eigenvalues from VT are selected, we estimate a MV j in example i by first regressing this attribute value against the k eigenvalues and then use the coefficients of the regression to reconstruct j from a linear combination of the k eigenvalues",0,null,false),
      B("The jth value of example i and the jth values of the k eigenvalues are not used in determining these regression coefficients",1,null,false)
    ],
      tr:"After selecting the principal components, regression is used to reconstruct the missing values: each missing value is estimated from a linear combination of the retained components, which lets the method capture complex relationships in high-dimensional data. We're not going through the eigenvalue details on this slide — the basic idea is to take the strong values and perform regression on them to reconstruct the missing values."},
    {n:23,title:"Singular Value Decomposition Imputation (SVDI)",blocks:[
      B("It should be noted that SVD can only be performed on complete matrices",0,null,false),
      B("A good approximation is to first apply EM to complete the matrix in order to obtain the eigenvectors and eigenvalues",0,null,false)
    ],
      tr:"A practical limitation is that SVD requires a complete matrix (the caption renders this as “complex”). So an initial imputation method such as EM is typically applied before the decomposition, and the quality of those initial estimates can influence the result. Building these matrices can be difficult and time-consuming, so applying another method first to obtain the vectors and values makes the whole SVD process a lot easier."},
    {n:24,title:"Local Least Squares Imputation (LLSI)",blocks:[
      B("In this method a target instance that has MVs is represented as a linear combination of similar instances",0,null,false),
      B("Rather than using all available instances in the data, only similar instances based on a similarity measure are used",0,null,false)
    ],
      tr:"Local least squares imputation (LLSI) represents an incomplete observation as a weighted combination of similar observations. Unlike global regression approaches, it focuses on local structure: only the nearest observations are used to estimate the missing values — instead of everyone, we use the people who are closest."},
    {n:25,title:"Local Least Squares Imputation (LLSI)",blocks:[
      DG("llsi-steps"),
      B("There are two steps in the LLSI",0,null,false),
      B("To select k instances by the L2-norm",1,null,false),
      B("Regression and estimation, regardless of how the k instances are selected",1,null,false),
      B("A heuristic k parameter selection method is used by the authors based on Pearson’s correlation coefficient",0,null,false)
    ],
      tr:"This method has two major stages. First, the most similar observations are identified using distance measurements. Second, least squares regression is applied to those neighbors to estimate the missing value — find everyone who is close, then use regression and estimation to determine the missing value."},
    {n:26,title:"Local Least Squares Imputation (LLSI)",blocks:[
      B("Let suppose that w is the instance with the MV, after eliminating the attribute with such MV",0,null,false),
      B("The k rows of the matrix A consist of the KNN instances, without the attribute with missing values",0,null,false),
      B("The least squares problem is formulated as",0,null,false),
      IMG("Formula: min_x ||Aᵀz − w||₂")
    ],
      tr:"This slide presents the mathematical formulation of the regression problem. The objective is to identify the coefficients that best represent the incomplete observation as a combination of the nearest-neighbor observations."},
    {n:27,title:"Local Least Squares Imputation (LLSI)",blocks:[
      B("Then, the MV α is estimated as a linear combination of first values of instances",0,null,false),
      IMG("Formula: α = bᵀz = bᵀ(Aᵀ)†w,"),
      B("where (AT )† is the pseudoinverse of AT",0,null,false)
    ],
      tr:"Not narrated separately in the lecture — after the least-squares formulation (previous slide), the professor moved directly on to recent machine learning approaches."},
    {n:28,title:"Recent Machine Learning Approaches",blocks:[
      B("There is a great amount of journal publications showing their application and particularization to real world problems",0,null,false),
      B("They can be grouped by the paradigm in which they are based on:",0,null,false),
      B("Clustering: MLP hybrid, LLS based, Fuzzy c-means with SVR and GAs, Hierarchical Clustering, K2 clustering, Weighted K-means, etc.",1,null,false),
      B("ANNs: RBFN based, Wavelet ANNs, MLP, ANNs framework, SOM,",1,null,false),
      B("Bayesian networks: Dynamic bayesian networks, Bayesian networks with weights, Mixture-kernel-based iterative estimator",1,null,false),
      B("Nearest neighbors: ICkNNI, Iterative KNNI, CGImpute, Boostrap for maximum likelihood, kDMI",1,null,false),
      B("Ensembles: Random Forest, Decision forest, GMDH",1,null,false),
      B("Similarity and correlation: FIMUS",1,null,false),
      B("Parameter estimation for regression imputation: EAs for covariance matrix estimation, Iterative mutual information imputation, CMVE, DMI (EM + decision trees), WLLSI",1,null,false)
    ],
      tr:"Missing value imputation continues to evolve. Researchers have proposed numerous advanced approaches — neural-network-based methods, Bayesian networks, hybrid systems, advanced nearest-neighbor approaches, clustering ones. It's an ever-evolving field, with a lot of journal publications if you want to look at how these are handled with machine learning."},
    {n:29,title:"Experimental Comparative Analyses",blocks:[
      N("This card merges the section-divider outline slide (deck slide 58) with the comparative-analysis slide (deck slide 59)."),
      DG("best-by-learner"),
      B("Summary of some major studies:",0,null,false),
      B("If we analyze the imputed values as possible noise, CMC and EC are the less disturbing ones",1,null,false),
      B("It is also interesting to note that EC and CMC are able to better maintain the mutual information between the imputed values and the class label",1,null,false),
      B("Those techniques that produce a set of rules as a model benefit more from FKMI, EC and SVMI",1,null,false),
      B("For black box classifiers, EC and KMI are more appropriate",1,null,false),
      B("Lazy learning methods take advantage of CMC and MC, as they disturb the distance calculation the least",1,null,false),
      B("Not imputing or deleting instances with MVs are not recommended",1,null,false),
      B("It is also important to note that there is no universal imputation method which performs best for all classifiers.",0,null,false)
    ],
      tr:"We conclude the chapter with comparative studies that evaluated many of these imputation methods across different learning algorithms; the book's authors summarize findings from multiple studies. Not imputing values or deleting observations is generally not recommended — we don't want to delete things or leave them blank. Event covering and class-based median/mode approaches tend to preserve information effectively. Rule-based learners often benefit from fuzzy K-means, event covering, and SVMI; black-box classifiers perform well with event covering and K-means; distance-based learners benefit from CMC and MC because they minimally distort distance calculations. Perhaps the most important conclusion: no single method consistently performs better than the others, so you have to try multiple methods in an iterative process. Effectiveness also depends on the learning algorithm, the data set's characteristics, the missingness mechanism, and the amount of missing data — you have to evaluate which method is best in which scenario."}

{
  id:"d14",
  title:"Dealing with Noisy Data",
  subtitle:"Cap 5 — identifying noise, class vs attribute noise, NCAR/NAR/NNAR, simulating noise, noise filters (EF, CVCF, IPF), robust learners & comparative analysis",
  week:"w8",
  slides:[
    {n:1,title:"Dealing with Noisy Data — Chapter Overview",blocks:[
      N("This one card merges the title slide, the outline (deck slides 2–3) and the identical section dividers (deck slides 5, 16, 28, 39, 44). Card → deck slide: 2→4 · 3–10→6–13 · 11→14–15 · 12–22→17–27 · 23–32→29–38 · 33–36→40–43 · 37→45."),
      B("Introduction",0,null,false),
      B("Identifying Noise",0,null,false),
      B("Types of Noise",0,null,false),
      B("Noise Filtering",0,null,false),
      B("Robust Learners Against Noise",0,null,false),
      B("Experimental Comparative Analysis",0,null,false)
    ],
      tr:"Today we examine another major data quality problem: noise. In previous chapters we focused on missing values; in this chapter we shift our attention to incorrect or corrupted data. Noise can significantly reduce the performance of machine learning models, distort patterns, and make it more difficult for algorithms to determine meaningful relationships in the data. Our goal is to understand what noise is, how it affects learning, how it can be detected, and what techniques we can use to deal with it. We'll discuss six major topics: an introduction to noisy data, identifying noise, types of noise, noise filtering, some learning methods, and some experimental results and comparisons."},
    {n:2,title:"Introduction",blocks:[
      B("The presence of noise in data is a common problem that produces several negative consequences in classification problems",0,null,false),
      B("The performance of the models built under such circumstances will heavily depend on the quality of the training data",0,null,false),
      B("Problems containing noise are complex problems and accurate solutions are often difficult to achieve without using specialized techniques",0,null,false)
    ],
      tr:"Noise is a common problem in classification tasks. Incorrect labels, faulty measurements, transmission errors, and data entry mistakes often introduce noise — someone types something wrong, a sensor is faulty, or someone labels you a graduate student instead of an undergraduate when entering you into the system. The performance of any machine learning system depends heavily on the quality of its training data; as noise increases, learning becomes more difficult and predictive accuracy often declines. If undergrads are mislabeled as grads and grads as undergrads, that causes noise, and the more it happens the more issues we have. For many data sets, special techniques are required to maintain acceptable performance when noise is present."},
    {n:3,title:"Identifying Noise",blocks:[
      B("The presence of noise in the data may affect the intrinsic characteristics of a classification problem",0,null,false),
      B("Noise may create small clusters of instances of a particular class in parts of the instance space corresponding to another class,",1,null,false),
      B("remove instances located in key areas within a particular class,",1,null,false),
      B("disrupt the boundaries of the classes and increase overlapping among them.",1,null,false)
    ],
      tr:"Before we can remove or manage noise, we need to understand how it affects a classification problem and how noisy observations can be recognized. Noise can significantly alter the structure of a data set: it may create artificial clusters, remove important observations, distort class boundaries, and increase overlapping among classes. As a result, classifiers may learn patterns that do not actually exist, or fail to identify patterns that do exist — faulty patterns or false positives, or missing patterns that are really in the data. So we have to try to identify this noise and deal with it."},
    {n:4,title:"Identifying Noise",blocks:[
      B("Noise is specially relevant in supervised problems, where it alters the relationship between the informative features and the measure output",0,null,false),
      B("For this reason noise has been specially studied in classification and regression",1,null,false),
      B("Robustness is the capability of an algorithm to build models that are insensitive to data corruptions and suffer less from the impact of noise",0,null,false),
      B("The more robust an algorithm is, the more similar the models built from clean and noisy data are",1,null,false)
    ],
      tr:"Noise is particularly problematic in supervised learning because it disrupts the relationship between the input variables and the targets — if we're looking for the top undergrads but you've been labeled as a grad, you don't show up in that pattern. This introduces the concept of robustness: a robust algorithm continues to perform reasonably well even when the training data contains errors. The more robust an algorithm is, the smaller the difference between models trained on clean data and those trained on noisy data. A robust model should handle some noise — not all noise, and there's no way to be 100% robust — but a little bit, and that's what makes it robust."},
    {n:5,title:"Identifying Noise",blocks:[
      B("Robustness is considered more important than performance results when dealing with noisy data",0,null,false),
      B("it allows one to know a priori the expected behavior of a learning method against noise in cases where the characteristics of noise are unknown",1,null,false)
    ],
      tr:"In noisy environments, robustness becomes more important than achieving the highest possible accuracy on a clean data set. A highly accurate algorithm that collapses when noise appears may be less useful than a slightly less accurate algorithm that behaves consistently. We may give up a little accuracy to deal with noise, because noise is always going to exist — we're OK with a few false positives because there may be noise in the data."},
    {n:6,title:"Identifying Noise",blocks:[
      DG("noise-approaches"),
      B("Several approaches have been studied in the literature to deal with noisy data:",0,null,false),
      B("Robust learners. These are techniques characterized by being less influenced by noisy data. An example of a robust learner is the C4.5 algorithm",0,null,false),
      B("Data polishing methods. Their aim is to correct noisy instances prior to training a learner",0,null,false),
      B("Noise filters identify noisy instances which can be eliminated from the training data",0,null,false)
    ],
      tr:"Researchers have developed three major approaches for dealing with noise. First, robust learning algorithms that naturally tolerate noisy data. Second, data polishing methods that attempt to correct noisy observations. Third, noise filters that identify potentially noisy instances and remove them from the training set before learning begins. You can use one or several of these on your training set or learning algorithm, but you won't always be able to get rid of noise — that's why we try to make things as robust as possible."},
    {n:7,title:"Identifying Noise",blocks:[
      B("Noise is not the only problem that supervised ML techniques have to deal with.",0,null,false),
      B("Complex and nonlinear boundaries between classes are problems that may hinder the performance of classifiers",0,null,false),
      B("it often is hard to distinguish between such overlapping and the presence of noisy examples",1,null,false),
      B("Relevant issues related to the degradation of performance:",0,null,false),
      B("Presence of small disjuncts",1,null,false),
      B("Overlapping between classes",1,null,false)
    ],
      tr:"Noise is not the only challenge faced by machine learning algorithms. Complex boundaries between classes, highly non-linear relationships, and overlapping classes can also reduce performance, and sometimes it's difficult to determine whether poor performance is caused by actual noise or by a naturally difficult classification problem. Overlapping between classes and small disjuncts are problems too — if you're not getting the performance you expect, it's not always just noise."},
    {n:8,title:"Identifying Noise",blocks:[
      DG("disjuncts-overlap"),
      IMG("Figure caption: “Examples of the interaction between classes: a small disjuncts and b overlapping”")
    ],
      tr:"This figure illustrates how class boundaries can become complicated. Some areas are naturally difficult to classify even without noise, which makes identifying truly noisy observations a challenge. In the first panel we have small disjunct groups away from the major group — small subclassifications that may or may not be noise. In the second we have a lot of overlapping values; the classes are clearly overlapping each other, and once again these could be noise or could not be noise."},
    {n:9,title:"Identifying Noise",blocks:[
      B("Another interesting problem is pointed out:",0,null,false),
      B("the higher or lower presence of examples located in the area surrounding class boundaries, which are called borderline examples",1,null,false),
      B("Misclassification often occurs near class boundaries where overlapping usually occurs",0,null,false),
      B("Classifier performance degradation was strongly affected by",0,null,false),
      B("the quantity of borderline examples",1,null,false),
      B("the presence of other noisy examples located farther outside the overlapping region",1,null,false)
    ],
      tr:"Research has shown that instances near class boundaries are particularly important. Misclassification tends to occur in these regions because classes overlap or decision boundaries become more complex, and the number of observations near the boundaries can significantly influence classifier performance. Points near a cluster's centroid are probably in that class; the ones on the edge, where two classes are almost touching, are the ones we're really interested in. Classifiers degrade quite a bit when there are a lot of these borderline examples — which could be bad data or could be noise, so we take time to investigate them."},
    {n:10,title:"Identifying Noise",blocks:[
      B("Safe examples are placed in relatively homogeneous areas with respect to the class label.",0,null,false),
      B("Borderline examples are located in the area surrounding class boundaries, where either the minority and majority classes overlap or these examples are very close to the difficult shape of the boundary",0,null,false),
      B("Noisy examples are individuals from one class occurring in the safe areas of the other class",0,null,false)
    ],
      tr:"The authors distinguish three kinds of observations. Safe examples occur in regions dominated by a single class; borderline examples occur at decision boundaries where distinguishing classes is difficult; and noisy examples appear within regions dominated by another class. We want to look at the safe and borderline examples, but we really want to look at the noisy ones and see whether they are actual noise or something else."},
    {n:11,title:"Identifying Noise",blocks:[
      N("Merges deck slide 14 (the figure) with deck slide 15, which repeats slide 13’s three definitions word for word."),
      DG("safe-border-noisy"),
      IMG("Figure labels: Safe examples · Borderline examples · Noisy examples (s / b / n points around a wavy class boundary)"),
      B("Safe examples are placed in relatively homogeneous areas with respect to the class label.",0,null,false),
      B("Borderline examples are located in the area surrounding class boundaries, where either the minority and majority classes overlap or these examples are very close to the difficult shape of the boundary",0,null,false),
      B("Noisy examples are individuals from one class occurring in the safe areas of the other class",0,null,false)
    ],
      tr:"This figure visualizes the distinction among safe, borderline, and noisy examples. Understanding these categories matters because many noise-detection methods try to distinguish true noise from legitimate but difficult observations: some points are clearly safe, some sit on or close to the border, and the ones further out in the other class's area are the noisy ones we want to examine. A key challenge is that borderline examples are not necessarily noise — in many cases they're valid observations near complex class boundaries, and removing them indiscriminately may actually hurt the classifier's performance."},
    {n:12,title:"Types of Noise",blocks:[
      B("A large number of components determine the quality of a data set",0,null,false),
      B("Among them, the class labels and the attribute values directly influence such a quality",0,null,false),
      B("The quality of the class labels refers to whether the class of each example is correctly assigned",1,null,false),
      B("the quality of the attributes refers to their capability of properly characterizing the examples for classification purposes",1,null,false)
    ],
      tr:"Now that we understand how noise appears, we can examine categories of noise. Two elements strongly influence data set quality: attribute values and class labels, and errors in either can introduce noise. The quality of a class label refers to whether the class was correctly assigned; the quality of the attributes refers to how well they characterize an entry. If there are errors in your attributes you may receive the wrong class, and if your class is wrong, your attribute values may wrongly affect the classification algorithm."},
    {n:13,title:"Types of Noise",blocks:[
      B("Based on these two information sources, two types of noise can be distinguished:",0,null,false),
      B("Class noise (also referred as label noise) occurs when an example is incorrectly labeled. Two types of class noise can be distinguished:",1,null,false),
      B("Contradictory examples",2,null,false),
      B("Misclassifications",2,null,false),
      B("Attribute noise refers to corruptions in the values of one or more attributes  erroneous attribute values, missing or unknown attribute values, and incomplete attributes or “do not care” values",1,null,false)
    ],
      tr:"Two major categories of noise are commonly discussed. Class noise occurs when labels are incorrect — examples include misclassifications or contradictory examples. Attribute noise occurs when input attributes contain incorrect, corrupted, incomplete, or missing values. Both can harm learning, but they affect the models in different ways."},
    {n:14,title:"Types of Noise",blocks:[
      B("Attribute noise is more harmful than class noise",0,null,false),
      B("Eliminating or correcting examples in data sets with class and attribute noise, respectively, may improve classifier performance",0,null,false),
      B("Attribute noise is more harmful in those attributes highly correlated with the class labels",0,null,false),
      B("Most of the works found in the literature are only focused on class noise",0,null,false)
    ],
      tr:"The authors note that attribute noise is often more damaging than class noise, especially when it affects attributes strongly related to the target variable. Despite this, much of the research literature has focused on class noise because it's easier to study and simulate."},
    {n:15,title:"Noise Introduction Mechanisms",blocks:[
      B("Traditionally the label noise introduction mechanism has not attracted much attention",0,null,false),
      B("However, the nature of noise becomes more and more important",0,null,false),
      B("Authors distinguish between three possible statistical models for label noise",0,null,false)
    ],
      tr:"Just as missing values have missingness mechanisms, noise can arise through different processes. Noise introduction hasn't attracted much attention, but it has become more and more important. The authors discuss three possible types of noise."},
    {n:16,title:"Noise Introduction Mechanisms",blocks:[
      DG("noise-model-a"),
      B("In the most simplistic case in which the noise procedure is not dependent of either the true value of the class Y or the input attribute values X, the label noise is called noise completely at random or NCAR",0,null,false)
    ],
      tr:"The first mechanism is Noise Completely At Random (NCAR), where the probability of introducing noise is independent of both the class labels and the attribute values — the same idea as missing completely at random."},
    {n:17,title:"Noise Introduction Mechanisms",blocks:[
      DG("noise-model-b"),
      B("Things get more complicated in the noise at random (NAR) model. Although the noise is independent of the inputs X, the true value of the class make it more or less prone to be noisy. This asymmetric labeling error can be produced by the different cost of extracting the true class, as for example in medical case-control studies, financial score assets and so on",0,null,false)
    ],
      tr:"The second mechanism is Noise At Random (NAR), where some classes may be more likely to receive incorrect labels than others."},
    {n:18,title:"Noise Introduction Mechanisms",blocks:[
      DG("noise-model-c"),
      B("The third and last noise model is the noisy not at random (NNAR), where the input attributes somehow affect the probability of the class label being erroneous. NNAR model is the more general case of class noise.",0,null,false)
    ],
      tr:"The most general case is Noisy Not At Random (NNAR), where the probability of corruption depends on both the attribute values and the class labels. NNAR is usually the most difficult situation because the corruption process is tied directly to the structure of the data."},
    {n:19,title:"Noise Introduction Mechanisms",blocks:[
      B("In the case of attribute noise, the modelization described above can be extended and adapted:",0,null,false),
      B("When the noise appearance does not depend either on the rest of the input features’ values or the class label the NCAR noise model applies",1,null,false),
      B("When the attribute noise depends on the true value  but not on the rest of input values or the observed class label y the NAR model is applicable",1,null,false),
      B("In the last case (NNAR) the noise probability will depend on the value of the feature but also on the rest of the input feature values",1,null,false)
    ],
      tr:"For attribute noise the models above can be adapted. When the noise does not depend on the input values or the class label, NCAR can be used. When it depends on the real value but not the rest of the input values, NAR can be used. When it depends on other input values along with its own value, NNAR can be used."},
    {n:20,title:"Simulating the Noise of Real-World Data Sets",blocks:[
      B("Checking the effect of noisy data on the performance of classifier learning algorithms is necessary to improve their reliability and has motivated the study of how to generate and introduce noise into the data",0,null,false),
      B("Noise generation can be characterized by three main characteristics:",0,null,false),
      B("The place where the noise is introduced",1,null,false),
      B("The noise distribution",1,null,false),
      B("The magnitude of generated noise values",1,null,false)
    ],
      tr:"Researchers frequently simulate noise in order to evaluate learning algorithms. Three characteristics matter: where the noise is introduced, the noise distribution (in a few cases or a lot? completely at random?), and the magnitude of the corruption — if a value should be in a range of one to 10 and we get 10 million, we want to look at that. These become important when deciding how to handle noise."},
    {n:21,title:"Simulating the Noise of Real-World Data Sets",blocks:[
      B("The two types of noise considered, class and attribute noise, have been modeled using four different noise schemes:",0,null,false),
      B("Class noise is introduced using an uniform class noise scheme (randomly corrupting the class labels of the examples) and a pairwise class noise scheme (labeling examples of the majority class with the second majority class)",1,null,false),
      B("Attribute noise is introduced using an uniform attribute noise scheme when erroneous attribute values can be totally unpredictable, and the Gaussian attribute noise scheme if noise is a low variation with respect to the correct value",1,null,false)
    ],
      tr:"Two types of noise are considered, class and attribute, modeled with different approaches. For class labels, common approaches are uniform noise (randomly corrupting the class labels) and pairwise label corruption (labeling the majority class with the next largest class label). For attributes, researchers often use uniform attribute noise, similar to class labels, or Gaussian noise. We simulate noise to test whether our classifier can handle it — if we train only on data with no noise, we might not be able to handle noise in the future."},
    {n:22,title:"Simulating the Noise of Real-World Data Sets",blocks:[
      DG("robustness-test"),
      B("Robustness  compare the performance of the classifiers learned with the original (without induced noise) data set with the performance of the classifiers learned using the noisy data set",0,null,false),
      B("Those classifiers learned from noisy data sets being more similar (in terms of results) to the noise free classifiers will be the most robust ones.",0,null,false)
    ],
      tr:"By comparing model performance before and after noise is introduced, researchers can measure robustness: the closer the noisy model performs to the original, the more robust it is. Train the model on clean data, introduce noise, retrain — if they perform very similarly the model is robust; if very differently, it's not as robust. So we take care to introduce noise into our training sets."},
    {n:23,title:"Noise Filtering at Data Level",blocks:[
      B("Noise filters are preprocessing mechanisms to detect and eliminate noisy instances in the training set",0,null,false),
      B("Result  reduced training set which is used as an input to a classification algorithm",0,null,false),
      B("The separation of noise detection and learning has the advantage that noisy instances do not influence the classifier building design",0,null,false)
    ],
      tr:"Having examined how noise affects data sets, we turn to techniques that identify or remove noisy observations. Noise filters act as a preprocessing method: they identify suspicious observations before model training begins, so that removed noisy observations don't affect the building of the classifier. But even with perfect data we may want to add some noise after training to see whether the model can handle it — we don't want to remove all noise, because real-world data is going to have noise and a model that isn't robust to it is a problem."},
    {n:24,title:"Noise Filtering at Data Level",blocks:[
      B("Noise filters are generally oriented to detect and eliminate instances with class noise from the training data",0,null,false),
      B("Elimination of such instances has been shown to be advantageous",0,null,false),
      B("The elimination of instances with attribute noise seems counterproductive",1,null,false),
      B("Instances with attribute noise still contain valuable information in other attributes which can help to build the classifier",1,null,false),
      B("It is also hard to distinguish between noisy examples and true exceptions",0,null,false)
    ],
      tr:"Noise filters usually detect and eliminate instances with class noise, and research shows that removing observations affected by class noise can greatly improve performance. Removing observations with attribute noise is more problematic, because those observations may still contain useful information in other variables. It's also hard to determine whether something is noise or an actual exception — in fraud detection, the outliers are exactly what we're looking for, so we can't just remove everything we think is noise. That's part of why data cleaning takes so long: about 80% of the data mining process is data cleaning and preparation."},
    {n:25,title:"Noise Filtering at Data Level",blocks:[
      DG("filters-compare"),
      B("We will consider three noise filters designed to deal with mislabeled instances as they are the most common and the most recent",0,null,false),
      B("It should be noted that these three methods are ensemble-based and vote-based filters.",0,null,false),
      B("Collecting information from different models will provide a better method for detecting mislabeled instances than collecting information from a single model",0,null,false)
    ],
      tr:"The chapter focuses on three modern filtering approaches, all ensemble-based and vote-based. The idea is that multiple models can collectively identify suspicious observations more effectively than a single model. If several tools agree that something is noise, it's more likely to be noise; if only one agrees, it's less likely. Using just one may produce many false positives."},
    {n:26,title:"Ensemble Filter",blocks:[
      B("The Ensemble Filter (EF) is a well-known filter in the literature",0,null,false),
      B("It uses a set of learning algorithms to create classifiers in several subsets of the training data",0,null,false),
      B("They serve as noise filters for the training set.",0,null,false),
      B("The authors originally proposed the use of C4.5, 1-NN and LDA",0,null,false)
    ],
      tr:"The ensemble filter uses several different learning algorithms to identify mislabeled instances — examples include decision trees, nearest-neighbor methods, and linear discriminant analysis — which serve to filter the training set. If multiple classifiers consistently disagree with an observation's label, that observation is considered suspicious and may be removed: three or four of you agree it's suspicious → high probability of noise; only one → low probability; all of you → very high, and remove it from the training set."},
    {n:27,title:"Ensemble Filter",blocks:[
      N("The algorithm box on this slide is an image — its text is transcribed word for word below."),
      B("The complete process carried out by EF is described below:",0,null,false),
      B("Split the training data set D_T into Γ equal sized subsets.",1,null,false),
      B("For each one of the μ filter algorithms:",1,null,false),
      B("For each of these Γ parts, the filter algorithm is trained on the other Γ − 1 parts. This results in Γ different classifiers.",2,null,false),
      B("These Γ resulting classifiers are then used to tag each instance in the excluded part as either correct or mislabeled, by comparing the training label with that assigned by the classifier.",2,null,false),
      B("At the end of the above process, each instance in the training data has been tagged by each filter algorithm.",1,null,false),
      B("Add to D_N the noisy instances identified in D_T using a voting scheme, taking into account the correctness of the labels obtained in the previous step by the μ filter algorithms. We use a consensus vote scheme in this case.",1,null,false),
      B("Remove the noisy instances from the training set: D_T ← D_T\\D_N.",1,null,false)
    ],
      tr:"Here is the actual algorithm, and it's very basic. Split the training set into equal-sized subsets; run each filter algorithm on each of the subsets; the resulting classifiers tag each instance as a possible issue; then the filter combines the votes into some probability and applies a threshold. I'm not going to read through the whole algorithm — I'll let you do that on your own."},
    {n:28,title:"Cross-Validated Committees Filter",blocks:[
      B("The Cross-Validated Committees Filter (CVCF) is mainly based on performing an Γ -FCV to split the full training data and on building classifiers using decision trees in each training subset",0,null,false),
      B("The authors of CVCF place special emphasis on using ensembles of decision trees such as C4.5",0,null,false)
    ],
      tr:"The cross-validated committees filter uses cross-validation to create multiple training subsets. A committee of classifiers is trained, and observations that repeatedly appear inconsistent across these committees are identified as noisy. Decision tree ensembles such as C4.5 are frequently used in this approach. (In the lecture this was narrated after the iterative-partitioning filter.)"},
    {n:29,title:"Cross-Validated Committees Filter",blocks:[

      B("The basic steps of CVCF are the following:",0,null,false),
      B("Split the training data set D_T into Γ equal sized subsets.",1,null,false),
      B("For each of these Γ parts, a base learning algorithm is trained on the other Γ − 1 parts. This results in Γ different classifiers. We use C4.5 as base learning algorithm in our experimentation as recommended by the authors.",1,null,false),
      B("These Γ resulting classifiers are then used to tag each instance in the training set D_T as either correct or mislabeled, by comparing the training label with that assigned by the classifier.",1,null,false),
      B("Add to D_N the noisy instances identified in D_T using a voting scheme (the majority scheme in our experimentation), taking into account the correctness of the labels obtained in the previous step by the Γ classifier built.",1,null,false),

    {n:30,title:"Iterative-Partitioning Filter",blocks:[

    {n:31,title:"Iterative-Partitioning Filter",blocks:[

      B("These Γ resulting classifiers, are then used to tag each instance in the training set D_T as either correct or mislabeled, by comparing the training label with that assigned by the classifier.",1,null,false),

    {n:32,title:"More Filtering Methods",blocks:[

    {n:33,title:"Robust Learners Against Noise",blocks:[

      tr:"Instead of removing noisy observations, another strategy is designing learning algorithms that naturally tolerate noise. In the real world we might not be able to remove it, and filters aren't perfect. Noise filtering always carries a risk because useful observations may be removed accidentally. Robust learning methods learn effectively even when some training examples are inaccurate — the goal is not to remove noise but to reduce its influence. One strong approach is to train multiple classifiers and see where they agree; where a couple don't agree, take a closer look and assign some probability."},
    {n:34,title:"Robust Learners Against Noise",blocks:[

    {n:35,title:"Robust Learners Against Noise",blocks:[

    {n:2,title:"Handling Missing Data: Sentinel Values",blocks:[

    {n:3,title:"Filtering Out Missing Data",blocks:[

      CODE("# Drops row if ANY column is NA\ndf.dropna()"),

    {n:4,title:"Imputing Missing Value Ranges",blocks:[

      B("Interpolation: Propagate adjacent observations.",0,null,false),

      tr:"We can impute missing value ranges: instead of just deleting them, we can replace them. Here, in our data frame, we fill all of the NAs in column A with a median value. So instead of just removing them, pandas has the ability to fill them, and you can choose whatever you want — median, average, min, max, that sort of thing."},
    {n:5,title:"Data Transformation Toolset",blocks:[
      TBL(["Wrangling Operation", "Pandas Implementation API", "Execution Code Pattern", "Pipeline Impact & Result"],[["Removing Duplicates", "df.drop_duplicates()", "df.drop_duplicates(['k'])", "Drops duplicate records matching subset column 'k'."], ["Element Mapping", "series.map(dict_or_func)", "s.map({'old': 'new'})", "Transforms element-wise fields via lookup keys."], ["Value Replacement", "df.replace(a, b)", "df.replace(-999, np.nan)", "Converts placeholder errors into standard null values."], ["Renaming Axes", "df.rename()", "df.rename(columns=str.upper)", "Alters header schema formatting into uppercase safely."]])
    ],
      tr:"We can also transform the data set using built-in tools. We can remove duplicates using drop_duplicates. We can do element mapping, which transforms element-wise fields via lookup keys. We can do value replacement — replace all −999 with NA, for example, so placeholders become NA values. You can't have a negative number of sales of an item, so we could replace that negative number with zero or with NA — there's any number of things we can do. We can also rename columns; this example makes the columns uppercase."},
    {n:6,title:"Discretization & Binning Mechanics",blocks:[

      tr:"We can do discretization (the caption hears it as “decentralization”) and binning. We can divide continuous numeric distributions into categorical values using edges — it's often easier to deal with a categorical value than a numeric one — and we do that with cut. We can do quantile-based binning via qcut, which partitions observations into quantile intervals using actual sample data, ensuring roughly the same number of elements per category."},
    {n:7,title:"Detecting & Filtering Outliers",blocks:[

      CODE("# Retrieve rows exceeding 3 standard deviations\noutliers = df[(np.abs(df['val']) > 3)]\n# Cap values smoothly using clip\ndf['val'] = df['val'].clip(lower=-3, upper=3)"),

    {n:8,title:"Sampling & Indicator Metrics",blocks:[

{
  id:"d16",
  title:"Data Wrangling: Join & Reshape",
  subtitle:"Python for Data Analysis · Chapter 8 — hierarchical indexing, merges & joins, concatenation, combining & reshaping (Wes McKinney, 3rd ed.)",
  week:"w9",
  slides:[
    {n:1,title:"Data Wrangling: Join & Reshape",blocks:[
      P("Chapter 8: Hierarchical Indexing, Dataset Merging, Concatenation, & Reshaping"),
      P("BASED ON WES MCKINNEY (3RD EDITION)")
    ],
      tr:"In this lecture we talk about data wrangling — in particular, joining and reshaping data. Joins combine data from multiple different sources (you learned joins as joining data from two tables). Often we have to change the data so the sources look similar before we can join them: say one set has a Social Security number with dashes and the other without — we have to reshape or reformat that data before we can do the join."},
    {n:2,title:"Hierarchical Indexing Mechanics",blocks:[
      DG("stack-unstack"),
      P("Multi-Level Axis Keys",true),
      P("Enables holding multiple index levels on a single axis. It acts as a way to work with higher-dimensional structures in 1D (Series) or 2D (DataFrame) layouts."),
      CODE("# Series with a MultiIndex\ns = pd.Series(np.random.randn(4),\n              index=[['a', 'a', 'b', 'b'], [1, 2, 1, 2]])"),
      P("Stack & Unstack Operations",true),
      P("Unstacking rearranges hierarchical index data into a wide DataFrame. Stacking rotates columns back to index rows."),
      CODE("# Rearrange structural layout\ns.unstack() # Returns 2D DataFrame\ndf.stack()   # Collapses columns to index")
    ],
      tr:"Multi-level axis keys enable holding multiple index levels on a single axis — a way to work with higher-dimensional data in a 1D Series or 2D DataFrame. We can add multi-level indices: basically “a” is also 1, “a” is also 2, that sort of thing. We can stack and unstack: unstacking rearranges the hierarchical index data into a wide DataFrame, and stacking rotates columns back to index rows — whether we're dealing with rows or columns, however we want to deal with the data at the time."},
    {n:3,title:"Reordering & Sorting Levels",blocks:[
      P("Level Swapping",true),
      P("Swap two level names or integer positions on an active axis seamlessly without copying data."),
      CODE("frame.swaplevel('key1', 'key2')"),
      P("Lexicographical Sorting",true),
      P("Always sort index levels to optimize lookup paths and range slice operations."),
      CODE("frame.sort_index(level=1)"),
      P("Column Index Mapping",true),
      P("Move indices to columns or columns to multi-level indices using set/reset methods."),
      CODE("frame.set_index(['a', 'b'])")
    ],
      tr:"We can do level swapping: swap two level names or integer positions on an axis without copying the data itself — we can swap key1 and key2's levels. We can sort the data frame, and sorting indices is built in. We can move indices to columns or columns to multi-level indices using set_index, so we can rearrange the data. A lot of this needs to be done before we can join data together."},
    {n:4,title:"Aggregating Summary Metrics",blocks:[
      P("Describing Reductions across MultiIndex Levels",true),
      P("Standard reduction metrics (such as sum or mean) can target a specific level on either rows or columns."),
      CODE("# Group by level and run summary metric\nframe.groupby(level='key2').mean()\nframe.groupby(level='color', axis=1).sum()"),
      IMG("Decorative stock image (blue circuit-board pattern) — no course content")
    ],
      tr:"We can also do summaries: group a level together and take its mean, or group levels together based on some instance and take the sum. Similar to what you did in SQL, you can make subgroups and then compute metrics on those subgroups."},
    {n:5,title:"Database-Style DataFrame Merges",blocks:[
      DG("join-types"),
      TBL(["Join Type Target", "Pandas Join API Parameter", "Execution Code Pattern", "SQL Database Equivalent"],[["Inner Join", "how='inner' (Default)", "pd.merge(df1, df2, on='key')", "Matches intersection of keys across both frames."], ["Left Join", "how='left'", "pd.merge(df1, df2, how='left', on='key')", "Retains all left records, aligning matching right keys."], ["Right Join", "how='right'", "pd.merge(df1, df2, how='right', on='key')", "Retains all right records, aligning matching left keys."], ["Full Outer Join", "how='outer'", "pd.merge(df1, df2, how='outer', on='key')", "Union of keys, populating unmatched coordinates with NaN."]])
    ],
      tr:"Then there are joins, just like you learned in principles of data management: inner join, left join, right join, and full outer join, and they work exactly the same way they do in 320. An inner join joins on some common thing — here a key — and matches anything that intersects. A left join matches what intersects and keeps everything on the left; a right join keeps everything on the right; and a full outer join shows everything together. The most common one to use is a full outer join, because sometimes those nulls are really important."},
    {n:6,title:"Merging on Index & MultiIndex",blocks:[
      P("Index-to-Column Matches",true),
      P("Sometimes the merge key(s) are contained in a DataFrame's index. Map columns directly to indices using configuration parameter flags."),
      CODE("# Merge using index of right side\npd.merge(left, right, left_on='key',\n         right_index=True)"),
      P("DataFrame .join() Shortcut",true),
      P("Convenient index-on-index or index-on-column combinations. Joins on the index by default, preserving original row alignment structures."),
      CODE("# Combine dataframes on index directly\nleft.join(right, how='outer')\nleft.join([another, other]) # Multi-join")
    ],
      tr:"Sometimes the merge keys are contained in the data frame's index, and we can map columns directly to indices using configuration parameter flags — left on a certain key, right on the index — so we use the index to merge them together. We can also just do joins with shorthand: we don't have to say merge, just left.join(right) and how we want it — outer, inner, left, right. And we can do multi-joins: instead of left.join(another).join(other), I can say left.join and pass in a list of the things I want to join."},
    {n:7,title:"Concatenating Axis Boundaries",blocks:[
      P("Binding Along Rows",true),
      P("Stack datasets vertically along axis 0. Computes logical index matches dynamically."),
      CODE("pd.concat([s1, s2], axis=0)"),
      P("Binding Along Columns",true),
      P("Align datasets horizontally. Fills gaps with NaNs unless inner-join alignment is specified."),
      CODE("pd.concat([df1, df2], axis=1)"),
      P("Multi-Level Keys",true),
      P("Construct a hierarchical MultiIndex along the concatenation axis to trace source blocks."),
      CODE("pd.concat([d1, d2], keys=['g1',\n'g2'])")
    ],
      tr:"We can do binding along rows as well: we can concatenate things together based on a particular axis. We can bind things on columns. We can construct a multi-level index by concatenating indices together. There's a lot we can do to put things together — concatenate rows, concatenate columns."},
    {n:8,title:"Combining Overlapping Datasets",blocks:[
      P("Conditional Patching",true),
      P("Patch null indices in one DataFrame using matching non-null indexes from an alternate DataFrame. Acts as a vectorized \"if-else\" conditional overlay."),
      CODE("# Fill nulls in df1 with non-nulls from df2\ndf1.combine_first(df2)"),
      P("Array-level np.where Equivalence",true),
      P("Combines arrays matching overlapping segments. Equivalent to applying a conditional branch on overlapping dimensions."),
      CODE("# NumPy elementwise fallback selector\nnp.where(pd.isna(a), b, a)")
    ],
      tr:"We can combine overlapping data sets — things that contain common columns. Say I have a data set of customers and a data set of employees, and both have first and last names; we know they're going to be the same, so we can fill those in. We can do conditional patching: patch null indices in one data frame using matching non-null indexes. There's a lot we can do with this."},
    {n:9,title:"Reshaping Format Structures",blocks:[
      P("Pivot & Melt Transformations",true),
      P("Reshape datasets to match tidy guidelines. Converting \"long\" formats to \"wide\" simplifies tabular analysis, while melting wide columns into singular variables enables streamlined grouping."),
      CODE("# Transform database log (long) to wide\ndf.pivot(index='date', columns='item', values='value')\n# Collapse columns to variable-value pairs\ndf.melt(id_vars=['key'])"),
      IMG("Cropped stock image: “Abstract Data Ty[pes]” diagram (Interface → Public Functions → Array / Data Structure / Memory; ScholarHat watermark) — not specific to pandas")
    ],
      tr:"We can create pivot tables, and we can melt things together — there's a lot of stuff we can do. And like I said, the best way to actually deal with this is just to try these."},
