 d19:[
  {id:"d19q1",slide:2,topic:"Overview",type:"mc",diff:1,q:"Feature Selection is a process that…",opts:["chooses an optimal subset of features according to a certain criterion", "creates new composite features", "removes noisy rows", "discretizes continuous attributes"],a:0,ev:"Feature Selection is a process that chooses an optimal subset of features according to a certain criterion."},
  {id:"d19q2",slide:2,topic:"Overview",type:"mc",diff:2,q:"Which is NOT listed as a reason we need FS?",opts:["to increase the number of attributes", "to improve performance (speed, predictive power, simplicity)", "to visualize the data for model selection", "to reduce dimensionality and remove noise"],a:0,ev:"Why we need FS: to improve performance…; to visualize the data…; To reduce dimensionality and remove noise."},
  {id:"d19q3",slide:3,topic:"Overview",type:"tf",diff:1,q:"Reducing the cost of the data is a reason for performing FS.",a:true,ev:"Reasons for performing FS may include: … reducing the cost of the data."},
  {id:"d19q4",slide:4,topic:"Search of a Subset",type:"mc",diff:2,q:"Which is NOT one of the FS perspectives?",opts:["discretizing continuous features", "searching for the best subset of features", "criteria for evaluating different subsets", "principle for selecting, adding, removing or changing features"],a:0,ev:"Perspectives: searching for the best subset of features; criteria for evaluating different subsets; principle for selecting, adding, removing or changing new features during the search."},
  {id:"d19q5",slide:5,topic:"Search of a Subset",type:"mc",diff:2,q:"With M features, how many possible subsets are there?",opts:["2ᴹ", "M²", "M", "2M"],a:0,ev:"There should be a total of 2ᴹ subsets where M is the number of features of a data set."},
  {id:"d19q6",slide:5,topic:"Search of a Subset",type:"tf",diff:2,q:"A feature subset can be represented as a binary array (1 = selected, 0 = not).",a:true,ev:"The selection can be represented as a binary array, with each element corresponding to the value 1, if the feature is currently selected by the algorithm and 0, if it does not occur."},
  {id:"d19q7",slide:6,topic:"Search of a Subset",type:"mc",diff:1,q:"Sequential Forward Generation (SFG) starts with…",opts:["an empty set of features", "the full set of features", "a random subset", "half of the features"],a:0,ev:"Sequential Forward Generation (SFG): It starts with an empty set of features S."},
  {id:"d19q8",slide:6,topic:"Search of a Subset",type:"mc",diff:1,q:"Sequential Backward Generation (SBG) starts with…",opts:["a full set of features and removes them one at a time", "an empty set and adds features", "a random direction", "both directions at once"],a:0,ev:"Sequential Backward Generation (SBG): It starts with a full set of features and,iteratively, they are removed one at a time."},
  {id:"d19q9",slide:6,topic:"Search of a Subset",type:"mc",diff:2,q:"In SBG, the criterion must point out…",opts:["the worst or least important feature", "the best feature", "a random feature", "the most correlated pair"],a:0,ev:"Here, the criterion must point out the worst or least important feature."},
  {id:"d19q10",slide:6,topic:"Search of a Subset",type:"tf",diff:2,q:"At the end of SBG, the remaining single feature is considered the most informative of the whole set.",a:true,ev:"By the end, the subset is only composed of a unique feature, which is considered to be the most informative of the whole set."},
  {id:"d19q11",slide:9,topic:"Search of a Subset",type:"mc",diff:2,q:"Bidirectional Generation (BG)…",opts:["performs SFG and SBG concurrently", "starts in a random direction", "only removes features", "only adds features"],a:0,ev:"Bidirectional Generation (BG): Begins the search in both directions, performing SFG and SBG concurrently."},
  {id:"d19q12",slide:9,topic:"Search of a Subset",type:"mc",diff:2,q:"Why does Random Generation (RG) not follow a fixed way of subset generation?",opts:["to avoid stagnation in a local optima", "to guarantee optimality", "to reduce memory", "to keep the subset size fixed"],a:0,ev:"RGtries to avoid the stagnation into a local optima by not following a fixed way for subset generation."},
  {id:"d19q13",slide:9,topic:"Search of a Subset",type:"tf",diff:2,q:"In Random Generation, the size of the subset of features can be stipulated in advance.",a:false,ev:"Unlike SFG or SBG, the size of the subset of features cannot be stipulated."},
  {id:"d19q14",slide:12,topic:"Search of a Subset",type:"mc",diff:2,q:"Which search strategy is the only one that can guarantee optimality?",opts:["Exhaustive search", "Heuristic search", "Nondeterministic search", "Random generation"],a:0,ev:"Only exhaustive search can guarantee the optimality."},
  {id:"d19q15",slide:12,topic:"Search of a Subset",type:"mc",diff:2,q:"The space complexity of exhaustive search is…",opts:["O(2ᴹ)", "O(M)", "O(M²)", "O(log M)"],a:0,ev:"As we said before, the space complexity is O(2ᴹ)."},
  {id:"d19q16",slide:12,topic:"Search of a Subset",type:"mc",diff:2,q:"In heuristic search, the number of subsets generated is…",opts:["O(M)", "O(2ᴹ)", "O(1)", "O(M!)"],a:0,ev:"The maximum length of this path is M and the number of subsets generated is O(M)."},
  {id:"d19q17",slide:12,topic:"Search of a Subset",type:"tf",diff:2,q:"Heuristic search prevents brute force search but will find a non-optimal subset.",a:true,ev:"Thus, it prevents brute force search, but it will surely find a non-optimal subset of features."},
  {id:"d19q18",slide:13,topic:"Search of a Subset",type:"mc",diff:2,q:"Nondeterministic search is also known as…",opts:["random search strategy", "exhaustive search", "depth-first search", "greedy search"],a:0,ev:"Nondeterministic Search: … It is also known as random search strategy"},
  {id:"d19q19",slide:13,topic:"Search of a Subset",type:"tf",diff:2,q:"With nondeterministic search you must wait until the search ends to get a usable subset.",a:false,ev:"it is unnecessary to wait until the search ends."},
  {id:"d19q20",slide:14,topic:"Selection Criteria",type:"mc",diff:2,q:"Information measures quantify…",opts:["the uncertainty of the receiver when she/he receives a message", "the distance between class densities", "the correlation between two variables", "the classifier accuracy"],a:0,ev:"Information serves to measure the uncertainty of the receiver when she/he receives a message."},
  {id:"d19q21",slide:14,topic:"Selection Criteria",type:"mc",diff:2,q:"Which formula is listed under Information Measures?",opts:["Shannon’s Entropy", "Pearson correlation coefficient", "Euclidean distance", "Odds ratio"],a:0,ev:"Information Measures: … Shannon’s Entropy: … Information gain:"},
  {id:"d19q22",slide:15,topic:"Selection Criteria",type:"mc",diff:2,q:"Distance measures are also known as…",opts:["measures of separability, discrimination or divergence", "measures of association", "consistency measures", "accuracy measures"],a:0,ev:"Measures of separability, discrimination or divergence measures."},
  {id:"d19q23",slide:15,topic:"Selection Criteria",type:"mc",diff:3,q:"Which distance is D_cb = Σ|x_i − y_i|?",opts:["City-block distance", "Euclidean distance", "Cebyshev distance", "Canberra distance"],a:0,ev:"City-block distance: D_cb = Σ_{i=1..m} |x_i − y_i|"},
  {id:"d19q24",slide:16,topic:"Selection Criteria",type:"mc",diff:2,q:"Dependence measures are also known as measures of…",opts:["association or correlation", "separability", "consistency", "accuracy"],a:0,ev:"known as measures of association or correlation."},
  {id:"d19q25",slide:16,topic:"Selection Criteria",type:"mc",diff:2,q:"Which coefficient is given as a dependence measure?",opts:["Pearson correlation coefficient", "Shannon’s entropy", "Chi-squared", "Minkowski distance"],a:0,ev:"Pearson correlation coefficient:"},
  {id:"d19q26",slide:17,topic:"Selection Criteria",type:"mc",diff:2,q:"Consistency measures aim to achieve…",opts:["P(C|FullSet) = P(C|SubSet)", "maximum accuracy", "minimum distance", "maximum entropy"],a:0,ev:"They aim to achieve P(C|FullSet) = P(C|SubSet)."},
  {id:"d19q27",slide:17,topic:"Selection Criteria",type:"mc",diff:3,q:"An inconsistency is defined as…",opts:["two examples with the same inputs but different classes", "two identical examples", "an example with missing values", "a feature with zero variance"],a:0,ev:"An inconsistency is defined as the case of two examples with the same inputs (same feature values) but with different output feature values (classes in classification)."},
  {id:"d19q28",slide:18,topic:"Selection Criteria",type:"mc",diff:2,q:"Accuracy measures rely on…",opts:["the classifier or learner", "an entropy formula", "pairwise distances", "correlation"],a:0,ev:"This form of evaluation relies on the classifier or learner."},
  {id:"d19q29",slide:18,topic:"Selection Criteria",type:"mc",diff:2,q:"In the accuracy-measures table, Error rate equals…",opts:["1− Accuracy", "tpr / fpr", "tp × tn / fp × fn", "Accuracy / 2"],a:0,ev:"Error rate: 1− Accuracy"},
  {id:"d19q30",slide:20,topic:"Filters, Wrappers & Embedded",type:"mc",diff:2,q:"Why are filter methods usually faster?",opts:["measuring uncertainty, distance, dependence or consistency is cheaper than measuring a learner’s accuracy", "they use more data", "they retrain the model each step", "they use exhaustive search"],a:0,ev:"measuring uncertainty, distances, dependence or consistency is usually cheaper than measuring the accuracy of a learning process. Thus, filter methods are usually faster."},
  {id:"d19q31",slide:20,topic:"Filters, Wrappers & Embedded",type:"tf",diff:2,q:"Filter-selected features can be used to learn different models from different DM techniques.",a:true,ev:"it does not rely on a particular learning bias, in such a way that the selected features can be used to learn different models from different DM techniques."},
  {id:"d19q32",slide:20,topic:"Filters, Wrappers & Embedded",type:"mc",diff:2,q:"Filters can handle larger sized data because…",opts:["of the simplicity and low time complexity of the evaluation measures", "they ignore the class", "they sample the data", "they use decision trees"],a:0,ev:"it can handle larger sized data, due to the simplicity and low time complexity of the evaluation measures."},
  {id:"d19q33",slide:22,topic:"Filters, Wrappers & Embedded",type:"mc",diff:2,q:"What can wrappers do that filters cannot?",opts:["allow a learning algorithm to fully exploit its bias", "run faster on huge data", "avoid using any learner", "work without labels"],a:0,ev:"filter models cannot allow a learning algorithm to fully exploit its bias, whereas wrapper methods do."},
  {id:"d19q34",slide:22,topic:"Filters, Wrappers & Embedded",type:"tf",diff:2,q:"Wrappers can achieve the purpose of improving the particular learner’s predictive performance.",a:true,ev:"can achieve the purpose of improving the particular learner’s predictive performance."},
  {id:"d19q35",slide:23,topic:"Filters, Wrappers & Embedded",type:"mc",diff:2,q:"In embedded FS, features are selected…",opts:["during the learning process", "before learning, independently of the learner", "after the model is tested", "randomly"],a:0,ev:"… but in this approach, the features are selected during the learning process."},
  {id:"d19q36",slide:23,topic:"Filters, Wrappers & Embedded",type:"mc",diff:3,q:"An advantage of embedded FS is that it…",opts:["does not require splitting the training data into training and validation sets", "always finds the optimal subset", "uses no learning algorithm", "needs no data"],a:0,ev:"they could take advantage of the available data by not requiring to split the training data into a training and validation set"},
  {id:"d19q37",slide:24,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Feature ranking techniques output…",opts:["a ranked list of features ordered by evaluation measures", "a single minimum subset", "a decision tree", "a binary array"],a:0,ev:"we expect as the output a ranked list of features which are ordered according to evaluation measures."},
  {id:"d19q38",slide:24,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"With a ranking, the simplest way to perform actual FS is to…",opts:["choose the first m features (when m is known)", "choose features at random", "pick the last feature", "keep all features"],a:0,ev:"For performing actual FS, the simplest way is to choose the first m features for the task at hand, whenever we know the most appropriate m value."},
  {id:"d19q39",slide:26,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Minimum subset techniques focus on…",opts:["obtaining the minimum possible subset without ordering the features", "ranking every feature", "adding noise", "sampling instances"],a:0,ev:"There must be a second category of techniques focused on obtaining the minimum possible subset without ordering the features."},
  {id:"d19q40",slide:28,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Which is NOT one of the three FS evaluation goals?",opts:["Encryption", "Inferability", "Interpretability", "Data Reduction"],a:0,ev:"Goals: Inferability … Interpretability … Data Reduction"},
  {id:"d19q41",slide:29,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Which is listed as an FS assessment measure?",opts:["Speed of the FS method", "Number of classes", "File size", "Training labels"],a:0,ev:"Accuracy; Complexity; Number of Features Selected; Speed of the FS method; Generality of the features selected"},
  {id:"d19q42",slide:30,topic:"Output, Evaluation & Drawbacks",type:"tf",diff:2,q:"The resulting subsets of many FS models are strongly dependent on the training set size.",a:true,ev:"The resulted subsets of many models of FS are strongly dependent on the training set size."},
  {id:"d19q43",slide:30,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Why is a backward removal strategy slow on large-scale data sets?",opts:["in the first stages it must decide based on huge quantities of data", "it uses random search", "it needs no data", "it only adds features"],a:0,ev:"A backward removal strategy is very slow when working with large-scale data sets. This is because in the firsts stages of the algorithm, it has to make decisions funded on huge quantities of data."},
  {id:"d19q44",slide:31,topic:"Output, Evaluation & Drawbacks",type:"mc",diff:2,q:"Decision tree inducers can be considered…",opts:["anytime algorithms for FS", "exhaustive methods", "filter-only methods", "clustering methods"],a:0,ev:"Decision tree inducers can be considered as anytime algorithms for FS"},
  {id:"d19q45",slide:32,topic:"Representative Methods & Advanced",type:"mc",diff:2,q:"Which are the three components used to categorize FS method combinations?",opts:["Search Direction, Search Strategy, Evaluation Measure", "Filters, Wrappers, Embedded", "Speed, Accuracy, Generality", "SFG, SBG, BG"],a:0,ev:"Three major components to categorize combinations: Search Direction; Search Strategy; Evaluation Measure"},
  {id:"d19q46",slide:32,topic:"Representative Methods & Advanced",type:"mc",diff:3,q:"In the combination table, Random direction with an Exhaustive strategy is…",opts:["not available (–)", "C1", "C16", "C13"],a:0,ev:"Random / Exhaustive cells are – (the table lists C13–C15 heuristic and C16–C18 nondeterministic)."},
  {id:"d19q47",slide:33,topic:"Representative Methods & Advanced",type:"mc",diff:2,q:"Which exhaustive method is combination C2?",opts:["Focus method", "Best First Search", "Branch and Bound", "Beam Search"],a:0,ev:"Focus method: C2."},
  {id:"d19q48",slide:33,topic:"Representative Methods & Advanced",type:"mc",diff:3,q:"Best First Search (BFS) corresponds to which combination?",opts:["C1", "C3", "C4", "C5"],a:0,ev:"Best First Search (BFS): C1."},
  {id:"d19q49",slide:33,topic:"Representative Methods & Advanced",type:"tf",diff:2,q:"Exhaustive methods cover the whole search space.",a:true,ev:"Cover the whole search space."},
  {id:"d19s1",slide:6,topic:"Search of a Subset",type:"short",diff:1,q:"Forward generation starting from an empty set (abbreviation)?",keys:["SFG"],ev:"Sequential Forward Generation (SFG)"},
  {id:"d19s2",slide:6,topic:"Search of a Subset",type:"short",diff:1,q:"Backward generation starting from the full set (abbreviation)?",keys:["SBG"],ev:"Sequential Backward Generation (SBG)"},
  {id:"d19s3",slide:9,topic:"Search of a Subset",type:"short",diff:2,q:"Generation that runs SFG and SBG concurrently (abbreviation)?",keys:["BG"],ev:"Bidirectional Generation (BG)"},
  {id:"d19s4",slide:9,topic:"Search of a Subset",type:"short",diff:2,q:"Generation that starts in a random direction (abbreviation)?",keys:["RG"],ev:"Random Generation (RG)"},
  {id:"d19s5",slide:33,topic:"Representative Methods & Advanced",type:"short",diff:2,q:"Automatic Branch and Bound (abbreviation)?",keys:["ABB"],ev:"Automatic Branch and Bound (ABB): C5."},
  {id:"d19s6",slide:2,topic:"Overview",type:"short",diff:1,q:"Feature Selection (abbreviation)?",keys:["FS"],ev:"Why we need FS"}

 d20:[
  {id:"d20q1",slide:2,topic:"Introduction",type:"mc",diff:1,q:"Instance selection (IS) performs the complementary process regarding…",opts:["the FS (feature selection)", "discretization", "normalization", "missing value imputation"],a:0,ev:"Instance selection (IS) performs the complementary process regarding the FS."},
  {id:"d20q2",slide:2,topic:"Introduction",type:"tf",diff:1,q:"The major issue of scaling down the data is the selection or identification of relevant data from an immense pool of instances.",a:true,ev:"The major issue of scaling down the data is the selection or identification of relevant data from an immense pool of instances."},
  {id:"d20q3",slide:2,topic:"Introduction",type:"mc",diff:2,q:"Instance Selection chooses a subset of data to achieve the original purpose of a DM application…",opts:["as if the whole data were used", "using only the test set", "after discretizing every attribute", "by removing attributes"],a:0,ev:"Instance Selection is to choose a subset of data to achieve the original purpose of a DM application as if the whole data were used."},
  {id:"d20q4",slide:3,topic:"Introduction",type:"mc",diff:2,q:"What distinguishes IS from data sampling?",opts:["IS is an intelligent operation of instance categorization, according to a degree of irrelevance or noise", "IS draws instances uniformly at random", "IS only works on numeric attributes", "IS always keeps every class's centroid"],a:0,ev:"IS vs. data sampling: intelligent operation of instance categorization, according to a degree of irrelevance or noise."},
  {id:"d20q5",slide:3,topic:"Introduction",type:"mc",diff:2,q:"The optimal outcome of IS is…",opts:["a minimum data subset, model independent, that can accomplish the same task with no performance loss", "the largest subset that fits in memory", "a subset that maximizes the number of classes", "a model-specific subset tuned to one classifier"],a:0,ev:"The optimal outcome of IS is a minimum data subset, model independent that can accomplish the same task with no performance loss."},
  {id:"d20q6",slide:3,topic:"Introduction",type:"tf",diff:1,q:"An IS method seeks a subset S ⊂ T such that Acc(S) is similar to Acc(T).",a:true,ev:"Acc(S) is similar to Acc(T)"},
  {id:"d20q7",slide:3,topic:"Introduction",type:"mc",diff:2,q:"In the IS definition, Acc(X) is…",opts:["the classification accuracy obtained using X as a training set", "the number of instances in X", "the accuracy of X on the training set itself", "the storage reduction of X"],a:0,ev:"where Acc(X) is the classification accuracy obtained using X as a training set."},
  {id:"d20q8",slide:4,topic:"Introduction",type:"mc",diff:1,q:"Which IS function lets a DM algorithm work with huge data?",opts:["Enabling", "Focusing", "Cleaning", "Condensing"],a:0,ev:"Enabling: IS enables a DM algorithm to work with huge data."},
  {id:"d20q9",slide:4,topic:"Introduction",type:"mc",diff:1,q:"Which IS function removes redundant as well as noisy instances?",opts:["Cleaning", "Enabling", "Focusing", "Wrapping"],a:0,ev:"Cleaning: redundant as well as noisy instances are usually removed, improving the quality of the input data."},
  {id:"d20q10",slide:4,topic:"Introduction",type:"mc",diff:2,q:"“IS focus the data on the relevant part” describes which function?",opts:["Focusing", "Enabling", "Cleaning", "Edition"],a:0,ev:"Focusing: a concrete DM task is focused on only one aspect of interest of the domain. IS focus the data on the relevant part."},
  {id:"d20q11",slide:5,topic:"TSS vs PS",type:"mc",diff:1,q:"Nowadays, which two clear distinctions exist in the literature?",opts:["Prototype Selection (PS) and Training Set Selection (TSS)", "Feature Selection and Discretization", "Condensation and Edition", "Filter and Wrapper"],a:0,ev:"Nowadays, there are two clear distinctions in the literature: Prototype Selection (PS) and Training Set Selection (TSS)."},
  {id:"d20q12",slide:5,topic:"TSS vs PS",type:"tf",diff:2,q:"Instance selection was thought to work with other learning methods, such as decision trees, ANNs or SVMs.",a:true,ev:"Instance selection is the most general one and was thought to work with other learning methods, such as decision trees, ANNs or SVMs."},
  {id:"d20q13",slide:6,topic:"TSS vs PS",type:"mc",diff:2,q:"In Prototype Selection, the instances selected (S) are fed to…",opts:["an Instance-based Classifier", "a Data Mining Algorithm that outputs a model", "a Feature Selection algorithm", "the Test Data Set"],a:0,ev:"Instances Selected (S) → Instance-based Classifier"},
  {id:"d20q14",slide:7,topic:"TSS vs PS",type:"mc",diff:2,q:"In Training Set Selection, the instances selected (S) go to…",opts:["a Data Mining Algorithm, producing the Model Obtained", "an Instance-based Classifier only", "the Prototype Selection Algorithm", "the Test Data Set (TS)"],a:0,ev:"Instances Selected (S) → Data Mining Algorithm → Model Obtained"},
  {id:"d20q15",slide:8,topic:"PS Taxonomy",type:"mc",diff:1,q:"Which search direction begins with an empty subset S and adds instances?",opts:["Incremental", "Decremental", "Batch", "Fixed"],a:0,ev:"Incremental. An incremental search begins with an empty subset S, and adds each instance in T R to S if it fulfills some criteria."},
  {id:"d20q16",slide:8,topic:"PS Taxonomy",type:"mc",diff:1,q:"A decremental search begins with…",opts:["S = T R, then searches for instances to remove", "an empty S", "a random subset of fixed size", "the class centroids"],a:0,ev:"Decremental. The decremental search begins with S = T R, and then searches for instances to remove from S"},
  {id:"d20q17",slide:8,topic:"PS Taxonomy",type:"mc",diff:2,q:"“Decremental removing more than one instance” defines which direction?",opts:["Batch", "Mixed", "Fixed", "Incremental"],a:0,ev:"Batch. Decremental removing more than one instance."},
  {id:"d20q18",slide:8,topic:"PS Taxonomy",type:"mc",diff:2,q:"In which direction is the number of instances user-defined?",opts:["Fixed", "Mixed", "Batch", "Decremental"],a:0,ev:"Fixed. The number of instances is user-defined."},
  {id:"d20q19",slide:8,topic:"PS Taxonomy",type:"mc",diff:2,q:"Which direction begins with a pre-selected subset S and can iteratively add or remove instances?",opts:["Mixed", "Incremental", "Batch", "Fixed"],a:0,ev:"Mixed. begins with a pre-selected subset S and iteratively can add or remove any instance which meets the specific criterion"},
  {id:"d20q20",slide:9,topic:"PS Taxonomy",type:"mc",diff:1,q:"Condensation methods retain…",opts:["the points closer to the decision boundaries (border points)", "only noisy points", "the class centroids only", "points far from any boundary"],a:0,ev:"Condensation. retain the points which are closer to the decision boundaries, also called border points."},
  {id:"d20q21",slide:9,topic:"PS Taxonomy",type:"tf",diff:2,q:"Edition methods seek to retain border points.",a:false,ev:"Edition. seek to remove border points. They remove points that are noisy or do not agree with their neighbors."},

 d20:[
  ["Instance selection (IS)","Complementary process to FS: choose a subset of data that achieves the original DM purpose as if the whole data were used.",2],
  ["IS vs. data sampling","IS is an intelligent operation of instance categorization, by a degree of irrelevance or noise.",3],
  ["IS goal","S ⊂ T with no superfluous instances and Acc(S) similar to Acc(T); a minimum, model-independent subset with no performance loss.",3],
  ["Three IS functions","Enabling (huge data) · Focusing (relevant part) · Cleaning (redundant and noisy removed).",4],
  ["PS vs TSS","PS: Instances Selected (S) → Instance-based Classifier. TSS: S → Data Mining Algorithm → Model Obtained.",5],
  ["Direction of search","Incremental (empty S, add) · Decremental (S = TR, remove) · Batch (remove more than one) · Mixed (pre-selected, add/remove) · Fixed (user-defined size).",8],
  ["Type of selection","Condensation keeps border points · Edition removes border/noisy points · Hybrid finds the smallest S that keeps or increases accuracy.",9],
  ["Filter vs wrapper (PS)","Filter: kNN on partial data, no leave-one-out. Wrapper: kNN on the complete TR with leave-one-out.",10],
  ["Criteria to compare PS methods","Storage reduction · Noise tolerance · Generalization accuracy · Time requirements.",11],
  ["CNN","One random instance per class in S; add every misclassified TR instance; repeat until none are misclassified.",19],
  ["FCNN","Start with the class centroids; add each Voronoi region's nearest enemy; repeat until no enemies are found.",20],
  ["RNN","Start S = TR; remove an instance if no other TR instance becomes misclassified; always a subset of CNN's result.",21],
  ["POP","Per attribute, raise an instance's weakness when it is outside a region limit; remove it when weakness = number of attributes.",22],
  ["ENN (Wilson)","Start S = TR; remove each instance that does not agree with the majority of its k nearest neighbors.",23],
  ["Multiedit","Split R into b > 2 random blocks; add to S the prototypes of R_{b_i} misclassified by KNN with R_{(b_i+1) mod b}; repeat while S ≠ R.",24],
  ["RNGE","Build the proximity graph (PG); discard instances misclassified by their graph neighbors.",25],
  ["All KNN","Extension of ENN: for i = 0 to k, flag instances misclassified by their i nearest neighbors; then remove the flagged ones.",26],
  ["IB3","Add X_i if its nearest acceptable instance a has a different class; remove instances whose classification record is significantly poor.",27],
  ["Associates / nearest enemy","Associates of Xi: instances with xi among their k nearest neighbors. Nearest enemy: the nearest instance with a different output class.",28],
  ["DROP1","Remove X_i if the number of associates classified correctly without X_i ≥ with X_i.",29],
  ["DROP2","Remove Xi if at least as many associates in TR are correct without it; process instances sorted by distance to their nearest enemy.",30],

  ["ICF","Phase 1: ENN removes noise. Phase 2: remove Xi when Reachability(Xi) > Coverage(Xi); recompute and repeat.",31],
  ["RMHC","Random S of fixed size s; each iteration swaps one instance between S and TR − S; keep the change if accuracy improves.",32],

    {t:"The distinction is based on the ==level of measure== of the data",c:[2,"slide","The distinction between parametric and non-parametric tests is based on the level of measure represented by the data to be analyzed"]},
    {t:"A parametric test usually uses ==real-valued data==",c:[2,"slide","A parametric test usually uses data composed by real values"]},
    {t:"If its conditions aren't met, the analysis can ==lose credibility==",c:[2,"slide","might cause a statistical analysis to lose credibility"]}
  ]},
  {h:"3 conditions for parametric tests",s:[3],items:[
    {t:"**Independence** — one event ==does not modify the probability== of another",c:[3,"slide","two events are independent when the fact that one occurs does not modify the probability of the other one occurring"]},
    {t:"**Normality** — behaviour follows a ==normal / Gauss distribution== (mean μ, variance σ)",c:[3,"slide","its behaviour follows a normal or Gauss distribution with a certain value of average μ and variance σ"]},
    {t:"**Heteroscedasticity** — a ==violation of equality of variances==",c:[3,"slide","a violation of the hypothesis of equality of variances"]}
  ]},
  {h:"Independence in practice",s:[4],items:[
    {t:"Independence is ==not truly verified in k-FCV and 5×2 CV==",c:[4,"slide","independency is not truly verified in k-FCV and 5×2CV"]},
    {t:"==Hold-out partitions== can be taken as independent (train/test don't overlap)",c:[4,"slide","Hold-out partitions can be safely take as independent, since training and tests partitions do not overlap"]}
  ]},
  {h:"Normality tests",s:[5],items:[
    {t:"**Kolmogorov–Smirnov** — compares the ==accumulated distribution== to a Gaussian's",c:[5,"slide","compares the accumulated distribution of observed data with the accumulated distribution expected from a Gaussian distribution"]},
    {t:"**Shapiro–Wilk** — checks ==symmetry & kurtosis== (curve shape) vs a Gaussian",c:[5,"slide","compute the level of symmetry and kurtosis (shape of the curve)"]},
    {t:"**D'Agostino–Pearson** — uses ==skewness & kurtosis== to measure distance from Gaussian",c:[5,"slide","first computes the skewness and kurtosis to quantify how far from Gaussian the distribution is"]}
  ]},
  {h:"Equal-variance test",s:[6],items:[
    {t:"**Levene's test** — checks ==homogeneity of variances (homoscedasticity)==",c:[6,"slide","Levene's test is used for checking whether or not k samples present this homogeneity of variances (homoscedasticity)"]},
    {t:"When normality fails, it's ==more reliable than Bartlett's==",c:[6,"slide","this test's result is more reliable than Bartlett's test"]}
  ]},
  {h:"Visual check (Q-Q)",s:[9],items:[
    {t:"**Q-Q plots** confront ==observed quartiles vs the normal distribution's==",c:[9,"slide","a confrontation between the quartiles from data observed and those from the normal distributions"]},
    {t:"With histograms, ==normality can be visually checked==",c:[9,"slide","the normality can be visually checked"]}
  ]},
  {h:"Key finding",s:[12],items:[
    {t:"Normality is ==often not verified== in a single-problem analysis",c:[12,"slide","the normality condition is not verified in a single-problem analysis"]},
    {t:"Even ==50 results== may not meet the parametric conditions",c:[12,"slide","A sample of 50 results that should be large enough to fulfill the parametric conditions does not always verify the necessary precepts"]},
    {t:"⇒ ==non-parametric tests are recommended== for comparing ML algorithms",c:[12,"slide","the use of non-parametric test for comparing ML algorithms is recommended"]}
  ]},
  {h:"Comparing TWO algorithms",s:[14,15,16],items:[
    {t:"Done with ==paired t tests==, often with the ==non-parametric Wilcoxon==",c:[14,"slide","ML approaches have been compared through parametric tests by means of paired t tests"]},
    {t:"Correct only for ==two methods==, not several",c:[14,"slide","Their use is correct when we are interested in finding the differences between two methods"]},
    {t:"**FWER** = probability of ==at least one error== in the family of hypotheses; grows with more comparisons",c:[15,"slide","It is the probability of at least one error in the family of hypotheses"]},
    {t:"**Wilcoxon** — the ==analogue of the paired t-test== (non-parametric)",c:[16,"slide","It is the analogue of the paired t-test in non-parametric statistical procedures"]}
  ]},
  {h:"Wilcoxon computation",s:[17,18,19],items:[
    {t:"Rank the ==differences dᵢ by absolute value== (average ranks for ties)",c:[17,"slide","The differences are ranked according to their absolute values"]},
    {t:"==R+== = ranks where the 1st algorithm wins; ==R−== = the opposite",c:[17,"slide","R− the sum of ranks for the opposite"]},
    {t:"Statistic ==T = min(R+, R−)==; reject H₀ if ==T ≤ Wilcoxon critical value==",c:[18,"slide","T = min(R+, R−)"]},
    {t:"==Safer than the t-test== — it ==does not assume normal distributions==",c:[19,"slide","the test is safer since it does not assume normal distributions"]}
  ]},
  {h:"Comparing MANY algorithms",s:[24,26],items:[
    {t:"**Multiple-comparison procedures** ==fix the FWER== across all algorithms",c:[24,"slide","Multiple comparison procedures are designed for allowing the FWER to be fixed"]},
    {t:"A **block** = the ==results for one specific problem== (≥ 3 results)",c:[26,"slide","each block corresponds to the results offered for a specific problem"]}
  ]},
  {h:"Friedman & Iman–Davenport",s:[27,28,29,30],items:[
    {t:"**Friedman** — non-parametric analog of the ==parametric two-way ANOVA==",c:[27,"slide","The Friedman test is a nonparametric analog of the parametric two-way analysis of variance"]},
    {t:"Asks whether samples have ==different median values==",c:[27,"slide","do at least two of the samples represent populations with different median values?"]},
    {t:"H₀: ==equality of medians==; H₁ is ==non-directional==",c:[28,"slide","The null hypothesis for Friedman's test states equality of medians between the populations"]},
    {t:"Method: ==rank algorithms per data set== (best = 1), compare ==average ranks==",c:[29,"slide","It ranks the algorithms for each data set separately, the best performing algorithm getting the rank of 1"]},
    {t:"**Iman–Davenport** — derived from Friedman, which is ==too conservative==",c:[30,"slide","Iman and Davenport proposed a derivation from the Friedman statistic"]}
  ]},
  {h:"Post-hoc procedures",s:[32,33,34,35,37],items:[
    {t:"Friedman only shows a difference ==exists==, not ==which== — so run a post-hoc",c:[32,"slide","does not involve the detection of the existing differences among the algorithms compared"]},
    {t:"Pick a ==control algorithm==, compare it with the ==remaining k−1==",c:[33,"slide","compare the control algorithm with the remain k − 1 algorithms"]},
    {t:"**Bonferroni-Dunn** — differ if ranking gap ≥ its ==critical difference (CD)==",c:[34,"slide","the corresponding average of rankings is at least as great as its critical difference (CD)"]},
    {t:"**Holm** — ==sequential==, ordered by significance; compares pᵢ with ==α/(k−i)==",c:[35,"slide","sequentially checks the hypotheses ordered according to their significance"]},
    {t:"**Hochberg** — ==step-up==, opposite to Holm; ==more powerful than Holm==",c:[37,"slide","Hochberg's method is more powerful than Holm's"]}
  ]},
  {figs:[["test-flow","Which test to use — Slide 1"],["param-nonparam","Parametric conditions — Slide 3"],["wilcoxon","Wilcoxon steps — Slides 17–18"]]}

 d6:[
  {h:"Why pandas",s:[1],items:[

    {t:"**Binning/discretization** — ==convert numerical attributes into nominal ones==, cutting cardinality",c:[27,"slide","They convert numerical attributes into nominal ones, thus drastically reducing the cardinality"]}
  ]},
  {h:"Data reduction strategies",s:[24,25],items:[
    {t:"Shrink large data while ==maintaining the integrity and the information== of the original",c:[24,"slide","reduce the size of the data set while trying to maintain the integrity and the information"]},

 d12:[
  {h:"What is a missing value",s:[2,3],items:[
    {t:"An **MV** = a value for an attribute ==not introduced or lost in the recording process== (equipment, entry, measurement)",c:[2,"slide","A missing value (MV) is just a value for attribute that was not introduced or was lost in the recording process"]},
    {t:"MVs cause ==loss of efficiency==, handling/analysis complications, and ==bias== from missing-vs-complete differences",c:[3,"slide","bias resulting from differences between missing and complete data."]}
  ]},
  {h:"Three ways to handle MVs",s:[4],items:[
    {t:"**Discard** examples/attributes with MVs; **Maximum likelihood** (estimate model params, then sample); **Imputation** (fill using other attributes)",c:[4,"slide","Usually the treatment of MVs in DM can be handled in three different ways:"]},
    {t:"Imputation works because ==attributes are not independent from each other==",c:[4,"slide","as attributes are not independent from each other"]}
  ]},
  {h:"Missingness mechanisms matter",s:[5,6],items:[
    {t:"The ==assumptions about the missingness mechanism== decide which treatment can be correctly applied",c:[5,"slide","can affect which treatment method could be correctly applied"]},
    {t:"The ==pattern of gaps== in the data matrix gives clues about the process that caused them",c:[6,"tr","The pattern of these gaps often provide clues about the process responsible for the missing data"]}
  ]},
  {h:"Probability framework",s:[7,8,9],items:[
    {t:"Under the **i.i.d.** assumption the data comes from a distribution with ==parameters θ== (per-case function f)",c:[7,"slide","θ represents the parameters of the model that yield such a particular instance of data."]},
    {t:"**θ is very rarely known** → assume common distributions: ==multivariate normal / multinomial / mixed==",c:[8,"slide","The parameters' values θ for the given data are very rarely known!"]},
    {t:"Split the data: **X = (X_obs, X_mis)** + an ==indicator matrix B== (0/1 for present/absent)",c:[9,"slide","We call Xobs the observed part of X"]}
  ]},
  {h:"MAR",s:[10],items:[
    {t:"**Missing at Random** — missingness ==depends only on observed data, not on X_mis==; most common assumption",c:[10,"slide","Having a missing at random (MAR) assumption means that this distribution does not depend on Xmis"]}
  ]},
  {h:"MCAR",s:[11,12],items:[
    {t:"**MCAR** = special case of MAR: missingness depends on ==neither the observed nor the unobserved data==",c:[11,"slide","does not depend on either the observed or the unobserved data"]},
    {t:"Under MCAR, ==complete-case analysis gives valid inferences== (but loses power); MCAR is ==more restrictive than MAR==",c:[12,"slide","the analysis of only those units with complete data gives valid inferences"]}
  ]},
  {h:"NMAR",s:[13],items:[
    {t:"**NMAR/MNAR** — the MV ==depends on the value itself==; the only unbiased fix is to ==model the missingness too==",c:[13,"slide","The only way to obtain an unbiased estimate is to model the missingness as well."]}
  ]},
  {h:"Simple approaches",s:[14,15,16,17],items:[
    {t:"Simple methods ==ignore the missingness mechanism== and blindly replace — cheap but often biased",c:[14,"slide","They usually do not take into account the missingness mechanism and they blindly perform the operation."]},
    {t:"**DNI** (do not impute) — ==the MVs remain unreplaced==; encoding a special value can cause serious inference problems",c:[15,"slide","the MVs remain unreplaced"]},
    {t:"**IM / case deletion** ==discards every instance with at least one MV== (valid under MCAR, but loses power)",c:[16,"slide","All instances with at least one MV are discarded from the data set."]},
    {t:"**MC** = global mean/mode; **CMC** = ==class-specific== mean/mode; drawback: ==covariance is severely altered==",c:[17,"slide","the covariance in the imputed data set will be severely altered if the amount of MVs is considerable"]}
  ]},
  {h:"Maximum likelihood",s:[18,19,20,21,22,23],items:[
    {t:"Rubin ==advised against case deletion== (wastes info); ideal case needs θ, which is ==rarely known & hard to estimate==",c:[18,"slide","the parameters θ are rarely known and also very hard to estimate"]},
    {t:"MLE finds params making the observed data most probable — easy in ==1-D (coin toss / Gaussian μ,σ)==",c:[19,"slide","it also works with onedimensional Gaussian by finding the"]},
    {t:"Real data → too many params (100 100-D Gaussians = ==10,000 parameters==), so use ==hidden variables== + an ==iterative== approach",c:[20,"slide","would yield 10,000 parameters"]},
    {t:"Three methods: ==Expectation-Maximization (EM), Multiple Imputation (MI), Bayesian PCA (BPCA)==",c:[23,"slide","Bayesian Principal Component Analysis (BPCA)"]}
  ]},
  {figs:[["missingness-mechanisms","MCAR / MAR / NMAR"],["em-loop","Iterative ML imputation"]]}
 ],
 d13:[
  {h:"ML vs statistical imputation",s:[2, 3],items:[
    {t:"Statistical methods search for **hidden distribution probabilities**; ML ==learns the relationships between attributes== directly",c:[2, "slide", "they model the relationship between the values by searching for the hidden distribution probabilities."]},
    {t:"Same process as ==regression (continuous) / classification (nominal)==; no distribution to estimate, **but still subject to MAR**",c:[3, "slide", "but they are still subject to the MAR assumption in order to correctly apply them"]}
  ]},
  {h:"KNNI",s:[4],items:[
    {t:"**KNNI** — take the K nearest neighbours: ==nominal → most common value==, ==numerical → average==",c:[4, "slide", "For nominal values, the most common value among all neighbors is taken"]},
    {t:"Needs a proximity measure — ==Euclidean (an Lp norm)== is most common",c:[4, "slide", "The Euclidean distance (it is a case of a Lp norm distance) is the most commonly used in the literature."]}
  ]},
  {h:"WKNNI",s:[5, 6],items:[
    {t:"**WKNNI** — same neighbours, but a ==weighted mean / most repeated value by similarity sᵢ(yⱼ)==; closer = more say",c:[5, "slide", "It uses a weighted mean or the most repeated value according to a similarity measure si(yj)"]},
    {t:"1/sᵢ = Σ(y_ih − y_jh)² · a neighbour ==missing attribute h is excluded== from I_Kih",c:[6, "slide", "if yjh is missing the jth attribute is excluded from IKih"]}
  ]},
  {h:"KMI",s:[7, 8],items:[
    {t:"**KMI** — K-means groups by similarity; ==centroid = mean of the cluster==",c:[7, "slide", "A cluster centroid represents the mean value of the objects in the cluster"]},
    {t:"After convergence, fill ==non-reference attributes==; same-cluster objects = ==nearest neighbours== (like KNNI)",c:[8, "slide", "Data objects that belong to the same cluster are taken to be nearest neighbors of each other"]}
  ]},
  {h:"FKMI",s:[9, 10, 11],items:[
    {t:"**FKMI** — each object has a ==membership function U== per cluster → ==less likely stuck in a local minimum==",c:[9, "slide", "less susceptible to get stuck in a local minimum situation"]},
    {t:"Centroids are ==membership-weighted, not plain means==, from ==reference attributes only==; MV = Σ U(xᵢ,vₖ)·v_kj",c:[10, "slide", "we use only reference attributes to compute the cluster centroids."]}
  ]},
  {h:"SVMI",s:[12],items:[
    {t:"**SVMI** — ==SVM regression==, an ==SVM classifier if nominal==; decision ↔ condition attributes swapped; trains on ==instances without MVs== only",c:[12, "slide", "Only the instances without MVs are used to predict the MV currently being imputed"]}
  ]},
  {h:"Event Covering (EC)",s:[13, 19],items:[
    {t:"**EC** — ==mixed-mode model → discrete one== (discretize with ==minimum loss of information==)",c:[13, "slide", "We discretize the continuous components using a minimum loss of information criterion"]},
    {t:"**3 steps:** ==detect interdependency== → ==group into clusters== → ==interpret each cluster==",c:[14, "slide", "EC consists of 3 steps:"]},
    {t:"NN distance = ==Hamming==; D*c = max within-cluster NN distance — ==smaller D*c = denser==",c:[16, "slide", "the smaller the D∗c , the denser the cluster."]},
    {t:"P(x) by ==dependence tree product approximation==; ==above-mean-probability samples go first==",c:[18, "slide", "Samples above the mean will be considered first for cluster initiation."]},
    {t:"Assign x: ≤D* to ==several → merge==, ==exactly one → join==, ==> D* to all → none==",c:[19, "slide", "then all these clusters can be merged together."]}
  ]},
  {h:"SVDI",s:[20, 23],items:[
    {t:"**SVDI** — SVD → ==mutually orthogonal expression patterns== (≈ principal components)",c:[20, "slide", "to obtain a set of mutually orthogonal expression patterns"]},
    {t:"Keep the ==k most significant== (Σ diagonal); fraction ==determined empirically==; regress → ==linear combination==",c:[21, "slide", "the exact fraction of eigenvalues best for estimation needs to be determined empirically"]},
    {t:"SVD ==only works on complete matrices== → ==apply EM first==",c:[23, "slide", "It should be noted that SVD can only be performed on complete matrices"]}
  ]},
  {h:"LLSI",s:[24, 27],items:[
    {t:"**LLSI** — target = ==linear combination of similar instances== (not all instances)",c:[24, "slide", "a target instance that has MVs is represented as a linear combination of similar instances"]},
    {t:"2 steps: ==select k by L2-norm== → ==regression & estimation==; k via ==Pearson’s correlation==",c:[25, "slide", "To select k instances by the L2-norm"]},
    {t:"min‖Aᵀz − w‖₂ → ==α = bᵀ(Aᵀ)†w==, † = ==pseudoinverse==",c:[27, "slide", "where (AT )† is the pseudoinverse of AT"]}
  ]},
  {h:"Recent ML approaches",s:[28],items:[
    {t:"By paradigm: ==Clustering, ANNs, Bayesian nets, Nearest neighbors, Ensembles, Similarity & correlation, Parameter estimation==",c:[28, "slide", "They can be grouped by the paradigm in which they are based on:"]}
  ]},
  {h:"Comparative results",s:[29],items:[
    {t:"As noise, ==CMC & EC disturb least== and ==keep mutual info with the class label==",c:[29, "slide", "CMC and EC are the less disturbing ones"]},
    {t:"**Rules** → ==FKMI, EC, SVMI== · **Black box** → ==EC, KMI== · **Lazy** → ==CMC, MC==",c:[29, "slide", "For black box classifiers, EC and KMI are more appropriate"]},
    {t:"==Don’t skip imputation or delete== instances; ==no universal best method==",c:[29, "slide", "there is no universal imputation method which performs best for all classifiers."]},
    {t:"Try several — ==it is going to be an iterative process==",c:[29, "tr", "It is going to be an iterative process."]}
  ]},
  {figs:[["knn-wknn", "KNNI vs WKNNI"], ["hard-vs-fuzzy", "KMI vs FKMI"], ["ec-assign", "EC cluster assignment"]]}

 d14:[
  {h:"Why noise matters",s:[2, 5],items:[
    {t:"Model performance ==heavily depends on the quality of the training data==",c:[2, "slide", "will heavily depend on the quality of the training data"]},
    {t:"Noise can ==create small clusters==, remove key instances, ==disrupt boundaries & increase overlapping==",c:[3, "slide", "disrupt the boundaries of the classes and increase overlapping among them."]},
    {t:"**Robustness** = models ==insensitive to data corruptions==; robust → ==clean & noisy models similar==",c:[4, "slide", "The more robust an algorithm is, the more similar the models built from clean and noisy data are"]},
    {t:"With noise, ==robustness > performance results==",c:[5, "slide", "Robustness is considered more important than performance results when dealing with noisy data"]}
  ]},
  {h:"3 approaches",s:[6],items:[
    {t:"**Robust learners** (e.g., ==C4.5==) · **Data polishing** (==correct== before training) · **Noise filters** (==eliminate==)",c:[6, "slide", "Data polishing methods. Their aim is to correct noisy instances prior to training a learner"]}
  ]},
  {h:"Not only noise",s:[7, 9],items:[
    {t:"Also ==small disjuncts== and ==overlapping between classes== — hard to tell from noise",c:[7, "slide", "it often is hard to distinguish between such overlapping and the presence of noisy examples"]},
    {t:"**Borderline examples** = near class boundaries; ==misclassification often occurs== there",c:[9, "slide", "Misclassification often occurs near class boundaries where overlapping usually occurs"]}
  ]},
  {h:"Safe / Borderline / Noisy",s:[10, 11],items:[
    {t:"**Safe** = ==homogeneous areas==; **Borderline** = ==around class boundaries==; **Noisy** = ==in the safe areas of the other class==",c:[10, "slide", "Noisy examples are individuals from one class occurring in the safe areas of the other class"]},
    {t:"Borderline ≠ noise — ==removing them indiscriminately may hurt== the classifier",c:[11, "tr", "Removing such examples indiscriminately may actually hurt the classifier's performance."]}
  ]},
  {h:"Types of noise",s:[12, 14],items:[
    {t:"Quality = ==class labels + attribute values==",c:[12, "slide", "the class labels and the attribute values directly influence such a quality"]},
    {t:"**Class (label) noise** = incorrectly labeled: ==contradictory examples, misclassifications==",c:[13, "slide", "Class noise (also referred as label noise) occurs when an example is incorrectly labeled"]},
    {t:"**Attribute noise** = erroneous, ==missing/unknown==, incomplete or ==“do not care”== values",c:[13, "slide", "incomplete attributes or “do not care” values"]},
    {t:"==Attribute noise is more harmful== (esp. attrs ==correlated with the class==); literature ==focuses on class noise==",c:[14, "slide", "Attribute noise is more harmful than class noise"]}
  ]},
  {h:"Noise mechanisms",s:[15, 19],items:[
    {t:"**NCAR** — ==independent of class Y and inputs X==",c:[16, "slide", "the label noise is called noise completely at random or NCAR"]},
    {t:"**NAR** — independent of X, but ==the true class makes it more/less prone== (e.g., ==medical case-control==)",c:[17, "slide", "the true value of the class make it more or less prone to be noisy"]},
    {t:"**NNAR** — ==inputs affect the label-error probability==; ==most general case==",c:[18, "slide", "NNAR model is the more general case of class noise."]},
    {t:"Attribute noise: NCAR (no dependence) · NAR (==own true value==) · NNAR (==own + other inputs==)",c:[19, "slide", "the noise probability will depend on the value of the feature but also on the rest of the input feature values"]}
  ]},
  {h:"Simulating noise",s:[20, 22],items:[
    {t:"3 traits: ==where introduced, distribution, magnitude==",c:[20, "slide", "The magnitude of generated noise values"]},
    {t:"Class: ==uniform== / ==pairwise (majority → 2nd majority)==; Attribute: ==uniform== / ==Gaussian (low variation)==",c:[21, "slide", "labeling examples of the majority class with the second majority class"]},
    {t:"Robustness test: ==original vs noisy== results — ==most similar = most robust==",c:[22, "slide", "will be the most robust ones."]}
  ]},
  {h:"Noise filters",s:[23, 25],items:[
    {t:"==Preprocessing== to detect & eliminate noisy instances → ==reduced training set==",c:[23, "slide", "Noise filters are preprocessing mechanisms to detect and eliminate noisy instances in the training set"]},
    {t:"Target ==class noise==; removing ==attribute-noise instances is counterproductive==",c:[24, "slide", "The elimination of instances with attribute noise seems counterproductive"]},
    {t:"Hard to tell ==noise from true exceptions== (e.g., fraud)",c:[24, "slide", "It is also hard to distinguish between noisy examples and true exceptions"]},
    {t:"EF, CVCF, IPF are all ==ensemble-based and vote-based==",c:[25, "slide", "these three methods are ensemble-based and vote-based filters."]}
  ]},
  {h:"EF · CVCF · IPF",s:[26, 31],items:[
    {t:"**EF** — ==C4.5, 1-NN, LDA==; each trained on Γ−1 parts, ==tags the excluded part==; ==consensus vote==",c:[27, "slide", "We use a consensus vote scheme in this case."]},
    {t:"**CVCF** — ==Γ-FCV==, ==C4.5== on Γ−1 parts, tags all of D_T; ==majority vote==",c:[29, "slide", "the majority scheme in our experimentation"]},
    {t:"**IPF** — C4.5 trained ==on each part==; majority vote; iterate until found ==< p% of original data==",c:[30, "slide", "is less than a percentage p of the size of the original training data set"]}
  ]},
  {h:"Robust learners",s:[33, 36],items:[
    {t:"Filtering drawback: ==valuable instances get dropped== → ==train several classifiers==",c:[33, "slide", "some instances will be dropped from the data sets, even if they are valuable"]},
    {t:"==C4.5 = paradigmatic robust learner==; fix tree sensitivity with ==split criteria + pruning==",c:[34, "slide", "C4.5 has been considered as a paradigmatic robust learner against noise"]},
    {t:"==Bagging beats boosting== under label noise; different base learners = ==MCS==",c:[35, "slide", "Bagging obtains better performance than boosting when label noise is present"]},
    {t:"Per-class ==bags== (binary decomposition) ==decrease overlapping== & ==contain noise== to its bag",c:[36, "slide", "It limits the effect of noisy instances to their respective bags"]}
  ]},
  {h:"Comparative results",s:[37],items:[
    {t:"Filters ==reduce accuracy loss== & ==model complexity==; ==MCSs== and ==OVO== improve results under noise",c:[37, "slide", "Using filters diminish the loss of accuracy as the noise increases"]}
  ]},
  {figs:[["noise-models", "NCAR / NAR / NNAR"], ["safe-border-noisy", "Safe / borderline / noisy"], ["filters-compare", "EF vs CVCF vs IPF"]]}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slideText(s){

    if(b.t==="tbl")return b.head.join(" ")+" "+b.rows.map(r=>r.join(" ")).join(" ");
    if(b.t==="dg")return (DIAGRAMS[b.id]&&DIAGRAMS[b.id].text)||"";
    if(b.t==="code")return b.x||"";

}
function deckReviewedCount(id){const d=deckById(id);return d.slides.filter(s=>S.decks[id].reviewed[s.n]).length;}
function deckAccuracy(id){
  const h=S.history.filter(x=>x.deck===id);
  if(!h.length)return null;
  return Math.round(100*h.filter(x=>x.correct).length/h.length);
}
function weakItems(id){
  // group history by qid, keep those with >=1 wrong
  const map={};
  S.history.filter(x=>x.deck===id).forEach(x=>{
    const k=x.qid; if(!map[k])map[k]={qid:k,deck:x.deck,topic:x.topic,slide:x.slide,q:x.q,attempts:0,wrong:0,hist:[]};
    map[k].attempts++; if(!x.correct)map[k].wrong++; map[k].hist.push(x.correct);
  });
  return Object.values(map).filter(m=>m.wrong>0).sort((a,b)=>b.wrong-a.wrong);
}
function weakTopicsCount(id){
  const set=new Set(weakItems(id).map(w=>w.topic));
  Object.entries(S.decks[id].topicStatus).forEach(([t,st])=>{if(st==="need")set.add(t);});
  return set.size;
}

/* record an answered question */
function record(deck,q,correct,your){
  S.history.push({deck,slide:q.slide,topic:q.topic,qid:q.id||("auto-"+deck+"-"+q.slide),
    type:q.type,correct:!!correct,ts:Date.now(),q:q.q,your:your==null?"":String(your),
    correct_ans:answerLabel(q)});
  // keep history bounded
  if(S.history.length>4000)S.history=S.history.slice(-4000);
  save();
}
function answerLabel(q){
  if(q.type==="mc")return q.opts[q.a];
  if(q.type==="tf")return q.a?"True":"False";
  if(q.type==="fib")return q.answer;
  if(q.type==="short")return q.ev;
  if(q.type==="match")return "(matching)";
  return "";
}

/* ---- auto fill-in-the-blank generator from a slide ---- */
const STOP=new Set("the a an of to in and or for with as is are be by on that this it its their they them from into which within under over most well known good are used they may have some other both each an all not no".split(" "));
function fibFromSlide(deck,s){
  // candidate sentences = paragraph/bullet text (not headings) with a meaningful term to blank
  const cands=[];
  s.blocks.forEach(b=>{
    if(b.t==="tbl"||b.t==="img"||b.t==="note"||b.t==="h")return;
    let txt=(b.lb?b.lb+" ":"")+(b.x||"");
    txt=txt.trim();
    if(txt.length<32)return;
    const term=pickTerm(txt);
    if(term)cands.push({txt,term});
  });
  if(!cands.length)return null;
  const c=cands[Math.floor(Math.random()*cands.length)];
  const blanked=c.txt.replace(c.term,"______");
  return {type:"fib",slide:s.n,topic:topicForSlide(deck,s.n),q:blanked,answer:c.term,ev:c.txt,id:"fib-"+deck+"-"+s.n+"-"+Math.floor(Math.random()*1e6)};
}
// choose the best term to blank: prefer acronyms-in-parens, then capitalised multi-word
// terms that aren't the sentence's first word, then the longest content word (not first word)
function pickTerm(txt){
  let m=txt.match(/\(([A-Z][A-Za-z0-9\/\-]{1,10})\)/);           // (GIL), (ANNs), (KNN)
  if(m)return m[1];
  const firstWord=(txt.match(/^[A-Za-z\-]+/)||[""])[0];
  const caps=[...txt.matchAll(/\b([A-Z][a-zA-Z\-]+(?:\s[A-Z][a-zA-Z\-]+){0,2})\b/g)]
    .map(x=>({w:x[1],i:x.index}))
    .filter(x=>x.i>0 && x.w.length>3 && !/^(The|They|This|That|It|Its|Both|Each|Set)$/.test(x.w));
  if(caps.length)return caps.sort((a,b)=>b.w.length-a.w.length)[0].w;
  const words=txt.replace(/[^A-Za-z\- ]/g," ").split(/\s+/)
    .filter(w=>w.length>6 && !STOP.has(w.toLowerCase()) && w.toLowerCase()!==firstWord.toLowerCase());
  if(words.length)return words.sort((a,b)=>b.length-a.length)[0];
  return null;
}
function topicForSlide(deck,n){
  const d=deckById(deck);const t=(d.topics||[]).find(t=>t.slides.includes(n));
  return t?t.name:d.title;
}

/* build a pool of questions for a deck (bank + generated fib for coverage) */
function poolForDeck(deck,{types="all",diff="all",slides=null}={}){
  let pool=BANK[deck].slice();
  if(slides)pool=pool.filter(q=>slides.includes(q.slide));
  if(diff!=="all")pool=pool.filter(q=>String(q.diff)===String(diff)||q.type==="fib");
  if(types!=="all"){
    const want=new Set(types);
    pool=pool.filter(q=>want.has(q.type));
    // add generated fib if requested
    if(want.has("fib")){
      const src=slides?deckById(deck).slides.filter(s=>slides.includes(s.n)):deckById(deck).slides;
      src.forEach(s=>{const f=fibFromSlide(deck,s);if(f&&(diff==="all"||diff==="1"))pool.push(f);});
    }
  }
  return pool;
}

function renderBlocks(container,blocks,highlight){
  let curUL=null;
  const flush=()=>{if(curUL){container.appendChild(curUL);curUL=null;}};
  blocks.forEach(b=>{
    if(b.t==="b"){
      if(!curUL)curUL=el("ul","bl");
      const li=el("li","l"+(b.l||0));
      const bx=String(b.x).replace(/\uf0e0/g,"\u2192"); // display-only: Wingdings arrow glyph -> real arrow (stored text stays verbatim)
      if(b.lb){const s=el("span","blk-lb");s.textContent=b.lb+" ";li.appendChild(s);li.appendChild(document.createTextNode(bx));}
      else li.textContent=bx;
      if(b.bold)li.classList.add("blk-bold");
      if(highlight)hl(li,highlight);
      curUL.appendChild(li);
      return;
    }
    flush();
    if(b.t==="h"){const e=el("div","blk-h",b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="p"){const e=el("div","blk-p"+(b.bold?" blk-bold":""),b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="note"){const e=el("div","blk-note",b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="code"){const pre=el("pre","blk-code");pre.textContent=b.x;if(highlight)hl(pre,highlight);container.appendChild(pre);}
    else if(b.t==="img"){const e=el("div","blk-img");e.innerHTML=`<span>🖼</span>`;e.appendChild(document.createTextNode("[Image: "+b.x+"]"));container.appendChild(e);}
    else if(b.t==="dg"){const d=DIAGRAMS[b.id];if(d){const holder=el("div");holder.innerHTML=d.svg();if(holder.firstElementChild)container.appendChild(holder.firstElementChild);}}
    else if(b.t==="tbl"){
      const t=el("table","slide-tbl");const thead=el("thead");const tr=el("tr");
      b.head.forEach(h=>tr.appendChild(el("th",null,h)));thead.appendChild(tr);t.appendChild(thead);
      const tb=el("tbody");
      b.rows.forEach(r=>{const rr=el("tr");r.forEach((cell,ci)=>{const td=el("td");if(ci===1){const k=el("span","kbd",cell);td.appendChild(k);if(highlight)hl(k,highlight);}else{td.textContent=cell;if(highlight)hl(td,highlight);}rr.appendChild(td);});tb.appendChild(rr);});
      t.appendChild(tb);container.appendChild(t);
    }
  });
  flush();
}
function hl(node,q){
  if(!q)return 0;
  const txt=node.textContent;const low=txt.toLowerCase(),ql=q.toLowerCase();
  if(low.indexOf(ql)<0)return 0;
  node.textContent="";
  let i=0,cnt=0;
  while(true){
    const j=low.indexOf(ql,i);
    if(j<0){node.appendChild(document.createTextNode(txt.slice(i)));break;}
    node.appendChild(document.createTextNode(txt.slice(i,j)));
    node.appendChild(el("mark",null,txt.slice(j,j+q.length)));
    cnt++;i=j+q.length;
  }
  return cnt;
}

/* ---------- BUILD QUESTION SETS ---------- */
function buildSlideQuestions(deck,n){
  let qs=BANK[deck].filter(q=>q.slide===n);
  const s=slideOf(deck,n);
  // add up to 2 auto fib for variety/coverage
  for(let k=0;k<2;k++){const f=fibFromSlide(deck,s);if(f)qs.push(f);}
  qs=dedupe(qs);
  if(!qs.length){const f=fibFromSlide(deck,s);if(f)qs=[f];}
  return shuffle(qs).slice(0,Math.max(3,Math.min(qs.length,8)));
}
function buildTopicQuestions(deck,t){
  let qs=BANK[deck].filter(q=>t.slides.includes(q.slide));
  t.slides.forEach(sn=>{const f=fibFromSlide(deck,slideOf(deck,sn));if(f)qs.push(f);});
  qs=dedupe(qs);
  return shuffle(qs).slice(0,Math.min(qs.length,10));
}
function dedupe(qs){const seen=new Set();return qs.filter(q=>{const k=q.id||q.q;if(seen.has(k))return false;seen.add(k);return true;});}

/* ---------- SESSION ENGINE (practice / slide / topic / test) ---------- */
function renderSession(){
  const Q=R.questions,i=R.i,q=Q[i];
  const isTest=R.mode==="test";
  const total=Q.length;

  const head=el("div","spread");head.style.marginBottom="14px";
  const title=R.mode==="slide"?`Slide ${R.slide} Practice`:R.mode==="topic"?`Topic: ${R.label}`:isTest?"Practice Test":"Practice";
  head.innerHTML=`<div><div class="eyebrow">${escapeHTML(deckById(R.deck).title)}</div><h2 style="font-size:19px;margin-top:4px">${escapeHTML(title)}</h2></div>`;
  const quit=el("button","btn sm","Exit");quit.onclick=()=>go(R.from||{view:"home"});
  head.appendChild(quit);
  view.appendChild(head);

  const pbar=el("div","progress");pbar.style.marginBottom="16px";
  pbar.appendChild(Object.assign(el("i"),{style:`width:${Math.round(100*i/total)}%`}));
  view.appendChild(pbar);
  const counter=el("div","muted");counter.style.cssText="font-size:13px;margin-bottom:10px;font-weight:600";
  counter.textContent=`Question ${i+1} of ${total}`;
  view.appendChild(counter);

  const card=el("div","q-card");
  const meta=el("div","q-meta");
  meta.innerHTML=`<span class="tag">Slide ${q.slide}</span><span class="pill">${typeName(q.type)}</span>${q.diff?`<span class="pill ${q.diff===3?"b":q.diff===2?"p":"g"}">${["","Basic","Moderate","Challenging"][q.diff]}</span>`:""}`;
  card.appendChild(meta);

  const answered={done:false};
  const advance=(correct,your)=>{
    if(answered.done)return;answered.done=true;
    if(!isTest||true)record(R.deck,q,correct,your);
    R.answers=R.answers||[];R.answers[i]={q,correct,your};
    // reveal handled inside each type; show next button
    nextBar();
  };
  const nextBar=()=>{
    const bar=el("div","row");bar.style.marginTop="18px";
    const more=i<total-1;
    const b=el("button","btn primary",more?"Next question ›":(isTest?"See results":"Finish"));
    b.onclick=()=>{
      if(more)go(Object.assign({},R,{i:i+1}));
      else finishSession();
    };
    bar.appendChild(b);
    card.appendChild(bar);
  };

  if(q.type==="mc")mcUI(card,q,advance);
  else if(q.type==="tf")tfUI(card,q,advance);
  else if(q.type==="fib")fibUI(card,q,advance);
  else if(q.type==="short")shortUI(card,q,advance);
  else if(q.type==="match")matchUI(card,q,advance);
  view.appendChild(card);
}

function fibUI(card,q,advance){

function shortUI(card,q,advance){
  const qt=el("div","q-text");qt.textContent=q.q;card.appendChild(qt);
  const ta=el("textarea","q-input");ta.placeholder="Answer in your own words…";card.appendChild(ta);
  const b=el("button","btn primary","Submit answer");b.style.marginTop="14px";
  b.onclick=()=>{
    const your=ta.value.trim();
    const low=normalize(your);
    const hits=(q.keys||[]).filter(k=>low.includes(normalize(k))).length;
    const need=Math.max(1,Math.ceil((q.keys||[]).length*0.34));
    const correct=hits>=need;
    ta.disabled=true;b.disabled=true;
    const box=el("div");
    box.innerHTML=`<div style="margin-bottom:8px" class="muted">Self-check — your wording doesn't have to match. Compare with the slide:</div>`;
    box.appendChild(sourceBox(q));
    const sc=el("div","row");sc.style.marginTop="12px";
    const bad=el("button","btn sm","I missed it");const good=el("button","btn sm primary","I had it");
    sc.append(el("span","muted"),bad,good);
    box.appendChild(sc);
    feedback(card,correct,box);
    // let learner override the keyword heuristic
    bad.onclick=()=>{overrideResult(false);};good.onclick=()=>{overrideResult(true);};
    let recorded=false;
    function overrideResult(val){if(recorded){/*update last*/const last=S.history[S.history.length-1];if(last&&last.qid===(q.id))last.correct=val;save();}bad.disabled=good.disabled=true;bad.style.opacity=val?.4:1;good.style.opacity=val?1:.4;}
    advance(correct,your);recorded=true;
  };

}
function matchUI(card,q,advance){
  const qt=el("div","q-text");qt.textContent=q.q;card.appendChild(qt);
  const grid=el("div","match-grid");
  const left=el("div","match-col");left.appendChild(Object.assign(el("h4"),{textContent:"Terms"}));
  const right=el("div","match-col");right.appendChild(Object.assign(el("h4"),{textContent:"Definitions"}));
  const terms=q.pairs.map((p,ix)=>({term:p[0],def:p[1],ix}));
  const defs=shuffle(q.pairs.map((p,ix)=>({def:p[1],ix})));
  let sel=null,solved=0;const total=q.pairs.length;const wrongAny={v:false};
  const termNodes={},defNodes={};
  terms.forEach(t=>{
    const b=el("div","match-item term",t.term);termNodes[t.ix]=b;
    b.onclick=()=>{if(b.classList.contains("done"))return;
      Object.values(termNodes).forEach(x=>x.classList.remove("sel"));
      sel=t.ix;b.classList.add("sel");};
    left.appendChild(b);
  });
  defs.forEach(d=>{
    const b=el("div","match-item def",d.def);defNodes[d.ix]=b;
    b.onclick=()=>{
      if(sel==null||b.classList.contains("paired"))return;
      if(sel===d.ix){
        termNodes[sel].classList.add("done");termNodes[sel].classList.remove("sel");
        b.classList.add("paired");solved++;sel=null;
        if(solved===total){finish();}
      }else{
        wrongAny.v=true;b.style.borderColor="var(--bad)";setTimeout(()=>b.style.borderColor="",400);
      }
    };
    right.appendChild(b);
  });
  grid.append(left,right);card.appendChild(grid);
  function finish(){
    const correct=!wrongAny.v;
    const box=el("div");
    q.pairs.forEach(p=>{const line=el("div");line.style.margin="4px 0";line.innerHTML=`<b>${escapeHTML(p[0])}:</b> `;line.appendChild(document.createTextNode(p[1]));box.appendChild(line);});
    const sb=el("div","source-box");sb.innerHTML=`<div class="src">Source: ${deckById(R.deck).title} — Slide ${q.slide}</div>`;sb.appendChild(Object.assign(el("div","quote"),{textContent:q.ev}));
    box.appendChild(sb);
    feedback(card,correct,box);advance(correct,"matching");
  }
}
function normalize(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();}

function makeSnippet(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return escapeHTML(text.slice(0,140))+"…";
  const start=Math.max(0,i-50),end=Math.min(text.length,i+q.length+80);
  return (start>0?"…":"")+escapeHTML(text.slice(start,i))+"<mark>"+escapeHTML(text.slice(i,i+q.length))+"</mark>"+escapeHTML(text.slice(i+q.length,end))+(end<text.length?"…":"");
}

/* ============================================================
   QUICK FIND  —  Ctrl/⌘+F launcher, jump straight to a slide.
   Searches every slide's word-for-word content AND its lecture
   transcript, across all weeks, and highlights the term on arrival.
   ============================================================ */
function searchAll(q){
  const ql=q.toLowerCase(),out=[];
  WEEKS.forEach(w=>w.deckIds.forEach((did,pi)=>{
    const d=deckById(did);if(!d)return;
    d.slides.forEach(s=>{
      const blob=s.title+" — "+slideText(s);
      const inContent=blob.toLowerCase().includes(ql);
      const inTr=!!(s.tr&&s.tr.toLowerCase().includes(ql));
      if(!inContent&&!inTr)return;
      out.push({weekId:w.id,weekLabel:w.label,deckId:did,ppt:pi+1,slide:s.n,title:s.title,
        snip:makeSnippet(inContent?blob:s.tr,q),
        source:inContent?(inTr?"slide + transcript":"slide"):"transcript"});
    });
  }));
  return out;
}
let QF=null;
function openQuickFind(prefill){
  if(QF){QF.input.focus();QF.input.select();return;}
  const ov=el("div","qf-overlay");
  const panel=el("div","qf-panel");
  const inrow=el("div","qf-inputrow");
  inrow.innerHTML=`<span class="qf-ico">🔍</span>`;
  const input=el("input","qf-input");input.type="text";input.placeholder="Search every slide & transcript…";input.autocomplete="off";input.spellcheck=false;
  const count=el("span","qf-count");
  const escb=el("button","qf-esc","esc");escb.onclick=closeQuickFind;
  inrow.append(input,count,escb);
  const results=el("div","qf-results");
  const foot=el("div","qf-foot");
  foot.innerHTML=`<span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span><span class="qf-foot-note">searches all weeks — slides + transcripts</span>`;
  panel.append(inrow,results,foot);ov.appendChild(panel);document.body.appendChild(ov);
  ov.addEventListener("mousedown",e=>{if(e.target===ov)closeQuickFind();});
  QF={ov,input,results,count,rows:[],active:-1};
  input.value=prefill||"";
  input.addEventListener("input",renderQF);
  input.addEventListener("keydown",qfKey);
  renderQF();
  setTimeout(()=>{input.focus();input.select();},0);
}
function closeQuickFind(){if(QF){QF.ov.remove();QF=null;}}
function renderQF(){
  const q=QF.input.value.trim();
  QF.results.innerHTML="";QF.rows=[];QF.active=-1;
  if(q.length<2){QF.count.textContent="";QF.results.innerHTML=`<div class="qf-hint">Type at least 2 characters. Results jump you straight to the slide with the word highlighted.</div>`;return;}
  const all=searchAll(q);
  QF.count.textContent=all.length?`${all.length} slide${all.length>1?"s":""}`:"0";
  if(!all.length){QF.results.innerHTML=`<div class="qf-empty">No slides or transcripts match \u201C${escapeHTML(q)}\u201D.</div>`;return;}
  const byWeek={};all.forEach(r=>{(byWeek[r.weekId]=byWeek[r.weekId]||[]).push(r);});
  const cap=80;let shown=0;
  WEEKS.forEach(w=>{
    const rows=byWeek[w.id];if(!rows||!rows.length)return;
    const hd=el("div","qf-week");hd.innerHTML=`<span>${escapeHTML(w.label)}</span><span class="qf-wk-sub">${rows.length}</span>`;QF.results.appendChild(hd);
    rows.forEach(r=>{
      if(shown>=cap)return;
      const row=el("div","qf-row");
      row.innerHTML=`<div class="qf-row-h"><span class="qf-badge">PPT ${r.ppt} · Slide ${r.slide}</span><span class="qf-title">${escapeHTML(r.title)}</span><span class="qf-src ${r.source==="transcript"?"tr":""}">${escapeHTML(r.source)}</span></div><div class="qf-snip">${r.snip}</div>`;
      row._data=r;
      row.addEventListener("mouseenter",()=>setActiveQF(QF.rows.indexOf(row)));
      row.addEventListener("click",()=>openRowQF(r));
      QF.results.appendChild(row);QF.rows.push(row);shown++;
    });
  });
  if(all.length>shown){const m=el("div","qf-more");m.textContent=`+ ${all.length-shown} more — keep typing to narrow`;QF.results.appendChild(m);}
  setActiveQF(0);
}
function setActiveQF(i){
  if(!QF||!QF.rows.length)return;
  QF.active=Math.max(0,Math.min(i,QF.rows.length-1));
  QF.rows.forEach((r,k)=>r.classList.toggle("active",k===QF.active));
  const a=QF.rows[QF.active];if(a)a.scrollIntoView({block:"nearest"});
}
function openRowQF(r){const q=QF.input.value.trim();closeQuickFind();go({view:"review",deck:r.deckId,n:r.slide,hl:q});}
function qfKey(e){
  if(e.key==="ArrowDown"){e.preventDefault();setActiveQF(QF.active+1);}
  else if(e.key==="ArrowUp"){e.preventDefault();setActiveQF(QF.active-1);}
  else if(e.key==="Enter"){e.preventDefault();const a=QF.rows[QF.active];if(a&&a._data)openRowQF(a._data);}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeQuickFind();}
}

function escapeHTML(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function timeAgo(ts){const d=(Date.now()-ts)/1000;if(d<60)return "just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";}

/* ============================================================
   RECONSTRUCTED DIAGRAMS
   Rebuilt as clean SVG to match the source slides as closely as
   possible: structure, labels, connections and (for the methods
   tree) the representative algorithms named on slides 9-17.
   Inline SVG is styled by the page CSS, so it adapts to dark/light.
   ============================================================ */
function dgWrap(vbW,vbH,inner,uid,caption){
  return `<div class="dg-wrap"><svg class="dg-svg" viewBox="0 0 ${Math.round(vbW)} ${Math.round(vbH)}" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">`
    +`<defs><marker id="${uid}" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" class="dg-arrow"/></marker></defs>`
    +inner+`</svg>`+(caption?`<div class="dg-cap">${escapeHTML(caption)}</div>`:"")+`</div>`;
}
function dgWrapText(text,maxChars){
  const words=String(text).split(" ");const lines=[];let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length<=maxChars)cur=(cur+" "+w).trim(); else {if(cur)lines.push(cur);cur=w;} });
  if(cur)lines.push(cur);
  if(lines.length>2){lines[1]=lines.slice(1).join(" ");lines.length=2;}
  return lines;
}
function dgLabel(cx,cy,label,cls,maxChars){
  const lines=dgWrapText(label,maxChars||18);
  if(lines.length<=1)return `<text x="${cx}" y="${cy}" class="dg-t ${cls||''}" text-anchor="middle" dominant-baseline="central">${escapeHTML(label)}</text>`;
  return `<text x="${cx}" y="${cy}" class="dg-t ${cls||''}" text-anchor="middle" dominant-baseline="central">`
    +`<tspan x="${cx}" dy="-0.55em">${escapeHTML(lines[0])}</tspan><tspan x="${cx}" dy="1.15em">${escapeHTML(lines[1])}</tspan></text>`;
}
function dgBox(x,y,w,h,label,boxCls,textCls,maxChars){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" class="dg-box ${boxCls||''}"/>`+dgLabel(x+w/2,y+h/2,label,textCls,maxChars||Math.floor(w/8.2));
}
function dgArrow(x1,y1,x2,y2,uid){return `<line class="dg-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${uid})"/>`;}
function dgCyl(x,y,w,h,label){
  const rx=w/2, ry=9, cx=x+w/2;
  return `<path class="dg-cyl" d="M ${x} ${y+ry} A ${rx} ${ry} 0 0 1 ${x+w} ${y+ry} L ${x+w} ${y+h-ry} A ${rx} ${ry} 0 0 1 ${x} ${y+h-ry} Z"/>`
    +`<ellipse class="dg-cyl-top" cx="${cx}" cy="${y+ry}" rx="${rx}" ry="${ry}"/>`
    +dgLabel(cx, y+h/2+3, label, "", Math.floor(w/7));
}

function dgPsTaxonomy(){
  const uid="arwpstx", W=960, colW=300, gap=15, x0=15, rowH=46, step=54, top=132;
  const cols=[
    ["Condensation",[["Incremental","CNN · FCNN"],["Decremental","RNN"],["Batch","POP"]]],

  let s=`<rect x="${W/2-90}" y="10" width="180" height="38" rx="10" class="dg-box root"/>`+dgLabel(W/2,29,"PS Methods","on");
  cols.forEach(([name,rows],ci)=>{
    const x=x0+ci*(colW+gap), cx=x+colW/2;
    s+=dgArrow(W/2,50,cx,76,uid);
    s+=`<rect x="${x}" y="80" width="${colW}" height="36" rx="10" class="dg-box cat"/>`+dgLabel(cx,98,name,"cat");
    const spineX=x+14, lastMid=top+(rows.length-1)*step+rowH/2;
    s+=`<line class="dg-line" x1="${spineX}" y1="116" x2="${spineX}" y2="${lastMid}"/>`;
    rows.forEach(([lab,meth],ri)=>{
      const y=top+ri*step, bx=x+28;
      s+=`<line class="dg-line" x1="${spineX}" y1="${y+rowH/2}" x2="${bx}" y2="${y+rowH/2}"/>`;
      s+=`<rect x="${bx}" y="${y}" width="${colW-28}" height="${rowH}" rx="9" class="dg-box"/>`;
      s+=`<text x="${bx+12}" y="${y+16}" class="dg-t sub" dominant-baseline="central">${escapeHTML(lab)}</text>`;
      s+=`<text x="${bx+12}" y="${y+33}" class="dg-t sm cat" dominant-baseline="central">${escapeHTML(meth)}</text>`;
    });
  });
  return dgWrap(W,top+6*step+rowH+12,s,uid,"PS taxonomy (reconstructed) — each leaf shows the methods this deck describes, or its full list when none are described");
}

/* theme */
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);$("#themeIco").textContent=S.theme==="dark"?"☀":"◑";$("#themeTxt").textContent=S.theme==="dark"?"Light mode":"Dark mode";}

/* mobile */
function closeMobile(){$("#sidebar").classList.remove("open");$("#backdrop").classList.remove("show");}
$("#menuBtn").onclick=()=>{$("#sidebar").classList.toggle("open");$("#backdrop").classList.toggle("show");};
$("#backdrop").onclick=closeMobile;

/* sidebar footer actions + search wiring */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]");if(!b)return;
  const a=b.dataset.nav;
  if(a==="theme"){S.theme=S.theme==="dark"?"light":"dark";save();applyTheme();}
  if(a==="reset"){if(confirm("Reset all study progress? This clears reviewed slides, question history, weak areas, flashcard confidence and test scores.")){S=freshState();save();applyTheme();go({view:"home"});}}
});
let searchT=null;
$("#search").addEventListener("input",e=>{
  const q=e.target.value;clearTimeout(searchT);
  searchT=setTimeout(()=>{if(q.trim().length>=2)go({view:"search",q});else if(R.view==="search")go({view:"home"});},220);
});
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter")go({view:"search",q:e.target.value});});
$("#qfHint").addEventListener("click",()=>openQuickFind($("#search").value.trim()));

/* Quick-find keyboard shortcuts: Ctrl/⌘+F opens, Esc closes, "/" opens */
document.addEventListener("keydown",e=>{
  const typing=/^(input|textarea|select)$/i.test(e.target&&e.target.tagName||"");
  if((e.ctrlKey||e.metaKey)&&(e.key==="f"||e.key==="F")){e.preventDefault();openQuickFind();return;}
  if(e.key==="Escape"&&QF){e.preventDefault();closeQuickFind();return;}
  if(e.key==="/"&&!typing&&!QF&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openQuickFind();}
});

/* boot */
applyTheme();
render();
