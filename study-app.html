{
  id:"d5",
  title:"Using Statistical Tests to Compare Methods",
  subtitle:"Data Sets & Proper Statistical Analysis (Part 2) — parametric conditions, normality, Wilcoxon, Friedman & post-hoc tests",
  week:"w3",
  slides:[
    {n:1,title:"Using Statistical Tests to Compare Methods",blocks:[
      DG("test-flow"),
      B("Using the raw performance measures to compare different ML methods and to establish a ranking is discouraged",0,null,false),
      B("Other tools of statistical nature must be utilized in order to obtain meaningful and durable conclusions",0,null,false),
      B("In recent years, there has been a growing interest for the experimental analysis in the field of DM",0,null,false)
    ],
      tr:"In the last lecture we talked about performance and partitioning. Now let's move on to statistical tests to compare methods. Up to this point we've assumed you can compare algorithms using performance values such as accuracy or kappa. However, observing different performance scores does not automatically mean one algorithm is better than the other. Suppose algorithm A achieves 92% accuracy while B achieves 90% — many would assume A is superior, but that conclusion may not be justified. Performance values vary due to randomness: how we partitioned the data, how we trained, initialization parameters, sampling variation. By chance, the 90% algorithm could actually be better than the 92% one. This is why many researchers discourage ranking algorithms solely on raw performance — other statistical tools must be used."},
    {n:2,title:"Conditions for the Safe Use of Parametric Tests",blocks:[
      B("The distinction between parametric and non-parametric tests is based on the level of measure represented by the data to be analyzed",0,null,false),
      B("A parametric test usually uses data composed by real values",0,null,false),
      B("However the latter does not imply that when we always dispose of this type of data, we should use a parametric test",0,null,false),
      B("Other initial assumptions for a safe usage of parametric tests must be fulfilled",1,null,false),
      B("The non fulfillment of these conditions might cause a statistical analysis to lose credibility",1,null,false)
    ],
      tr:"Before selecting a statistical test, we must understand the assumptions underlying it. Statistical tests are generally divided into two categories — parametric and nonparametric. Parametric methods such as t-tests and ANOVA are based on assumptions about the underlying distribution of the data. Although ML performance measures are numerical, we can't automatically assume parametric tests are appropriate; several additional assumptions must be satisfied, and if violated the conclusions may not be reliable. This has led many data-mining researchers to favor nonparametric tests."},
    {n:3,title:"Conditions for the Safe Use of Parametric Tests",blocks:[
      DG("param-nonparam"),
      B("The following conditions are needed in order to safely carry out parametric tests:",0,null,false),
      B("Independence: In statistics, two events are independent when the fact that one occurs does not modify the probability of the other one occurring.",1,null,true),
      B("Normality: An observation is normal when its behaviour follows a normal or Gauss distribution with a certain value of average μ and variance σ.",1,null,true),
      B("Heteroscedasticity: This property indicates the existence of a violation of the hypothesis of equality of variances.",1,null,true)
    ],
      tr:"There are three major assumptions that must be examined before applying parametric tests. The first is independence: individual observations should not be influenced by one another — two events are independent when the fact that one occurs does not modify the probability of the other occurring. The second is normality: the data should follow a normal or Gaussian distribution; many parametric procedures depend heavily on this. The third is heteroscedasticity, sometimes called equality of variances — the variance of the groups being compared should be similar."},
    {n:4,title:"Conditions for the Safe Use of Parametric Tests",blocks:[
      B("With respect to the independence condition, Demšar suggests that independency is not truly verified in k-FCV and 5×2CV.",0,null,false),
      B("Hold-out partitions can be safely take as independent, since training and tests partitions do not overlap.",0,null,false),
      B("The independence of the events in terms of getting results is usually obvious, given that they are independent runs of the algorithm with randomly generated initial seeds",0,null,false)
    ],
      tr:"Of the three assumptions, independence is often the most difficult to guarantee in a machine-learning setting. Common validation methods such as k-fold cross-validation and 5×2 cross-validation do not provide complete independence because training and testing procedures overlap across multiple runs. In contrast, holdout validation produces more independent partitions because they do not overlap. Researchers must be aware of this, because many statistical procedures assume observations are independent — and in practice they may not be."},
    {n:5,title:"Conditions for the Safe Use of Parametric Tests",blocks:[
      B("Three normality tests are usually used in order to check whether normality is present or not:",0,null,false),
      B("Kolmogorov–Smirnov: compares the accumulated distribution of observed data with the accumulated distribution expected from a Gaussian distribution.",1,null,false),
      B("Shapiro–Wilk: analyzes the observed data to compute the level of symmetry and kurtosis (shape of the curve) in order to compute the difference with respect to a Gaussian distribution afterwards.",1,null,false),
      B("D’Agostino–Pearson: first computes the skewness and kurtosis to quantify how far from Gaussian the distribution is in terms of asymmetry and shape. It then calculates how far each of these values differs from the value expected with a Gaussian distribution.",1,null,false)
    ],
      tr:"To determine whether the normality assumption is satisfied, researchers commonly apply formal normality tests. Three popular tests are discussed. The Kolmogorov–Smirnov test compares the observed distribution to an ideal Gaussian distribution. The Shapiro–Wilk test examines the shape of the distribution, including symmetry. The D'Agostino–Pearson test combines information about skewness and kurtosis to evaluate departures from normality. If your data is normal, these tests will report that."},
    {n:6,title:"Conditions for the Safe Use of Parametric Tests",blocks:[
      B("Levene’s test is used for checking whether or not k samples present this homogeneity of variances (homoscedasticity).",0,null,false),
      B("When observed data does not fulfill the normality condition, this test’s result is more reliable than Bartlett’s test, which checks the same property.",0,null,false)
    ],
      tr:"The third assumption involves equal variance across groups. Levene's test is commonly used to evaluate it — the goal is to determine whether multiple samples exhibit similar variability. Levene's test is generally preferred over Bartlett's test when normality is questionable, because it tends to be more robust when the distributions depart from Gaussian behavior. If variances differ substantially, the assumptions required by many parametric procedures may be violated."},
    {n:7,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("Let us consider an small case of study",0,null,false),
      B("a small set of 6 well-known classification problems",1,null,false),
      B("10-FCV as a validation scheme",1,null,false),
      B("MLP as a classifier",1,null,false),
      B("5 runs",1,null,false),
      B("Please note that using a k-FCV will mean that independence is not held but it is the most common validation scheme used in classification so this study case turns out to be relevant",0,null,false)
    ],
      tr:"This next section investigates whether these assumptions are actually satisfied in real machine-learning experiments. The authors present a case study using six classification data sets evaluated with an MLP classifier, assessed with 10-fold cross-validation repeated 5 times. The goal is simple — determine whether the resulting performance scores follow a normal distribution. Note that using k-FCV means independence is not held, but it is the most common validation scheme used in classification."},
    {n:8,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("We want to check if our samples follow a normal distribution:",0,null,false),
      B("As we can observe, in many cases the normality assumption is not held (indicated by an “a” in the table).",0,null,false),
      IMG("Table: normality-test results across the 6 data sets (an 'a' marks a violation of normality)")
    ],
      tr:"This slide presents the results of several normality tests applied to the experimental data. Many entries in the table indicate violations of the normality assumption — the distribution of the performance scores frequently differs from the bell-shaped Gaussian distribution required by many parametric tests. The key takeaway is that normality cannot simply be assumed; it must be validated. Here the 'a' indicates that normality is not satisfied — Cleveland and Pima seem OK, but some others are off."},
    {n:9,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("Q-Q graphics can be also used to represent a confrontation between the quartiles from data observed and those from the normal distributions.",0,null,false),
      B("Complemented with histograms of the data, the normality can be visually checked",0,null,false),
      IMG("Q–Q plot + histogram: observed sample quantiles vs. the normal distribution")
    ],
      tr:"Statistical tests are not the only way to assess normality — researchers also use graphical techniques such as histograms and Q-Q plots. A Q-Q plot compares the observed quantiles of the sample data to the quantiles expected from a normal distribution. If the points fall roughly along a straight line, the data is considered close to normal; large deviations from the line indicate departures from normality. Combined with histograms, normality can usually be checked visually rather than relying only on a number."},
    {n:10,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("A general case in which the property of abnormality is clearly presented",0,null,false),
      IMG("Q–Q plot: a clear case where normality is violated (no bell shape)")
    ],
      tr:"This figure shows a case where normality is clearly violated. The distribution does not display the symmetrical bell shape, and the Q-Q plot shows substantial deviations from the expected straight line. We don't see a Gaussian bell curve, and if we leave the data looking like this, statistical tests become risky because some required assumptions are not met."},
    {n:11,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("A sample whose distribution follows a normal shape, and the three normality tests employed verified this",0,null,false),
      IMG("Q–Q plot + histogram: a sample that does follow a normal shape")
    ],
      tr:"This example data set does appear to follow the normal distribution — the histogram exhibits a familiar bell shape and the points on the Q-Q plot remain close to the reference line. In this case, the three normality tests discussed earlier all support the normality assumption. A few points may be off the line, but those may be outliers; the majority are right on the line."},
    {n:12,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("The non fulfillment of the normality and homoscedasticity conditions is perfectible.",0,null,true),
      B("In most functions, the normality condition is not verified in a single-problem analysis",0,null,false),
      B("The homoscedasticity is also dependent of the number of algorithms studied",1,null,false),
      B("A sample of 50 results that should be large enough to fulfill the parametric conditions does not always verify the necessary precepts for applying parametric tests, as we could see in the previous section.",0,null,false),
      B("For all these reasons, the use of non-parametric test for comparing ML algorithms is recommended",0,null,false)
    ],
      tr:"This slide summarizes one of the chapter's most important conclusions: the authors observe that normality and homoscedasticity are frequently violated in machine-learning experiments. Even when the sample size is reasonably large, performance results often fail the necessary assumptions for parametric testing. Because of these repeated violations, many researchers recommend using nonparametric procedures when comparing algorithms — they are more robust because they rely on fewer assumptions about the underlying distribution."},
    {n:13,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("The third condition needing to be fulfilled is heteroscedasticity",0,null,false),
      B("Applying Levene’s test to the samples of the six data sets results in the following table",0,null,false),
      B("The non fulfillment of the normality and homoscedasticity conditions is perfectible.",0,null,true)
    ],
      tr:"This slide examines the third assumption — equal variance across groups. The authors applied Levene's test to the data sets, and the results show that variance equality is not always satisfied. Just as normality is frequently violated, homoscedasticity also fails in many practical situations. When both assumptions are violated, the argument for using nonparametric procedures becomes even stronger."},
    {n:14,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("ML approaches have been compared through parametric tests by means of paired t tests",0,null,false),
      B("In some cases, the t test is accompanied with the non-parametric Wilcoxon test applied over multiple data sets",0,null,false),
      B("Their use is correct when we are interested in finding the differences between two methods",0,null,false),
      B("they must not be used when we are interested in comparisons that include several methods.",1,null,false)
    ],
      tr:"This next section introduces statistical methods specifically for comparing algorithms when the parametric assumptions can't be trusted. We begin with comparing two algorithms across multiple data sets. Traditionally researchers use the paired t-test, but in ML studies it is common to accompany it with a nonparametric alternative — the Wilcoxon signed-ranks test. These tests are appropriate when comparing exactly two methods; problems arise when researchers perform many pairwise comparisons among algorithms."},
    {n:15,title:"Normality Test over the Group of Data Sets and Algorithms",blocks:[
      B("In the case of repeating pairwise comparisons, there is an associated error that grows as the number of comparisons done increases",0,null,false),
      B("It is the family-wise error rate (FWER)",0,null,false),
      B("It is the probability of at least one error in the family of hypotheses",1,null,false),
      B("To solve this problem, some authors use the Bonferroni correction for applying paired t test although is not recommended.",0,null,false)
    ],
      tr:"When multiple pairwise comparisons are performed, the risk of making statistical mistakes increases. This risk is called the family-wise error rate — the probability of making at least one false discovery among all comparisons. As the number of comparisons grows, the chance of obtaining a significant result purely by chance also grows. This is one reason repeatedly applying pairwise t-tests is discouraged when multiple algorithms are compared."},
    {n:16,title:"Wilcoxon Signed-Ranks Test",blocks:[
      B("It is the analogue of the paired t-test in non-parametric statistical procedures",0,null,false),
      B("It is a pairwise test that aims to detect significant differences between two sample means",0,null,false),
      B("i.e. the behavior of two algorithms",1,null,false)
    ],
      tr:"The Wilcoxon signed-ranks test is one of the most important nonparametric tests in ML research. It serves as the nonparametric counterpart to the paired t-test; its purpose is to determine whether two related samples show significantly different performance. Because it does not require normal distributions, it is generally considered safer than the paired t-test when analyzing ML results."},
    {n:17,title:"Wilcoxon Signed-Ranks Test",blocks:[
      DG("wilcoxon"),
      B("Let di be the difference between the performance scores of the two classifiers on ith out of Nds data sets",0,null,false),
      B("The differences are ranked according to their absolute values",0,null,false),
      B("average ranks are assigned in case of ties",1,null,false),
      B("Let R+ be the sum of ranks for the data sets onwhich the first algorithm outperformed the second, and R− the sum of ranks for the opposite",0,null,false)
    ],
      tr:"The Wilcoxon procedure begins by calculating the performance difference between the two algorithms on each data set. Next, the absolute values of those differences are ranked. Positive ranks correspond to data sets where the first algorithm performs better; negative ranks correspond to data sets where the second performs better. The sums of the positive and negative ranks are then calculated. Rather than relying on the actual performance values, the procedure focuses on ranking the differences."},
    {n:18,title:"Wilcoxon Signed-Ranks Test",blocks:[
      B("Let T be the smaller of the sums",0,null,false),
      B("T = min(R+, R−)",1,null,false),
      B("If T is less than or equal to the value of the distribution of Wilcoxon for Nds degrees of freedom the null hypothesis of equality of means is rejected.",0,null,false)
    ],
      tr:"After calculating the positive and negative rank sums, the smaller of the two values becomes the test statistic T = min(R+, R−). This value is compared against critical values from the Wilcoxon distribution. If T is significantly small, the null hypothesis is rejected — which suggests the two algorithms exhibit statistically significant differences."},
    {n:19,title:"Wilcoxon Signed-Ranks Test",blocks:[
      B("Wilcoxon signed ranks test is more sensible than the t-test",0,null,false),
      B("It assumes commensurability of differences, but only qualitatively",1,null,false),
      B("Greater differences still count more, which is probably desired, but the absolute magnitudes are ignored",1,null,false),
      B("From the statistical point of view, the test is safer since it does not assume normal distributions",0,null,false)
    ],
      tr:"The Wilcoxon signed-ranks test offers several advantages. First, it does not require the data to be normalized. Second, it remains sensitive to consistent differences between algorithms. Third, it reduces the influence of extreme values because it relies on rank information rather than raw numerical values. For these reasons it has become one of the most widely recommended tests for comparison in ML."},
    {n:20,title:"A Case Study: Performing Pairwise Comparisons",blocks:[
      B("We will perform the statistical analysis by means of pairwise comparisons by using the results of performance measures obtained by the algorithms MLP, RBFN, SONN and LVQ",0,null,false),
      B("In order to compare the results between two algorithms and to stipulate which one is the best, we can perform a Wilcoxon signed-rank test",0,null,false),
      B("This statement must be enclosed by a probability of error, that is the complement of the probability of reporting that two systems are the same, called the p value",0,null,false)
    ],
      tr:"Next we introduce a practical example involving four neural-network-based algorithms — MLP, RBFN, SONN, and LVQ. The objective is to compare their classification performance using Wilcoxon. As with any statistical analysis, the result is expressed in terms of probability and uncertainty rather than absolute certainty."},
    {n:21,title:"A Case Study: Performing Pairwise Comparisons",blocks:[
      B("Ranks obtained",0,null,false),
      B("Results from Wilcoxon’s test",0,null,false),
      IMG("Tables: ranks obtained and Wilcoxon's-test results for MLP, RBFN, SONN, LVQ")
    ],
      tr:"This slide presents the ranking results of the Wilcoxon test outcomes for the algorithms. The ranking summarizes which algorithms tend to perform better across the data sets — the numbers represent the ranks and how close they were to being accurate. The results indicate whether the observed differences are statistically significant; a significant result means the performance difference is unlikely to have occurred by random chance alone."},
    {n:22,title:"A Case Study: Performing Pairwise Comparisons",blocks:[
      B("The comparisons performed in this study are independent, so they never have to be considered in a whole",0,null,false),
      B("If we try to extract a conclusion which involves more than one comparison from the previous tables,wewill lose control of the FWER",0,null,false),
      B("The statement: “SONN obtains a classification rate better than RBFN, LVQ and MLP algorithms with a p value lower than 0.05” is incorrect",1,null,false)
    ],
      tr:"The authors stress an important limitation of pairwise testing: each comparison is analyzed independently. While we may conclude that one algorithm outperforms another in a specific comparison, we cannot automatically combine several pairwise results into a broader statement involving all algorithms — doing so ignores the family-wise error rate. So the statement 'SONN obtains a classification rate better than the other three algorithms within a p-value' is incorrect."},
    {n:23,title:"A Case Study: Performing Pairwise Comparisons",blocks:[
      B("The true statistical signification for combining pairwise comparisons is given by",0,null,false),
      IMG("Formula: true statistical signification for combining pairwise comparisons")
    ],
      tr:"This slide illustrates the statistical complications that arise when combining multiple pairwise comparisons. Although each individual comparison may be valid, combining several significant results into a global conclusion requires additional statistical controls; without them, the probability of reporting false discoveries increases. This motivates the development of multiple-comparison procedures designed specifically for comparisons among several algorithms."},
    {n:24,title:"Non-parametric Tests for Multiple Comparisons AmongMore than Two Algorithms",blocks:[
      B("Multiple comparison procedures are designed for allowing the FWER to be fixed",0,null,false),
      B("They take into account all the influences that can exist within the set of results for each algorithm.",0,null,false)
    ],
      tr:"So far we've focused on comparing two algorithms, but in real ML research it's much more common to compare several methods simultaneously. When comparing more than two algorithms, pairwise testing quickly becomes problematic — every additional comparison increases the probability of a Type I error (concluding a difference exists when it does not). Multiple-comparison procedures were developed to control the family-wise error rate while allowing several algorithms to be compared at once."},
    {n:25,title:"Non-parametric Tests for Multiple Comparisons AmongMore than Two Algorithms",blocks:[
      B("One of the most frequent situations where the use of statistical procedures is requested is in the joint analysis of the results achieved by various algorithms",0,null,false),
      B("The groups of differences between these methods (also called blocks) are usually associated with the problems met in the experimental study.",0,null,false)
    ],
      tr:"One of the most frequent situations where statistical procedures are requested is the joint analysis of the results achieved by various algorithms. When we try to put multiple algorithms together, we start causing more and more problems, so a rigorous procedure is needed."},
    {n:26,title:"Non-parametric Tests for Multiple Comparisons AmongMore than Two Algorithms",blocks:[
      B("In a multiple problem comparison, each block corresponds to the results offered for a specific problem.",0,null,false),
      B("When referring to multiple comparisons tests, a block is composed of three or more subjects or results",0,null,false),
      B("Each one corresponding to the performance evaluation of the algorithm for the problem",1,null,false)
    ],
      tr:"The groups of differences between the methods — also called blocks — are usually associated with the problems in the experimental study. In a multiple-problem comparison, each block corresponds to the result offered for a specific problem; a block is composed of three or more results, each corresponding to the performance of an algorithm for that problem."},
    {n:27,title:"Friedman Test",blocks:[
      B("The Friedman test is a nonparametric analog of the parametric two-way analysis of variance",0,null,false),
      B("It can be used to answer the following question:",0,null,false),
      B("In a set of k samples (where k ≥ 2), do at least twoof the samples represent populations with different median values?",1,null,false),
      B("The Friedman test is the analog of the repeated measures ANOVA",0,null,false)
    ],
      tr:"The Friedman test is one of the most important statistical tests in ML. It serves as a nonparametric alternative to repeated-measures ANOVA and answers a simple question: do all the algorithms perform similarly, or is there evidence that at least one behaves differently? Because it is nonparametric, it does not require the normality assumptions that often fail in ML experiments."},
    {n:28,title:"Friedman Test",blocks:[
      B("The null hypothesis for Friedman’s test states equality of medians between the populations",0,null,false),
      B("The alternative hypothesis is defined as the negation of the null hypothesis, so it is nondirectional.",0,null,false)
    ],
      tr:"Like every statistical test, Friedman begins with a hypothesis. The null hypothesis states that all algorithms have equivalent performance — any observed differences are due to random variation. The alternative hypothesis states that one algorithm differs from the others. Notice the alternative does not tell us which algorithm differs; it merely indicates that some difference exists somewhere in the group."},
    {n:29,title:"Friedman Test",blocks:[
      B("The Friedman test method is described as follows:",0,null,false),
      B("It ranks the algorithms for each data set separately, the best performing algorithm getting the rank of 1, the second best rank 2, and so on.",1,null,false),
      B("In case of ties average ranks are assigned",1,null,false),
      B("The Friedman test compares the average ranks of algorithms,",1,null,false),
      B("The Friedman statistic is",1,null,false),
      B("χ²F is distributed according to a χ² distribution with k−1 degrees of freedom, when n and k are big enough (as a rule of a thumb, n > 10 and k > 5)",0,null,false),
      IMG("Formula: the Friedman statistic")
    ],
      tr:"The Friedman test works by ranking the algorithms on each data set: rank 1 goes to the best-performing algorithm, rank 2 to the second best, and so on. After ranking all data sets, average ranks are calculated for each algorithm and the test statistic is computed from these ranks. If the statistic is large enough, the null hypothesis is rejected and we conclude that statistically significant differences exist among the algorithms."},
    {n:30,title:"Iman–Davenport test",blocks:[
      B("Iman and Davenport proposed a derivation from the Friedman statistic",0,null,false),
      B("This last metric often produces a conservative effect not desired.",0,null,false),
      B("The proposed statistic is",0,null,false),
      B("which is distributed according to an F distribution with k-1 and (k-1)(N-1) degrees of freedom",0,null,false),
      IMG("Formula: the Iman–Davenport statistic")
    ],
      tr:"Next is the Iman–Davenport test. Researchers observed that the Friedman test can sometimes be conservative — it may fail to detect genuine differences. To address this, Iman and Davenport proposed a modified version of the Friedman statistic with greater statistical power, allowing it to detect differences more effectively. Many ML studies report both Friedman and Iman–Davenport."},
    {n:31,title:"Iman–Davenport test",blocks:[
      B("A drawback of the ranking scheme employed by the Friedman test is that it allows for intra-set comparisons only",0,null,false),
      B("When the number of algorithms for comparison is small this may pose a disadvantage since inter-set comparisons may not be meaningful",0,null,false),
      B("The method of aligned ranks for the Friedman test overcomes this problem",0,null,false)
    ],
      tr:"A limitation of the Friedman ranking approach is that rankings are assigned independently within each data set, which does not always capture certain relationships across data sets. To address this, researchers developed variants such as the aligned-rank Friedman, which incorporates additional information when comparing the algorithms, improving sensitivity when the number of algorithms is relatively small."},
    {n:32,title:"Post-hoc procedures",blocks:[
      B("The rejection of the null hypothesis in both tests described above does not involve the detection of the existing differences among the algorithms compared.",0,null,false),
      B("They only inform us of the presence of differences among all samples of results compared",0,null,false),
      B("In order to conducting pairwise comparisons within the framework of multiple comparisons, we can proceed with a post-hoc procedure",0,null,false)
    ],
      tr:"Suppose the Friedman test rejects the null hypothesis — what have we learned? We know that differences exist somewhere among the algorithms, but not which algorithm is different. To answer that, we perform a post-hoc analysis, which identifies the specific algorithms responsible for the result."},
    {n:33,title:"Post-hoc procedures",blocks:[
      B("A control algorithm (maybe a proposal to be compared) is usually chosen.",0,null,false),
      B("Then, the post-hoc procedures proceed to compare the control algorithm with the remain k − 1 algorithms.",0,null,false),
      B("In the following, we describe three post-hoc procedures: Bonferroni-Dunn’s, Holm and Hochberg procedures.",0,null,false)
    ],
      tr:"In many studies, researchers select a control algorithm before conducting post-hoc comparisons. The control may be a newly proposed method, the best-performing method, or a widely accepted benchmark. Each competing algorithm is then compared against the control. This structure simplifies interpretation and helps maintain control over statistical error."},
    {n:34,title:"Bonferroni-Dunn’s procedure",blocks:[
      B("It is similar to Dunnett’s test for ANOVA designs",0,null,false),
      B("The performance of two algorithms is significantly different if the corresponding average of rankings is at least as great as its critical difference (CD).",0,null,false),
      B("The value of qα is the critical value of Q for a multiple non-parametric comparison with a control",0,null,false),
      IMG("Formula: Bonferroni-Dunn critical difference (CD)")
    ],
      tr:"The Bonferroni-Dunn procedure is one of the simplest post-hoc methods. It calculates a quantity called the critical difference (CD). If the difference in average rankings between two algorithms exceeds the critical difference, the algorithms are considered significantly different. Its main advantage is simplicity; its main disadvantage is that it tends to be conservative, meaning it may fail to detect some genuine differences."},
    {n:35,title:"Holm procedure",blocks:[
      B("For contrasting the procedure of Bonferroni-Dunn, we dispose of a procedure that sequentially checks the hypotheses ordered according to their significance.",0,null,false),
      B("We will denote the p-values ordered by p1, p2, …, in the way that p1 ≤ p2 ≤ …≤ pk.",0,null,false),
      B("Holm’s method compares each pi with α/(ki) starting from the most significant p-value",0,null,false)
    ],
      tr:"The Holm procedure was developed to provide more statistical power than Bonferroni-Dunn. Instead of applying a single correction to all comparisons, Holm orders the p-values from largest to smallest and tests the most significant comparison first. If that comparison is significant, the procedure continues to the next."},
    {n:36,title:"Holm procedure",blocks:[
      B("If p1 is lower than α/(k1), the corresponding hypothesis is rejected and it leaves us to compare p2 with α/(k2)",0,null,false),
      B("If the second hypothesis is rejected, we continue with the process",0,null,false),
      B("As soon as a certain hypothesis can not be rejected, all the remaining hypotheses are maintained as supported",0,null,false),
      B("The statistic for comparing the i algorithm with the j algorithm is:",0,null,false),
      IMG("Formula: Holm's adjusted threshold α/(k−i)")
    ],
      tr:"Holm continues evaluating the hypotheses one at a time. As long as each comparison satisfies its adjusted threshold, the procedure continues; once a comparison fails to reach significance, all remaining hypotheses are retained. It is a step-down approach — finding the strongest difference and working its way through."},
    {n:37,title:"Hochberg procedure",blocks:[
      B("It is a step-up procedure thatworks in the opposite direction to Holm’s method",0,null,false),
      B("It compares the largest p-value with the next largest with α/2 and so forth until it encounters a hypothesis it can reject",0,null,false),
      B("All hypotheses with smaller p values are then rejected as well",0,null,false),
      B("Hochberg’s method is more powerful than Holm’s",0,null,false)
    ],
      tr:"The Hochberg procedure is another post-hoc method. Unlike Holm's step-down approach, Hochberg uses a step-up strategy: it begins with the largest p-value and works in the opposite direction. Because of this design, Hochberg often has even greater statistical power than Holm, and can identify significant differences that more conservative methods might not."}
  ],

{
  id:"d6",
  title:"Getting Started with pandas",
  subtitle:"Python for Data Analysis · Chapter 5 — Series, DataFrame, indexing, alignment & sorting (Wes McKinney, 3rd ed.)",
  week:"w4",
  slides:[
    {n:1,title:"Why pandas? Labeled Structural Data",blocks:[
      DG("pandas-structures"),
      P("Heterogeneous Support",true),
      P("Designed strictly for tabular data structures with mixed metadata types (such as integers, strings, timestamps, and floats)."),
      CODE("# Mixed-type heterogeneous DataFrame\ndata = {\n    'state': ['Ohio', 'Ohio', 'Nevada'],\n    'year': [2000, 2001, 2002],\n    'pop': [1.5, 1.7, 2.9]\n}\ndf = pd.DataFrame(data)"),
      P("Relational Index Alignment",true),
      P("Provides automatic label-based relational alignment across differently shaped, unmatched index positions seamlessly."),
      CODE("# Automatic index alignment union\ns1 = pd.Series([7.3, -2.5], index=['a', 'c'])\ns2 = pd.Series([2.1, 1.4], index=['b', 'c'])\ns1 + s2  # Yields NaNs on mismatches")
    ],
      tr:"In this chapter we start talking about pandas — we won't go into a lot of depth, just the basic data structures and core. Why pandas? It's labeled structural data: it lets us do things on tabular structures that aren't easily done in Python itself. Like NumPy, Python's own data structures weren't meant for large, fast data processing, so we convert our data into a pandas DataFrame. It also does relational index alignments: I can make a series of 7.3 and -2.5 with index A and C, another of 2.1 and 1.4 with index B and C, and when I add them together pandas aligns them by label automatically."},
    {n:2,title:"Core pandas Data Structures",blocks:[
      P("Series",true),
      P("A structured, 1D array-like sequence containing data matched with a distinct axis labels index array."),
      CODE("s = pd.Series([4, 7, -5, 3])"),
      P("DataFrame",true),
      P("A multi-column spreadsheet-like 2D structure containing ordered collections of labeled columns."),
      CODE("df = pd.DataFrame(data)"),
      P("Index Objects",true),
      P("Immutable sequences carrying axes metadata tags responsible for label alignments and lookup routes."),
      CODE("df.index  # Read-only metadata")
    ],
      tr:"There are a few core pandas data structures. A Series is a 1D array-like sequence of data matched with a distinct axis label; if you don't give it a label it defaults to the numbers. A DataFrame is a multi-column, spreadsheet-like 2D structure — an ordered collection of labeled columns and values. And Index objects are immutable sequences that carry the metadata about the index labels. With a Series I can give names to each element and reference it by name instead of position, which lets me join two series on their index names without knowing where each element sits."},
    {n:3,title:"Manipulating the pandas Series",blocks:[
      P("Unified Value-Label Mapping",true),
      B("Explicit Indexing: Map indexes explicitly (e.g. string labels) to decouple values from integers.",0,null,false),
      B("Vectorized Filters: Perform boolean logical mask checks without mutating target indexes.",0,null,false),
      CODE("# Series selection & filtering\ns = pd.Series([4, 7, -5, 3], index=['d', 'b', 'a', 'c'])\ns['b']   # Label-based lookup -> 7\ns[s > 0] # Vectorized boolean mask selection")
    ],
      tr:"To manipulate a Series I can index it explicitly: pd.Series([4,7,-5,3]) with names D, B, A, C — then s['b'] gives me 7 because I named it, so I don't need the index position. People say dictionaries can do this, and they can, but a dictionary is a 2D key-value structure stored all over the place; a Series is stored in one continuous memory block, so it's very efficient. There's a little extra metadata, but that little extra space makes up for it by being fast. I can also do boolean things: s[s > 0] prints true/true/false/true — pandas automatically iterates through the vector instead of me looping through each element."},
    {n:4,title:"DataFrame Anatomy & Selection",blocks:[
      P("Construction Options",true),
      P("Generate DataFrames using nested dict-of-dicts structures, lists of dicts, or multidimensional NumPy array blocks."),
      CODE("# Creating from nested dictionaries\npop = {'Nevada': {2001: 2.4, 2002: 2.9},\n       'Ohio': {2000: 1.5, 2001: 1.7}}\ndf = pd.DataFrame(pop)"),
      P("loc and iloc Selection",true),
      P("Avoid ambiguous indexing conflicts by relying on explicit extraction handlers: label-based loc vs integer-based iloc."),
      CODE("# Explicit selection handlers\ndf.loc[2001, ['Ohio', 'Nevada']]\ndf.iloc[0:2, [0, 1]]")
    ],
      tr:"There are a few ways to construct DataFrames. The easiest is to make a Python dictionary and push it into a DataFrame, which becomes a 2D array; you can also build from nested dict-of-dicts or NumPy arrays. Once it's a DataFrame we can do a lot automatically — re-index it, drop elements, explicitly select rows and columns, reset the index. To select without ambiguity we use explicit handlers: label-based loc versus integer-based iloc."},
    {n:5,title:"Reindexing & Dropping Axis Entries",blocks:[
      TBL(["Core Method","Standard Command Syntax","Functional Execution & Alignment Behavior"],[["Reindexing","obj.reindex(new_labels)","Alters an axis index, introducing NaNs or interpolated values for new index tags."],["Dropping Entries","frame.drop(labels, axis=1)","Discards elements or columns from a target dimension and returns a new object."],["Subset Indexing","frame.loc[rows, cols]","Selects explicit row/column combinations using label lists."],["Reset Index","frame.reset_index()","Resets the index to standard integers and inserts the old index as a column."]])
    ],
      tr:"DataFrames are really efficient compared to Python dictionaries and there's a lot we can do to them. We can reindex — add new labels or tags. We can drop a label or drop elements from a frame. We can explicitly select rows and columns. And we can reset the index, which turns the index back into standard integers and inserts the old index as a column."},
    {n:6,title:"Filtering & Indexing Nuances",blocks:[
      P("Boolean Masks",true),
      P("Evaluate conditional flags to dynamically retrieve array subsets matching specified logical structures."),
      CODE("df[df['pop'] > 2.0]"),
      P("Inclusive Slicing",true),
      P("Slicing with labels differs from standard Python lists because the end boundary element is fully included."),
      CODE("obj['a':'c']  # Includes 'c'"),
      P("Index Safety",true),
      P("Enforce strict API parsing with loc/iloc to prevent runtime type index mismatches on integer-based axis datasets."),
      CODE("s.iloc[1]  # Safe position-based")
    ],
      tr:"We can do some filtering too — a Boolean match, just like before, evaluating conditional flags to do subset matching. We can do slicing that now includes the labels, not just numbers — and note that label slicing includes the end boundary, unlike a normal Python list. And we can enforce strict API parsing with loc and iloc to prevent runtime index mismatches on integer-based data."},
    {n:7,title:"Arithmetic & Automatic Data Alignment",blocks:[
      P("Index Union Alignment",true),
      P("When computing math on objects with differing indexes, pandas constructs a unified union index under the hood, generating NaNs on mismatch."),
      CODE("# Alignment yields NaNs on mismatch\ndf1 + df2"),
      P("Fill Value Solutions",true),
      P("Avoid cascading null values using direct arithmetic functions rather than raw operator symbols, specifying fallback default values."),
      CODE("# Add with fill values\ndf1.add(df2, fill_value=0)")
    ],
      tr:"We can do algorithmic stuff with DataFrames. We can add two DataFrames together and it will union them and do the mathematics for us. When the indexes differ, pandas builds a unified union index under the hood and yields NaNs where they don't match. To avoid those cascading nulls we use the direct arithmetic functions, like df1.add(df2, fill_value=0), rather than the raw plus operator."},
    {n:8,title:"Function Application & Sorting",blocks:[
      TBL(["Operation Category","Standard Method Name","Operational Impact & Purpose"],[["Row/Col Mapping","frame.apply(func, axis=0)","Applies an arbitrary functional transformation across whole rows or columns."],["Element-wise Math","frame.applymap(format_func)","Applies a python scalar function element-by-element across the DataFrame grid."],["Lexicographical Sort","frame.sort_index(ascending=True)","Sorts indices lexicographically on rows or columns along the target axis."],["Data Value Sort","frame.sort_values(by='column')","Orders the DataFrame row entries using the elements of selected columns."]])
    ],
      tr:"We can apply arbitrary functions and map them to rows and columns, and we can sort — sort values, sort columns, sort indices. A lot is built in. This becomes important on your project: you may want to apply a function to a whole column to look for outliers or to normalize the values, or join two data sets by mapping columns with the same names together even when they aren't in the same order."},
    {n:9,title:"Descriptive Math Performance Comparison",blocks:[
      DG("pandas-perf"),
      P("Computing metrics (such as sums, means, and standard deviations) across millions of elements is significantly faster with pandas' vectorized calculations."),
      CODE("# Standard deviation along column axes\ndf.std(axis='columns')\n# Average skipping missing indicators\ndf.mean(axis=0, skipna=True)")
    ],
      tr:"Let's talk about how much faster this is. If we use pure Python list math for things like standard deviation and mean, it can be roughly a 60-times factor slower than doing it in pandas. Pandas is all about performance, just like NumPy was — we can do these things in Python, but Python wasn't set up for them, and these libraries make it better for us."},
    {n:10,title:"Descriptive Stats & Summaries",blocks:[
      B("Exclude NaNs — reduction methods skip missing indicators by default.",0,null,false),
      B("Reductions: compute sum or mean across axes, generating Series summaries.",0,null,false),
      CODE("df.sum(axis=1)"),
      B("Describe — quick per-column summary statistics.",0,null,false),
      B("Correlation: evaluate relationship structures using corr and cov methods.",0,null,false),
      CODE("df.corr()")
    ],
      tr:"That is the end of chapter five. There's a lot more pandas can do — reductions and summaries across axes, describe, correlation and covariance — and we'll use pandas more and more through the semester. The best way to learn a lot of this is to play with it yourself; the book has a bunch of examples on its GitHub. Next we'll move on to chapter six, where we talk about how you actually get the data into pandas."}
  ],
  topics:[
    {name:"Why pandas & Core Structures",slides:[1,2]},
    {name:"Series & DataFrame Selection",slides:[3,4,5,6]},
    {name:"Alignment, Functions & Sorting",slides:[7,8]},
    {name:"Descriptive Stats & Performance",slides:[9,10]}
  ]
}

{
  id:"d7",
  title:"Data Loading & Storage",
  subtitle:"Python for Data Analysis · Chapter 6 — parsers, chunking, binary formats & databases (Wes McKinney, 3rd ed.)",
  week:"w4",
  slides:[
    {n:1,title:"Parsing Engines: C vs. Python",blocks:[
      DG("io-formats"),
      P("Highly Optimized C Engine",true),
      P("By default, pandas uses a highly optimized parsing engine written in C to read structural flat text streams. This maintains rapid computation speeds without runtime interpreter blocks."),
      CODE("# Optimized high-speed default load\ndf = pd.read_csv('data.csv', engine='c')"),
      P("Feature-Rich Python Engine",true),
      P("An alternate Python-based parsing engine acts as a fallback. This supports complex features like multi-character regex delimiters, but operates at a slower execution pace."),
      CODE("# Fallback engine for complex parsing\ndf = pd.read_csv('complex.csv', sep=r'\\s+', engine='python')")
    ],
      tr:"Now that we can manipulate data with pandas and NumPy, we need to get the data into our application — and these files can be large and may not all fit in memory. There's a C way and a Python way. By default pandas uses a highly optimized engine written in C, which keeps computation fast without runtime interpreter problems, but it has fewer features. The alternate Python-based engine is slower but has more features, like multi-character regex delimiters and more control over how you break things down."},
    {n:2,title:"Standard Flat-File Parsers",blocks:[
      P("Comma Separated Values",true),
      P("Load comma-delimited data via read_csv(), mapping header structures automatically."),
      CODE("pd.read_csv('file.csv')"),
      P("Tab-Delimited Streams",true),
      P("Load custom tab-separated tables by passing explicit parameter flags dynamically."),
      CODE("pd.read_table('f.txt', sep='\\t')"),
      P("Fixed-Width Tables",true),
      P("Process files where columns are arranged by static character widths using fixed-width parsers."),
      CODE("pd.read_fwf('legacy.dat')")
    ],
      tr:"There are standard flat-file parsers. If we just want a comma-separated file we read a CSV directly. We can read a tab-delimited table from a text file by saying it's separated by tabs. And we can do fixed-width tables — files arranged by static character widths rather than tabs or commas. We can even use a regular expression as the separator, so we're not limited to CSV. Handling all these different ways is the power of pandas — it does the work for us."},
    {n:3,title:"Handling Massive Datasets via Chunks",blocks:[
      P("Memory-Safe Out-Of-Core Ingestion",true),
      P("Loading exceptionally large files into memory at once is a common failure point. Work around memory limits using pandas' streaming mechanisms."),
      B("Initial Audits: Restrict load scopes using nrows.",0,null,false),
      B("TextParser Chunks: Retrieve iterative generators via chunksize.",0,null,false),
      CODE("# Stream file rows in 10,000 blocks\nchunks = pd.read_csv('large.csv', chunksize=10000)\nfor chunk in chunks:\n    process(chunk)")
    ],
      tr:"How do we handle massive data sets — files with millions or hundreds of millions of entries that we don't want to read into memory all at once? We read them in groups, or chunks. Instead of reading the whole CSV into one giant structure, we set chunksize and loop: for chunk in chunks, grab a chunk, process it, then loop back and grab the next. Otherwise we'd run out of memory or start swapping to the hard drive, which is slow. So we retrieve it in chunks and process it in chunks."},
    {n:4,title:"Configuration Parameters Toolset",blocks:[
      TBL(["Parsing Argument","API Parameter Flag","Execution Code Pattern","Underlying Operational Mechanism"],[["Explicit Indexing","index_col","pd.read_csv('f.csv', index_col='id')","Specifies a column to use as the row index labels."],["Ignore Metadata","skiprows","pd.read_csv('f.csv', skiprows=[0, 10])","Skips specified rows (e.g. metadata or comments) on load."],["Custom Null Keys","na_values","pd.read_csv('f.csv', na_values=['NULL'])","Maps specific strings to standard NaN missing indicators."],["DataType Alignment","converters","pd.read_csv('f.csv', converters={'col': int})","Applies dict functions column-wise to clean values on read."]])
    ],
      tr:"There's a lot of configuration you can do as you read the data, so you don't have to read it and then process it — you can do both at once. You can pick which column is the index with index_col. You can skip rows you know are header or metadata rows with skiprows. You can map specific strings to nulls with na_values. And you can convert a column while reading it — converters — so it comes in as an integer instead of a string."},
    {n:5,title:"Writing DataFrames to Flat Files",blocks:[
      P("Flexible Output Formats",true),
      P("Data can be written back to custom text formats using to_csv(), specifying custom delimiters and missing value strings."),
      CODE("# Enforce custom delimiters & null strings\ndf.to_csv('out.csv', sep='|', na_rep='NULL')"),
      P("Header & Index Cleanup",true),
      P("Ensure outputs are clean of redundant sequential index rows or headers to prevent structural errors during down-pipeline processing."),
      CODE("# Drop index columns from text output files\ndf.to_csv('clean.csv', index=False, header=False)")
    ],
      tr:"There are also ways of writing DataFrames back out as flat files. We can take a DataFrame and write it out as a CSV, defining our separators and our null values. We can turn headers and index columns on or off as we write. There's a lot pandas will do for you when manipulating data files."},
    {n:6,title:"Semi-Structured & Web Data",blocks:[
      P("JSON Formatting",true),
      P("Store arrays or parse complex key-value nested trees natively inside DataFrame structures."),
      CODE("df = pd.read_json('data.json')"),
      P("Web Scraping Tables",true),
      P("Scrape tabular tags inside complex HTML web page scripts automatically with built-in parsers."),
      CODE("dfs = pd.read_html('http://url.com')"),
      P("Excel Spreadsheets",true),
      P("Extract sheets directly using the Excel workbook API, wrapping third-party reader engines."),
      CODE("df = pd.read_excel('x.xlsx', sheet_name='S1')")
    ],
      tr:"Pandas can read a lot more than CSVs. We can read JSON files directly — you don't have to convert JSON to CSV first. We can read an HTML page straight from the web and pull its tables into a DataFrame. And we can read Excel files. So you can get JSON, CSV, Excel and HTML, convert them all to DataFrames, and once they're in a common format you can start manipulating them together."},
    {n:7,title:"High-Performance Binary Formats",blocks:[
      TBL(["Binary Serialization Format","Standard Python API","Core Memory & Storage Characteristics"],[["Apache Parquet","pd.read_parquet()","Column-oriented format with dense compression; highly efficient for analytical queries."],["HDF5 Systems","pd.read_hdf()","Excellent for scientific computations, managing massive, nested multi-gigabyte structures."],["Feather Format","pd.read_feather()","Lightweight, fast disk representation mapped closely to physical Arrow memory layouts."],["Python Pickle","pd.read_pickle()","Quick Python object serialization; not recommended for long-term storage across versions."]])
    ],
      tr:"We can also use high-performance binary formats. If we're doing high-performance analytic queries we can read the data as binary and let it stay binary. We can condense it and choose the data structure — whether we want it small, or large but fast. Depending on what we want to do with the data is how we read it in."},
    {n:8,title:"Interacting with Databases",blocks:[
      P("Relational Database SQL Queries",true),
      P("Pandas can load data directly from relational tables. Query rows safely using SQLAlchemy wrappers, bypassing messy manual cursor loops."),
      CODE("# Query SQL rows straight to DataFrame\nimport sqlalchemy as sqla\ndb = sqla.create_engine('sqlite:///my.db')\ndf = pd.read_sql('SELECT * FROM users', db)")
    ],
      tr:"We can also have pandas interact with relational databases. We bring in SQLAlchemy, create a database engine, read SQL, and convert that result straight into a DataFrame. So now we can get data from files, from the internet, from JSON, and from databases — and pandas is smart enough to read whatever structure comes back from SQL and build the proper DataFrame, which we then access by column names rather than positions."},
    {n:9,title:"File Format Parsing Performance",blocks:[
      DG("file-perf"),
      N("Converting standard flat files to Parquet optimizes file sizes and read times for analytical pipelines."),
      CODE("# Optimized high-speed caching routine\ndf.to_parquet('cache.parquet')\ndf = pd.read_parquet('cache.parquet')")
    ],
      tr:"There are huge speed differences depending on what you use. Reading a file with the native Python CSV reader could take about a second and a half; HDF5 could do it in under half a second; and Apache Parquet in much less time. But remember, the faster you go, the fewer features you get — some of these are tailored to very specific things, so you have to look at what analytics you want to do before choosing a reader."},
    {n:10,title:"Standard ETL File Pipeline",blocks:[
      B("Extract — read from CSV, JSON, HTML, Excel, databases, or binary stores into a DataFrame.",0,null,false),
      B("Type Align: enforce strict data type safety rules on load across mixed columns.",0,null,false),
      CODE("converters={'id': int}"),
      B("Fast Cache — persist to a high-performance binary format (e.g. Parquet) for repeat reads.",0,null,false),
      B("Load Target: load clean records into centralized analytical relational databases.",0,null,false),
      CODE("df.to_sql('users', db)")
    ],
      tr:"That's the end of chapter six. There's a lot to pandas and a lot to reading in files. My suggestion is to go try the examples on the book's repository and play around — the best learning tool is to try and fail until you get what you want. Next we're going to progress to chapter seven, where we focus on deep data cleaning, outlier filtering, and vector string parsing."}
  ],
  topics:[
    {name:"Parsing Engines & Flat Files",slides:[1,2,3,4]},
    {name:"Writing & Semi-Structured I/O",slides:[5,6]},
    {name:"Binary Formats & Databases",slides:[7,8]},
    {name:"Performance & ETL Pipeline",slides:[9,10]}
  ]
}

{
  id:"d8",
  title:"Data Preparation: Integration & Cleaning",
  subtitle:"Cap 3 — combining sources, finding redundant/duplicate attributes, and cleaning dirty data (lecture stops before normalization)",
  week:"w4",
  slides:[
    {n:1,title:"Overview",blocks:[
      DG("data-prep-flow"),
      B("Data gathered in data sets can present multiple forms and come from many different sources.",0,null,false),
      B("Different attribute names or table schemes will produce uneven examples",1,null,false),
      B("Attribute values may represent the same concept but with different names creating inconsistencies",1,null,false)
    ],
      tr:"Today we begin data preparation. Machine-learning algorithms get most of the attention, but experienced practitioners know data preparation often consumes the largest portion of a project's time — it's that 80% cleaning, 20% analysis. The objective is to improve the quality, consistency and usability of the data before mining it. Real-world data rarely comes from a single clean source: different systems use different attribute names, structures and coding conventions, so the same real-world concept can be represented differently — a 'software engineer level 2' at one company may be a 'junior engineer' at another."},
    {n:2,title:"Overview",blocks:[
      B("Integrating data from different databases is usually called data integration.",0,null,false),
      B("It will produce an uniform data set",0,null,false),
      B("Data integration it is not the final step.",0,null,false),
      B("Errors like missing values or uncontrolled noise may be still present.",1,null,false)
    ],
      tr:"Combining information from multiple sources is called data integration; the objective is a unified data set with a consistent structure. But integration alone doesn't solve every data-quality problem — even after combining successfully, issues like missing values, noise, outliers and inconsistencies may still exist. So integration is not the final step; it's typically followed by additional preparation."},
    {n:3,title:"Overview",blocks:[
      B("Data integration is usually followed by a data cleaning step.",0,null,false),
      B("Even a consistent and (almost) error-free data set may not be adequate for a particular DM algorithm",0,null,false),
      B("Data normalizations and data transformations may enable or improve the application of DM algorithms to a data set",1,null,false),
      B("Dealing with large data sets is usually tackled by using data reduction techniques",1,null,false)
    ],
      tr:"After integration, the next major step is usually data cleaning — even a consistent data set may not suit a particular data-mining algorithm. Further preprocessing can include cleaning errors, normalizing values, transforming values and reducing data volume. We'll cover normalization, transformation and reduction in later lectures; today we focus on integration and cleaning."},
    {n:4,title:"Data Integration",blocks:[
      B("Goal: collect a single data set with information coming from varied and different sources",0,null,false),
      B("A data map is used to establish how each instance is arranged in a common structure",0,null,false),
      B("Data from relational databases is flattened: gathered together into one single record",0,null,false)
    ],
      tr:"Data integration is the step of putting multiple data sets together — the goal is to collect information from many sources into a single coherent data set. A data map is often created to define how variables from different systems correspond, so a row in one data set maps to a row in another. When data comes from relational databases, records from multiple tables are flattened — merged into one single record. This can create duplicates, but since we're only analyzing (not updating) the data, we don't worry about update or deletion anomalies, so we can un-normalize it."},
    {n:5,title:"Data Integration — Finding Redundant Attributes",blocks:[
      B("An attribute is redundant when it can be derived from another attribute or set of them",0,null,false),
      B("Redundancy is a problem that should be avoided",0,null,false),
      B("It increments the data size, so modeling time for DM algorithms increases",1,null,false),
      B("It also may induce overfitting",1,null,false),
      B("Redundancies in attributes can be detected using correlation analysis",0,null,false)
    ],
      tr:"A redundant attribute is one whose information can already be obtained from another — if position 101 maps to 'software engineer', I probably don't need the title column; if annual and monthly salary are both present, one can be computed from the other. Removing redundant attributes decreases storage and computational cost and can also reduce overfitting, making analysis faster. We detect redundancy using correlation analysis."},
    {n:6,title:"Data Integration — Finding Redundant Attributes",blocks:[
      B("χ² Correlation Test quantifies the correlation among two nominal attributes contain c and r different values each:",0,null,false),
      B("where oij is the frequency of (Ai,Bj) and:",0,null,false),
      IMG("Formula: the χ² statistic (oij is the observed frequency of the category pair (Ai, Bj))")
    ],
      tr:"For two nominal attributes we use the chi-square correlation test, which measures the degree of association between two categorical variables. A strong association suggests one attribute overlaps significantly with the other — the stronger the relationship, the more carefully we should evaluate whether both attributes need to stay in the data set. If they're directly correlated, we can drop one."},
    {n:7,title:"Data Integration — Finding Redundant Attributes",blocks:[
      B("χ² works fine for nominal attributes, but for numerical attributes Pearson's product moment coefficient is widely used",0,null,false),
      B("where m is the number of instances, and A̅, B̅ are the mean values of attributes A and B.",0,null,false),
      B("Values of r close to +1 or -1 may indicate a high correlation among A and B.",0,null,false),
      IMG("Formula: Pearson's product-moment correlation coefficient r (m instances; means A̅, B̅)")
    ],
      tr:"For numerical variables, Pearson's product-moment correlation coefficient is one of the most common measures of redundancy. Its values range from -1 to +1: close to +1 is a strong positive relationship, close to -1 a strong negative relationship, and near 0 little or no linear relationship. Strong correlations — high positive or high negative — indicate an opportunity to eliminate a redundant variable; a value near 0 means low correlation, so we'd keep it."},
    {n:8,title:"Data Integration — Finding Redundant Attributes",blocks:[
      B("Similarly to correlation, covariance is an useful and widely used measure in statistics in order to check how much two variables change together",0,null,false),
      B("The relation among covariance and correlation is given by:",0,null,false),
      B("If two variables are independent, the covariance will be 0.",0,null,false),
      IMG("Formula: the relationship between covariance and correlation")
    ],
      tr:"Covariance is another way to measure how two numerical variables vary together. When variables tend to increase or decrease together the covariance is positive; when one increases while the other decreases it's negative; and if the variables are independent the covariance tends toward 0. So the higher the positive covariance or the lower the negative covariance, the more likely the two are associated — and candidates for removing one."},
    {n:9,title:"Data Integration — Detecting Tuple Duplication and Inconsistency",blocks:[
      B("Having duplicate tuples can be a source of inconsistency",0,null,false),
      B("Sometimes the duplicity is subtle",0,null,false),
      B("If the information comes from different systems of measurement, some instances could be actually the same, but not identified like that",1,null,false),
      B("Values can be represented using the metric system and the imperial system in different sources",1,null,false)
    ],
      tr:"Another challenge during integration is identifying duplicate records. Two records may represent the same entity while appearing different because of inconsistent formats — one system stores distance in kilometers while another stores it in miles. Without standardizing these, duplicate records stay in the set and muddy the water, so we want to normalize that data."},
    {n:10,title:"Data Integration — Detecting Tuple Duplication and Inconsistency",blocks:[
      B("Analyzing the similarity between nominal attributes is not trivial",0,null,false),
      B("Several character-based distance measures for nominal values can be found in the literature:",0,null,false),
      B("The edit distance",1,null,false),
      B("The affine gap distance",1,null,false),
      B("Jaro algorithm",1,null,false),
      B("q-grams",1,null,false),
      B("WHIRL distance",1,null,false),
      B("Metaphone",1,null,false),
      B("ONCA",1,null,false)
    ],
      tr:"Detecting duplicates among text values is harder than among numbers. Numbers often look for exact matches, but text can differ — someone wrote 'lower' where another wrote 'minimum', or 'NY' versus 'ny'. Researchers have developed several character-based distance measures for nominal (non-numeric) values: the edit distance, the affine gap distance, the Jaro algorithm, q-grams, WHIRL distance, metaphone and ONCA. These evaluate how similar two strings are rather than just checking for exact equality."},
    {n:11,title:"Data Integration — Detecting Tuple Duplication and Inconsistency",blocks:[
      B("Trying to detect similarities in numeric data is harder",0,null,false),
      B("Some authors encode the numbers as strings or use range comparisons — naïve approaches",0,null,false),
      B("Using the distribution of the data or adapting WHIRL cosine similarity metric are better",0,null,false),
      B("Many authors rely on detecting discrepancies in the data cleaning step",0,null,false)
    ],
      tr:"Numeric duplicates can also be difficult to detect. Simple approaches compare values directly or convert numbers to strings; more sophisticated ones examine the distribution or adapt similarity measures originally designed for text. In many cases numeric inconsistencies are ultimately addressed during the data-cleaning step — 100 isn't exactly 101, but they're close, and miles versus kilometers can hide a match."},
    {n:12,title:"Data Integration — Detecting Tuple Duplication and Inconsistency",blocks:[
      B("We have introduced measures to detect duplicity in each attribute",0,null,false),
      B("We can determine whether a couple of instances are duplicated or not using the metrics in several approaches:",0,null,false),
      B("Probabilistic approaches, as the Fellegi-Sunter model",1,null,false),
      B("Supervised (and semisupervised) approaches",1,null,false),
      B("Distance-based techniques",1,null,false),
      B("Clustering algorithms (for unsupervised data)",1,null,false)
    ],
      tr:"Once we have measures for each attribute, we can decide whether two instances are duplicates using several approaches — and we don't use just one; we combine many, because with data cleaning it's never one-and-done. The approaches include probabilistic methods like the Fellegi-Sunter model, supervised and semi-supervised approaches, distance-based techniques, and clustering algorithms for unsupervised data — clustering similar values together to flag likely duplicates."},
    {n:13,title:"Data Cleaning",blocks:[
      B("Integrating the data in a data set does not mean that the data is free from errors",0,null,false),
      B("Broadly, dirty data include missing data, wrong data and non-standard representation of the same data",0,null,false),
      B("If a high proportion of the data is dirty, applying a DM process will surely result in a unreliable model",0,null,false)
    ],
      tr:"Once we've integrated the data and removed some duplicates, we still need to clean it — successfully integrating data does not guarantee quality data. Dirty data broadly includes missing data, wrong data, and non-standard representations of the same data — for example US month-day-year versus international day-month-year dates, where the same value looks completely different. If a high proportion of the data is dirty, the result will be an unreliable model."},
    {n:14,title:"Data Cleaning",blocks:[
      B("The sources of dirty data include",0,null,false),
      B("data entry errors,",1,null,false),
      B("data update errors,",1,null,false),
      B("data transmission errors and even bugs in the data processing system.",1,null,false),
      B("Dirty data usually is presented in two forms: missing data (MVs) and wrong (noisy) data.",0,null,false)
    ],
      tr:"There are many sources of dirty data: data-entry errors, where someone typed a value in wrong; data-update errors, where someone updated the wrong record; data-transmission errors, where data got corrupted or truncated in transit; and even bugs in the data-processing software that mangle a correctly entered value. Dirty data usually shows up in two forms — missing values, or MVs, and wrong (noisy) data."},
    {n:15,title:"Data Cleaning",blocks:[
      B("The way of handling MVs and noisy data is quite different:",0,null,false),
      B("The instances containing MVs can be ignored, filled in manually or with a constant or filled in by using estimations over the data",1,null,false),
      B("For noise, basic statistical and descriptive techniques can be used to identify outliers, or filters can be applied to eliminate noisy instances",1,null,false)
    ],
      tr:"Handling missing values and noise is quite different. Instances with missing values can be ignored, filled in manually, filled with a constant such as the median or mode, or filled in by estimation using an algorithm. For noise, we use basic statistical and descriptive techniques to identify outliers, then decide whether to filter them out — but you don't always remove outliers, because in a fraud-detection system the outliers are exactly what you're looking for. Handling noise and missing values, and normalization and transformation, we'll cover in the coming weeks."}
  ],
  topics:[
    {name:"Overview of Data Preparation",slides:[1,2,3]},
    {name:"Integration & Redundant Attributes",slides:[4,5,6,7,8]},
    {name:"Detecting Duplicate Tuples",slides:[9,10,11,12]},
    {name:"Data Cleaning",slides:[13,14,15]}
  ]
}
