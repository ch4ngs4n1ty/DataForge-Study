 d8:[
  {id:"d8q1",slide:1,topic:"Overview",type:"tf",diff:1,q:"Data preparation typically consumes only a small fraction of a project's time compared with modeling.",a:false,ev:"It's usually the reverse — roughly 80% cleaning, 20% analysis."},
  {id:"d8q2",slide:2,topic:"Data integration",type:"mc",diff:1,q:"Combining information from multiple sources into a uniform data set is called…",opts:["data integration","data cleaning","normalization","data reduction"],a:0,ev:"Integrating data from different databases is called data integration; it produces a uniform data set."},
  {id:"d8q3",slide:2,topic:"Data integration",type:"tf",diff:1,q:"Data integration is the final step and guarantees error-free data.",a:false,ev:"Integration is not the final step; missing values and noise may still be present."},
  {id:"d8q4",slide:4,topic:"Data integration",type:"mc",diff:2,q:"When integrating relational data, records from multiple tables are usually…",opts:["flattened into one single record","kept fully normalized","deleted","encrypted"],a:0,ev:"Data from relational databases is flattened — gathered into one single record."},
  {id:"d8q5",slide:5,topic:"Redundant attributes",type:"mc",diff:1,q:"An attribute is redundant when…",opts:["it can be derived from another attribute","it has missing values","it is numeric","it is the index"],a:0,ev:"A redundant attribute can be derived from another attribute or set of them."},
  {id:"d8q6",slide:5,topic:"Redundant attributes",type:"tf",diff:2,q:"Redundant attributes can increase data size and may induce overfitting.",a:true,ev:"Redundancy increments data size and modeling time and may induce overfitting."},

  {id:"d8q8",slide:7,topic:"Correlation measures",type:"mc",diff:2,q:"For numerical attributes, which coefficient (ranging −1 to +1) measures redundancy?",opts:["Pearson's correlation coefficient","χ²","edit distance","the Jaro algorithm"],a:0,ev:"Pearson's product-moment coefficient is used for numerical attributes; values near ±1 indicate high correlation."},

  {id:"d8q11",slide:9,topic:"Duplicate tuples",type:"mc",diff:2,q:"Why can duplicate tuples be hard to spot?",opts:["different measurement systems (e.g. metric vs imperial)","identical formatting","exact numeric equality","they never occur"],a:0,ev:"Duplicity is subtle when sources use different measurement systems like metric vs imperial."},
  {id:"d8q12",slide:10,topic:"Duplicate tuples",type:"mc",diff:1,q:"Which is a character-based distance measure for nominal values?",opts:["the Jaro algorithm","Pearson's r","covariance","Levene's test"],a:0,ev:"Jaro is one of the character-based measures (with edit distance, affine gap, q-grams, WHIRL, metaphone, ONCA)."},
  {id:"d8q13",slide:12,topic:"Dedup approaches",type:"mc",diff:2,q:"Which is a strategy for deciding whether two instances are duplicates?",opts:["a probabilistic approach (Fellegi-Sunter)","a t-test","ANOVA","min-max scaling"],a:0,ev:"Approaches include probabilistic (Fellegi-Sunter), supervised, distance-based, and clustering methods."},
  {id:"d8q14",slide:13,topic:"Data cleaning",type:"mc",diff:1,q:"Dirty data broadly includes…",opts:["missing, wrong, and non-standard representations","only missing values","only outliers","only duplicates"],a:0,ev:"Dirty data broadly includes missing data, wrong data, and non-standard representations of the same data."},
  {id:"d8q15",slide:14,topic:"Data cleaning",type:"mc",diff:1,q:"What are the two forms dirty data usually takes?",opts:["missing values (MVs) and noisy data","integers and strings","rows and columns","nominal and numeric"],a:0,ev:"Dirty data usually presents as missing values (MVs) and wrong (noisy) data."},
  {id:"d8q16",slide:15,topic:"Handling dirty data",type:"mc",diff:2,q:"How are missing values (MVs) commonly handled?",opts:["ignore, fill manually/with a constant, or estimate","always delete the whole column","convert them to text","there is no way to handle them"],a:0,ev:"MVs can be ignored, filled in manually or with a constant, or filled by estimation."},
  {id:"d8q17",slide:15,topic:"Handling dirty data",type:"tf",diff:2,q:"You should always remove outliers during cleaning.",a:false,ev:"Not always — in fraud detection the outliers are exactly what you're looking for."}

  {id:"d9q1",slide:1,topic:"Matplotlib API",type:"mc",diff:1,q:"In matplotlib, individual subplots (Axes) are added inside a…",opts:["top-level Figure container","DataFrame","Series","GroupBy object"],a:0,ev:"All plots reside inside a top-level Figure container; Subplots (Axes) are added within it."},

 d10:[
  {id:"d10q1",slide:1,topic:"Split-apply-combine",type:"mc",diff:1,q:"The split-apply-combine framework does which sequence?",opts:["split into groups, apply a function, combine results","sort, filter, merge","read, clean, save","train, test, deploy"],a:0,ev:"Data is split into groups, a function is applied to each, and the results are combined into one output."},
  {id:"d10q2",slide:1,topic:"Split-apply-combine",type:"tf",diff:1,q:"When grouping a DataFrame, non-numeric columns are automatically excluded from statistical summaries.",a:true,ev:"Non-numeric columns are excluded from statistical summaries automatically."},
  {id:"d10q3",slide:2,topic:"Iterating",type:"mc",diff:2,q:"Iterating over a GroupBy object yields…",opts:["2-tuples of (group name, chunk of data)","a single DataFrame","only the group names","a list of columns"],a:0,ev:"The GroupBy object yields a sequence of 2-tuples: the group name and its chunk of data."},
  {id:"d10q4",slide:2,topic:"Selecting",type:"tf",diff:2,q:"Grouping first and then selecting a column is faster than selecting the column first and then grouping.",a:false,ev:"The version that gets the data first and then groups is the faster one."},
  {id:"d10q5",slide:3,topic:"Functions & levels",type:"mc",diff:2,q:"When you pass a function to groupby, the function is…",opts:["called once per index value, its return used as the group key","ignored","applied only to the first row","used to sort the data"],a:0,ev:"Any function passed to GroupBy is called once per index value, and the return values become group keys."},
  {id:"d10q6",slide:4,topic:"Optimized methods",type:"mc",diff:1,q:"Optimized built-in GroupBy methods (mean, sum, count) are fast because they…",opts:["bypass Python interpreter loops (run in compiled C)","use more memory","skip the data","require NumPy only"],a:0,ev:"They compute in compiled C and bypass Python interpreter loops."},
  {id:"d10q7",slide:5,topic:"Aggregation",type:"mc",diff:2,q:"To apply several aggregation functions to a grouped column, you…",opts:["pass a list of functions to agg()","call groupby twice","use plot()","set group_keys=False"],a:0,ev:"agg() accepts a list of functions (or string aliases) to apply multiple aggregations."},
  {id:"d10q8",slide:6,topic:"transform",type:"mc",diff:2,q:"groupby(...).transform(func) returns an object that…",opts:["has the exact same shape as the parent group","is always a single number","drops the index","is sorted"],a:0,ev:"transform returns an object of the exact same shape as the parent group, ideal for broadcasting back."},
  {id:"d10q9",slide:7,topic:"apply",type:"mc",diff:2,q:"How do you stop pandas from adding the grouping keys to the result's index?",opts:["group_keys=False","axis=1","sort=False","as_index=None"],a:0,ev:"Passing group_keys=False prevents the hierarchical index behavior."},
  {id:"d10q10",slide:8,topic:"Quantiles",type:"mc",diff:2,q:"Which functions bucket continuous data before grouping?",opts:["pd.cut and pd.qcut","pd.merge and pd.concat","pd.read_csv","pd.pivot"],a:0,ev:"pd.cut and pd.qcut discretize continuous data into bins for group-level analysis."},
  {id:"d10q11",slide:9,topic:"Performance",type:"tf",diff:1,q:"pandas GroupBy is faster than pure Python loops because data sits in contiguous memory blocks.",a:true,ev:"pandas groupby is efficient because vectors and DataFrames are contiguous blocks in memory, not spread around."},
  {id:"d10q12",slide:6,topic:"transform",type:"mc",diff:2,q:"A common use of transform is to…",opts:["add a per-group metric (e.g. group mean) back to the parent DataFrame","delete groups","rename columns","read a file"],a:0,ev:"You can save the transformed per-group result (like a group mean) directly back into the parent DataFrame."}

 d11:[
  {id:"d11q1",slide:1,topic:"Normalization",type:"tf",diff:1,q:"Raw operational attributes are usually good enough for accurate predictive models with no changes.",a:false,ev:"Raw attributes are usually not good enough for accurate predictive models."},
  {id:"d11q2",slide:2,topic:"Normalization",type:"mc",diff:1,q:"New attributes engineered for modeling are usually called…",opts:["modeling or analytic variables","raw attributes","index labels","null values"],a:0,ev:"The new attributes are usually named modeling variables or analytic variables."},
  {id:"d11q3",slide:3,topic:"Normalization",type:"mc",diff:1,q:"Min-max normalization does what?",opts:["scales values into a chosen [min, max] range","gives mean 0 and std 1","divides by a power of ten","ranks the values"],a:0,ev:"Min-max scales all numerical values of an attribute into a specified range."},
  {id:"d11q4",slide:4,topic:"Normalization",type:"mc",diff:2,q:"Z-score normalization produces a distribution with…",opts:["mean 0 and standard deviation 1","values between 0 and 1","only positive values","integer ranks"],a:0,ev:"Z-score normalizes to a new distribution with mean 0 and standard deviation 1."},
  {id:"d11q5",slide:4,topic:"Normalization",type:"mc",diff:2,q:"When is z-score preferred over min-max?",opts:["when the min or max is unknown or the data is noisy","when data is already normal","when there are no numbers","never"],a:0,ev:"If minimum/maximum are unknown or the data is noisy, min-max is infeasible, so z-score is used."},
  {id:"d11q6",slide:6,topic:"Transformation",type:"mc",diff:1,q:"Data transformation is the process of…",opts:["creating new attributes via mathematical formulas","deleting rows","reading files","sorting columns"],a:0,ev:"Transformation creates new attributes, usually combining raw attributes with mathematical formulas."},
  {id:"d11q7",slide:8,topic:"Transformation",type:"mc",diff:2,q:"Quadratic transformations are used mainly to…",opts:["help make the data separable","normalize to [0,1]","remove duplicates","rank the values"],a:0,ev:"Quadratic transformations can help transform data to make it separable."},
  {id:"d11q8",slide:10,topic:"Polynomial",type:"mc",diff:3,q:"When no expert knowledge is available, a transformation f can be approximated by…",opts:["a polynomial via brute search, one degree at a time","deleting the attribute","a single linear scale","a chi-square test"],a:0,ev:"f can be approximated via a polynomial using a brute search, one degree at a time (Weierstrass)."},
  {id:"d11q9",slide:13,topic:"Rank",type:"mc",diff:2,q:"A rank transformation replaces each value with…",opts:["its rank (integers 1 to m)","its z-score","its logarithm","a binary flag"],a:0,ev:"The value is replaced with its rank, giving integers from 1 to m (m = number of instances)."},
  {id:"d11q10",slide:14,topic:"Rank",type:"tf",diff:2,q:"The rank-to-normal-score transformation can be applied separately to the training and test partitions.",a:false,ev:"This transformation cannot be applied separately to the training and test partitions."},
  {id:"d11q11",slide:15,topic:"Box-Cox",type:"mc",diff:2,q:"The Box-Cox transformation aims to make a continuous variable…",opts:["almost normally distributed","strictly between 0 and 1","nominal","integer-valued"],a:0,ev:"Box-Cox transforms a continuous variable into an almost normal distribution."},
  {id:"d11q12",slide:18,topic:"Box-Cox",type:"mc",diff:3,q:"How is the Box-Cox parameter λ chosen?",opts:["iteratively, testing values from −3.0 to 3.0","set to 1 always","from the mean","by a chi-square test"],a:0,ev:"λ is found iteratively, testing values from −3.0 to 3.0 until the result is closest to normal."},
  {id:"d11q13",slide:20,topic:"Histogram",type:"mc",diff:2,q:"To spread the right side of a histogram, you can apply…",opts:["the logarithm, y = log(x)","a power, y = x^g","a rank transform","min-max scaling"],a:0,ev:"Using the logarithm spreads the right side of the histogram; a power transform spreads the left side."},
  {id:"d11q14",slide:22,topic:"Nominal to binary",type:"mc",diff:2,q:"The 1-to-N (one-hot) transformation maps a nominal attribute to N binary attributes where…",opts:["only one is 1 and the rest are 0 per instance","all are 1","values are ranked","values are averaged"],a:0,ev:"Each nominal value becomes a binary attribute; per instance only one is 1 while the rest are 0."},
  {id:"d11q15",slide:23,topic:"Nominal to binary",type:"tf",diff:2,q:"One-hot encoding a nominal attribute with very large cardinality can create a very sparse data set.",a:true,ev:"Large cardinality generates many attributes, producing a very sparse data set with performance problems."},
  {id:"d11q16",slide:25,topic:"Data reduction",type:"mc",diff:2,q:"Which are attribute (dimensionality) reduction techniques?",opts:["Wavelet transforms and PCA","cut and qcut","read_csv and to_csv","mean and median"],a:0,ev:"Well-known attribute reduction techniques include Wavelet transforms and Principal Component Analysis (PCA)."},
  {id:"d11q17",slide:27,topic:"Data reduction",type:"mc",diff:2,q:"Binning/discretization reduces data by…",opts:["converting numerical attributes into nominal ones (lower cardinality)","deleting all rows","adding new columns","normalizing to [0,1]"],a:0,ev:"Binning/discretization converts numerical attributes into nominal ones, drastically reducing cardinality."}
 ]

 d12:[
  {id:"d12q1",slide:2,topic:"Introduction",type:"mc",diff:1,q:"A missing value (MV) is best described as…",opts:["a value for an attribute that was not introduced or was lost in recording","always an error in the model","a duplicate record","an outlier"],a:0,ev:"An MV is a value for an attribute that was not introduced or was lost in the recording process."},
  {id:"d12q2",slide:3,topic:"Introduction",type:"mc",diff:2,q:"Which is a problem commonly associated with missing values?",opts:["bias from differences between missing and complete data","faster computation","guaranteed higher accuracy","more records"],a:0,ev:"Problems include loss of efficiency, handling/analysis complications, and bias between missing and complete data."},
  {id:"d12q3",slide:4,topic:"Introduction",type:"mc",diff:2,q:"Which is NOT one of the three broad ways to treat MVs in data mining?",opts:["Encrypting the attributes","Discarding examples/attributes with MVs","Maximum likelihood procedures","Imputation using other attributes"],a:0,ev:"The three ways are discarding, maximum likelihood procedures, and imputation — not encryption."},
  {id:"d12q4",slide:4,topic:"Introduction",type:"tf",diff:2,q:"Imputation works partly because attributes are not independent from each other.",a:true,ev:"Imputation fills MVs with estimated values, exploiting that attributes are not independent from each other."},
  {id:"d12q5",slide:5,topic:"Mechanisms",type:"tf",diff:2,q:"The assumptions we make about the missingness mechanism can affect which treatment method is valid.",a:true,ev:"The assumptions about the missingness mechanism affect which treatment can be correctly applied, if any."},
  {id:"d12q6",slide:7,topic:"Mechanisms",type:"mc",diff:2,q:"In the probability framework, θ represents…",opts:["the parameters of the model that generate the data","the number of missing values","the observed values only","the imputed values"],a:0,ev:"Under the i.i.d. assumption, θ represents the model parameters that yield the data (f is the per-case function)."},
  {id:"d12q7",slide:9,topic:"Mechanisms",type:"mc",diff:2,q:"The data set is split as X = (Xobs, Xmis). What does the indicator matrix B record?",opts:["whether each value is present or absent","the mean of each column","the class labels","the covariance"],a:0,ev:"B is a 0/1 matrix of the same size as X recording whether each value is present or absent."},
  {id:"d12q8",slide:10,topic:"Mechanisms",type:"mc",diff:2,q:"Missing at Random (MAR) means the probability of missingness…",opts:["does not depend on Xmis (depends only on observed data)","depends on the missing value itself","is always zero","depends on nothing at all"],a:0,ev:"Under MAR the missingness distribution does not depend on Xmis — only on observed information."},
  {id:"d12q9",slide:11,topic:"Mechanisms",type:"mc",diff:2,q:"MCAR differs from MAR because MCAR missingness depends on…",opts:["neither the observed nor the unobserved data","only the observed data","only the missing values","the class label"],a:0,ev:"MCAR is a special case of MAR where missingness depends on neither the observed nor the unobserved data."},
  {id:"d12q10",slide:12,topic:"Mechanisms",type:"tf",diff:2,q:"MCAR is more restrictive than MAR.",a:true,ev:"MCAR is more restrictive; MAR only requires MVs to behave like a random sample within observed-data subclasses."},
  {id:"d12q11",slide:12,topic:"Mechanisms",type:"tf",diff:2,q:"Under MCAR, analyzing only the complete cases gives valid inferences (though with some loss of information).",a:true,ev:"Under MCAR, complete-case analysis gives valid inferences, with some loss of information/power."},
  {id:"d12q12",slide:13,topic:"Mechanisms",type:"mc",diff:3,q:"For NMAR data, the only way to get an unbiased estimate is to…",opts:["model the missingness itself","delete all missing rows","use the global mean","ignore the mechanism"],a:0,ev:"NMAR depends on the missing value itself; unbiased estimation requires explicitly modeling the missingness."},
  {id:"d12q13",slide:14,topic:"Simple",type:"tf",diff:1,q:"Simple approaches generally ignore the missingness mechanism and blindly perform the replacement.",a:true,ev:"Simple approaches usually do not take the missingness mechanism into account and blindly perform the operation."},
  {id:"d12q14",slide:16,topic:"Simple",type:"mc",diff:2,q:"Case deletion (ignore missing / IM) does what?",opts:["discards every instance with at least one missing value","replaces MVs with the mean","encodes MVs as a new value","models the missingness"],a:0,ev:"IM/case deletion discards every instance containing at least one MV; valid under MCAR but loses power."},
  {id:"d12q15",slide:17,topic:"Simple",type:"mc",diff:2,q:"A key drawback of mean/mode (MC) substitution when there are many MVs is that…",opts:["the covariance is severely altered","the data set shrinks","records are duplicated","it cannot handle numbers"],a:0,ev:"MC/CMC preserve size but severely alter covariance when the amount of MVs is considerable."},
  {id:"d12q16",slide:17,topic:"Simple",type:"mc",diff:2,q:"CMC differs from MC because CMC uses the mean/mode of…",opts:["only instances with the same class as the reference instance","the entire data set","a random subset","the missing values"],a:0,ev:"CMC (concept mean/most-common) uses the mean or mode of only the instances sharing the reference instance's class."},
  {id:"d12q17",slide:18,topic:"Max likelihood",type:"mc",diff:2,q:"Rubin et al. advised against case deletion mainly because it…",opts:["wastes information","is too slow","requires θ to be known","always biases toward zero"],a:0,ev:"Rubin and colleagues advised against case deletion because it wastes information."},
  {id:"d12q18",slide:19,topic:"Max likelihood",type:"tf",diff:2,q:"Maximum likelihood parameters can be estimated directly for simple one-dimensional cases like a coin toss or a 1-D Gaussian.",a:true,ev:"MLE works analytically for 1-D Bernoulli (coin toss) and 1-D Gaussian (finding μ and σ)."},
  {id:"d12q19",slide:20,topic:"Max likelihood",type:"mc",diff:3,q:"Why is direct likelihood maximization often infeasible for real data?",opts:["too many parameters (e.g. a mixture of 100 100-D Gaussians ≈ 10,000 parameters)","the data is always normal","there are never any MVs","θ is always known"],a:0,ev:"Complex distributions can have thousands of parameters (100 100-D Gaussians ≈ 10,000), so direct maximization is infeasible."},
  {id:"d12q20",slide:21,topic:"Max likelihood",type:"mc",diff:2,q:"Hidden variables are introduced in ML imputation to…",opts:["simplify the likelihood function and account for MVs","delete the missing rows","encode categories as numbers","remove outliers"],a:0,ev:"Hidden variables simplify the likelihood function and help account for the missing values."},
  {id:"d12q21",slide:23,topic:"Max likelihood",type:"mc",diff:2,q:"Which three methods are named for iterative ML-based imputation?",opts:["EM, Multiple Imputation, and Bayesian PCA","KNN, SVM, and k-means","MAR, MCAR, and NMAR","mean, median, and mode"],a:0,ev:"The three named methods are Expectation-Maximization (EM), Multiple Imputation (MI), and Bayesian PCA (BPCA)."}
 ]

  {h:"NumPy & pandas",s:[6],items:[
    {t:"**NumPy** — the ==ndarray== object; ==contiguous memory blocks== → ==10x to 100x faster== than pure Python loops",c:[6,"slide","Numerical Python (NumPy) provides the cornerstone vector computational structures. It features the powerful ndarray object. Operates on contiguous memory blocks to bypass standard interpreter checks, rendering calculations 10x to 100x faster than pure native Python loops."]},
    {t:"**pandas** — ==multi-dimensional DataFrame== and ==single-dimensional Series==; label alignment + missing values",c:[6,"slide","Introduces high-level structured data tools via the multi-dimensional DataFrame and single-dimensional Series objects. Blends raw NumPy array math with relational SQL operations and Excel capabilities, highlighting robust automatic label alignment and missing-value handling."]}
  ]},
  {h:"Interactive & visual tools",s:[7],items:[
    {t:"**IPython** — enhanced interactive env: ==tab-completion, history==, system shortcuts",c:[7,"slide","An enhanced interactive environment designed to accelerate debugging, exploration, and live execution. Features complete tab-completion, history, and system shortcuts."]},
    {t:"**Jupyter** — ==web-based document framework== over ==language-agnostic kernels==",c:[7,"slide","A web-based document framework executing over language-agnostic kernels, merging Markdown documentation, active code blocks, and visual plots seamlessly."]},
    {t:"**matplotlib** — standard backend for ==2D data plots==",c:[7,"slide","The standard visual backend for publishing quality 2D data plots. Integrates cleanly with pandas and NumPy structures as a reliable default tool."]}
  ]},
  {h:"Modeling stack",s:[8],items:[
    {t:"**SciPy** — ==integration, optimization, signal processing, matrix algebra==",c:[8,"slide","A core mathematical toolbox providing advanced routines for scientific integration, multi-variate optimization, signal processing, and matrix algebra operations."]},
    {t:"**scikit-learn** — ==classification, clustering, dimensionality reduction==, model testing",c:[8,"slide","The premier general-purpose machine learning toolkit. Contains integrated routines for classification, clustering, dimensionality reduction, and model testing."]},
    {t:"**statsmodels** — ==frequentist== evaluations, econometric models, ==ANOVA==",c:[8,"slide","A highly focused statistical inference library providing frequentist evaluations, econometric analysis models, and rigorous ANOVA metrics."]}
  ]},
  {h:"Setup & imports",s:[9,10],items:[
    {t:"**Env** — ==conda create -n pydata-book python=3.10== (Miniconda + conda-forge)",c:[9,"slide","Build an isolated environment with: conda create -n pydata-book python=3.10."]},
    {t:"**Aliases** — ==np== numpy · ==pd== pandas · ==plt== matplotlib.pyplot · ==sns== seaborn",c:[10,"slide","import numpy as np; import pandas as pd; import matplotlib.pyplot as plt; import seaborn as sns."]}
  ]}

 d2:[
  {h:"DM & KDD",s:[4,5],items:[
    {t:"**Data Mining (DM)** — ==solving problems by analyzing data present in real databases==",c:[4,"slide","Data Mining (DM) is about solving problems by analyzing data present in real databases."]},
    {t:"**KDD** — ==identifying valid, novel, potentially useful, and ultimately understandable patterns in data==",c:[5,"slide","KDD definition: “the nontrivial process of identifying valid, novel, potentially useful, and ultimately understandable patterns in data”"]},
    {t:"**Stages** — Problem Specification · Problem Understanding · ==Data Preprocessing== · ==Data Mining== · Evaluation · Results Exploitation",c:[5,"slide","Stages: Problem Specification. Problem Understanding. Data Preprocessing. Data Mining. Evaluation. Results Exploitation."]}
  ]},
  {h:"Statistical methods",s:[9,10,11,12,13],items:[
    {t:"**Regression** — estimation; ==Linear, quadratic and logistic== are the most well known",c:[9,"slide","Regression Models: They are used in estimation tasks. Linear, quadratic and logistic regression are the most well known."]},
    {t:"**ANNs** — ==MLP, RBFNs, LVQ==; ==robust to outliers and noise==; require numeric",c:[10,"slide","Artificial Neural Networks (ANNs): Multi-layer perceptron (MLP), Radial Basis Function Networks (RBFNs) and Learning Vector Quantization (LVQ) are the most well known. They require numeric attributes. They are robust to outliers and noise."]},
    {t:"**Bayesian** — ==Naïve Bayes==; require nominal; ==cannot deal with missing values==",c:[11,"slide","Bayesian Learning: It uses the probability theory as a framework for making rational decisions under uncertainty. Naïve Bayes is the most well known technique. They require nominal attributes and cannot deal with missing values."]},
    {t:"**Instance-based** — examples ==stored verbatim==, ==distance function==; ==KNN==",c:[12,"slide","The examples are stored verbatim, and a distance function is used to determine which members of the database are closest to a new example. The K-Nearest Neighbor (KNN) is the most representative method."]},
    {t:"**SVMs** — learning theory; ==perform very well when data is linearly separable==",c:[13,"slide","They are machine learning algorithms based on learning theory and similar to ANNs in the sense that they are used for estimation and perform very well when data is linearly separable."]}
  ]},
  {h:"Symbolic methods",s:[14,15],items:[
    {t:"**Rule Learning** — ==AQ, CN2, RIPPER, PART and FURIA==",c:[14,"slide","Rule Learning: AQ, CN2, RIPPER, PART and FURIA are good examples of this family."]},
    {t:"**Decision Trees** — ==divide and conquer==; ==CART, C4.5 and PUBLIC==",c:[15,"slide","Decision Trees: They construct predictive models formed by iterations of a divide and conquer scheme of hierarchical decisions. CART, C4.5 and PUBLIC are good examples of this family."]}
  ]},
  {h:"Descriptive tasks",s:[16,17],items:[
    {t:"**Clustering** — ==natural groups or clusters==; ==k-Means, COBWEB and Self Organizing Maps==",c:[16,"slide","Clustering: the examples must be divided into natural groups or clusters. Well known examples of clustering algorithms are k-Means, COBWEB and Self Organizing Maps."]},
    {t:"**Association Rules** — ==Apriori== is the most emblematic technique",c:[17,"slide","Association Rules: Set of techniques that aim to find association relationships in the data. The Apriori technique is the most emblematic technique to address this problem."]}
  ]},
  {h:"Supervised learning",s:[19,20],items:[
    {t:"**Supervised = prediction** — relationships between ==input attributes and a target attribute==",c:[19,"slide","Prediction methods are commonly referred to as supervised learning. Supervised methods are thought to attempt the discovery of the relationships between input attributes and a target attribute."]},
    {t:"**Classification** — target domain ==finite and categorical==",c:[20,"slide","Classification: The domain of the target attribute is finite and categorical. A classifier must assign a class to a unseen example."]},
    {t:"**Regression** — target ==formed by infinite values==; **Time Series** — ==making predictions in time==",c:[20,"slide","Regression: The target attribute is formed by infinite values. Time Series Analysis: Making predictions in time."]}
  ]},
  {h:"Unsupervised learning",s:[22,23],items:[
    {t:"**Unsupervised** — ==no supervisor and only input data==",c:[22,"slide","There is no supervisor and only input data is available."]},
    {t:"Aim — find ==regularities, irregularities, relationships, similarities and associations==",c:[22,"slide","The aim is now to find regularities, irregularities, relationships, similarities and associations in the input."]},
    {t:"**Problems** — Clustering · Association Rules · ==Pattern Mining== · ==Outlier Detection==",c:[23,"slide","Problems: Clustering. Association Rules. Pattern Mining. Outlier Detection — the process of finding data examples with behaviours that are very different from the expectation (outliers or anomalies)."]}
  ]},
  {h:"Other paradigms",s:[25,26,27,28],items:[
    {t:"**Imbalanced** — ==class of interest is much lower than the other classes==",c:[25,"slide","Imbalanced Learning: A classification problem where the data has exceptional distribution on the target attribute. The number of examples representing the class of interest is much lower than that of the other classes."]},
    {t:"**Multi-instance** — each example = ==a bag of instances==; **Multi-label** — ==a subset of== classes",c:[25,"slide","Multi-instance Learning: each example consists of a bag of instances instead of an unique instance. Multi-label Classification: Each instance is associated not with a class, but instead with a subset of them."]},
    {t:"**Transfer Learning** — knowledge from ==source tasks → target task==; **Data Stream** — ==inspected only once==",c:[28,"slide","Transfer Learning: Aims to extract the knowledge from one or more source tasks and apply the knowledge to a target task. Data Stream Learning: Each instance can be inspected only once and must then be discarded to make room for subsequent instances."]}
  ]},
  {h:"Data preprocessing",s:[30,31,32,33,34,35,36],items:[
    {t:"**Key rule** — ==Low-quality data will lead to low-quality DM performance==",c:[30,"slide","Low-quality data will lead to low-quality DM performance."]},
    {t:"**Preparation** — Cleaning · Transformation · Integration · Normalization · ==Missing Data Imputation== · ==Noise Identification==",c:[32,"slide","Forms of Data Preparation: Data Cleaning. Data Transformation. Data Integration. Data Normalization. Missing Data Imputation. Noise Identification."]},
    {t:"**Reduction** — ==Feature Selection== · ==Instance Selection== · ==Discretization== · Feature Extraction/Instance Generation",c:[35,"slide","Forms of Data Reduction: Feature Selection. Instance Selection. Discretization. Feature Extraction/Instance Generation."]}
  ]},
  {figs:[["kdd","KDD process — Slide 6"],["dm-methods","Data Mining methods — Slide 8"],["data-prep","Forms of Data Preparation — Slide 31"]]}

 d3:[
  {h:"Why NumPy?",s:[2],items:[
    {t:"**Contiguous memory** — ==raw binary array data in contiguous structures within memory==",c:[2,"slide","NumPy stores raw binary array data in contiguous structures within memory, separate from regular Python system references."]},
    {t:"**Vectorization** — ==batch operations run on comprehensive array chunks simultaneously without== slower Python loop constructs",c:[2,"slide","Batch operations run on comprehensive array chunks simultaneously without the usage of standard slower Python loop constructs."]},
    {t:"A Python **list** is ==not stored as a continuous array of pointers==",c:[2,"tr","So a list in Python is not stored as a continuous array of pointers. It can be all over the place, which has issues when we're doing data processing."]}
  ]},
  {h:"Creating ndarrays",s:[3],items:[
    {t:"**np.array** — ==accept nested lists, tuples, or sequence iterables, automatically inferring data types==",c:[3,"slide","Functions like np.array accept nested lists, tuples, or sequence iterables, automatically inferring data types."]},
    {t:"**zeros / ones** — ==generate specific matrix dimensions initialized with static elements==",c:[3,"slide","Methods like zeros and ones generate specific matrix dimensions initialized with static elements."]},
    {t:"**np.arange / np.empty** — ==arange creates a sequence array==; empty ==allocates uninitialized contiguous memory==",c:[3,"slide","np.arange creates a sequence array, while np.empty allocates uninitialized contiguous memory."]}
  ]},
  {h:"NumPy dtypes",s:[4],items:[
    {t:"**Signed** ==int8, int32, int64==",c:[4,"slide","Signed Integers — int8, int32, int64 — Signed integers from 8-bit to 64-bit precision limits."]},
    {t:"**Unsigned** ==uint8, uint32, uint64== — non-negative only, ==ideal for memory optimization==",c:[4,"slide","Unsigned Integers — uint8, uint32, uint64 — Non-negative integers only, ideal for memory optimization."]},
    {t:"**Float** ==float32, float64==; cast with ==arr.astype(np.float64)==",c:[4,"slide","Floating Point — float32, float64 — arr.astype(np.float64) — Double precision float64 matches standard Python float parameters."]}
  ]},
  {h:"Arithmetic & ufuncs",s:[5,8],items:[
    {t:"**Element-wise** — ==operate ... across dimensional bounds without requiring explicit loop nesting==",c:[5,"slide","Calculations operate element-wise directly across dimensional bounds without requiring explicit loop nesting."]},
    {t:"**Unary** ==np.sqrt / np.exp== — single-array ops in ==optimized C==",c:[8,"slide","Unary ufuncs — Execute single-array operations. Computes rapid element values directly in optimized C."]},
    {t:"**Binary** ==np.maximum / np.add==; **Output** ==np.sqrt(arr, out=arr)==",c:[8,"slide","Binary Operators — Compute results across dual input array dimensions simultaneously on execution. Output Scopes — Direct calculation outputs into specified target buffers."]}
  ]},
  {h:"Slicing & views",s:[6],items:[
    {t:"**View (no-copy)** — ==Slices serve directly as active “views”==; ==modifications instantly mutate the parent==",c:[6,"slide","Slices serve directly as active “views” over the source matrix bounds instead of spawning detached variable clones. Modifications instantly mutate the parent."]},
    {t:"**Copy** — ==Force explicit allocations using the copy method== (arr[5:8].copy())",c:[6,"slide","NumPy prevents performance bottlenecks by restricting copy cycles for large data structures. Force explicit allocations using the copy method."]}
  ]},
  {h:"Boolean & fancy indexing",s:[7],items:[
    {t:"**Boolean masks** — logical statements ==yield boolean arrays==; ==Boolean masking always copies data==",c:[7,"slide","Logical statements on string or numeric arrays yield boolean arrays acting as instant data-filtering overlays. Boolean masking always copies data."]},
    {t:"**Fancy indexing** — ==Extract subsets out of order==; ==Fancy indexing always copies array values==",c:[7,"slide","Extract subsets out of order by passing structured coordinate lists or indices natively. Fancy indexing always copies array values."]}
  ]},
  {h:"Performance",s:[9],items:[
    {t:"Pure Python loop **48.8 ms** vs NumPy ==~68.7x faster==",c:[9,"slide","# Average Speedup: ~68.7x faster (Pure Python list loop ≈ 48.8 ms)."]},
    {t:"==about 68.7 times faster== — “a huge speed performance boost”",c:[9,"tr","So the Python way took 48.8 milliseconds ... It is about 68.7 times faster. So less than a millisecond, which is a huge speed performance in boost."]}
  ]},
  {figs:[["numpy-perf","Vectorization benchmark — Slide 9"]]},
  {h:"Linear algebra",s:[10],items:[
    {t:"**Matrix product** ==np.dot() / @==; **inv** ==numpy.linalg.inv==; **qr** ==.qr==; **svd** ==.svd==",c:[10,"slide","Matrix Product — np.dot() / @. Matrix Inversion — numpy.linalg.inv. QR Decomposition — numpy.linalg.qr. Decompositions — numpy.linalg.svd."]}
  ]}

 d4:[
  {h:"Benchmark data sets",s:[3,4],items:[
    {t:"==evaluate such a technique in a set of standard DM problems (or data sets) publicly available==",c:[3,"slide","The common procedure is to evaluate such a technique in a set of standard DM problems (or data sets) publicly available."]},
    {t:"**Goal** — ==evaluate the performance of a given model over a set of well-known standard problems==",c:[4,"slide","To evaluate the performance of a given model over a set of well-known standard problems."]}
  ]},
  {h:"Underfitting vs overfitting",s:[5],items:[
    {t:"**Underfitting** — ==poorly adjusted==: ==high error both in training and test (unseen) data==",c:[5,"slide","Underfitting happens when the model is poorly adjusted to the data, suffering from high error both in training and test (unseen) data."]},
    {t:"**Overfitting** — ==too tightly adjusted==: ==high precision to known cases but behaving poorly with unseen data==",c:[5,"slide","Overfitting happens when the model is too tightly adjusted to data offering high precision to known cases but behaving poorly with unseen data."]},
    {t:"Overfitting is hard to spot — ==the lack of unseen case makes impossible to notice this situation==",c:[7,"slide","Adjusting such a model to better fit the data may lead to overfitting; the lack of unseen case makes impossible to notice this situation."]}
  ]},
  {figs:[["uf-of","Under/overfitting vs. complexity — Slide 6"],["kfcv","k-Fold Cross-Validation — Slide 10"]]},
  {h:"k-Fold Cross Validation",s:[9],items:[
    {t:"==randomly partitioned into k equal size folds or partitions==",c:[9,"slide","In k-FCV, the original data set is randomly partitioned into k equal size folds or partitions."]},
    {t:"==one is retained as the validation data==; ==remaining k − 1 subsamples are used to build the model==",c:[9,"slide","From the k partitions, one is retained as the validation data for testing the model, and the remaining k − 1 subsamples are used to build the model."]},
    {t:"==repeated k times with each of the k subsamples used exactly once as the validation data==",c:[9,"slide","As we have k partitions, the process is repeated k times with each of the k subsamples used exactly once as the validation data."]}
  ]},
  {h:"Choosing k & stratified",s:[11,12],items:[
    {t:"==5 and 10 being the most common ones==",c:[11,"slide","The value of k may vary, 5 and 10 being the most common ones."]},
    {t:"==big data sets ... 10-FCV==; ==smaller data sets 5-FCV==",c:[11,"slide","If big data sets are being used, 10-FCV is usually utilized. For smaller data sets 5-FCV is more frequent."]},
    {t:"**Stratified k-FCV** — ==equal number of samples of each class on each partition==",c:[12,"slide","The most commonly employed method in the literature to avoid this problem is stratified k-FCV. It places an equal number of samples of each class on each partition to maintain class distributions equal in all partitions."]}
  ]},
  {h:"5×2 CV & Leave-one-out",s:[13,15],items:[
    {t:"**5×2 CV** — ==randomly partitioned in two subsets A and B==; ==built using A and validated with B==, then ==reversed==",c:[13,"slide","The whole data set is randomly partitioned in two subsets A and B. The model is first built using A and validated with B. Then the process is reversed with the model built with B and tested with A."]},
    {t:"**Leave one out** — ==extreme case of k-FCV==: ==k equals the number of examples in the data set==",c:[15,"slide","Is an extreme case of k-FCV: k equals the number of examples in the data set. In each step only one instance is used to test the model whereas the rest of instances are used to learn it."]}
  ]},
  {h:"Performance measures",s:[16,17],items:[
    {t:"Binary measures: ==classification rate, precision, sensitivity, specificity, G-mean, F-score, AUC== ... ==Cohen's Kappa==",c:[16,"slide","Well-known accuracy measures for binary-class problems are classification rate, precision, sensitivity, specificity, G-mean, F-score, AUC, Youden's index and Cohen's Kappa."]},
    {t:"Multi-class: mainly ==Classification rate (also known as accuracy)== and ==Cohen's kappa==",c:[17,"slide","Only two measures are widely used ... Classification rate (also known as accuracy): is the number of successful hits relative to the total number of classifications; Cohen's kappa."]}
  ]},
  {h:"Cohen's kappa",s:[18],items:[
    {t:"==compensates for random hits==",c:[18,"slide","Cohen's kappa is an alternative to classification rate, a method, known for decades, that compensates for random hits."]},
    {t:"Ranges ==through 0 (random classification) to 1 (perfect agreement)==",c:[18,"slide","Cohen's kappa ranges from −1 through 0 (random classification) to 1 (perfect agreement)."]},
    {t:"Why: fraud is ==99% nonfraud== — always predicting nonfraud is ==99% accurate==",c:[18,"tr","So let's go back to the fraud detection. 99% are nonfraud. 1% is fraud. So if the classifier always selects nonfraud, it's 99% accurate. That's a problem."]}
  ]}

 d5:[
  {h:"Why raw performance isn't enough",s:[1],items:[
    {t:"Comparing methods by ==raw performance== to rank them is **discouraged**",c:[1,"slide","Using the raw performance measures to compare different ML methods and to establish a ranking is discouraged"]},
    {t:"Use ==other statistical tools== to get meaningful, durable conclusions",c:[1,"slide","Other tools of statistical nature must be utilized in order to obtain meaningful and durable conclusions"]}
  ]},
  {h:"Parametric vs non-parametric",s:[2],items:[
    {t:"The distinction is based on the ==level of measure== of the data",c:[2,"slide","The distinction between parametric and non-parametric tests is based on the level of measure represented by the data to be analyzed"]},
    {t:"A parametric test usually uses ==real-valued data==",c:[2,"slide","A parametric test usually uses data composed by real values"]},
    {t:"If its conditions aren't met, the analysis can ==lose credibility==",c:[2,"slide","might cause a statistical analysis to lose credibility"]}
  ]},
  {h:"3 conditions for parametric tests",s:[3],items:[
    {t:"**Independence** — one event ==does not modify the probability== of another",c:[3,"slide","two events are independent when the fact that one occurs does not modify the probability of the other one occurring"]},
    {t:"**Normality** — behaviour follows a ==normal / Gauss distribution== (mean μ, variance σ)",c:[3,"slide","its behaviour follows a normal or Gauss distribution with a certain value of average μ and variance σ"]},
    {t:"**Heteroscedasticity** — a ==violation of equality of variances==",c:[3,"slide","a violation of the hypothesis of equality of variances"]}
  ]},
  {h:"Independence in practice",s:[4],items:[
    {t:"Independence is ==not truly verified in k-FCV and 5×2 CV==",c:[4,"slide","independency is not truly verified in k-FCV and 5×2CV"]},
    {t:"==Hold-out partitions== can be taken as independent (train/test don't overlap)",c:[4,"slide","Hold-out partitions can be safely take as independent, since training and tests partitions do not overlap"]}
  ]},
  {h:"Normality tests",s:[5],items:[
    {t:"**Kolmogorov–Smirnov** — compares the ==accumulated distribution== to a Gaussian's",c:[5,"slide","compares the accumulated distribution of observed data with the accumulated distribution expected from a Gaussian distribution"]},
    {t:"**Shapiro–Wilk** — checks ==symmetry & kurtosis== (curve shape) vs a Gaussian",c:[5,"slide","compute the level of symmetry and kurtosis (shape of the curve)"]},
    {t:"**D'Agostino–Pearson** — uses ==skewness & kurtosis== to measure distance from Gaussian",c:[5,"slide","first computes the skewness and kurtosis to quantify how far from Gaussian the distribution is"]}
  ]},
  {h:"Equal-variance test",s:[6],items:[
    {t:"**Levene's test** — checks ==homogeneity of variances (homoscedasticity)==",c:[6,"slide","Levene's test is used for checking whether or not k samples present this homogeneity of variances (homoscedasticity)"]},
    {t:"When normality fails, it's ==more reliable than Bartlett's==",c:[6,"slide","this test's result is more reliable than Bartlett's test"]}
  ]},
  {h:"Visual check (Q-Q)",s:[9],items:[
    {t:"**Q-Q plots** confront ==observed quartiles vs the normal distribution's==",c:[9,"slide","a confrontation between the quartiles from data observed and those from the normal distributions"]},
    {t:"With histograms, ==normality can be visually checked==",c:[9,"slide","the normality can be visually checked"]}
  ]},
  {h:"Key finding",s:[12],items:[
    {t:"Normality is ==often not verified== in a single-problem analysis",c:[12,"slide","the normality condition is not verified in a single-problem analysis"]},
    {t:"Even ==50 results== may not meet the parametric conditions",c:[12,"slide","A sample of 50 results that should be large enough to fulfill the parametric conditions does not always verify the necessary precepts"]},
    {t:"⇒ ==non-parametric tests are recommended== for comparing ML algorithms",c:[12,"slide","the use of non-parametric test for comparing ML algorithms is recommended"]}
  ]},
  {h:"Comparing TWO algorithms",s:[14,15,16],items:[
    {t:"Done with ==paired t tests==, often with the ==non-parametric Wilcoxon==",c:[14,"slide","ML approaches have been compared through parametric tests by means of paired t tests"]},
    {t:"Correct only for ==two methods==, not several",c:[14,"slide","Their use is correct when we are interested in finding the differences between two methods"]},
    {t:"**FWER** = probability of ==at least one error== in the family of hypotheses; grows with more comparisons",c:[15,"slide","It is the probability of at least one error in the family of hypotheses"]},
    {t:"**Wilcoxon** — the ==analogue of the paired t-test== (non-parametric)",c:[16,"slide","It is the analogue of the paired t-test in non-parametric statistical procedures"]}
  ]},
  {h:"Wilcoxon computation",s:[17,18,19],items:[
    {t:"Rank the ==differences dᵢ by absolute value== (average ranks for ties)",c:[17,"slide","The differences are ranked according to their absolute values"]},
    {t:"==R+== = ranks where the 1st algorithm wins; ==R−== = the opposite",c:[17,"slide","R− the sum of ranks for the opposite"]},
    {t:"Statistic ==T = min(R+, R−)==; reject H₀ if ==T ≤ Wilcoxon critical value==",c:[18,"slide","T = min(R+, R−)"]},
    {t:"==Safer than the t-test== — it ==does not assume normal distributions==",c:[19,"slide","the test is safer since it does not assume normal distributions"]}
  ]},
  {h:"Comparing MANY algorithms",s:[24,26],items:[
    {t:"**Multiple-comparison procedures** ==fix the FWER== across all algorithms",c:[24,"slide","Multiple comparison procedures are designed for allowing the FWER to be fixed"]},
    {t:"A **block** = the ==results for one specific problem== (≥ 3 results)",c:[26,"slide","each block corresponds to the results offered for a specific problem"]}
  ]},
  {h:"Friedman & Iman–Davenport",s:[27,28,29,30],items:[
    {t:"**Friedman** — non-parametric analog of the ==parametric two-way ANOVA==",c:[27,"slide","The Friedman test is a nonparametric analog of the parametric two-way analysis of variance"]},
    {t:"Asks whether samples have ==different median values==",c:[27,"slide","do at least two of the samples represent populations with different median values?"]},
    {t:"H₀: ==equality of medians==; H₁ is ==non-directional==",c:[28,"slide","The null hypothesis for Friedman's test states equality of medians between the populations"]},
    {t:"Method: ==rank algorithms per data set== (best = 1), compare ==average ranks==",c:[29,"slide","It ranks the algorithms for each data set separately, the best performing algorithm getting the rank of 1"]},
    {t:"**Iman–Davenport** — derived from Friedman, which is ==too conservative==",c:[30,"slide","Iman and Davenport proposed a derivation from the Friedman statistic"]}
  ]},
  {h:"Post-hoc procedures",s:[32,33,34,35,37],items:[
    {t:"Friedman only shows a difference ==exists==, not ==which== — so run a post-hoc",c:[32,"slide","does not involve the detection of the existing differences among the algorithms compared"]},
    {t:"Pick a ==control algorithm==, compare it with the ==remaining k−1==",c:[33,"slide","compare the control algorithm with the remain k − 1 algorithms"]},
    {t:"**Bonferroni-Dunn** — differ if ranking gap ≥ its ==critical difference (CD)==",c:[34,"slide","the corresponding average of rankings is at least as great as its critical difference (CD)"]},
    {t:"**Holm** — ==sequential==, ordered by significance; compares pᵢ with ==α/(k−i)==",c:[35,"slide","sequentially checks the hypotheses ordered according to their significance"]},
    {t:"**Hochberg** — ==step-up==, opposite to Holm; ==more powerful than Holm==",c:[37,"slide","Hochberg's method is more powerful than Holm's"]}
  ]},
  {figs:[["test-flow","Which test to use — Slide 1"],["param-nonparam","Parametric conditions — Slide 3"],["wilcoxon","Wilcoxon steps — Slides 17–18"]]}
 ],
 d6:[
  {h:"Why pandas",s:[1],items:[
    {t:"**Labeled structural data** — tabular structures with ==mixed metadata types== (integers, strings, timestamps, floats)",c:[1,"slide","Designed strictly for tabular data structures with mixed metadata types (such as integers, strings, timestamps, and floats)."]},
    {t:"**Index alignment** — ==automatic label-based relational alignment== across unmatched positions",c:[1,"slide","Provides automatic label-based relational alignment across differently shaped, unmatched index positions seamlessly."]}
  ]},
  {h:"Core structures",s:[2],items:[
    {t:"**Series** — a ==1D array-like sequence== matched with an axis-labels index",c:[2,"slide","A structured, 1D array-like sequence containing data matched with a distinct axis labels index array."]},
    {t:"**DataFrame** — a ==2D structure== of ordered, labeled columns",c:[2,"slide","A multi-column spreadsheet-like 2D structure containing ordered collections of labeled columns."]},
    {t:"**Index** — ==immutable sequences== carrying axes metadata for alignment & lookup",c:[2,"slide","Immutable sequences carrying axes metadata tags responsible for label alignments and lookup routes."]}

/* ============================================================
   STORAGE  (localStorage when available; safe in-memory fallback)
   ============================================================ */
const KEY="slide-study-v1";
const mem={};
const Store={
  read(){
    try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}
    catch(e){return mem[KEY]?JSON.parse(mem[KEY]):null;}
  },
  write(o){
    const s=JSON.stringify(o);
    try{localStorage.setItem(KEY,s);}catch(e){mem[KEY]=s;}
  }
};
function freshState(){
  const decks={};
  DECKS.forEach(d=>decks[d.id]=deckState());
  return {
    theme:"light",
    decks,
    history:[],          // {deck,slide,topic,qid,type,correct,ts,q,your,correct_ans}
    tests:[],            // {deck,total,correct,pct,ts}
    lastSession:null
  };
}
function deckState(){return {reviewed:{},topicStatus:{},flash:{}};}
let S=Store.read()||freshState();
// migrate missing fields
S.decks=S.decks||{};
DECKS.forEach(d=>{S.decks[d.id]=Object.assign(deckState(),S.decks[d.id]);});
S.history=S.history||[]; S.tests=S.tests||[];
function save(){S.lastSession=Date.now();Store.write(S);}

   HELPERS
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const deckById=id=>DECKS.find(d=>d.id===id);
const slideOf=(id,n)=>deckById(id).slides.find(s=>s.n===n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function slideText(s){
  return s.blocks.map(b=>{
    if(b.t==="tbl")return b.head.join(" ")+" "+b.rows.map(r=>r.join(" ")).join(" ");
    if(b.t==="dg")return (DIAGRAMS[b.id]&&DIAGRAMS[b.id].text)||"";
    if(b.t==="code")return b.x||"";
    if(b.t==="b"&&b.lb)return b.lb+" "+b.x;
    return b.x||"";
  }).join("  ");
}
function deckReviewedCount(id){const d=deckById(id);return d.slides.filter(s=>S.decks[id].reviewed[s.n]).length;}
function deckAccuracy(id){
  const h=S.history.filter(x=>x.deck===id);
  if(!h.length)return null;
  return Math.round(100*h.filter(x=>x.correct).length/h.length);
}
function weakItems(id){
  // group history by qid, keep those with >=1 wrong
  const map={};
  S.history.filter(x=>x.deck===id).forEach(x=>{
    const k=x.qid; if(!map[k])map[k]={qid:k,deck:x.deck,topic:x.topic,slide:x.slide,q:x.q,attempts:0,wrong:0,hist:[]};
    map[k].attempts++; if(!x.correct)map[k].wrong++; map[k].hist.push(x.correct);
  });
  return Object.values(map).filter(m=>m.wrong>0).sort((a,b)=>b.wrong-a.wrong);
}
function weakTopicsCount(id){
  const set=new Set(weakItems(id).map(w=>w.topic));
  Object.entries(S.decks[id].topicStatus).forEach(([t,st])=>{if(st==="need")set.add(t);});
  return set.size;
}

/* record an answered question */
function record(deck,q,correct,your){
  S.history.push({deck,slide:q.slide,topic:q.topic,qid:q.id||("auto-"+deck+"-"+q.slide),
    type:q.type,correct:!!correct,ts:Date.now(),q:q.q,your:your==null?"":String(your),
    correct_ans:answerLabel(q)});
  // keep history bounded
  if(S.history.length>4000)S.history=S.history.slice(-4000);
  save();
}
function answerLabel(q){
  if(q.type==="mc")return q.opts[q.a];
  if(q.type==="tf")return q.a?"True":"False";
  if(q.type==="fib")return q.answer;
  if(q.type==="short")return q.ev;
  if(q.type==="match")return "(matching)";
  return "";
}

/* ---- auto fill-in-the-blank generator from a slide ---- */
const STOP=new Set("the a an of to in and or for with as is are be by on that this it its their they them from into which within under over most well known good are used they may have some other both each an all not no".split(" "));
function fibFromSlide(deck,s){
  // candidate sentences = paragraph/bullet text (not headings) with a meaningful term to blank
  const cands=[];
  s.blocks.forEach(b=>{
    if(b.t==="tbl"||b.t==="img"||b.t==="note"||b.t==="h")return;
    let txt=(b.lb?b.lb+" ":"")+(b.x||"");
    txt=txt.trim();
    if(txt.length<32)return;
    const term=pickTerm(txt);
    if(term)cands.push({txt,term});
  });
  if(!cands.length)return null;
  const c=cands[Math.floor(Math.random()*cands.length)];
  const blanked=c.txt.replace(c.term,"______");
  return {type:"fib",slide:s.n,topic:topicForSlide(deck,s.n),q:blanked,answer:c.term,ev:c.txt,id:"fib-"+deck+"-"+s.n+"-"+Math.floor(Math.random()*1e6)};
}
// choose the best term to blank: prefer acronyms-in-parens, then capitalised multi-word
// terms that aren't the sentence's first word, then the longest content word (not first word)
function pickTerm(txt){
  let m=txt.match(/\(([A-Z][A-Za-z0-9\/\-]{1,10})\)/);           // (GIL), (ANNs), (KNN)
  if(m)return m[1];
  const firstWord=(txt.match(/^[A-Za-z\-]+/)||[""])[0];
  const caps=[...txt.matchAll(/\b([A-Z][a-zA-Z\-]+(?:\s[A-Z][a-zA-Z\-]+){0,2})\b/g)]
    .map(x=>({w:x[1],i:x.index}))
    .filter(x=>x.i>0 && x.w.length>3 && !/^(The|They|This|That|It|Its|Both|Each|Set)$/.test(x.w));
  if(caps.length)return caps.sort((a,b)=>b.w.length-a.w.length)[0].w;
  const words=txt.replace(/[^A-Za-z\- ]/g," ").split(/\s+/)
    .filter(w=>w.length>6 && !STOP.has(w.toLowerCase()) && w.toLowerCase()!==firstWord.toLowerCase());
  if(words.length)return words.sort((a,b)=>b.length-a.length)[0];
  return null;
}
function topicForSlide(deck,n){
  const d=deckById(deck);const t=(d.topics||[]).find(t=>t.slides.includes(n));
  return t?t.name:d.title;
}

/* build a pool of questions for a deck (bank + generated fib for coverage) */
function poolForDeck(deck,{types="all",diff="all",slides=null}={}){
  let pool=BANK[deck].slice();
  if(slides)pool=pool.filter(q=>slides.includes(q.slide));
  if(diff!=="all")pool=pool.filter(q=>String(q.diff)===String(diff)||q.type==="fib");
  if(types!=="all"){
    const want=new Set(types);
    pool=pool.filter(q=>want.has(q.type));
    // add generated fib if requested
    if(want.has("fib")){
      const src=slides?deckById(deck).slides.filter(s=>slides.includes(s.n)):deckById(deck).slides;
      src.forEach(s=>{const f=fibFromSlide(deck,s);if(f&&(diff==="all"||diff==="1"))pool.push(f);});
    }
  }
  return pool;
}

function renderBlocks(container,blocks,highlight){
  let curUL=null;
  const flush=()=>{if(curUL){container.appendChild(curUL);curUL=null;}};
  blocks.forEach(b=>{
    if(b.t==="b"){
      if(!curUL)curUL=el("ul","bl");
      const li=el("li","l"+(b.l||0));
      if(b.lb){const s=el("span","blk-lb");s.textContent=b.lb+" ";li.appendChild(s);li.appendChild(document.createTextNode(b.x));}
      else li.textContent=b.x;
      if(b.bold)li.classList.add("blk-bold");
      if(highlight)hl(li,highlight);
      curUL.appendChild(li);
      return;
    }
    flush();
    if(b.t==="h"){const e=el("div","blk-h",b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="p"){const e=el("div","blk-p"+(b.bold?" blk-bold":""),b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="note"){const e=el("div","blk-note",b.x);if(highlight)hl(e,highlight);container.appendChild(e);}
    else if(b.t==="code"){const pre=el("pre","blk-code");pre.textContent=b.x;if(highlight)hl(pre,highlight);container.appendChild(pre);}
    else if(b.t==="img"){const e=el("div","blk-img");e.innerHTML=`<span>🖼</span>`;e.appendChild(document.createTextNode("[Image: "+b.x+"]"));container.appendChild(e);}
    else if(b.t==="dg"){const d=DIAGRAMS[b.id];if(d){const holder=el("div");holder.innerHTML=d.svg();if(holder.firstElementChild)container.appendChild(holder.firstElementChild);}}
    else if(b.t==="tbl"){
      const t=el("table","slide-tbl");const thead=el("thead");const tr=el("tr");
      b.head.forEach(h=>tr.appendChild(el("th",null,h)));thead.appendChild(tr);t.appendChild(thead);
      const tb=el("tbody");
      b.rows.forEach(r=>{const rr=el("tr");r.forEach((cell,ci)=>{const td=el("td");if(ci===1){const k=el("span","kbd",cell);td.appendChild(k);if(highlight)hl(k,highlight);}else{td.textContent=cell;if(highlight)hl(td,highlight);}rr.appendChild(td);});tb.appendChild(rr);});
      t.appendChild(tb);container.appendChild(t);
    }
  });
  flush();
}
function hl(node,q){
  if(!q)return 0;
  const txt=node.textContent;const low=txt.toLowerCase(),ql=q.toLowerCase();
  if(low.indexOf(ql)<0)return 0;
  node.textContent="";
  let i=0,cnt=0;
  while(true){
    const j=low.indexOf(ql,i);
    if(j<0){node.appendChild(document.createTextNode(txt.slice(i)));break;}
    node.appendChild(document.createTextNode(txt.slice(i,j)));
    node.appendChild(el("mark",null,txt.slice(j,j+q.length)));
    cnt++;i=j+q.length;
  }
  return cnt;
}

/* ---------- BUILD QUESTION SETS ---------- */
function buildSlideQuestions(deck,n){
  let qs=BANK[deck].filter(q=>q.slide===n);
  const s=slideOf(deck,n);
  // add up to 2 auto fib for variety/coverage
  for(let k=0;k<2;k++){const f=fibFromSlide(deck,s);if(f)qs.push(f);}
  qs=dedupe(qs);
  if(!qs.length){const f=fibFromSlide(deck,s);if(f)qs=[f];}
  return shuffle(qs).slice(0,Math.max(3,Math.min(qs.length,8)));
}
function buildTopicQuestions(deck,t){
  let qs=BANK[deck].filter(q=>t.slides.includes(q.slide));
  t.slides.forEach(sn=>{const f=fibFromSlide(deck,slideOf(deck,sn));if(f)qs.push(f);});
  qs=dedupe(qs);
  return shuffle(qs).slice(0,Math.min(qs.length,10));
}
function dedupe(qs){const seen=new Set();return qs.filter(q=>{const k=q.id||q.q;if(seen.has(k))return false;seen.add(k);return true;});}

/* ---------- SESSION ENGINE (practice / slide / topic / test) ---------- */
function renderSession(){
  const Q=R.questions,i=R.i,q=Q[i];
  const isTest=R.mode==="test";
  const total=Q.length;

  const head=el("div","spread");head.style.marginBottom="14px";
  const title=R.mode==="slide"?`Slide ${R.slide} Practice`:R.mode==="topic"?`Topic: ${R.label}`:isTest?"Practice Test":"Practice";
  head.innerHTML=`<div><div class="eyebrow">${escapeHTML(deckById(R.deck).title)}</div><h2 style="font-size:19px;margin-top:4px">${escapeHTML(title)}</h2></div>`;
  const quit=el("button","btn sm","Exit");quit.onclick=()=>go(R.from||{view:"home"});
  head.appendChild(quit);
  view.appendChild(head);

  const pbar=el("div","progress");pbar.style.marginBottom="16px";
  pbar.appendChild(Object.assign(el("i"),{style:`width:${Math.round(100*i/total)}%`}));
  view.appendChild(pbar);
  const counter=el("div","muted");counter.style.cssText="font-size:13px;margin-bottom:10px;font-weight:600";
  counter.textContent=`Question ${i+1} of ${total}`;
  view.appendChild(counter);

  const card=el("div","q-card");
  const meta=el("div","q-meta");
  meta.innerHTML=`<span class="tag">Slide ${q.slide}</span><span class="pill">${typeName(q.type)}</span>${q.diff?`<span class="pill ${q.diff===3?"b":q.diff===2?"p":"g"}">${["","Basic","Moderate","Challenging"][q.diff]}</span>`:""}`;
  card.appendChild(meta);

  const answered={done:false};
  const advance=(correct,your)=>{
    if(answered.done)return;answered.done=true;
    if(!isTest||true)record(R.deck,q,correct,your);
    R.answers=R.answers||[];R.answers[i]={q,correct,your};
    // reveal handled inside each type; show next button
    nextBar();
  };
  const nextBar=()=>{
    const bar=el("div","row");bar.style.marginTop="18px";
    const more=i<total-1;
    const b=el("button","btn primary",more?"Next question ›":(isTest?"See results":"Finish"));
    b.onclick=()=>{
      if(more)go(Object.assign({},R,{i:i+1}));
      else finishSession();
    };
    bar.appendChild(b);
    card.appendChild(bar);
  };

  if(q.type==="mc")mcUI(card,q,advance);
  else if(q.type==="tf")tfUI(card,q,advance);
  else if(q.type==="fib")fibUI(card,q,advance);
  else if(q.type==="short")shortUI(card,q,advance);
  else if(q.type==="match")matchUI(card,q,advance);
  view.appendChild(card);
}
function typeName(t){return {mc:"Multiple Choice",tf:"True / False",fib:"Fill in the Blank",short:"Short Answer",match:"Definition Matching"}[t]||t;}

function sourceBox(q){
  const s=el("div","source-box");
  s.innerHTML=`<div class="src">Source: ${deckById(R.deck).title} — Slide ${q.slide}</div>`;
  const qt=el("div","quote");qt.textContent="\u201C"+q.ev+"\u201D";

}
function feedback(card,correct,extraNode){
  const f=el("div","feedback "+(correct?"ok":"no"));
  f.appendChild(Object.assign(el("div","verdict"),{textContent:correct?"✓ Correct":"✗ Not quite"}));
  if(extraNode)f.appendChild(extraNode);

}

function mcUI(card,q,advance){
  card.appendChild(Object.assign(el("div","q-text"),{textContent:q.q}));
  const opts=el("div");
  const order=q._order||(q._order=shuffle(q.opts.map((_,ix)=>ix)));
  const btns=[];
  order.forEach(ix=>{
    const b=el("button","opt",q.opts[ix]);
    b.onclick=()=>{
      const correct=ix===q.a;
      btns.forEach(x=>x.disabled=true);
      b.classList.add(correct?"correct":"wrong");
      if(!correct){const ci=btns.findIndex((_,k)=>order[k]===q.a);if(ci>=0)btns[ci].classList.add("correct");}
      feedback(card,correct,sourceBox(q));
      advance(correct,q.opts[ix]);
    };
    btns.push(b);opts.appendChild(b);
  });
  card.appendChild(opts);
}
function tfUI(card,q,advance){
  card.appendChild(Object.assign(el("div","q-text"),{textContent:q.q}));
  const opts=el("div");const btns=[];
  [["True",true],["False",false]].forEach(([lbl,val])=>{
    const b=el("button","opt",lbl);
    b.onclick=()=>{
      const correct=val===q.a;btns.forEach(x=>x.disabled=true);
      b.classList.add(correct?"correct":"wrong");
      if(!correct){const cb=btns[q.a?0:1];cb.classList.add("correct");}
      feedback(card,correct,sourceBox(q));advance(correct,lbl);
    };btns.push(b);opts.appendChild(b);
  });
  card.appendChild(opts);
}
function fibUI(card,q,advance){
  const qt=el("div","q-text");qt.textContent=q.q;card.appendChild(qt);
  const inp=el("input","q-input");inp.placeholder="Type the missing term…";card.appendChild(inp);
  const b=el("button","btn primary","Check answer");b.style.marginTop="14px";
  b.onclick=()=>{
    const your=inp.value.trim();
    const correct=normalize(your)===normalize(q.answer)||(your.length>2&&normalize(q.answer).includes(normalize(your))&&normalize(your).length>=Math.min(4,normalize(q.answer).length));
    inp.disabled=true;b.disabled=true;
    const ans=el("div");ans.innerHTML=`<div style="margin-bottom:6px"><b>Answer:</b> ${escapeHTML(q.answer)}</div>`;ans.appendChild(sourceBox(q));
    feedback(card,correct,ans);advance(correct,your);
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!b.disabled)b.click();});
  card.appendChild(b);
  setTimeout(()=>inp.focus(),40);
}
function shortUI(card,q,advance){
  const qt=el("div","q-text");qt.textContent=q.q;card.appendChild(qt);
  const ta=el("textarea","q-input");ta.placeholder="Answer in your own words…";card.appendChild(ta);
  const b=el("button","btn primary","Submit answer");b.style.marginTop="14px";
  b.onclick=()=>{
    const your=ta.value.trim();
    const low=normalize(your);
    const hits=(q.keys||[]).filter(k=>low.includes(normalize(k))).length;
    const need=Math.max(1,Math.ceil((q.keys||[]).length*0.34));
    const correct=hits>=need;
    ta.disabled=true;b.disabled=true;
    const box=el("div");
    box.innerHTML=`<div style="margin-bottom:8px" class="muted">Self-check — your wording doesn't have to match. Compare with the slide:</div>`;
    box.appendChild(sourceBox(q));
    const sc=el("div","row");sc.style.marginTop="12px";
    const bad=el("button","btn sm","I missed it");const good=el("button","btn sm primary","I had it");
    sc.append(el("span","muted"),bad,good);
    box.appendChild(sc);
    feedback(card,correct,box);
    // let learner override the keyword heuristic
    bad.onclick=()=>{overrideResult(false);};good.onclick=()=>{overrideResult(true);};
    let recorded=false;
    function overrideResult(val){if(recorded){/*update last*/const last=S.history[S.history.length-1];if(last&&last.qid===(q.id))last.correct=val;save();}bad.disabled=good.disabled=true;bad.style.opacity=val?.4:1;good.style.opacity=val?1:.4;}
    advance(correct,your);recorded=true;
  };
  card.appendChild(b);
  setTimeout(()=>ta.focus(),40);
}
function matchUI(card,q,advance){
  const qt=el("div","q-text");qt.textContent=q.q;card.appendChild(qt);
  const grid=el("div","match-grid");
  const left=el("div","match-col");left.appendChild(Object.assign(el("h4"),{textContent:"Terms"}));
  const right=el("div","match-col");right.appendChild(Object.assign(el("h4"),{textContent:"Definitions"}));
  const terms=q.pairs.map((p,ix)=>({term:p[0],def:p[1],ix}));
  const defs=shuffle(q.pairs.map((p,ix)=>({def:p[1],ix})));
  let sel=null,solved=0;const total=q.pairs.length;const wrongAny={v:false};
  const termNodes={},defNodes={};
  terms.forEach(t=>{
    const b=el("div","match-item term",t.term);termNodes[t.ix]=b;
    b.onclick=()=>{if(b.classList.contains("done"))return;
      Object.values(termNodes).forEach(x=>x.classList.remove("sel"));
      sel=t.ix;b.classList.add("sel");};
    left.appendChild(b);
  });
  defs.forEach(d=>{
    const b=el("div","match-item def",d.def);defNodes[d.ix]=b;
    b.onclick=()=>{
      if(sel==null||b.classList.contains("paired"))return;
      if(sel===d.ix){
        termNodes[sel].classList.add("done");termNodes[sel].classList.remove("sel");
        b.classList.add("paired");solved++;sel=null;
        if(solved===total){finish();}
      }else{
        wrongAny.v=true;b.style.borderColor="var(--bad)";setTimeout(()=>b.style.borderColor="",400);
      }
    };
    right.appendChild(b);
  });
  grid.append(left,right);card.appendChild(grid);
  function finish(){
    const correct=!wrongAny.v;
    const box=el("div");
    q.pairs.forEach(p=>{const line=el("div");line.style.margin="4px 0";line.innerHTML=`<b>${escapeHTML(p[0])}:</b> `;line.appendChild(document.createTextNode(p[1]));box.appendChild(line);});
    const sb=el("div","source-box");sb.innerHTML=`<div class="src">Source: ${deckById(R.deck).title} — Slide ${q.slide}</div>`;sb.appendChild(Object.assign(el("div","quote"),{textContent:q.ev}));
    box.appendChild(sb);
    feedback(card,correct,box);advance(correct,"matching");
  }
}
function normalize(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();}

function makeSnippet(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return escapeHTML(text.slice(0,140))+"…";
  const start=Math.max(0,i-50),end=Math.min(text.length,i+q.length+80);
  return (start>0?"…":"")+escapeHTML(text.slice(start,i))+"<mark>"+escapeHTML(text.slice(i,i+q.length))+"</mark>"+escapeHTML(text.slice(i+q.length,end))+(end<text.length?"…":"");
}

/* ============================================================
   QUICK FIND  —  Ctrl/⌘+F launcher, jump straight to a slide.
   Searches every slide's word-for-word content AND its lecture
   transcript, across all weeks, and highlights the term on arrival.
   ============================================================ */
function searchAll(q){
  const ql=q.toLowerCase(),out=[];
  WEEKS.forEach(w=>w.deckIds.forEach((did,pi)=>{
    const d=deckById(did);if(!d)return;
    d.slides.forEach(s=>{
      const blob=s.title+" — "+slideText(s);
      const inContent=blob.toLowerCase().includes(ql);
      const inTr=!!(s.tr&&s.tr.toLowerCase().includes(ql));
      if(!inContent&&!inTr)return;
      out.push({weekId:w.id,weekLabel:w.label,deckId:did,ppt:pi+1,slide:s.n,title:s.title,
        snip:makeSnippet(inContent?blob:s.tr,q),
        source:inContent?(inTr?"slide + transcript":"slide"):"transcript"});
    });
  }));
  return out;
}
let QF=null;
function openQuickFind(prefill){
  if(QF){QF.input.focus();QF.input.select();return;}
  const ov=el("div","qf-overlay");
  const panel=el("div","qf-panel");
  const inrow=el("div","qf-inputrow");
  inrow.innerHTML=`<span class="qf-ico">🔍</span>`;
  const input=el("input","qf-input");input.type="text";input.placeholder="Search every slide & transcript…";input.autocomplete="off";input.spellcheck=false;
  const count=el("span","qf-count");
  const escb=el("button","qf-esc","esc");escb.onclick=closeQuickFind;
  inrow.append(input,count,escb);
  const results=el("div","qf-results");
  const foot=el("div","qf-foot");
  foot.innerHTML=`<span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span><span class="qf-foot-note">searches all weeks — slides + transcripts</span>`;
  panel.append(inrow,results,foot);ov.appendChild(panel);document.body.appendChild(ov);
  ov.addEventListener("mousedown",e=>{if(e.target===ov)closeQuickFind();});
  QF={ov,input,results,count,rows:[],active:-1};
  input.value=prefill||"";
  input.addEventListener("input",renderQF);
  input.addEventListener("keydown",qfKey);
  renderQF();
  setTimeout(()=>{input.focus();input.select();},0);
}
function closeQuickFind(){if(QF){QF.ov.remove();QF=null;}}
function renderQF(){
  const q=QF.input.value.trim();
  QF.results.innerHTML="";QF.rows=[];QF.active=-1;
  if(q.length<2){QF.count.textContent="";QF.results.innerHTML=`<div class="qf-hint">Type at least 2 characters. Results jump you straight to the slide with the word highlighted.</div>`;return;}
  const all=searchAll(q);
  QF.count.textContent=all.length?`${all.length} slide${all.length>1?"s":""}`:"0";
  if(!all.length){QF.results.innerHTML=`<div class="qf-empty">No slides or transcripts match \u201C${escapeHTML(q)}\u201D.</div>`;return;}
  const byWeek={};all.forEach(r=>{(byWeek[r.weekId]=byWeek[r.weekId]||[]).push(r);});
  const cap=80;let shown=0;
  WEEKS.forEach(w=>{
    const rows=byWeek[w.id];if(!rows||!rows.length)return;
    const hd=el("div","qf-week");hd.innerHTML=`<span>${escapeHTML(w.label)}</span><span class="qf-wk-sub">${rows.length}</span>`;QF.results.appendChild(hd);
    rows.forEach(r=>{
      if(shown>=cap)return;
      const row=el("div","qf-row");
      row.innerHTML=`<div class="qf-row-h"><span class="qf-badge">PPT ${r.ppt} · Slide ${r.slide}</span><span class="qf-title">${escapeHTML(r.title)}</span><span class="qf-src ${r.source==="transcript"?"tr":""}">${escapeHTML(r.source)}</span></div><div class="qf-snip">${r.snip}</div>`;
      row._data=r;
      row.addEventListener("mouseenter",()=>setActiveQF(QF.rows.indexOf(row)));
      row.addEventListener("click",()=>openRowQF(r));
      QF.results.appendChild(row);QF.rows.push(row);shown++;
    });
  });
  if(all.length>shown){const m=el("div","qf-more");m.textContent=`+ ${all.length-shown} more — keep typing to narrow`;QF.results.appendChild(m);}
  setActiveQF(0);
}
function setActiveQF(i){
  if(!QF||!QF.rows.length)return;
  QF.active=Math.max(0,Math.min(i,QF.rows.length-1));
  QF.rows.forEach((r,k)=>r.classList.toggle("active",k===QF.active));
  const a=QF.rows[QF.active];if(a)a.scrollIntoView({block:"nearest"});
}
function openRowQF(r){const q=QF.input.value.trim();closeQuickFind();go({view:"review",deck:r.deckId,n:r.slide,hl:q});}
function qfKey(e){
  if(e.key==="ArrowDown"){e.preventDefault();setActiveQF(QF.active+1);}
  else if(e.key==="ArrowUp"){e.preventDefault();setActiveQF(QF.active-1);}
  else if(e.key==="Enter"){e.preventDefault();const a=QF.rows[QF.active];if(a&&a._data)openRowQF(a._data);}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();closeQuickFind();}
}

/* ============================================================

function escapeHTML(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function timeAgo(ts){const d=(Date.now()-ts)/1000;if(d<60)return "just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";}

/* ============================================================
   RECONSTRUCTED DIAGRAMS
   Rebuilt as clean SVG to match the source slides as closely as
   possible: structure, labels, connections and (for the methods
   tree) the representative algorithms named on slides 9-17.
   Inline SVG is styled by the page CSS, so it adapts to dark/light.
   ============================================================ */
function dgWrap(vbW,vbH,inner,uid,caption){
  return `<div class="dg-wrap"><svg class="dg-svg" viewBox="0 0 ${Math.round(vbW)} ${Math.round(vbH)}" preserveAspectRatio="xMidYMid meet" role="img" xmlns="http://www.w3.org/2000/svg">`
    +`<defs><marker id="${uid}" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" class="dg-arrow"/></marker></defs>`
    +inner+`</svg>`+(caption?`<div class="dg-cap">${escapeHTML(caption)}</div>`:"")+`</div>`;
}
function dgWrapText(text,maxChars){
  const words=String(text).split(" ");const lines=[];let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length<=maxChars)cur=(cur+" "+w).trim(); else {if(cur)lines.push(cur);cur=w;} });
  if(cur)lines.push(cur);
  if(lines.length>2){lines[1]=lines.slice(1).join(" ");lines.length=2;}
  return lines;
}
function dgLabel(cx,cy,label,cls,maxChars){
  const lines=dgWrapText(label,maxChars||18);
  if(lines.length<=1)return `<text x="${cx}" y="${cy}" class="dg-t ${cls||''}" text-anchor="middle" dominant-baseline="central">${escapeHTML(label)}</text>`;
  return `<text x="${cx}" y="${cy}" class="dg-t ${cls||''}" text-anchor="middle" dominant-baseline="central">`
    +`<tspan x="${cx}" dy="-0.55em">${escapeHTML(lines[0])}</tspan><tspan x="${cx}" dy="1.15em">${escapeHTML(lines[1])}</tspan></text>`;
}
function dgBox(x,y,w,h,label,boxCls,textCls,maxChars){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" class="dg-box ${boxCls||''}"/>`+dgLabel(x+w/2,y+h/2,label,textCls,maxChars||Math.floor(w/8.2));
}
function dgArrow(x1,y1,x2,y2,uid){return `<line class="dg-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${uid})"/>`;}
function dgCyl(x,y,w,h,label){
  const rx=w/2, ry=9, cx=x+w/2;
  return `<path class="dg-cyl" d="M ${x} ${y+ry} A ${rx} ${ry} 0 0 1 ${x+w} ${y+ry} L ${x+w} ${y+h-ry} A ${rx} ${ry} 0 0 1 ${x} ${y+h-ry} Z"/>`
    +`<ellipse class="dg-cyl-top" cx="${cx}" cy="${y+ry}" rx="${rx}" ry="${ry}"/>`
    +dgLabel(cx, y+h/2+3, label, "", Math.floor(w/7));
}

function dgKDD(){
  const uid="arwkdd";
  const stages=["Problem Specification","Problem Understanding","Data Preprocessing","Data Mining","Evaluation","Results Exploitation"];
  const cylW=122,cylH=80,bw=152,bh=66,gap=26,y=42;
  const cylX=16, cylCy=y+bh/2;
  let inner=dgCyl(cylX,cylCy-cylH/2,cylW,cylH,"Real-world databases");
  const sx0=cylX+cylW+gap;const cx=[];
  stages.forEach((s,i)=>{const sx=sx0+i*(bw+gap);cx.push(sx+bw/2);inner+=dgBox(sx,y,bw,bh,s,"stage","",18);});
  const lastRight=sx0+stages.length*bw+(stages.length-1)*gap;
  const koX=lastRight+gap, koW=152, koH=66;
  inner+=dgBox(koX,y,koW,koH,"Understandable patterns (knowledge)","out","out",18);

function dgEmLoop(){
  const uid="arwem";
  const steps=[["Estimate \u03B8","initial parameters"],["Impute MVs","via regression"],["Refine","update estimates"]];
  const bw=176,bh=70,gap=52,y=24,x0=16;

    if(i>0){const px=x0+(i-1)*(bw+gap)+bw;inner+=dgArrow(px+4,y+bh/2,x-4,y+bh/2,uid);}
  });
  const x3=x0+2*(bw+gap), lastR=x3+bw, firstL=x0, yb=y+bh+34;
  inner+=`<path d="M ${lastR-bw/2} ${y+bh} L ${lastR-bw/2} ${yb} L ${firstL+bw/2} ${yb} L ${firstL+bw/2} ${y+bh}" class="dg-line"/>`;
  inner+=`<polygon points="${firstL+bw/2-5},${y+bh+8} ${firstL+bw/2+5},${y+bh+8} ${firstL+bw/2},${y+bh}" class="dg-arrow"/>`;
  inner+=`<text x="${(firstL+lastR)/2}" y="${yb+16}" class="dg-t sub" text-anchor="middle">repeat until convergence \u2192 best guess for the missing values</text>`;
  const totalW=x0+3*bw+2*gap+x0;
  return dgWrap(totalW,yb+30,inner,uid,"Iterative maximum-likelihood imputation (EM)");
}

/* theme */
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);$("#themeIco").textContent=S.theme==="dark"?"☀":"◑";$("#themeTxt").textContent=S.theme==="dark"?"Light mode":"Dark mode";}

/* mobile */
function closeMobile(){$("#sidebar").classList.remove("open");$("#backdrop").classList.remove("show");}
$("#menuBtn").onclick=()=>{$("#sidebar").classList.toggle("open");$("#backdrop").classList.toggle("show");};
$("#backdrop").onclick=closeMobile;

/* sidebar footer actions + search wiring */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]");if(!b)return;
  const a=b.dataset.nav;
  if(a==="theme"){S.theme=S.theme==="dark"?"light":"dark";save();applyTheme();}
  if(a==="reset"){if(confirm("Reset all study progress? This clears reviewed slides, question history, weak areas, flashcard confidence and test scores.")){S=freshState();save();applyTheme();go({view:"home"});}}
});
let searchT=null;
$("#search").addEventListener("input",e=>{
  const q=e.target.value;clearTimeout(searchT);
  searchT=setTimeout(()=>{if(q.trim().length>=2)go({view:"search",q});else if(R.view==="search")go({view:"home"});},220);
});
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter")go({view:"search",q:e.target.value});});
$("#qfHint").addEventListener("click",()=>openQuickFind($("#search").value.trim()));

/* Quick-find keyboard shortcuts: Ctrl/⌘+F opens, Esc closes, "/" opens */
document.addEventListener("keydown",e=>{
  const typing=/^(input|textarea|select)$/i.test(e.target&&e.target.tagName||"");
  if((e.ctrlKey||e.metaKey)&&(e.key==="f"||e.key==="F")){e.preventDefault();openQuickFind();return;}
  if(e.key==="Escape"&&QF){e.preventDefault();closeQuickFind();return;}
  if(e.key==="/"&&!typing&&!QF&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openQuickFind();}
});

/* boot */
applyTheme();
render();
