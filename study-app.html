 d10:[
  {id:"d10q1",slide:1,topic:"Split-apply-combine",type:"mc",diff:1,q:"The split-apply-combine framework does which sequence?",opts:["split into groups, apply a function, combine results","sort, filter, merge","read, clean, save","train, test, deploy"],a:0,ev:"Data is split into groups, a function is applied to each, and the results are combined into one output."},
  {id:"d10q2",slide:1,topic:"Split-apply-combine",type:"tf",diff:1,q:"When grouping a DataFrame, non-numeric columns are automatically excluded from statistical summaries.",a:true,ev:"Non-numeric columns are excluded from statistical summaries automatically."},
  {id:"d10q3",slide:2,topic:"Iterating",type:"mc",diff:2,q:"Iterating over a GroupBy object yields…",opts:["2-tuples of (group name, chunk of data)","a single DataFrame","only the group names","a list of columns"],a:0,ev:"The GroupBy object yields a sequence of 2-tuples: the group name and its chunk of data."},
  {id:"d10q4",slide:2,topic:"Selecting",type:"tf",diff:2,q:"Grouping first and then selecting a column is faster than selecting the column first and then grouping.",a:false,ev:"The version that gets the data first and then groups is the faster one."},
  {id:"d10q5",slide:3,topic:"Functions & levels",type:"mc",diff:2,q:"When you pass a function to groupby, the function is…",opts:["called once per index value, its return used as the group key","ignored","applied only to the first row","used to sort the data"],a:0,ev:"Any function passed to GroupBy is called once per index value, and the return values become group keys."},
  {id:"d10q6",slide:4,topic:"Optimized methods",type:"mc",diff:1,q:"Optimized built-in GroupBy methods (mean, sum, count) are fast because they…",opts:["bypass Python interpreter loops (run in compiled C)","use more memory","skip the data","require NumPy only"],a:0,ev:"They compute in compiled C and bypass Python interpreter loops."},
  {id:"d10q7",slide:5,topic:"Aggregation",type:"mc",diff:2,q:"To apply several aggregation functions to a grouped column, you…",opts:["pass a list of functions to agg()","call groupby twice","use plot()","set group_keys=False"],a:0,ev:"agg() accepts a list of functions (or string aliases) to apply multiple aggregations."},
  {id:"d10q8",slide:6,topic:"transform",type:"mc",diff:2,q:"groupby(...).transform(func) returns an object that…",opts:["has the exact same shape as the parent group","is always a single number","drops the index","is sorted"],a:0,ev:"transform returns an object of the exact same shape as the parent group, ideal for broadcasting back."},
  {id:"d10q9",slide:7,topic:"apply",type:"mc",diff:2,q:"How do you stop pandas from adding the grouping keys to the result's index?",opts:["group_keys=False","axis=1","sort=False","as_index=None"],a:0,ev:"Passing group_keys=False prevents the hierarchical index behavior."},
  {id:"d10q10",slide:8,topic:"Quantiles",type:"mc",diff:2,q:"Which functions bucket continuous data before grouping?",opts:["pd.cut and pd.qcut","pd.merge and pd.concat","pd.read_csv","pd.pivot"],a:0,ev:"pd.cut and pd.qcut discretize continuous data into bins for group-level analysis."},
  {id:"d10q11",slide:9,topic:"Performance",type:"tf",diff:1,q:"pandas GroupBy is faster than pure Python loops because data sits in contiguous memory blocks.",a:true,ev:"pandas groupby is efficient because vectors and DataFrames are contiguous blocks in memory, not spread around."},
  {id:"d10q12",slide:6,topic:"transform",type:"mc",diff:2,q:"A common use of transform is to…",opts:["add a per-group metric (e.g. group mean) back to the parent DataFrame","delete groups","rename columns","read a file"],a:0,ev:"You can save the transformed per-group result (like a group mean) directly back into the parent DataFrame."}

 d11:[
  {id:"d11q1",slide:1,topic:"Normalization",type:"tf",diff:1,q:"Raw operational attributes are usually good enough for accurate predictive models with no changes.",a:false,ev:"Raw attributes are usually not good enough for accurate predictive models."},
  {id:"d11q2",slide:2,topic:"Normalization",type:"mc",diff:1,q:"New attributes engineered for modeling are usually called…",opts:["modeling or analytic variables","raw attributes","index labels","null values"],a:0,ev:"The new attributes are usually named modeling variables or analytic variables."},
  {id:"d11q3",slide:3,topic:"Normalization",type:"mc",diff:1,q:"Min-max normalization does what?",opts:["scales values into a chosen [min, max] range","gives mean 0 and std 1","divides by a power of ten","ranks the values"],a:0,ev:"Min-max scales all numerical values of an attribute into a specified range."},
  {id:"d11q4",slide:4,topic:"Normalization",type:"mc",diff:2,q:"Z-score normalization produces a distribution with…",opts:["mean 0 and standard deviation 1","values between 0 and 1","only positive values","integer ranks"],a:0,ev:"Z-score normalizes to a new distribution with mean 0 and standard deviation 1."},
  {id:"d11q5",slide:4,topic:"Normalization",type:"mc",diff:2,q:"When is z-score preferred over min-max?",opts:["when the min or max is unknown or the data is noisy","when data is already normal","when there are no numbers","never"],a:0,ev:"If minimum/maximum are unknown or the data is noisy, min-max is infeasible, so z-score is used."},
  {id:"d11q6",slide:6,topic:"Transformation",type:"mc",diff:1,q:"Data transformation is the process of…",opts:["creating new attributes via mathematical formulas","deleting rows","reading files","sorting columns"],a:0,ev:"Transformation creates new attributes, usually combining raw attributes with mathematical formulas."},
  {id:"d11q7",slide:8,topic:"Transformation",type:"mc",diff:2,q:"Quadratic transformations are used mainly to…",opts:["help make the data separable","normalize to [0,1]","remove duplicates","rank the values"],a:0,ev:"Quadratic transformations can help transform data to make it separable."},
  {id:"d11q8",slide:10,topic:"Polynomial",type:"mc",diff:3,q:"When no expert knowledge is available, a transformation f can be approximated by…",opts:["a polynomial via brute search, one degree at a time","deleting the attribute","a single linear scale","a chi-square test"],a:0,ev:"f can be approximated via a polynomial using a brute search, one degree at a time (Weierstrass)."},
  {id:"d11q9",slide:13,topic:"Rank",type:"mc",diff:2,q:"A rank transformation replaces each value with…",opts:["its rank (integers 1 to m)","its z-score","its logarithm","a binary flag"],a:0,ev:"The value is replaced with its rank, giving integers from 1 to m (m = number of instances)."},
  {id:"d11q10",slide:14,topic:"Rank",type:"tf",diff:2,q:"The rank-to-normal-score transformation can be applied separately to the training and test partitions.",a:false,ev:"This transformation cannot be applied separately to the training and test partitions."},
  {id:"d11q11",slide:15,topic:"Box-Cox",type:"mc",diff:2,q:"The Box-Cox transformation aims to make a continuous variable…",opts:["almost normally distributed","strictly between 0 and 1","nominal","integer-valued"],a:0,ev:"Box-Cox transforms a continuous variable into an almost normal distribution."},
  {id:"d11q12",slide:18,topic:"Box-Cox",type:"mc",diff:3,q:"How is the Box-Cox parameter λ chosen?",opts:["iteratively, testing values from −3.0 to 3.0","set to 1 always","from the mean","by a chi-square test"],a:0,ev:"λ is found iteratively, testing values from −3.0 to 3.0 until the result is closest to normal."},
  {id:"d11q13",slide:20,topic:"Histogram",type:"mc",diff:2,q:"To spread the right side of a histogram, you can apply…",opts:["the logarithm, y = log(x)","a power, y = x^g","a rank transform","min-max scaling"],a:0,ev:"Using the logarithm spreads the right side of the histogram; a power transform spreads the left side."},
  {id:"d11q14",slide:22,topic:"Nominal to binary",type:"mc",diff:2,q:"The 1-to-N (one-hot) transformation maps a nominal attribute to N binary attributes where…",opts:["only one is 1 and the rest are 0 per instance","all are 1","values are ranked","values are averaged"],a:0,ev:"Each nominal value becomes a binary attribute; per instance only one is 1 while the rest are 0."},
  {id:"d11q15",slide:23,topic:"Nominal to binary",type:"tf",diff:2,q:"One-hot encoding a nominal attribute with very large cardinality can create a very sparse data set.",a:true,ev:"Large cardinality generates many attributes, producing a very sparse data set with performance problems."},
  {id:"d11q16",slide:25,topic:"Data reduction",type:"mc",diff:2,q:"Which are attribute (dimensionality) reduction techniques?",opts:["Wavelet transforms and PCA","cut and qcut","read_csv and to_csv","mean and median"],a:0,ev:"Well-known attribute reduction techniques include Wavelet transforms and Principal Component Analysis (PCA)."},
  {id:"d11q17",slide:27,topic:"Data reduction",type:"mc",diff:2,q:"Binning/discretization reduces data by…",opts:["converting numerical attributes into nominal ones (lower cardinality)","deleting all rows","adding new columns","normalizing to [0,1]"],a:0,ev:"Binning/discretization converts numerical attributes into nominal ones, drastically reducing cardinality."}

 d12:[
  {id:"d12q1",slide:2,topic:"Introduction",type:"mc",diff:1,q:"A missing value (MV) is best described as…",opts:["a value for an attribute that was not introduced or was lost in recording","always an error in the model","a duplicate record","an outlier"],a:0,ev:"An MV is a value for an attribute that was not introduced or was lost in the recording process."},
  {id:"d12q2",slide:3,topic:"Introduction",type:"mc",diff:2,q:"Which is a problem commonly associated with missing values?",opts:["bias from differences between missing and complete data","faster computation","guaranteed higher accuracy","more records"],a:0,ev:"Problems include loss of efficiency, handling/analysis complications, and bias between missing and complete data."},
  {id:"d12q3",slide:4,topic:"Introduction",type:"mc",diff:2,q:"Which is NOT one of the three broad ways to treat MVs in data mining?",opts:["Encrypting the attributes","Discarding examples/attributes with MVs","Maximum likelihood procedures","Imputation using other attributes"],a:0,ev:"The three ways are discarding, maximum likelihood procedures, and imputation — not encryption."},
  {id:"d12q4",slide:4,topic:"Introduction",type:"tf",diff:2,q:"Imputation works partly because attributes are not independent from each other.",a:true,ev:"Imputation fills MVs with estimated values, exploiting that attributes are not independent from each other."},
  {id:"d12q5",slide:5,topic:"Mechanisms",type:"tf",diff:2,q:"The assumptions we make about the missingness mechanism can affect which treatment method is valid.",a:true,ev:"The assumptions about the missingness mechanism affect which treatment can be correctly applied, if any."},
  {id:"d12q6",slide:7,topic:"Mechanisms",type:"mc",diff:2,q:"In the probability framework, θ represents…",opts:["the parameters of the model that generate the data","the number of missing values","the observed values only","the imputed values"],a:0,ev:"Under the i.i.d. assumption, θ represents the model parameters that yield the data (f is the per-case function)."},
  {id:"d12q7",slide:9,topic:"Mechanisms",type:"mc",diff:2,q:"The data set is split as X = (Xobs, Xmis). What does the indicator matrix B record?",opts:["whether each value is present or absent","the mean of each column","the class labels","the covariance"],a:0,ev:"B is a 0/1 matrix of the same size as X recording whether each value is present or absent."},
  {id:"d12q8",slide:10,topic:"Mechanisms",type:"mc",diff:2,q:"Missing at Random (MAR) means the probability of missingness…",opts:["does not depend on Xmis (depends only on observed data)","depends on the missing value itself","is always zero","depends on nothing at all"],a:0,ev:"Under MAR the missingness distribution does not depend on Xmis — only on observed information."},
  {id:"d12q9",slide:11,topic:"Mechanisms",type:"mc",diff:2,q:"MCAR differs from MAR because MCAR missingness depends on…",opts:["neither the observed nor the unobserved data","only the observed data","only the missing values","the class label"],a:0,ev:"MCAR is a special case of MAR where missingness depends on neither the observed nor the unobserved data."},
  {id:"d12q10",slide:12,topic:"Mechanisms",type:"tf",diff:2,q:"MCAR is more restrictive than MAR.",a:true,ev:"MCAR is more restrictive; MAR only requires MVs to behave like a random sample within observed-data subclasses."},
  {id:"d12q11",slide:12,topic:"Mechanisms",type:"tf",diff:2,q:"Under MCAR, analyzing only the complete cases gives valid inferences (though with some loss of information).",a:true,ev:"Under MCAR, complete-case analysis gives valid inferences, with some loss of information/power."},
  {id:"d12q12",slide:13,topic:"Mechanisms",type:"mc",diff:3,q:"For NMAR data, the only way to get an unbiased estimate is to…",opts:["model the missingness itself","delete all missing rows","use the global mean","ignore the mechanism"],a:0,ev:"NMAR depends on the missing value itself; unbiased estimation requires explicitly modeling the missingness."},
  {id:"d12q13",slide:14,topic:"Simple",type:"tf",diff:1,q:"Simple approaches generally ignore the missingness mechanism and blindly perform the replacement.",a:true,ev:"Simple approaches usually do not take the missingness mechanism into account and blindly perform the operation."},
  {id:"d12q14",slide:16,topic:"Simple",type:"mc",diff:2,q:"Case deletion (ignore missing / IM) does what?",opts:["discards every instance with at least one missing value","replaces MVs with the mean","encodes MVs as a new value","models the missingness"],a:0,ev:"IM/case deletion discards every instance containing at least one MV; valid under MCAR but loses power."},
  {id:"d12q15",slide:17,topic:"Simple",type:"mc",diff:2,q:"A key drawback of mean/mode (MC) substitution when there are many MVs is that…",opts:["the covariance is severely altered","the data set shrinks","records are duplicated","it cannot handle numbers"],a:0,ev:"MC/CMC preserve size but severely alter covariance when the amount of MVs is considerable."},
  {id:"d12q16",slide:17,topic:"Simple",type:"mc",diff:2,q:"CMC differs from MC because CMC uses the mean/mode of…",opts:["only instances with the same class as the reference instance","the entire data set","a random subset","the missing values"],a:0,ev:"CMC (concept mean/most-common) uses the mean or mode of only the instances sharing the reference instance's class."},
  {id:"d12q17",slide:18,topic:"Max likelihood",type:"mc",diff:2,q:"Rubin et al. advised against case deletion mainly because it…",opts:["wastes information","is too slow","requires θ to be known","always biases toward zero"],a:0,ev:"Rubin and colleagues advised against case deletion because it wastes information."},
  {id:"d12q18",slide:19,topic:"Max likelihood",type:"tf",diff:2,q:"Maximum likelihood parameters can be estimated directly for simple one-dimensional cases like a coin toss or a 1-D Gaussian.",a:true,ev:"MLE works analytically for 1-D Bernoulli (coin toss) and 1-D Gaussian (finding μ and σ)."},
  {id:"d12q19",slide:20,topic:"Max likelihood",type:"mc",diff:3,q:"Why is direct likelihood maximization often infeasible for real data?",opts:["too many parameters (e.g. a mixture of 100 100-D Gaussians ≈ 10,000 parameters)","the data is always normal","there are never any MVs","θ is always known"],a:0,ev:"Complex distributions can have thousands of parameters (100 100-D Gaussians ≈ 10,000), so direct maximization is infeasible."},
  {id:"d12q20",slide:21,topic:"Max likelihood",type:"mc",diff:2,q:"Hidden variables are introduced in ML imputation to…",opts:["simplify the likelihood function and account for MVs","delete the missing rows","encode categories as numbers","remove outliers"],a:0,ev:"Hidden variables simplify the likelihood function and help account for the missing values."},
  {id:"d12q21",slide:23,topic:"Max likelihood",type:"mc",diff:2,q:"Which three methods are named for iterative ML-based imputation?",opts:["EM, Multiple Imputation, and Bayesian PCA","KNN, SVM, and k-means","MAR, MCAR, and NMAR","mean, median, and mode"],a:0,ev:"The three named methods are Expectation-Maximization (EM), Multiple Imputation (MI), and Bayesian PCA (BPCA)."}

 d13:[
  {id:"d13q1",slide:2,topic:"ML Imputation Overview",type:"mc",diff:1,q:"According to the slides, the statistical imputation methods from the previous section model the relationship between values by…",opts:["searching for the hidden distribution probabilities", "finding the K nearest neighbors", "inducing a set of decision rules", "training a support vector machine"],a:0,ev:"they model the relationship between the values by searching for the hidden distribution probabilities."},
  {id:"d13q2",slide:2,topic:"ML Imputation Overview",type:"tf",diff:1,q:"In Artificial Intelligence, modeling unknown relationships between attributes has been done using Machine Learning models.",a:true,ev:"In Artificial Intelligence modeling the unknown relationships between attributes … has been done using Machine Learning models."},
  {id:"d13q3",slide:3,topic:"ML Imputation Overview",type:"tf",diff:2,q:"Using ML methods for imputation removes the need for the MAR assumption.",a:false,ev:"… but they are still subject to the MAR assumption in order to correctly apply them."},
  {id:"d13q4",slide:3,topic:"ML Imputation Overview",type:"mc",diff:2,q:"What do ML imputation methods alleviate us from, according to the slides?",opts:["searching for the estimated underlying distribution of the data", "the MAR assumption", "needing any training data", "choosing a distance measure"],a:0,ev:"The use of ML methods for imputation alleviates us from searching for the estimated underlying distribution of the data."},
  {id:"d13q5",slide:4,topic:"KNN Imputation (KNNI / WKNNI)",type:"mc",diff:1,q:"In KNNI, a missing numerical value is replaced by…",opts:["the average value of the K nearest neighbors", "the most common value among the neighbors", "the global mean of the data set", "zero"],a:0,ev:"For numerical values the average value is used."},
  {id:"d13q6",slide:4,topic:"KNN Imputation (KNNI / WKNNI)",type:"mc",diff:1,q:"In KNNI, a missing nominal value is replaced by…",opts:["the most common value among all neighbors", "the average value of the neighbors", "a new ‘unknown’ category", "the class label"],a:0,ev:"For nominal values, the most common value among all neighbors is taken."},
  {id:"d13q7",slide:4,topic:"KNN Imputation (KNNI / WKNNI)",type:"mc",diff:2,q:"Which proximity measure is the most commonly used for KNNI in the literature?",opts:["Euclidean distance (a case of an Lp norm)", "Hamming distance", "Pearson’s correlation coefficient", "Cosine similarity"],a:0,ev:"The Euclidean distance (it is a case of a Lp norm distance) is the most commonly used in the literature."},
  {id:"d13q8",slide:5,topic:"KNN Imputation (KNNI / WKNNI)",type:"mc",diff:2,q:"What distinguishes WKNNI from KNNI?",opts:["the estimate takes into account the different distances to the neighbors", "it uses clusters instead of neighbors", "it trains only on complete instances", "it discretizes continuous attributes"],a:0,ev:"The estimated value now takes into account the different distances to the neighbors."},
  {id:"d13q9",slide:5,topic:"KNN Imputation (KNNI / WKNNI)",type:"tf",diff:2,q:"WKNNI selects its neighbors in the same way KNNI does.",a:true,ev:"The Weighted KNN method selects the instances with similar values as KNNI does."},
  {id:"d13q10",slide:6,topic:"KNN Imputation (KNNI / WKNNI)",type:"tf",diff:3,q:"In WKNNI, if neighbor j is missing attribute h, that neighbor is excluded from the index set I_Kih.",a:true,ev:"… if yjh is missing the jth attribute is excluded from IKih."},
  {id:"d13q11",slide:6,topic:"KNN Imputation (KNNI / WKNNI)",type:"mc",diff:3,q:"In WKNNI, 1/sᵢ = Σ(y_ih − y_jh)². A closer neighbor therefore gets…",opts:["a larger similarity sᵢ and so more weight in the average", "a smaller weight", "zero weight", "the same weight as every other neighbor"],a:0,ev:"The missing entry is estimated as an average weighted by the similarity measure; closer neighbors have greater similarity."},
  {id:"d13q12",slide:7,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:1,q:"In K-means clustering, a cluster centroid represents…",opts:["the mean value of the objects in the cluster", "the median object of the cluster", "the object farthest from the others", "a randomly chosen object"],a:0,ev:"A cluster centroid represents the mean value of the objects in the cluster."},
  {id:"d13q13",slide:7,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:2,q:"K-means measures intra-cluster dissimilarity by…",opts:["adding the distances among the objects and the cluster centroid", "counting the objects in the cluster", "the Hamming distance between centroids", "the membership degrees"],a:0,ev:"K-means measures the intra-cluster dissimilarity by the addition of distances among the objects and the centroid of the cluster."},
  {id:"d13q14",slide:8,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:2,q:"In KMI, once the clusters have converged, how are the MVs replaced?",opts:["same-cluster objects are treated as nearest neighbors and a nearest neighbor algorithm fills them (like KNNI)", "with the global mean of the attribute", "with an SVM classifier", "the incomplete objects are deleted"],a:0,ev:"Data objects that belong to the same cluster are taken to be nearest neighbors of each other, and KMI applies a nearest neighbor algorithm to replace MVs."},
  {id:"d13q15",slide:9,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:1,q:"In FKMI, the membership function U describes…",opts:["the degree to which a data object belongs to a certain cluster", "the distance between two centroids", "the number of clusters", "the class label of the object"],a:0,ev:"Each data object has a membership function U which describes the degree to which this data object belongs to a certain cluster."},
  {id:"d13q16",slide:9,topic:"Clustering Imputation (KMI / FKMI)",type:"tf",diff:2,q:"Continuous membership values make fuzzy clustering more likely to get stuck in a local minimum.",a:false,ev:"Continuous membership values in fuzzy clustering make the resulting algorithms less susceptible to get stuck in a local minimum situation."},
  {id:"d13q17",slide:9,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:2,q:"Why can the original K-means be problematic?",opts:["it may be trapped in a local minimum if the initial points are not selected properly", "it cannot compute centroids", "it only works on nominal data", "it requires a complete matrix"],a:0,ev:"The original K-means clustering may be trapped in a local minimum status if the initial points are not selected properly."},
  {id:"d13q18",slide:10,topic:"Clustering Imputation (KMI / FKMI)",type:"tf",diff:2,q:"In FKMI, the centroids are obtained by the plain mean values of the objects.",a:false,ev:"The centroids are not obtained by the mean values — the membership degree of each object is considered."},
  {id:"d13q19",slide:10,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:2,q:"Which attributes are used to compute the FKMI cluster centroids?",opts:["only reference attributes", "only non-reference attributes", "all attributes, including those with MVs", "only the class attribute"],a:0,ev:"Since there are unavailable data in incomplete objects, we use only reference attributes to compute the cluster centroids."},
  {id:"d13q20",slide:11,topic:"Clustering Imputation (KMI / FKMI)",type:"mc",diff:2,q:"In FKMI, an MV in a non-reference attribute is replaced based on…",opts:["the membership degrees and the centroids", "the most common value in the data set", "a regression against eigenvalues", "the Hamming distance to the nearest sample"],a:0,ev:"We replace attributes with MVs (non-reference attribute) based on the information about membership degrees and the centroids."},
  {id:"d13q21",slide:12,topic:"SVM Imputation (SVMI)",type:"mc",diff:1,q:"If the attribute with MVs is nominal, SVMI acts as…",opts:["an SVM classifier", "an SVM regressor", "a K-means clusterer", "an EM step"],a:0,ev:"If the attribute with MVs is nominal it will act as a SVM classifier."},
  {id:"d13q22",slide:12,topic:"SVM Imputation (SVMI)",type:"tf",diff:1,q:"SVMI uses only the instances without MVs to predict the MV currently being imputed.",a:true,ev:"Only the instances without MVs are used to predict the MV currently being imputed."},
  {id:"d13q23",slide:12,topic:"SVM Imputation (SVMI)",type:"mc",diff:3,q:"In SVMI, the decision attributes (output or classes) are set as…",opts:["the condition attributes (input attributes)", "the missing values", "the similarity weights", "the cluster centroids"],a:0,ev:"It sets the decision attributes (output or classes) as the condition attributes (input attributes) and the condition attributes as the decision attributes."},
  {id:"d13q24",slide:13,topic:"Event Covering (EC)",type:"mc",diff:2,q:"In Event Covering (EC), the mixed-mode probability model is approximated by…",opts:["a discrete one", "a mixture of Gaussians", "a neural network", "a linear regression model"],a:0,ev:"In EC mixed-mode probability model is approximated by a discrete one."},
  {id:"d13q25",slide:13,topic:"Event Covering (EC)",type:"tf",diff:2,q:"EC discretizes the continuous components using a minimum loss of information criterion.",a:true,ev:"We discretize the continuous components using a minimum loss of information criterion."},
  {id:"d13q26",slide:14,topic:"Event Covering (EC)",type:"mc",diff:2,q:"Which is NOT one of EC’s three steps?",opts:["compute the SVD of the data matrix", "detect from data patterns which indicate statistical interdependency", "group the data into clusters based on detected interdependency", "interpret the underlying patterns for each cluster identified"],a:0,ev:"EC consists of 3 steps: detect interdependency patterns, group into clusters, interpret the underlying patterns."},
  {id:"d13q27",slide:15,topic:"Event Covering (EC)",type:"mc",diff:2,q:"Which distance does EC use as the nearest-neighbour distance d(xᵢ, xⱼ)?",opts:["Hamming distance", "Euclidean distance", "Manhattan distance", "Mahalanobis distance"],a:0,ev:"The nearestneighbour distance d(xi, xj) (Hamming distance) of a sample xi to a set of examples S is defined as …"},
  {id:"d13q28",slide:16,topic:"Event Covering (EC)",type:"tf",diff:2,q:"In EC, the larger D*c is, the denser the cluster.",a:false,ev:"The smaller the D∗c, the denser the cluster."},
  {id:"d13q29",slide:16,topic:"Event Covering (EC)",type:"mc",diff:3,q:"In EC, D*c is defined as…",opts:["the maximum within-cluster nearest-neighbour distance", "the minimum distance between two clusters", "the mean probability of the cluster", "the number of samples in the cluster"],a:0,ev:"We define the maximum within-cluster nearest-neighbour distance as D∗c."},
  {id:"d13q30",slide:17,topic:"Event Covering (EC)",type:"mc",diff:2,q:"The EC estimate of P(x) is known as the…",opts:["dependence tree product approximation", "maximum likelihood estimate", "Bayesian posterior", "kernel density estimate"],a:0,ev:"An estimation of P(x) known as the dependence tree product approximation …"},
  {id:"d13q31",slide:17,topic:"Event Covering (EC)",type:"tf",diff:2,q:"In EC, isolated samples can be detected by observing wide gaps in the nearest neighbour distance space.",a:true,ev:"… the isolated samples can be easily detected by observing the wide gaps in the nearest neighbour distance space."},
  {id:"d13q32",slide:18,topic:"Event Covering (EC)",type:"mc",diff:2,q:"Which samples does EC consider first for cluster initiation?",opts:["samples above the mean probability", "samples below the mean probability", "isolated samples", "randomly chosen samples"],a:0,ev:"Samples above the mean will be considered first for cluster initiation."},
  {id:"d13q33",slide:18,topic:"Event Covering (EC)",type:"tf",diff:3,q:"The dependence tree product approximation is the best second-order approximation of the high-order probability distribution.",a:true,ev:"The probability defined above is known to be the best second-order approximation of the high-order probability distribution."},
  {id:"d13q34",slide:19,topic:"Event Covering (EC)",type:"mc",diff:2,q:"In EC, if D(x,Cₖ) ≤ D* for more than one cluster Cₖ, then…",opts:["all these clusters can be merged together", "x joins only the closest cluster", "x is discarded", "a new cluster is created for x"],a:0,ev:"If there exists more than one cluster … such that D(x,Ck) ≤ D∗ for all k, then all these clusters can be merged together."},
  {id:"d13q35",slide:19,topic:"Event Covering (EC)",type:"tf",diff:2,q:"If D(x,Cₖ) > D* for all clusters Cₖ, then x may not belong to any cluster.",a:true,ev:"If D(x,Ck) > D∗ for all clusters Ck, then x may not belong to any cluster."},
  {id:"d13q36",slide:20,topic:"SVD Imputation (SVDI)",type:"mc",diff:2,q:"SVDI employs singular value decomposition to obtain…",opts:["a set of mutually orthogonal expression patterns", "the K nearest neighbors", "fuzzy membership degrees", "a discrete probability model"],a:0,ev:"We employ singular value decomposition to obtain a set of mutually orthogonal expression patterns that can be linearly combined …"},
  {id:"d13q37",slide:21,topic:"SVD Imputation (SVDI)",type:"tf",diff:2,q:"In SVDI, the exact fraction of eigenvalues best for estimation is fixed in advance by theory.",a:false,ev:"The exact fraction of eigenvalues best for estimation needs to be determined empirically."},
  {id:"d13q38",slide:21,topic:"SVD Imputation (SVDI)",type:"mc",diff:3,q:"In SVDI, the contribution of each pattern is quantified by…",opts:["the corresponding eigenvalues on the diagonal of matrix Σ", "the membership function U", "the Hamming distance", "Pearson’s correlation coefficient"],a:0,ev:"… quantified by corresponding eigenvalues on the diagonal of matrix Σ."},
  {id:"d13q39",slide:22,topic:"SVD Imputation (SVDI)",type:"tf",diff:3,q:"In SVDI, the jth value of example i is used to determine the regression coefficients.",a:false,ev:"The jth value of example i and the jth values of the k eigenvalues are not used in determining these regression coefficients."},
  {id:"d13q40",slide:23,topic:"SVD Imputation (SVDI)",type:"mc",diff:2,q:"Because SVD can only be performed on complete matrices, the slides suggest first…",opts:["applying EM to complete the matrix", "deleting every incomplete row", "applying KNNI to every column", "discretizing the data"],a:0,ev:"A good approximation is to first apply EM to complete the matrix in order to obtain the eigenvectors and eigenvalues."},
  {id:"d13q41",slide:24,topic:"Local Least Squares (LLSI)",type:"mc",diff:1,q:"In LLSI, a target instance that has MVs is represented as…",opts:["a linear combination of similar instances", "the centroid of its cluster", "a discrete event", "the mean of all instances"],a:0,ev:"A target instance that has MVs is represented as a linear combination of similar instances."},
  {id:"d13q42",slide:24,topic:"Local Least Squares (LLSI)",type:"tf",diff:1,q:"LLSI uses all available instances in the data to impute.",a:false,ev:"Rather than using all available instances in the data, only similar instances based on a similarity measure are used."},
  {id:"d13q43",slide:25,topic:"Local Least Squares (LLSI)",type:"mc",diff:2,q:"LLSI selects its k instances using…",opts:["the L2-norm", "the Hamming distance", "fuzzy membership values", "the eigenvalues"],a:0,ev:"To select k instances by the L2-norm."},
  {id:"d13q44",slide:25,topic:"Local Least Squares (LLSI)",type:"mc",diff:3,q:"The heuristic k parameter selection used by the LLSI authors is based on…",opts:["Pearson’s correlation coefficient", "the Hamming distance", "the mean probability", "the singular values"],a:0,ev:"A heuristic k parameter selection method is used by the authors based on Pearson’s correlation coefficient."},
  {id:"d13q45",slide:26,topic:"Local Least Squares (LLSI)",type:"mc",diff:3,q:"In the LLSI least squares problem, the k rows of matrix A consist of…",opts:["the KNN instances, without the attribute with missing values", "all instances in the data set", "the cluster centroids", "the eigenvalues from Vᵀ"],a:0,ev:"The k rows of the matrix A consist of the KNN instances, without the attribute with missing values."},
  {id:"d13q46",slide:27,topic:"Local Least Squares (LLSI)",type:"mc",diff:2,q:"In α = bᵀ(Aᵀ)†w, the symbol (Aᵀ)† denotes…",opts:["the pseudoinverse of Aᵀ", "the transpose of A", "the inverse of the similarity matrix", "the membership matrix"],a:0,ev:"where (AT)† is the pseudoinverse of AT."},
  {id:"d13q47",slide:28,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"On the recent-approaches slide, Random Forest is grouped under which paradigm?",opts:["Ensembles", "Clustering", "ANNs", "Nearest neighbors"],a:0,ev:"Ensembles: Random Forest, Decision forest, GMDH."},
  {id:"d13q48",slide:28,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"FIMUS is listed under which paradigm?",opts:["Similarity and correlation", "Bayesian networks", "Ensembles", "ANNs"],a:0,ev:"Similarity and correlation: FIMUS."},
  {id:"d13q49",slide:29,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"Analyzing the imputed values as possible noise, which methods are the least disturbing?",opts:["CMC and EC", "KNNI and SVMI", "MC and IM", "SVDI and LLSI"],a:0,ev:"If we analyze the imputed values as possible noise, CMC and EC are the less disturbing ones."},
  {id:"d13q50",slide:29,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"Techniques that produce a set of rules as a model benefit more from…",opts:["FKMI, EC and SVMI", "CMC and MC", "EC and KMI", "KNNI and WKNNI"],a:0,ev:"Those techniques that produce a set of rules as a model benefit more from FKMI, EC and SVMI."},
  {id:"d13q51",slide:29,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"For black box classifiers, which imputation methods are more appropriate?",opts:["EC and KMI", "FKMI and SVMI", "CMC and MC", "DNI and IM"],a:0,ev:"For black box classifiers, EC and KMI are more appropriate."},
  {id:"d13q52",slide:29,topic:"Recent Approaches & Comparison",type:"mc",diff:2,q:"Lazy learning methods take advantage of CMC and MC because…",opts:["they disturb the distance calculation the least", "they are the fastest to compute", "they produce rules", "they preserve the covariance"],a:0,ev:"Lazy learning methods take advantage of CMC and MC, as they disturb the distance calculation the least."},
  {id:"d13q53",slide:29,topic:"Recent Approaches & Comparison",type:"tf",diff:1,q:"Not imputing or deleting instances with MVs is recommended.",a:false,ev:"Not imputing or deleting instances with MVs are not recommended."},
  {id:"d13q54",slide:29,topic:"Recent Approaches & Comparison",type:"tf",diff:1,q:"There is a universal imputation method which performs best for all classifiers.",a:false,ev:"There is no universal imputation method which performs best for all classifiers."},
  {id:"d13q55",slide:29,topic:"Recent Approaches & Comparison",type:"tf",diff:2,q:"EC and CMC better maintain the mutual information between the imputed values and the class label.",a:true,ev:"EC and CMC are able to better maintain the mutual information between the imputed values and the class label."}

 d14:[
  {id:"d14q1",slide:2,topic:"Introduction",type:"mc",diff:1,q:"According to the slides, the performance of models built from noisy data heavily depends on…",opts:["the quality of the training data", "the number of classes", "the choice of programming language", "the size of the test set"],a:0,ev:"The performance of the models built under such circumstances will heavily depend on the quality of the training data."},
  {id:"d14q2",slide:2,topic:"Introduction",type:"tf",diff:1,q:"Problems containing noise are complex, and accurate solutions are often difficult to achieve without specialized techniques.",a:true,ev:"Problems containing noise are complex problems and accurate solutions are often difficult to achieve without using specialized techniques."},
  {id:"d14q3",slide:3,topic:"Identifying Noise",type:"mc",diff:2,q:"Which is NOT listed as an effect noise can have on a classification problem?",opts:["it makes the data set larger", "it creates small clusters of one class in another class’s space", "it removes instances in key areas of a class", "it disrupts class boundaries and increases overlapping"],a:0,ev:"Noise may create small clusters…, remove instances located in key areas…, disrupt the boundaries of the classes and increase overlapping among them."},
  {id:"d14q4",slide:4,topic:"Identifying Noise",type:"mc",diff:2,q:"Why is noise specially relevant in supervised problems?",opts:["it alters the relationship between the informative features and the measure output", "it deletes the class labels", "it only affects unsupervised clustering", "it makes training faster"],a:0,ev:"Noise is specially relevant in supervised problems, where it alters the relationship between the informative features and the measure output."},
  {id:"d14q5",slide:4,topic:"Identifying Noise",type:"mc",diff:1,q:"Robustness is the capability of an algorithm to…",opts:["build models that are insensitive to data corruptions", "reach 100% accuracy on clean data", "remove all noisy instances", "train without labels"],a:0,ev:"Robustness is the capability of an algorithm to build models that are insensitive to data corruptions and suffer less from the impact of noise."},
  {id:"d14q6",slide:4,topic:"Identifying Noise",type:"tf",diff:2,q:"The more robust an algorithm is, the more similar the models built from clean and noisy data are.",a:true,ev:"The more robust an algorithm is, the more similar the models built from clean and noisy data are."},
  {id:"d14q7",slide:5,topic:"Identifying Noise",type:"tf",diff:2,q:"When dealing with noisy data, raw performance results are considered more important than robustness.",a:false,ev:"Robustness is considered more important than performance results when dealing with noisy data."},
  {id:"d14q8",slide:6,topic:"Identifying Noise",type:"mc",diff:1,q:"Which algorithm is given as an example of a robust learner?",opts:["C4.5", "k-means", "Naive Bayes", "Apriori"],a:0,ev:"An example of a robust learner is the C4.5 algorithm."},
  {id:"d14q9",slide:6,topic:"Identifying Noise",type:"mc",diff:2,q:"Data polishing methods aim to…",opts:["correct noisy instances prior to training a learner", "eliminate noisy instances from the training data", "be less influenced by noisy data", "generate synthetic noise"],a:0,ev:"Data polishing methods. Their aim is to correct noisy instances prior to training a learner."},
  {id:"d14q10",slide:6,topic:"Identifying Noise",type:"mc",diff:2,q:"Noise filters…",opts:["identify noisy instances which can be eliminated from the training data", "correct noisy instances before training", "are learners that ignore noise", "add Gaussian noise to attributes"],a:0,ev:"Noise filters identify noisy instances which can be eliminated from the training data."},
  {id:"d14q11",slide:7,topic:"Identifying Noise",type:"tf",diff:1,q:"Noise is the only problem that supervised ML techniques have to deal with.",a:false,ev:"Noise is not the only problem that supervised ML techniques have to deal with."},
  {id:"d14q12",slide:7,topic:"Identifying Noise",type:"mc",diff:2,q:"Which two issues are listed as related to the degradation of performance?",opts:["presence of small disjuncts and overlapping between classes", "missing values and duplicates", "too many attributes and too few classes", "normalization and discretization"],a:0,ev:"Relevant issues related to the degradation of performance: Presence of small disjuncts; Overlapping between classes."},
  {id:"d14q13",slide:7,topic:"Identifying Noise",type:"mc",diff:3,q:"Why are complex and nonlinear class boundaries a problem for noise detection?",opts:["it is often hard to distinguish such overlapping from the presence of noisy examples", "they always contain missing values", "they make classifiers faster", "they cannot be plotted"],a:0,ev:"it often is hard to distinguish between such overlapping and the presence of noisy examples"},
  {id:"d14q14",slide:9,topic:"Identifying Noise",type:"mc",diff:2,q:"Examples located in the area surrounding class boundaries are called…",opts:["borderline examples", "safe examples", "noisy examples", "small disjuncts"],a:0,ev:"the higher or lower presence of examples located in the area surrounding class boundaries, which are called borderline examples"},
  {id:"d14q15",slide:9,topic:"Identifying Noise",type:"tf",diff:2,q:"Misclassification often occurs near class boundaries, where overlapping usually occurs.",a:true,ev:"Misclassification often occurs near class boundaries where overlapping usually occurs."},
  {id:"d14q16",slide:9,topic:"Identifying Noise",type:"mc",diff:3,q:"Classifier performance degradation was strongly affected by the quantity of borderline examples and…",opts:["the presence of other noisy examples located farther outside the overlapping region", "the number of attributes", "the choice of distance metric", "the size of the test set"],a:0,ev:"the quantity of borderline examples; the presence of other noisy examples located farther outside the overlapping region"},
  {id:"d14q17",slide:10,topic:"Identifying Noise",type:"mc",diff:1,q:"Safe examples are placed…",opts:["in relatively homogeneous areas with respect to the class label", "in the area surrounding class boundaries", "in the safe areas of the other class", "outside the data range"],a:0,ev:"Safe examples are placed in relatively homogeneous areas with respect to the class label."},
  {id:"d14q18",slide:10,topic:"Identifying Noise",type:"mc",diff:1,q:"Noisy examples are…",opts:["individuals from one class occurring in the safe areas of the other class", "examples on the class boundary", "examples in homogeneous areas of their own class", "examples with missing values"],a:0,ev:"Noisy examples are individuals from one class occurring in the safe areas of the other class."},
  {id:"d14q19",slide:11,topic:"Identifying Noise",type:"tf",diff:2,q:"Borderline examples should always be removed because they are noise.",a:false,ev:"Lecture: borderline examples are not necessarily noise — removing such examples indiscriminately may actually hurt the classifier's performance."},
  {id:"d14q20",slide:12,topic:"Types of Noise",type:"mc",diff:2,q:"Which two components directly influence the quality of a data set?",opts:["the class labels and the attribute values", "the file format and the encoding", "the number of rows and columns", "the classifier and the test set"],a:0,ev:"Among them, the class labels and the attribute values directly influence such a quality."},
  {id:"d14q21",slide:13,topic:"Types of Noise",type:"mc",diff:1,q:"Class noise (label noise) occurs when…",opts:["an example is incorrectly labeled", "an attribute value is corrupted", "an attribute is missing", "a sensor reading is out of range"],a:0,ev:"Class noise (also referred as label noise) occurs when an example is incorrectly labeled."},
  {id:"d14q22",slide:13,topic:"Types of Noise",type:"mc",diff:2,q:"Which are the two types of class noise?",opts:["contradictory examples and misclassifications", "erroneous and missing attribute values", "uniform and Gaussian noise", "NCAR and NAR"],a:0,ev:"Two types of class noise can be distinguished: Contradictory examples; Misclassifications."},
  {id:"d14q23",slide:13,topic:"Types of Noise",type:"tf",diff:2,q:"Missing or unknown attribute values and “do not care” values are forms of attribute noise.",a:true,ev:"Attribute noise refers to corruptions in the values of one or more attributes … missing or unknown attribute values, and incomplete attributes or “do not care” values"},
  {id:"d14q24",slide:14,topic:"Types of Noise",type:"tf",diff:1,q:"Attribute noise is more harmful than class noise.",a:true,ev:"Attribute noise is more harmful than class noise."},
  {id:"d14q25",slide:14,topic:"Types of Noise",type:"mc",diff:2,q:"Attribute noise is most harmful in attributes that are…",opts:["highly correlated with the class labels", "uncorrelated with the class", "categorical", "normalized"],a:0,ev:"Attribute noise is more harmful in those attributes highly correlated with the class labels."},
  {id:"d14q26",slide:14,topic:"Types of Noise",type:"tf",diff:2,q:"Most of the works in the literature focus on attribute noise.",a:false,ev:"Most of the works found in the literature are only focused on class noise."},
  {id:"d14q27",slide:15,topic:"Noise Introduction Mechanisms",type:"mc",diff:2,q:"How many statistical models for label noise do the authors distinguish?",opts:["three", "two", "four", "six"],a:0,ev:"Authors distinguish between three possible statistical models for label noise."},
  {id:"d14q28",slide:16,topic:"Noise Introduction Mechanisms",type:"mc",diff:1,q:"Label noise that depends on neither the true class Y nor the input attributes X is called…",opts:["NCAR (noise completely at random)", "NAR (noise at random)", "NNAR (noisy not at random)", "MCAR"],a:0,ev:"… not dependent of either the true value of the class Y or the input attribute values X, the label noise is called noise completely at random or NCAR"},
  {id:"d14q29",slide:17,topic:"Noise Introduction Mechanisms",type:"mc",diff:2,q:"In the NAR model, the noise is…",opts:["independent of the inputs X, but the true class makes it more or less prone to be noisy", "dependent on the input attributes X", "completely independent of everything", "only present in attributes"],a:0,ev:"Although the noise is independent of the inputs X, the true value of the class make it more or less prone to be noisy."},
  {id:"d14q30",slide:17,topic:"Noise Introduction Mechanisms",type:"mc",diff:3,q:"Which example of asymmetric labeling error is given for NAR?",opts:["medical case-control studies", "image compression", "sensor drift", "web crawling"],a:0,ev:"… as for example in medical case-control studies, financial score assets and so on"},
  {id:"d14q31",slide:18,topic:"Noise Introduction Mechanisms",type:"mc",diff:2,q:"In NNAR, what affects the probability of the class label being erroneous?",opts:["the input attributes", "nothing — it is purely random", "only the number of classes", "only the test set"],a:0,ev:"… noisy not at random (NNAR), where the input attributes somehow affect the probability of the class label being erroneous."},
  {id:"d14q32",slide:18,topic:"Noise Introduction Mechanisms",type:"tf",diff:2,q:"NNAR is the most general case of class noise.",a:true,ev:"NNAR model is the more general case of class noise."},
  {id:"d14q33",slide:19,topic:"Noise Introduction Mechanisms",type:"mc",diff:3,q:"For attribute noise, which model applies when the noise depends on the attribute’s true value but not on the other inputs or the class label?",opts:["NAR", "NCAR", "NNAR", "MAR"],a:0,ev:"When the attribute noise depends on the true value but not on the rest of input values or the observed class label y the NAR model is applicable."},
  {id:"d14q34",slide:19,topic:"Noise Introduction Mechanisms",type:"mc",diff:3,q:"For attribute noise, NNAR means the noise probability depends on…",opts:["the value of the feature and also the rest of the input feature values", "nothing", "only the class label", "only the feature’s own value"],a:0,ev:"In the last case (NNAR) the noise probability will depend on the value of the feature but also on the rest of the input feature values."},
  {id:"d14q35",slide:20,topic:"Simulating Noise",type:"mc",diff:2,q:"Which is NOT one of the three characteristics of noise generation?",opts:["the classifier used", "the place where the noise is introduced", "the noise distribution", "the magnitude of generated noise values"],a:0,ev:"Noise generation can be characterized by: the place where the noise is introduced; the noise distribution; the magnitude of generated noise values."},
  {id:"d14q36",slide:21,topic:"Simulating Noise",type:"mc",diff:2,q:"The pairwise class noise scheme labels…",opts:["examples of the majority class with the second majority class", "examples with a random class label", "attribute values with Gaussian noise", "minority examples as majority"],a:0,ev:"a pairwise class noise scheme (labeling examples of the majority class with the second majority class)"},
  {id:"d14q37",slide:21,topic:"Simulating Noise",type:"mc",diff:2,q:"Which attribute-noise scheme is used when the noise is a low variation with respect to the correct value?",opts:["Gaussian attribute noise", "uniform attribute noise", "pairwise noise", "uniform class noise"],a:0,ev:"… the Gaussian attribute noise scheme if noise is a low variation with respect to the correct value"},
  {id:"d14q38",slide:21,topic:"Simulating Noise",type:"tf",diff:2,q:"Class and attribute noise are modeled using four different noise schemes.",a:true,ev:"The two types of noise considered, class and attribute noise, have been modeled using four different noise schemes."},
  {id:"d14q39",slide:22,topic:"Simulating Noise",type:"mc",diff:2,q:"How is robustness measured experimentally?",opts:["compare classifiers learned on the original data with those learned on the noisy data", "measure training time", "count the noisy instances removed", "compare two different data sets"],a:0,ev:"compare the performance of the classifiers learned with the original (without induced noise) data set with the performance of the classifiers learned using the noisy data set"},
  {id:"d14q40",slide:22,topic:"Simulating Noise",type:"tf",diff:2,q:"The most robust classifiers are those whose noisy-data results are most similar to the noise-free classifiers.",a:true,ev:"Those classifiers learned from noisy data sets being more similar (in terms of results) to the noise free classifiers will be the most robust ones."},
  {id:"d14q41",slide:23,topic:"Noise Filtering",type:"mc",diff:1,q:"Noise filters are…",opts:["preprocessing mechanisms to detect and eliminate noisy instances in the training set", "learners that tolerate noise", "post-processing steps on predictions", "methods to correct attribute values"],a:0,ev:"Noise filters are preprocessing mechanisms to detect and eliminate noisy instances in the training set."},
  {id:"d14q42",slide:23,topic:"Noise Filtering",type:"mc",diff:2,q:"What is the advantage of separating noise detection and learning?",opts:["noisy instances do not influence the classifier building design", "training data is never reduced", "it removes attribute noise perfectly", "no voting is needed"],a:0,ev:"The separation of noise detection and learning has the advantage that noisy instances do not influence the classifier building design."},
  {id:"d14q43",slide:24,topic:"Noise Filtering",type:"tf",diff:2,q:"Eliminating instances with attribute noise is generally recommended.",a:false,ev:"The elimination of instances with attribute noise seems counterproductive."},
  {id:"d14q44",slide:24,topic:"Noise Filtering",type:"mc",diff:2,q:"Why is eliminating instances with attribute noise counterproductive?",opts:["they still contain valuable information in other attributes", "they are always true exceptions", "they never affect the classifier", "they are too few to matter"],a:0,ev:"Instances with attribute noise still contain valuable information in other attributes which can help to build the classifier."},
  {id:"d14q45",slide:25,topic:"Noise Filtering",type:"mc",diff:2,q:"The three noise filters considered in the chapter are…",opts:["ensemble-based and vote-based", "single-model and threshold-based", "graph-based", "nearest-neighbor based"],a:0,ev:"It should be noted that these three methods are ensemble-based and vote-based filters."},
  {id:"d14q46",slide:26,topic:"Noise Filtering",type:"mc",diff:2,q:"Which learners did the authors of the Ensemble Filter originally propose?",opts:["C4.5, 1-NN and LDA", "SVM, MLP and Naive Bayes", "k-means, EM and PCA", "bagging, boosting and stacking"],a:0,ev:"The authors originally proposed the use of C4.5, 1-NN and LDA."},
  {id:"d14q47",slide:27,topic:"Noise Filtering",type:"mc",diff:3,q:"Which voting scheme does EF use in the book’s experimentation?",opts:["consensus", "majority", "weighted", "random"],a:0,ev:"We use a consensus vote scheme in this case."},
  {id:"d14q48",slide:27,topic:"Noise Filtering",type:"mc",diff:3,q:"In EF, each filter algorithm tags the instances in…",opts:["the excluded part", "the whole training set", "the test set", "a random sample"],a:0,ev:"These Γ resulting classifiers are then used to tag each instance in the excluded part as either correct or mislabeled."},
  {id:"d14q49",slide:28,topic:"Noise Filtering",type:"mc",diff:2,q:"CVCF splits the training data by performing…",opts:["a Γ-FCV (cross-validation)", "a bootstrap", "a single holdout split", "clustering"],a:0,ev:"The Cross-Validated Committees Filter (CVCF) is mainly based on performing an Γ -FCV to split the full training data."},
  {id:"d14q50",slide:29,topic:"Noise Filtering",type:"mc",diff:3,q:"Which voting scheme does CVCF use in the book’s experimentation?",opts:["majority", "consensus", "unanimous", "weighted"],a:0,ev:"Add to D_N the noisy instances identified in D_T using a voting scheme (the majority scheme in our experimentation)."},
  {id:"d14q51",slide:30,topic:"Noise Filtering",type:"mc",diff:2,q:"IPF stops iterating when…",opts:["the number of identified noisy instances is less than a percentage p of the original training set", "all instances are removed", "C4.5 reaches 100% accuracy", "a fixed 10 iterations are done"],a:0,ev:"IPF removes noisy instances in multiple iterations until the number of identified noisy instances in each of these iterations is less than a percentage p of the size of the original training data set."},

 d17:[
  {id:"d17q1",slide:2,topic:"Overview",type:"mc",diff:1,q:"What is the goal of data reduction?",opts:["produce the same (or almost the same) mining outcome from reduced data", "delete all noisy records", "increase the number of attributes", "encrypt the data set"],a:0,ev:"The goal is to provide the mining process with a mechanism to produce the same (or almost the same) outcome when it is applied over reduced data instead of the original data."},
  {id:"d17q2",slide:3,topic:"Overview",type:"mc",diff:1,q:"Which data reduction family reduces the number of attributes?",opts:["Dimensionality Reduction", "Sample Numerosity Reduction", "Cardinality Reduction", "Data Squashing"],a:0,ev:"Dimensionality Reduction: ensures the reduction of the number of attributes or random variables in the data set."},
  {id:"d17q3",slide:3,topic:"Overview",type:"mc",diff:2,q:"Which family replaces the original data by a smaller alternative data representation (fewer rows)?",opts:["Sample Numerosity Reduction", "Dimensionality Reduction", "Cardinality Reduction", "Feature Selection"],a:0,ev:"Sample Numerosity Reduction: replaces the original data by an alternative smaller data representation"},
  {id:"d17q4",slide:3,topic:"Overview",type:"mc",diff:2,q:"Cardinality reduction reduces…",opts:["the number of possible values a variable can take", "the number of rows", "the number of attributes", "the number of clusters"],a:0,ev:"Cardinality Reduction: transformations applied to obtain a reduced representation of the original data (lecture: reduces the number of possible values a variable can take)."},
  {id:"d17q5",slide:3,topic:"Overview",type:"tf",diff:1,q:"Data reduction techniques are usually categorized into three main families.",a:true,ev:"Data Reduction techniques are usually categorized into three main families"},
  {id:"d17q6",slide:4,topic:"Curse of Dimensionality",type:"mc",diff:2,q:"As the number of dimensions increases, the sample size needed to estimate multivariate densities grows…",opts:["exponentially", "linearly", "logarithmically", "not at all"],a:0,ev:"… the sample size needs to increase exponentially in order to have an effective estimate of multivariate densities."},
  {id:"d17q7",slide:4,topic:"Curse of Dimensionality",type:"tf",diff:2,q:"Dimensionality becomes a serious obstacle for the efficiency of most DM algorithms.",a:true,ev:"Dimensionality becomes a serious obstacle for the efficiency of most of the DM algorithms."},
  {id:"d17q8",slide:5,topic:"Curse of Dimensionality",type:"mc",diff:2,q:"Which is a NONLINEAR dimension reducer?",opts:["ISOMAP", "Principal Components Analysis", "Factor analysis", "MultiDimensional Scaling"],a:0,ev:"Nonlinear methods: Locally Linear Embedding; ISOMAP"},
  {id:"d17q9",slide:5,topic:"Curse of Dimensionality",type:"mc",diff:2,q:"Which is NOT listed as a linear dimension reducer?",opts:["Locally Linear Embedding", "Factor analysis", "MultiDimensional Scaling", "Principal Components Analysis"],a:0,ev:"Linear methods: Factor analysis, MultiDimensional Scaling, Principal Components Analysis"},
  {id:"d17q10",slide:6,topic:"Curse of Dimensionality",type:"mc",diff:1,q:"Feature selection methods aim to…",opts:["eliminate irrelevant and redundant features", "create new composite variables", "add synthetic attributes", "discretize continuous variables"],a:0,ev:"Feature Selection methods are aimed at eliminating irrelevant and redundant features, reducing the number of variables in the model."},
  {id:"d17q11",slide:6,topic:"Curse of Dimensionality",type:"mc",diff:3,q:"In the feature selection optimization problem, what is J?",opts:["the criterion function", "the original set of features", "the subset of features", "the minimum number of features"],a:0,ev:"J(B) → criterion function; A → Original set of Features; Z → Subset of Features; d → minimum nº features"},
  {id:"d17q12",slide:7,topic:"PCA",type:"mc",diff:1,q:"PCA creates…",opts:["new variables (principal components) that are linear transformations of the originals", "a subset of the original variables", "clusters of observations", "discrete bins"],a:0,ev:"Find a set of linear transformations of the original variables which could describe most of the variance using a relatively fewer number of variables."},
  {id:"d17q13",slide:7,topic:"PCA",type:"mc",diff:2,q:"It is usual to keep principal components that contain what share of the variance?",opts:["95% or more", "50%", "10%", "exactly 100%"],a:0,ev:"It is usual to keep only the first few principal components that may contain 95% or more of the variance of the original data set."},
  {id:"d17q14",slide:7,topic:"PCA",type:"tf",diff:2,q:"PCA is useful when there are too many independent variables and they show high correlation.",a:true,ev:"PCA is useful when there are too many independent variables and they show high correlation."},
  {id:"d17q15",slide:8,topic:"PCA",type:"mc",diff:1,q:"What is the FIRST step of the PCA procedure?",opts:["Normalize input data", "Compute k orthonormal vectors", "Sort the PCs by eigenvalues", "Remove weaker components"],a:0,ev:"Procedure: Normalize input data. → Compute k orthonormal vectors → Sort the PCs → Reduce data"},
  {id:"d17q16",slide:8,topic:"PCA",type:"mc",diff:2,q:"PCs are sorted by their strength, given by their…",opts:["eigenvalues", "means", "cluster sizes", "p-values"],a:0,ev:"Sort the PCs according to their strength, given by their eigenvalues."},
  {id:"d17q17",slide:8,topic:"PCA",type:"mc",diff:2,q:"What is the LAST step of the PCA procedure?",opts:["Reduce data by removing weaker components", "Normalize input data", "Compute principal components", "Discretize the attributes"],a:0,ev:"Reduce data by removing weaker components."},
  {id:"d17q18",slide:9,topic:"PCA",type:"mc",diff:2,q:"In the PCA figure, X′ and Y′ are…",opts:["the first two principal components obtained", "the original axes", "cluster centroids", "factor loadings"],a:0,ev:"PCA. X′ and Y′ are the first two principal components obtained"},
  {id:"d17q19",slide:10,topic:"Factor Analysis, MDS & LLE",type:"mc",diff:2,q:"How does factor analysis differ from PCA?",opts:["it seeks hidden factors in the variables rather than transformations of the attributes", "it increases dimensionality", "it only works on categorical data", "it samples rows"],a:0,ev:"Different because it does not seek to find transformations for the given attributes. Instead, its goal is to discover hidden factors in the current variables."},
  {id:"d17q20",slide:11,topic:"Factor Analysis, MDS & LLE",type:"mc",diff:3,q:"In the factor analysis equation A − μ = LF + ε, L represents…",opts:["the loadings", "the factors", "the mean", "the attributes"],a:0,ev:"… find the set of factors F and the associated loadings L"},
  {id:"d17q21",slide:11,topic:"Factor Analysis, MDS & LLE",type:"tf",diff:2,q:"In factor analysis, F is the set of factors and μ is the mean of the attributes A.",a:true,ev:"given the attributes A, along with the mean μ, we endeavor to find the set of factors F and the associated loadings L"},
  {id:"d17q22",slide:13,topic:"Factor Analysis, MDS & LLE",type:"mc",diff:2,q:"MultiDimensional Scaling tries to preserve…",opts:["the distances between pairs of points", "the class proportions", "the variance of each attribute", "the number of clusters"],a:0,ev:"… a classical distance measure (like Euclidean) between them is as close as possible to each pair of points."},
  {id:"d17q23",slide:13,topic:"Factor Analysis, MDS & LLE",type:"mc",diff:2,q:"What does MDS take as its input before projecting to lower dimensions?",opts:["a distance matrix computed in the original space", "the eigenvalues", "a random sample", "the class labels"],a:0,ev:"… use as input this distance matrix, which then projects it in to a lower-dimensional space so as to preserve these distances."},
  {id:"d17q24",slide:14,topic:"Factor Analysis, MDS & LLE",type:"mc",diff:2,q:"Locally Linear Embedding writes each point as…",opts:["a linear, weighted sum of its neighbors", "the centroid of its cluster", "a principal component", "a hidden factor"],a:0,ev:"… each point can be written as a linear, weighted sum of its neighbors."},
  {id:"d17q25",slide:14,topic:"Factor Analysis, MDS & LLE",type:"tf",diff:2,q:"LLE recovers global nonlinear structure from locally linear fits.",a:true,ev:"LLE recovers global nonlinear structure from locally linear fits."},
  {id:"d17q26",slide:15,topic:"Data Sampling",type:"mc",diff:1,q:"Which is a purpose of data sampling?",opts:["to reduce the number of instances submitted to the DM algorithm", "to add attributes", "to encrypt records", "to compute eigenvalues"],a:0,ev:"To reduce the number of instances submitted to the DM algorithm."},
  {id:"d17q27",slide:15,topic:"Data Sampling",type:"mc",diff:2,q:"Data sampling can divide a data set into how many data sets for subsequent DM analysis?",opts:["three", "two", "four", "ten"],a:0,ev:"To divide a data set into three data sets to carry out the subsequent analysis of DM algorithms."},
  {id:"d17q28",slide:16,topic:"Data Sampling",type:"mc",diff:2,q:"In SRSWOR (without replacement), the probability of drawing any tuple is…",opts:["1/N", "1/s", "s/N", "N/s"],a:0,ev:"Simple random sample without replacement (SRSWOR) of size s: … the probability of drawing any tuple in T is 1/N."},
  {id:"d17q29",slide:16,topic:"Data Sampling",type:"mc",diff:2,q:"What distinguishes SRSWR from SRSWOR?",opts:["each drawn tuple is recorded and replaced", "it samples clusters", "it uses strata", "it forces class balance"],a:0,ev:"Simple random sample with replacement (SRSWR) of size s: Similar to SRSWOR, except that each time a tuple is drawn from T, it is recorded and replaced."},
  {id:"d17q30",slide:17,topic:"Data Sampling",type:"mc",diff:2,q:"Which sample is forced to have a certain composition according to a target variable?",opts:["Balanced sample", "Cluster sample", "Stratified sample", "SRSWR"],a:0,ev:"Balanced sample: The sample is designed according to a target variable and is forced to have a certain composition according to a predefined criterion."},
  {id:"d17q31",slide:17,topic:"Data Sampling",type:"mc",diff:2,q:"Which sample obtains an SRS at each of the mutually disjointed parts called strata?",opts:["Stratified sample", "Cluster sample", "Balanced sample", "SRSWOR"],a:0,ev:"Stratified sample: If T is divided into mutually disjointed parts called strata, a stratified sample of T is generated by obtaining an SRS at each stratum"},
  {id:"d17q32",slide:17,topic:"Data Sampling",type:"mc",diff:3,q:"In cluster sampling with G clusters, an SRS of s clusters requires…",opts:["s < G", "s > G", "s = G", "s = N"],a:0,ev:"Cluster sample: … an SRS of s clusters can be obtained, where s < G."},
  {id:"d17q33",slide:18,topic:"Condensation, Squashing & Clustering",type:"mc",diff:2,q:"Why did data condensation emerge?",opts:["naive sampling is not suitable for real-world problems with noisy data", "sampling is too slow", "PCA needs more data", "clusters are hard to compute"],a:0,ev:"… naive sampling methods, such as random sampling or stratified sampling, are not suitable for real-world problems with noisy data"},
  {id:"d17q34",slide:18,topic:"Condensation, Squashing & Clustering",type:"tf",diff:2,q:"Data condensation attempts to obtain a minimal set which correctly classifies all the original examples.",a:true,ev:"They attempt to obtain a minimal set which correctly classifies all the original examples."},
  {id:"d17q35",slide:19,topic:"Condensation, Squashing & Clustering",type:"mc",diff:2,q:"Data squashing compresses data so that…",opts:["a statistical analysis on the compressed data gets the same outcome as on the original", "the number of attributes increases", "only outliers remain", "the data becomes categorical"],a:0,ev:"… a statistical analysis carried out on the compressed data obtains the same outcome that the one obtained with the original data set."},
  {id:"d17q36",slide:19,topic:"Condensation, Squashing & Clustering",type:"mc",diff:2,q:"Which are the two data squashing schemes?",opts:["Original Data Squashing (DS) and Likelihood-based Data Squashing (LDS)", "SRSWR and SRSWOR", "PCA and FA", "EF and IPF"],a:0,ev:"Schemes: Original Data Squashing (DS). Likelihood-based Data Squashing (LDS)."},
  {id:"d17q37",slide:20,topic:"Condensation, Squashing & Clustering",type:"mc",diff:1,q:"In clustering-based reduction, what can be used instead of the actual data?",opts:["the clusters (e.g., their centroids)", "the noisy points", "the class labels", "the eigenvectors"],a:0,ev:"Clusters the data could be used instead of the actual data."},
  {id:"d17q38",slide:22,topic:"Binning & Cardinality",type:"mc",diff:1,q:"Binning is the process of…",opts:["converting a continuous variable into a set of ranges", "combining categories into one", "removing attributes", "sampling rows"],a:0,ev:"Binning is the process of converting a continuous variable into a set of ranges."},
  {id:"d17q39",slide:22,topic:"Binning & Cardinality",type:"mc",diff:2,q:"Combining two or more categories of a nominal/ordinal variable into one is called…",opts:["cardinality reduction", "binning", "feature selection", "data squashing"],a:0,ev:"Cardinality reduction of nominal and ordinal variables is the process of combining two or more categories into one new category."},
  {id:"d17q40",slide:22,topic:"Binning & Cardinality",type:"tf",diff:1,q:"Binning is the easiest and direct way of discretization.",a:true,ev:"Binning is the easiest and direct way of discretization."},
  {id:"d17s1",slide:7,topic:"PCA",type:"short",diff:1,q:"Which technique keeps the first few components with 95% or more of the variance? (abbreviation)",keys:["PCA"],ev:"It is usual to keep only the first few principal components that may contain 95% or more of the variance…"},
  {id:"d17s2",slide:14,topic:"Factor Analysis, MDS & LLE",type:"short",diff:2,q:"Which nonlinear method writes each point as a weighted sum of its neighbors? (abbreviation)",keys:["LLE"],ev:"Locally Linear Embedding … each point can be written as a linear, weighted sum of its neighbors."},
  {id:"d17s3",slide:13,topic:"Factor Analysis, MDS & LLE",type:"short",diff:2,q:"Which method preserves pairwise distances in a lower-dimensional space? (abbreviation)",keys:["MDS"],ev:"MultiDimensional Scaling … so as to preserve these distances."},
  {id:"d17s4",slide:16,topic:"Data Sampling",type:"short",diff:2,q:"Simple random sample with replacement (abbreviation)?",keys:["SRSWR"],ev:"Simple random sample with replacement (SRSWR)"},
  {id:"d17s5",slide:19,topic:"Condensation, Squashing & Clustering",type:"short",diff:2,q:"Likelihood-based Data Squashing (abbreviation)?",keys:["LDS"],ev:"Likelihood-based Data Squashing (LDS)."}

  {id:"d18q24",slide:8,topic:"Moving Windows",type:"mc",diff:1,q:"Which method computes statistics over a fixed-size moving window?",opts:["rolling()", "expanding()", "resample()", "shift()"],a:0,ev:"The rolling() API — Establish dynamic window groupings to compute statistics over rolling periods."},
  {id:"d18q25",slide:8,topic:"Moving Windows",type:"mc",diff:2,q:"ts.rolling(window=30, min_periods=10).mean() computes…",opts:["a 30-day moving average (needs at least 10 values)", "the mean of the first 30 values", "a 10-day average", "an expanding mean"],a:0,ev:"# Compute a 30-day moving average — ts.rolling(window=30, min_periods=10).mean()"},
  {id:"d18q26",slide:8,topic:"Moving Windows",type:"mc",diff:2,q:"expanding() windows…",opts:["accumulate from the start of the series, growing each step", "stay a fixed size", "weight recent values more", "shift values forward"],a:0,ev:"Expanding computations accumulate statistics starting from the beginning of the time series, expanding the window size with each step."},
  {id:"d18q27",slide:9,topic:"Moving Windows",type:"mc",diff:2,q:"Exponentially weighted windows (ewm)…",opts:["give recent observations more influence via decaying weights", "weight every value equally", "only use the first value", "ignore missing values"],a:0,ev:"Assign decaying weights to give recent observations more influence."},
  {id:"d18q28",slide:9,topic:"Moving Windows",type:"tf",diff:2,q:"Exponentially weighted windows respond faster to trend shifts than standard rolling averages.",a:true,ev:"Exponentially weighted windows respond faster to trend shifts than standard rolling averages."},
  {id:"d18q29",slide:10,topic:"Performance & Pipeline",type:"mc",diff:2,q:"How long did native Python loops take in the resampling benchmark?",opts:["1,840 ms", "18 ms", "102.2 ms", "320 ms"],a:0,ev:"Native Python Loops 1,840 ms"},
  {id:"d18q30",slide:10,topic:"Performance & Pipeline",type:"mc",diff:2,q:"What speedup does vectorized .resample() give over Python loops?",opts:["≈ 102.2×", "≈ 27.55×", "≈ 8.4×", "≈ 2×"],a:0,ev:"S = T_Loops / T_Vectorized = 1,840 / 18 ≈ 102.2 ×"},
  {id:"d18q31",slide:11,topic:"Performance & Pipeline",type:"mc",diff:2,q:"In the ingestion pipeline, which step standardizes datetime intervals to uniform frequencies?",opts:["Set Freq — ts.asfreq('D')", "Rolling Stats", "Resample", "Parse Dates"],a:0,ev:"Set Freq — Standardize datetime intervals to uniform frequencies. — ts.asfreq('D')"},
  {id:"d18q32",slide:11,topic:"Performance & Pipeline",type:"mc",diff:2,q:"Which pipeline step applies sliding windows to capture long-term trends and smooth noise?",opts:["Rolling Stats — ts.rolling(30).mean()", "Set Freq", "Parse Dates", "Localization"],a:0,ev:"Rolling Stats — Apply sliding windows to capture long-term trends and smooth noise. — ts.rolling(30).mean()"},
  {id:"d18s1",slide:5,topic:"Ranges & Time Zones",type:"short",diff:1,q:"Which method makes a naive index timezone-aware?",keys:["tz_localize"],ev:"Localization — tz_localize"},
  {id:"d18s2",slide:4,topic:"Ranges & Time Zones",type:"short",diff:1,q:"Which function generates a fixed-frequency range of dates?",keys:["date_range"],ev:"pd.date_range('2026-07-01', periods=30, freq='D')"},
  {id:"d18s3",slide:7,topic:"Periods & Resampling",type:"short",diff:2,q:"Which method changes the frequency of a time series (up/down sampling)?",keys:["resample"],ev:"ts.resample('M', label='right').sum()"},
