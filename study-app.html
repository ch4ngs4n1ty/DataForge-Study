{
  id:"d9",
  title:"Plotting & Visualization",
  subtitle:"Python for Data Analysis · Chapter 9 — matplotlib API, plot customization & pandas/seaborn integrations (Wes McKinney, 3rd ed.)",
  week:"w5",
  slides:[
    {n:1,title:"The Matplotlib API Primer",blocks:[
      DG("fig-anatomy"),
      P("Figures and Subplots",true),
      P("All plots in Matplotlib reside inside a top-level Figure container. Within this, one or more individual Subplots (Axes) are added for active data rendering."),
      CODE("# Set up a figure container and subplots\nfig = plt.figure(figsize=(10, 6))\nax1 = fig.add_subplot(2, 2, 1)\nax2 = fig.add_subplot(2, 2, 2)"),
      P("Unified Subplots Helper",true),
      P("The standard plt.subplots() creates a brand new figure and returns a NumPy array containing the individual pre-configured subplot objects."),
      CODE("# Create a 2x3 grid matrix of subplots\nfig, axes = plt.subplots(2, 3)\naxes[0, 1].plot(np.random.randn(50))")
    ],
      tr:"In this chapter we start doing plotting and visualization with matplotlib, pandas, and seaborn. All plots in matplotlib live inside a top-level figure container, and within it we add one or more subplots (axes) for rendering. To set up a figure we create it with plt, give it a figure size like 10 by 6, and add subplots to it. The plt.subplots() helper creates a brand new figure and returns a NumPy array of the individual subplot objects."},
    {n:2,title:"Line Styles & Customization",blocks:[
      P("Color & Style",true),
      P("Combine abbreviated color keys and line formats directly, or spell out verbose property configuration tags for highly descriptive setups."),
      CODE("ax.plot(x, y, 'g--')\nax.plot(x, y, color='#4f46e5', linestyle='dashed')"),
      P("Data Markers",true),
      P("Add explicit, highlighted point markers over vector lines to draw structural attention to precise mathematical data coordinates."),
      CODE("ax.plot(data, 'ko--')\nax.plot(data, marker='o', color='black')"),
      P("Interpolation Styles",true),
      P("Alter how data points connect visually on the grid by passing style properties like step transformations or smooth linear splines."),
      CODE("ax.plot(data, drawstyle='steps-post')")
    ],
      tr:"We can color and style these plots. We can give a color like green, or any hexadecimal number, and decide whether the line is dashed. We can add explicit markers to alter how data points are shown on the screen — there's a lot of customization you can do. We can also change how points connect, using styles like step transformations."},
    {n:3,title:"Ticks, Labels, & Legends",blocks:[
      P("Axes Boundary Detailing",true),
      P("Customize axis labels, tick locations, and tick names to make charts easily readable at a glance."),
      B("Ticks & Limits: Command standard limits with xlim and label locations using xticks.",0,null,false),
      B("Plot Legend boxes: Pass the label parameter within plot lines and trigger a structured legend() call to identify variables.",0,null,false),
      CODE("ax.set_xticks([0, 250, 500])\nax.set_xticklabels(['one', 'two', 'three'], rotation=30)\nax.legend(loc='best')")
    ],
      tr:"We can set up boundaries, ticks, and legends — all of that can be configured through matplotlib. We customize axis labels, tick locations and tick names to make the chart readable, command the limits with xlim and label locations with xticks, and trigger a legend() call to identify the variables."},
    {n:4,title:"Annotations & Drawings",blocks:[
      P("Subplot Text Annotations",true),
      P("Draw attention to specific graph areas by placing text labels at raw coordinate positions, using custom alignment or visual formatting."),
      CODE("# Place explicit label on coordinates\nax.text(x, y, \"Important Peak\", family='monospace')"),
      P("Context Arrows and Patches",true),
      P("Use the annotate API to connect notes to coordinates with custom pointers. You can also render shapes (circles, rectangles) on top of plots."),
      CODE("# Annotate with a stylized pointing arrow\nax.annotate('Crash', xy=(x_val, y_val),\n            xytext=(x_text, y_text),\n            arrowprops=dict(facecolor='red'))")
    ],
      tr:"You can put annotations on plots — you can do drawings, put arrows, place text labels at raw coordinates. The annotate API connects notes to coordinates with custom pointers, and you can render shapes like circles and rectangles on top of the plots. There's a lot you can add to these graphs and images."},
    {n:5,title:"pandas Plotting Parameters",blocks:[
      TBL(["Plot Parameter","Standard API Option","Execution Code Pattern","Pipeline Impact & Visual Output"],[["Chart Variant","kind","df.plot(kind='barh')","Renders as bar, line, scatter, box, density, or pie."],["Target Axes","ax","df.plot(ax=axes[0])","Plots the data inside an existing subplot container."],["Legend Render","legend","df.plot(legend=False)","Determines whether to show or hide the default variables legend."],["Subplot Split","subplots","df.plot(subplots=True)","Splits DataFrame columns into individual, stacked subplots."]])
    ],
      tr:"In pandas you give a bunch of information to plot. kind is the kind of plot — bar, line, scatter, pie, whatever. You can put axes on it, add whether or not it has a legend, and do subplots and determine whether they're stacked on each other. This is all done through pandas when you're initially setting up the plots."},
    {n:6,title:"Core Plot Types in pandas",blocks:[
      P("Line Plots",true),
      P("The default option for pandas Series and DataFrames. Excellent for tracking trends or time series sequential changes."),
      CODE("df['value'].plot(grid=True)"),
      P("Bar Plots",true),
      P("Creates discrete bar comparisons. bar renders vertical bars, while barh outputs horizontal blocks."),
      CODE("df.plot(kind='bar', stacked=True)"),
      P("Histograms & Density",true),
      P("Visualize how values are distributed in a dataset using frequency counts or Kernel Density Estimations (KDE)."),
      CODE("df['val'].plot(kind='density')")
    ],
      tr:"Line plots are basically just lines — the default option for a pandas series, good for tracking trends. We can do the same with bar plots to compare two things, and we can do histograms and densities. There are heat maps and a bunch of different maps, but the core plot types in pandas are line, bar, and histograms — and you'll find those are really where you need to be when doing data analytics."},
    {n:7,title:"Advanced Plots with seaborn",blocks:[
      P("Aesthetic Statistical Defaults",true),
      P("Seaborn simplifies creating complex statistical plots. It handles automatic data grouping, aggregation, and aesthetic design themes under the hood."),
      CODE("# Plot a bar chart grouping by 'day'\nimport seaborn as sns\nsns.barplot(x='total_bill', y='day', data=tips)"),
      P("Categorical Hue Faceting",true),
      P("Use the hue parameter to easily split plots by a categorical column, applying unique, high-contrast color palettes automatically."),
      CODE("# Group bar chart with color keying\nsns.barplot(x='day', y='total_bill',\n            hue='smoker', data=tips)")
    ],
      tr:"There are some advanced plots we can use seaborn to do. Pandas does basic plotting, but seaborn is where you can do more statistical stuff and add more depth. We give a name to x, a name to y, and the data — and it automatically does some of the aggregation for you when you put in something like the word day. We can also do hue faceting to split plots by a categorical column."},
    {n:8,title:"Multidimensional Relations",blocks:[
      P("Pair Plots and Grid Facets",true),
      P("Use Seaborn's pairplot to quickly find relationships across multiple columns. It creates a grid matrix displaying pairwise scatter plots and histograms."),
      CODE("# Plot pairwise relationships\nsns.pairplot(data, hue='class', diag_kind='kde')\n# Create grouped grids easily\ng = sns.FacetGrid(tips, col='time')\ng.map(plt.hist, 'tip')")
    ],
      tr:"We can do multi-dimensional relations — pair plots. We can pair-plot two different things together and compare them, creating a grid matrix of pairwise scatter plots and histograms. There's a lot that can be done using seaborn and pandas, and these plots just show up on the screen — no, they're not drawn in Turtle."},
    {n:9,title:"Plotting Engine Performance",blocks:[
      DG("plot-perf"),
      N("Direct vector drawing with raw Matplotlib minimizes plotting overhead, making it ideal for high-frequency or interactive visualizations."),
      CODE("# Optimize complex figure redraws\nfig.canvas.draw_idle()")
    ],
      tr:"Which one you use has a time factor. Plotting from matplotlib is a lot faster, but speed comes with fewer features. Pandas is a bit more feature-friendly and can do more, but it's slower than matplotlib. Seaborn is quite a bit slower again, but can do a lot more statistical analysis and more complex graphs. So you have to make a choice: a basic graph with speed, or a complex graph that's slower."},
    {n:10,title:"Exploratory Viz Pipeline",blocks:[
      B("Init Canvas — create the figure and its subplots (Axes grid).",0,null,false),
      B("Base Plot: draw vector curves on the Axes grid.",0,null,false),
      CODE("ax.plot(x, y)"),
      B("Style axes — set ticks, labels, legends, colors and markers.",0,null,false),
      B("Save Graphic: export a high-DPI vector image file.",0,null,false),
      CODE("plt.savefig()")
    ],
      tr:"This covers the basics of making plots in Python. In 320 you had to use Excel or Google Sheets to make these plots, but here the data is already in Python, so you just plot it in Python itself instead of exporting to a CSV first. I keep it to the basics because the best way to learn is to play around with them — try the samples on the book's GitHub. Next we move on to chapter 10."}
  ],
  topics:[
    {name:"Matplotlib API & Styling",slides:[1,2,3,4]},
    {name:"pandas Plotting",slides:[5,6]},
    {name:"seaborn & Multidimensional",slides:[7,8]},
    {name:"Performance & Pipeline",slides:[9,10]}
  ]
}

{
  id:"d10",
  title:"Data Aggregation & Grouping",
  subtitle:"Python for Data Analysis · Chapter 10 — GroupBy mechanics, split-apply-combine & aggregation (Wes McKinney, 3rd ed.)",
  week:"w5",
  slides:[
    {n:1,title:"The Split-Apply-Combine Framework",blocks:[
      DG("split-apply-combine"),
      P("Split-Apply-Combine Concept",true),
      P("Data contained in a pandas object is first split into distinct groups along an axis. A function is applied to each group, producing a new value. Finally, the results are combined into a final output object."),
      CODE("# Group Series by a key array\ngrouped = df['data1'].groupby(df['key1'])\nprint(grouped.mean())  # Automatically aggregates"),
      P("DataFrame Grouping",true),
      P("You can group whole DataFrames by column names as strings, arrays of the same length, or custom index markers. Non-numeric columns are excluded from statistical summaries automatically."),
      CODE("# Group DataFrame by column keys\ndf.groupby(['key1', 'key2']).mean()")
    ],
      tr:"In this chapter we talk about data aggregation and grouping — GroupBy mechanics, split-apply-combine, and pivot tables. In the split-apply-combine framework, data in a pandas object is first split into distinct groups along an axis, a function is applied to each group producing a new value, and finally the results are combined into a final output. So we grab data1 and group it by key1, then apply the mean to each group. You can also group whole DataFrames by column names, like key1 and key2."},
    {n:2,title:"Iterating & Selecting Groups",blocks:[
      P("Iterating Over Groups",true),
      P("The GroupBy object supports iteration, yielding a sequence of 2-tuples containing the group name and the corresponding chunk of data."),
      CODE("for name, group in df.groupby('key1'):\n    print(name, group.shape)"),
      P("Syntactic Sugar",true),
      P("Indexing a GroupBy object with a column name yields a GroupBy object containing only that column, optimizing computation paths."),
      CODE("# Equivalent, but second is faster\ndf.groupby('key1')['data1']\ndf[['data1']].groupby(df['key1'])"),
      P("Grouping with Dicts",true),
      P("Instead of arrays, group columns or rows by mapping them with a dictionary or Series to quickly aggregate categorized variables."),
      CODE("mapping = {'a': 'red', 'b': 'red'}\nby_column = df.groupby(mapping, axis=1)")
    ],
      tr:"We can iterate through groups: for name, group in groupby, print the name and the group shape. There's some syntactic sugar too — you can group then select a column, or select then group; the two are equivalent, but the second is faster because you get the data first then group it. We can also group columns or rows by mapping them with a dictionary to a specific axis."},
    {n:3,title:"Grouping by Functions & Levels",blocks:[
      P("Advanced Grouping Keys",true),
      P("Pandas offers clean abstractions to group indices using Python functions or specific hierarchical MultiIndex levels."),
      B("Grouping with Functions: Any function passed to GroupBy is called once per index value, with the return values used as group keys.",0,null,false),
      B("Grouping by Index Levels: Aggregate easily across hierarchical indices by passing the level name or number.",0,null,false),
      CODE("# Group by length of index names\ndf.groupby(len).sum()\n# Group by MultiIndex level\ndf.groupby(level='cty', axis=1).count()")
    ],
      tr:"We can group by functions or by index levels. Any function passed to GroupBy is called once per index value, and the return values become the group keys — so if two labels have the same length, we can group them by length. We can also group by any number of things like a city, or aggregate across hierarchical MultiIndex levels by passing the level name or number."},
    {n:4,title:"Optimized GroupBy Methods",blocks:[
      TBL(["Method Name","Standard Call Pattern","Optimized C Execution Details"],[["Count / Sum","grouped.count() / grouped.sum()","Computes non-null counts or arithmetic sums; bypasses Python interpreter loops."],["Mean / Median","grouped.mean() / grouped.median()","Calculates group averages or statistical medians rapidly in compiled C."],["Min / Max","grouped.min() / grouped.max()","Retrieves the extreme boundary observations inside each group container."],["First / Last","grouped.first() / grouped.last()","Returns the first or final non-null observation sequence per group."]])
    ],
      tr:"There are some optimized, built-in groupby methods: count, mean, median, first, last, max — all of that is already built in. They're optimized and pretty quick, and they try to avoid using Python loops."},
    {n:5,title:"Custom Column-Wise Aggregations",blocks:[
      P("The agg() Interface",true),
      P("Pass custom functions or standard string aliases to the `agg()` method. To apply multiple aggregation functions to columns, pass a list of functions."),
      CODE("# Multiple aggregations on grouped columns\ngrouped = df.groupby(['day', 'smoker'])\ngrouped_pct = grouped['tip_pct']\ngrouped_pct.agg(['mean', 'std', my_func])"),
      P("Mapping Column-Specific Functions",true),
      P("Apply different aggregation functions to distinct columns of a DataFrame by passing a dictionary mapping column names to functions."),
      CODE("# Apply unique functions column-wise\ndf.groupby(['day']).agg({\n    'tip': np.max,\n    'size': 'sum'\n})")
    ],
      tr:"We can do custom column-wise aggregate functions — we don't have to use the built-ins. We can aggregate and get the mean, the standard deviation, and our own function passed in. This is important when you want special statistical functions not built into the language. We can also map column-specific functions, so for one column we always find the max while another gets a different function."},
    {n:6,title:"Group-Wise Transformations",blocks:[
      P("The transform() Method",true),
      P("Applies a function to each group, returning an object of the exact same shape as the parent group. Highly optimized for broadcasting operations."),
      CODE("df.groupby('key').transform('mean')"),
      P("Demarcation Demands",true),
      P("The transformation function must return a scalar or an array matching the exact dimensions of the target slice group."),
      CODE("# Demean values per group\ndemeaned = df.groupby('key').transform(\n    lambda x: x - x.mean()\n)"),
      P("Broadcasting Outputs",true),
      P("Bypasses manual merge loops, allowing calculated group metrics to be added directly to the parent DataFrame safely."),
      CODE("df['g_mean'] = df.groupby('k').transform('mean')")
    ],
      tr:"We can transform groups. transform applies a function to each group, returning an object of the exact same shape as the parent group — so it looks a lot like the parent and has the means in it. The function can return a scalar or an array, and we can use lambdas. We can then save the result directly back into the parent DataFrame as a new attribute, so we have it for later and don't recompute it every time."},
    {n:7,title:"Flexible Operations with apply()",blocks:[
      P("General-Purpose Group Analysis",true),
      P("The `apply()` method splits the object into pieces, calls the passed function on each piece, and attempts to glue the pieces back together, offering extreme programmatic flexibility."),
      CODE("# Select top n values per group\ndef top(df, n=5, col='tip_pct'):\n    return df.sort_values(by=col)[-n:]\ndf.groupby('smoker').apply(top)"),
      P("Suppressing Group Keys",true),
      P("By default, pandas adds the grouping keys to the index of the resulting object. Prevent this hierarchical index behavior using `group_keys=False`."),
      CODE("# Disable key insertion into index\ndf.groupby('smoker', group_keys=False).apply(top)")
    ],
      tr:"We can do general-purpose group analysis using apply — it splits the object into pieces, calls the passed function on each piece, and glues the pieces back together, offering extreme flexibility. We can sort things and apply functions to the groups. We can also suppress the group keys, so we say we don't want the grouping keys added to the index, using group_keys=False."},
    {n:8,title:"Quantile-Based Analysis",blocks:[
      P("Bucket Operations & Facet Slices",true),
      P("Combining the grouping engine with discretization tools like `pd.cut` or `pd.qcut` enables robust group-level bucket analysis and distribution tracking across cohorts."),
      CODE("# Slice continuous data into equal quantiles\nfactor = pd.qcut(df['total_bill'], 4)\n# Group on bins and compute statistics\ngrouped = df['tip_pct'].groupby(factor)\nprint(grouped.mean())")
    ],
      tr:"We can do bucket operations and slices with groups. I can make a cut of them — say I only want four of the items, not all of them. Combining the grouping engine with discretization tools like pd.cut or pd.qcut enables group-level bucket analysis and distribution tracking across cohorts."},
    {n:9,title:"Grouping Calculation Performance",blocks:[
      DG("groupby-perf"),
      N("Using pandas' compiled vector routines to group and aggregate millions of rows is significantly faster than relying on manual iteration loops.")
    ],
      tr:"If we did pure Python for groupby, it would take a long time — but pandas groupby is quite a bit more efficient, all because of those vectors and DataFrames being contiguous blocks in memory instead of spread all over the place. You could do a lot of this yourself in Python, but it's better to let pandas do it. Next we'll move on to time-series analysis."}
  ],
  topics:[

{
  id:"d11",
  title:"Data Preparation: Normalization & Transformation",
  subtitle:"Cap 3 (continued) — normalization, transformation techniques, and data reduction (picks up after integration & cleaning)",
  week:"w5",
  slides:[
    {n:1,title:"Data Normalization",blocks:[
      DG("norm-methods"),
      B("Sometimes the attributes selected are raw attributes.",0,null,false),
      B("They have a meaning in the original domain from where they were obtained",1,null,false),
      B("They are designed to work with the operational system in which they are being currently used",1,null,false),
      B("Usually these original attributes are not good enough to obtain accurate predictive models",0,null,false)
    ],
      tr:"In this lecture we move beyond integration and cleaning to two more preparation activities: normalization and transformation. Even after data is cleaned and integrated it may not suit machine learning — variables may have different scales, distributions may be skewed, and the raw attributes may not be the most useful for prediction. Raw attributes have meaning in their original domain and were designed for the operational system they came from, so they're often not good enough for accurate predictive models."},
    {n:2,title:"Data Normalization",blocks:[
      B("It is common to perform a series of manipulation steps to transform the original attributes or to generate new attributes",0,null,false),
      B("They will show better properties that will help the predictive power of the model",1,null,false),
      B("The new attributes are usually named modeling variables or analytic variables.",0,null,false)
    ],
      tr:"We perform a series of manipulation steps to transform the original attributes or generate new ones that show better properties for the model's predictive power. For example, 10,000 different salary numbers probably aren't useful, so we may turn that raw data into ranges or high/medium/low groups. The new attributes are usually called modeling variables or analytic variables."},
    {n:3,title:"Data Normalization",blocks:[
      P("Min-Max Normalization",true),
      B("The min-max normalization aims to scale all the numerical values v of a numerical attribute A to a specified range denoted by [new − minA, new − maxA].",0,null,false),
      B("The following expression transforms v to the new value v’:",0,null,false),
      IMG("Formula: min-max maps v to v' = (v − minA)/(maxA − minA) · (new_maxA − new_minA) + new_minA")
    ],
      tr:"Min-max normalization scales all numerical values of an attribute to a specified range, mapping v to a new value v' within [new_minA, new_maxA]."},
    {n:4,title:"Data Normalization",blocks:[
      P("Z-score Normalization",true),
      B("If minimum or maximum values of attribute A are not known, or the data is noisy, the min-max normalization is infeasible",0,null,false),
      B("Alternative: normalize the data of attribute A to obtain a new distribution with mean 0 and std. deviation equal to 1",0,null,false),
      IMG("Formula: z-score v' = (v − mean(A)) / std(A) → new distribution with mean 0 and std 1")
    ],
      tr:"If the minimum or maximum of an attribute aren't known, or the data is noisy, min-max is infeasible. The alternative is z-score normalization: normalize the attribute to a new distribution with mean 0 and standard deviation 1."},
    {n:5,title:"Data Normalization",blocks:[
      P("Decimal-scaling Normalization",true),
      B("A simple way to reduce the absolute values of a numerical attribute",0,null,false),
      B("where j is the smallest integer such that new − maxA < 1.",0,null,false),
      IMG("Formula: decimal scaling v' = v / 10^j, where j is the smallest integer with new_maxA < 1")
    ],
      tr:"Decimal-scaling normalization is a simple way to reduce the absolute values of a numerical attribute, dividing by a power of ten where j is the smallest integer that makes the new maximum less than 1."},
    {n:6,title:"Data Transformation",blocks:[
      B("It is the process to create new attributes",0,null,false),
      B("Often called transforming the attributes or the attribute set.",1,null,false),
      B("Data transformation usually combines the original raw attributes using different mathematical formulas originated in business models or pure mathematical formulas.",0,null,false),
      B("It is the process to create new attributes",0,null,false),
      B("Often called transforming the attributes or the attribute set.",1,null,false),
      B("Data transformation usually combines the original raw attributes using different mathematical formulas originated in business models or pure mathematical formulas.",0,null,false)
    ],
      tr:"Data transformation is the process of creating new attributes — often called transforming the attribute set. It usually combines the original raw attributes using mathematical formulas, either from business models or pure mathematics."},
    {n:7,title:"Data Transformation",blocks:[
      P("Linear Transformations",true),
      B("Normalizations may not be enough to adapt the data to improve the generated model.",0,null,false),
      B("Aggregating the information contained in various attributes might be beneficial",0,null,false),
      B("If B is an attribute subset of the complete set A, a new attribute Z can be obtained by a linear combination:",0,null,false),
      IMG("Formula: linear combination Z = Σ w_i · A_i over an attribute subset B ⊆ A")
    ],
      tr:"Normalizations may not be enough to improve the model, so aggregating the information in several attributes can help. If B is a subset of the full attribute set A, a new attribute Z can be built as a linear combination of those attributes."},
    {n:8,title:"Data Transformation",blocks:[
      P("Quadratic Transformations",true),
      B("In quadratic transformations a new attribute is built as follows",0,null,false),
      B("where ri,j is a real number.",0,null,false),
      B("These kinds of transformations have been thoroughly studied and can help to transform data to make it separable.",0,null,false),
      IMG("Formula: quadratic transform builds a new attribute from Σ r_i,j · A_i · A_j (r_i,j ∈ ℝ)")
    ],
      tr:"In quadratic transformations a new attribute is built from products of attributes (with real coefficients). These have been studied thoroughly and can help transform the data to make it separable."},
    {n:9,title:"Data Transformation",blocks:[
      B("Non-polynomial Approximations of Transformations",0,null,false),
      B("Sometimes polynomial transformations are not enough",0,null,false),
      B("For example, guessing whether a set of triangles are congruent is not possible by simply observing their vertices coordinates",0,null,false),
      B("Computing the length of their segments will easily solve the problem  non-polynomial transformation",1,null,false)
    ],
      tr:"Sometimes polynomial transformations aren't enough. For example, you can't tell whether triangles are congruent just from their vertex coordinates — but computing the lengths of their segments solves it easily, which is a non-polynomial transformation."},
    {n:10,title:"Data Transformation",blocks:[
      P("Polynomial Approximations of Transformations",true),
      B("We have observed that specific transformations may be needed to extract knowledge",0,null,false),
      B("But help from an expert is not always available",1,null,false),
      B("When no knowledge is available, a transformation f can be approximated via a polynomial transformation using a brute search with one degree at a time.",0,null,false),
      B("Using the Weistrass approximation, there is a polynomial function f that takes the value Yi for each instance Xi .",1,null,false)
    ],
      tr:"When specific transformations are needed to extract knowledge but no expert is available, a transformation f can be approximated by a polynomial using a brute search, one degree at a time. By the Weierstrass approximation there is a polynomial f that takes the value Yi for each instance Xi."},
    {n:11,title:"Data Transformation",blocks:[
      P("Polynomial Approximations of Transformations",true),
      B("There are as many polynomials verifying Y = f (X) as we want",0,null,false),
      B("As the number of instances in the data set increases, the approximations will be better",0,null,false),
      B("We can use computer assistance to approximate the intrinsic transformation",0,null,false)
    ],
      tr:"There are as many polynomials satisfying Y = f(X) as we want, and as the number of instances increases the approximations get better. We can use computer assistance to approximate the intrinsic transformation."},
    {n:12,title:"Data Transformation",blocks:[
      P("Polynomial Approximations of Transformations",true),
      B("When the intrinsic transformation is polynomial we need to add the cartesian product of the attributes needed for the polynomial degree approximation.",0,null,false),
      B("Sometimes the approximation obtained must be rounded to avoid the limitations of the computer digital precision.",0,null,false)
    ],
      tr:"When the intrinsic transformation is polynomial we add the cartesian product of the attributes needed for the polynomial-degree approximation. Sometimes the result must be rounded to avoid the limits of the computer's digital precision."},
    {n:13,title:"Data Transformation",blocks:[
      P("Rank Transformations",true),
      B("A change in an attribute distribution can result in a change of themodel performance",0,null,false),
      B("The simplest transformation to accomplish this in numerical attributes is to replace the value of an attribute with its rank",0,null,false),
      B("The attribute will be transformed into a new attribute containing integer values ranging from 1 to m, being m the number of instances in the data set.",0,null,false)
    ],
      tr:"A change in an attribute's distribution can change model performance. The simplest way to do this for a numerical attribute is to replace its value with its rank, producing a new attribute of integers from 1 to m, where m is the number of instances."},
    {n:14,title:"Data Transformation",blocks:[
      P("Rank Transformations",true),
      B("Next we can transform the ranks to normal scores representing their probabilities in the normal distribution by spreading these values on the gaussian curve using a simple transformation given by:",0,null,false),
      B("being ri the rank of the observation i and Φ the cumulative normal function",0,null,false),
      B("Note: this transformation cannot be applied separately to the training and test partitions",0,null,false),
      IMG("Formula: normal score s_i = Φ⁻¹( r_i / (m+1) ), r_i = rank of observation i, Φ = cumulative normal")
    ],
      tr:"Next we can transform the ranks to normal scores that represent their probabilities in the normal distribution, spreading the values on the Gaussian curve using the cumulative normal function. Note: this transformation cannot be applied separately to the training and test partitions."},
    {n:15,title:"Data Transformation",blocks:[
      P("Box-Cox Transformations",true),
      B("When selecting the optimal transformation for an attribute is that we do not know in advance which transformation will be the best",0,null,false),
      B("The Box-Cox transformation aims to transform a continuous variable into an almost normal distribution",0,null,false)
    ],
      tr:"When selecting the optimal transformation for an attribute, we don't know in advance which will be best. The Box-Cox transformation aims to turn a continuous variable into an almost-normal distribution."},
    {n:16,title:"Data Transformation",blocks:[
      P("Box-Cox Transformations",true),
      B("This can be achieved by mapping the values using following the set of transformations:",0,null,false),
      B("All linear, inverse, quadratic and similar transformations are special cases of the Box-Cox transformations.",0,null,false),
      IMG("Formula: Box-Cox — x' = (x^λ − 1)/λ for λ ≠ 0, and x' = log(x) for λ = 0")
    ],
      tr:"Box-Cox maps the values using a set of transformations; all linear, inverse, quadratic and similar transformations are special cases of the Box-Cox transformations."},
    {n:17,title:"Data Transformation",blocks:[
      P("Box-Cox Transformations",true),
      B("Please note that all the values of variable x in the previous slide must be positive. If we have negative values in the attribute we must add a parameter c to offset such negative values:",0,null,false),
      B("The parameter g is used to scale the resulting values, and it is often considered as the geometric mean of the data",0,null,false),
      IMG("Formula: offset/scale — x' = ((x + c)^λ − 1)/(λ · g^(λ−1)); g ≈ geometric mean of the data")
    ],
      tr:"All the values of the variable must be positive; if there are negative values we add a parameter c to offset them. The parameter g scales the resulting values and is often taken as the geometric mean of the data."},
    {n:18,title:"Data Transformation",blocks:[
      P("Box-Cox Transformations",true),
      B("The value of λ is iteratively found by testing different values in the range from −3.0 to 3.0 in small steps until the resulting attribute is as close as possible to the normal distribution.",0,null,false)
    ],
      tr:"The value of λ is found iteratively by testing values from −3.0 to 3.0 in small steps until the resulting attribute is as close as possible to the normal distribution."},
    {n:19,title:"Data Transformation",blocks:[
      P("Spreading the Histogram",true),
      B("Spreading the histogram is a special case of Box-Cox transformations",0,null,false),
      B("As Box-Coxtransforms the data to resemble a normal distribution, the histogram is thus spread as shown here",0,null,false)
    ],
      tr:"Spreading the histogram is a special case of Box-Cox. Because Box-Cox transforms the data to resemble a normal distribution, the histogram is spread out."},
    {n:20,title:"Data Transformation",blocks:[
      P("Spreading the Histogram",true),
      B("When the user is not interested in converting the distribution to a normal one, but just spreading it, we can use two special cases of Box-Cox transformations",0,null,false),
      B("Using the logarithm (with an offset if necessary) can be used to spread the right side of the histogram: y = log(x)",1,null,false),
      B("If we are interested in spreading the left side of the histogram we can simply use the power transformation y = xg",1,null,false)
    ],
      tr:"If the user just wants to spread the histogram rather than make it normal, there are two special cases: using the logarithm (with an offset if needed) spreads the right side, y = log(x); and a power transformation spreads the left side, y = x^g."},
    {n:21,title:"Data Transformation",blocks:[
      P("Nominal to Binary Transformation",true),
      B("The presence of nominal attributes in the data set can be problematic, specially if the DM algorithm used cannot correctly handle them",0,null,false),
      B("The first option is to transform the nominal variable to a numeric one",0,null,false),
      B("Although simple, this approach has two big drawbacks that discourage it:",0,null,false),
      B("With this transformation we assume an ordering of the attribute values",1,null,false),
      B("The integer values can be used in operations as numbers, whereas the nominal values cannot",1,null,false)
    ],
      tr:"Nominal attributes can be problematic, especially if the DM algorithm can't handle them. The first option is to convert the nominal variable into a numeric one, but this has two drawbacks: it assumes an ordering of the values, and the integers can be used in arithmetic operations while the nominal values cannot."},
    {n:22,title:"Data Transformation",blocks:[
      P("Nominal to Binary Transformation",true),
      B("In order to avoid the aforementioned problems, a very typical transformation used for DM methods is to map each nominal attribute to a set of newly generated attributes.",0,null,false),
      B("If N is the number of different values the nominal attribute has, we will substitute the nominal variable with a new set of binary attributes, each one representing one of the N possible values.",0,null,false),
      B("For each instance, only one of the N newly created attributes will have a value of 1, while the rest will have the value of 0",0,null,false)
    ],
      tr:"To avoid those problems, a very typical transformation is to map each nominal attribute to a set of newly generated binary attributes — one per possible value. If N is the number of values, we replace the nominal variable with N binary attributes, and for each instance only one of them is 1 while the rest are 0."},
    {n:23,title:"Data Transformation",blocks:[
      P("Nominal to Binary Transformation",true),
      B("This transformation is also referred in the literature as 1-to-N transformation.",0,null,false),
      B("A problem with this kind of transformation appears when the original nominal attribute has a large cardinality",0,null,false),
      B("The number of attributes generated will be large as well, resulting in a very sparse data set which will lead to numerical and performance problems.",1,null,false)
    ],
      tr:"This is also called the 1-to-N transformation. A problem appears when the original nominal attribute has a large cardinality: the number of generated attributes is large too, giving a very sparse data set that leads to numerical and performance problems."},
    {n:24,title:"Data Transformation",blocks:[
      P("Transformations via Data Reduction",true),
      B("When the data set is very large, performing complex analysis and DM can take a long computing time",0,null,false),
      B("Data reduction techniques are applied in these domains to reduce the size of the data set while trying to maintain the integrity and the information of the original data set as much as possible",0,null,false),
      B("Mining on the reduced data set will be much more efficient and it will also resemble the results that would have been obtained using the original data set.",0,null,false)
    ],
      tr:"When the data set is very large, complex analysis and mining take a long time. Data reduction techniques shrink the size of the data set while keeping as much of the original information and integrity as possible, so mining is much more efficient and still resembles the results from the full data set."},
    {n:25,title:"Data Transformation",blocks:[
      P("Transformations via Data Reduction",true),
      B("The main strategies to perform data reduction are Dimensionality Reduction (DR) techniques",0,null,false),
      B("They aim to reduce the number of attributes or instances available in the data set",0,null,false),
      B("Chapter 7 is devoted to attribute DR.",0,null,false),
      B("Well known attribute reduction techniques are Wavelet transforms or Principal Component Analysis (PCA).",1,null,false)
    ],
      tr:"The main strategies are dimensionality reduction techniques, which reduce the number of attributes or instances. Attribute reduction — covered in Chapter 7 — includes well-known techniques like wavelet transforms and Principal Component Analysis (PCA)."},
    {n:26,title:"Data Transformation",blocks:[
      P("Transformations via Data Reduction",true),
      B("Many techniques can be found for reducing the dimensionality in the number of instances, like the use of clustering techniques, parametric methods and so on",0,null,false),
      B("The reader will find a complete survey of IS techniques in Chapter 8",0,null,false)
    ],
      tr:"Many techniques reduce the number of instances, such as clustering and parametric methods; a full survey of instance-selection techniques is in Chapter 8. The idea is that if a group of rows is always similar, we can reduce them down while keeping the overall nature of the data."},
    {n:27,title:"Data Transformation",blocks:[
      P("Transformations via Data Reduction",true),
      B("The use of binning and discretization techniques is also useful to reduce the dimensionality and complexity of the data set.",0,null,false),
      B("They convert numerical attributes into nominal ones, thus drastically reducing the cardinality of the attributes involved",0,null,false),
      B("Chapter 9 presents a thorough presentation of these discretization techniques",0,null,false)
    ],
      tr:"Binning and discretization also reduce dimensionality and complexity: they convert numerical attributes into nominal ones, drastically reducing cardinality — for example turning age into young, middle-aged, and senior instead of 110 possible values. Chapter 9 presents these discretization techniques in depth."}

{
  id:"d12",
  title:"Dealing with Missing Values",
  subtitle:"Cap 4 (part 1 of 2) — introduction, missingness mechanisms (MCAR/MAR/NMAR), simple approaches & maximum likelihood imputation",
  week:"w6",
  slides:[
    {n:1,title:"Dealing with Missing Values — Chapter Overview",blocks:[
      B("Introduction",0,null,false),
      B("Assumptions and Missing Data Mechanisms",0,null,false),
      B("Simple Approaches to Missing Data",0,null,false),
      B("Maximum Likelihood Imputation Methods",0,null,false),
      B("Machine Learning Based Methods",0,null,false),
      B("Experimental Comparative Analysis",0,null,false)
    ],
      tr:"This chapter examines six major topics: an introduction, assumptions, simple approaches, maximum likelihood imputation methods, machine learning-based methods, and experimental comparative analysis. We're going to break this up into two separate lectures — the basic idea of missing values first, and how to deal with them second. This week covers the first four; the machine-learning methods and comparative analysis come next week."},
    {n:2,title:"Introduction",blocks:[
      B("A missing value (MV) is just a value for attribute that was not introduced or was lost in the recording process:",0,null,false),
      B("Equipment errors",1,null,false),
      B("Manual data entry procedures",1,null,false),
      B("Incorrect measurements",1,null,false)
    ],
      tr:"A missing value occurs when information that should exist for an attribute is unavailable. Notice I say unavailable — it doesn't mean it doesn't exist, it's just not available at this time. For instance, a person with no age value still has an age. Missing values commonly arise from equipment malfunctions, manual data-entry errors, incomplete forms, survey non-responses, or incorrect measurements."},
    {n:3,title:"Introduction",blocks:[
      B("MVs make performing data analysis difficult",0,null,false),
      B("Also inappropriate handling of the MVs in the analysis may introduce bias and can result in misleading conclusions",0,null,false),
      B("Problems are usually associated with MVs:",0,null,false),
      B("loss of efficiency;",1,null,false),
      B("complications in handling and analyzing the data;",1,null,false),
      B("bias resulting from differences between missing and complete data.",1,null,false)
    ],
      tr:"Missing values complicate both statistical analysis and machine learning: they reduce the usable information, make analysis harder, and can introduce bias if not handled properly. Data sets with substantial missing information often produce less reliable models and less trustworthy conclusions. In fact some missingness should be expected in almost every real-world data set — a set that's too perfect is worth questioning."},
    {n:4,title:"Introduction",blocks:[
      DG("mv-approaches"),
      B("Usually the treatment of MVs in DM can be handled in three different ways:",0,null,false),
      B("Discarding the examples with MVs. Deleting attributes with elevated levels of MVs is included in this category too.",1,null,false),
      B("Using maximum likelihood procedures, where the parameters of a model for the data are estimated, and later used for imputation by means of sampling.",1,null,false),
      B("Imputation of MVs is a class of procedures that aims to fill in the MVs with estimated ones, as attributes are not independent from each other",1,null,false)
    ],
      tr:"There are three broad approaches. First, remove incomplete observations or even whole attributes — a column with 70% missing or a row with 80% missing may be a candidate for removal, but only a candidate. Second, estimate the underlying probability distribution and generate plausible values using maximum likelihood procedures. Third, directly impute missing values using relationships among the observed attributes. Most modern approaches fall into the second or third category — we don't remove data unless we absolutely have to."},
    {n:5,title:"Assumptions and Missing Data Mechanisms",blocks:[
      DG("missingness-mechanisms"),
      B("It is important to categorize the mechanisms which lead to the introduction of MVs",0,null,false),
      B("The assumptions we make about the missingness mechanism can affect which treatment method could be correctly applied, if any",0,null,false)
    ],
      tr:"Before discussing specific methods we must understand why values become missing, because different causes require different treatment strategies. The critical concept is the missingness mechanism — the process that caused the values to go missing. The validity of many statistical techniques depends on assumptions about this process; if those assumptions are wrong, the imputed values may be unreliable and biased no matter how sophisticated the method."},
    {n:6,title:"Assumptions and Missing Data Mechanisms",blocks:[
      DG("missing-matrix"),
      B("In most problems, the data is arranged in a rectangular data matrix, where MVs can appear as shown next:",0,null,false)
    ],
      tr:"This figure illustrates missing values within a data matrix. Some observations are complete while others contain one or more gaps. The pattern of these gaps often provides clues about the process responsible for the missing data and may influence the choice of imputation strategy — for example, if one value is always missing whenever another has a particular value, that correlation is worth investigating."},
    {n:7,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("If we consider the i.i.d. assumption, the probability function of the complete data can be written as follows:",0,null,false),
      B("Where f is the probability function for a single case and θ represents the parameters of the model that yield such a particular instance of data.",0,null,false),
      IMG("Formula: P(X | θ) = ∏ᵢ f(xᵢ | θ) — f = probability function for a single case, θ = model parameters")
    ],
      tr:"The authors introduce a probability-based framework using the common independent and identically distributed (i.i.d.) assumption. The observed data is viewed as generated from a probability distribution governed by some unknown parameters θ. This idea forms the foundation for the maximum likelihood and Bayesian models — there's some probability, given an unknown parameter, that a value shows up."},
    {n:8,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("The parameters' values θ for the given data are very rarely known!",0,null,false),
      B("We can consider distributions that are commonly found in nature:",0,null,false),
      B("multivariate normal distribution (only real values)",1,null,false),
      B("multinomial model (nominal attributes)",1,null,false),
      B("mixed models for combined normal and categorical features",1,null,false),
      B("The parameters' values θ for the given data are very rarely known!",0,null,false),
      B("We can consider distributions that are commonly found in nature:",0,null,false),
      B("multivariate normal distribution (only real values)",1,null,false),
      B("multinomial model (nominal attributes)",1,null,false),
      B("mixed models for combined normal and categorical features",1,null,false)
    ],
      tr:"In practice the true distribution is almost never known, and the parameter value θ is rarely known to us. So analysts assume distributions that commonly appear in nature: multivariate normal for real-valued data, multinomial for nominal attributes, and mixed models for data sets with both. We make assumptions — sometimes they're wrong and we revise them, but we always have to make some assumption and then make a good guess from there."},
    {n:9,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("X = (Xobs, Xmis),",0,null,false),
      B("We call Xobs the observed part of X",1,null,false),
      B("We denote the missing part as Xmis",1,null,false),
      B("Let's suppose that we dispose of a matrix B of the same size of X",0,null,false),
      B("B values are 0 o 1 when X elements are missing and missing respectively.",0,null,false)
    ],
      tr:"We divide the data set into two conceptual parts: X = (X_obs, X_mis), the observed components and the missing components, which together make the entire data set X. An indicator matrix B of the same size records whether each value is present or absent (0/1). These matrices matter because many imputation methods model the observed and missing portions separately — some use the observed, some the missing, some both, and some neither."},
    {n:10,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("The distribution of B should be related to X and to some unknown parameters ζ , so we dispose a probability model for B described by P(B|X, ζ).",0,null,false),
      B("Having a missing at random (MAR) assumption means that this distribution does not depend on Xmis:",0,null,false),
      IMG("Formula (MAR): P(B | X, ζ) = P(B | X_obs, ζ) — missingness does not depend on X_mis")
    ],
      tr:"Missing at Random (MAR) means the probability of a value being missing depends only on observed information, not on the missing value itself. It's one of the most common assumptions in modern imputation because it allows estimation without explicitly modeling the missing values — we remove the missing values and work only with the observed ones, using information from the observed to predict the missing."},
    {n:11,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("MCAR is a special case of MAR in which the distribution of an example having a MV for an attribute does not depend on either the observed or the unobserved data",0,null,false)
    ],
      tr:"MCAR — Missing Completely at Random — is a special case of MAR. The major difference is that we use neither the observed nor the missing values: we assume the missingness is 100% random, so we don't need to look at any observed or missing data to estimate the value."},
    {n:12,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("Under MCAR, the analysis of only those units with complete data gives valid inferences",0,null,false),
      B("Although there will generally be some loss of information",1,null,false),
      B("MCAR is more restrictive than MAR",0,null,false),
      B("MAR requires only that the MVs behave like a random sample of all values in some particular subclasses defined by observed data.",1,null,false)
    ],
      tr:"Under MCAR, analyzing only the units with complete data gives valid inferences, though there is generally some loss of information — so deleting incomplete observations produces unbiased results but reduces the sample size and statistical power. MCAR is more restrictive than MAR: MAR only requires the missing values to behave like a random sample within subclasses defined by the observed data, while MCAR does not use the observed values at all."},
    {n:13,title:"Assumptions and Missing Data Mechanisms",blocks:[
      B("A third case arises when MAR does not apply as the MV depends on both the rest of observed values and the proper value itself.",0,null,false),
      B("This model is usually called not missing at random (NMAR) or missing not at random (MNAR) in the literature.",0,null,false),
      B("The only way to obtain an unbiased estimate is to model the missingness as well.",0,null,false),
      B("This is a very complex task in which we should create a model accounting for the missing data that should be later incorporated to a more complex model used to estimate the MVs.",1,null,false)

 {id:"d3q6",slide:4,topic:"Data Types (dtypes)",type:"mc",diff:2,q:"Unsigned integers (uint8/uint32/uint64) are described as…",opts:["Non-negative integers only, ideal for memory optimization","Signed integers from 8-bit to 64-bit","Fixed-length text representations","Double precision floats"],a:0,ev:"Unsigned Integers — Non-negative integers only, ideal for memory optimization."},
 {id:"d3q7",slide:4,topic:"Data Types (dtypes)",type:"tf",diff:1,q:"float64 matches standard Python float parameters (double precision).",a:true,ev:"Double precision float64 matches standard Python float parameters."},
 {id:"d3q8",slide:5,topic:"Array Arithmetic",type:"mc",diff:1,q:"How do element-wise calculations operate?",opts:["Directly across dimensional bounds without requiring explicit loop nesting","Only after converting to a Python list","One element per thread","Only on 1-D arrays"],a:0,ev:"Calculations operate element-wise directly across dimensional bounds without requiring explicit loop nesting."},
 {id:"d3q9",slide:6,topic:"Slicing & Views",type:"mc",diff:2,q:"A no-copy slice such as arr[5:8]…",opts:["Serves as an active view over the source; modifications instantly mutate the parent","Always makes a detached copy","Deletes the original array","Converts the array to a list"],a:0,ev:"Slices serve directly as active “views” over the source matrix bounds … Modifications instantly mutate the parent."},
 {id:"d3q10",slide:6,topic:"Slicing & Views",type:"tf",diff:1,q:"Calling .copy() on a slice leaves the original arr intact.",a:true,ev:"arr_copy = arr[5:8].copy() … arr_copy[:] = 64  # Leaves arr intact"},
 {id:"d3q11",slide:7,topic:"Boolean & Fancy Indexing",type:"tf",diff:2,q:"Boolean masking and fancy indexing both always copy data.",a:true,ev:"Boolean masking always copies data. … Fancy indexing always copies array values."},
 {id:"d3q12",slide:8,topic:"Universal Functions (ufuncs)",type:"mc",diff:2,q:"Which describes a unary ufunc?",opts:["Executes single-array operations (e.g. np.sqrt, np.exp) in optimized C","Computes results across two input arrays","Writes output into a target buffer only","Copies array values out of order"],a:0,ev:"Unary ufuncs — Execute single-array operations. Computes rapid element values directly in optimized C."},
 {id:"d3q13",slide:9,topic:"Performance",type:"mc",diff:1,q:"In the benchmark, how much faster is the vectorized NumPy version on average?",opts:["About 68.7× faster","About 2× faster","About 10× faster","Exactly the same speed"],a:0,ev:"Average Speedup: ~68.7x faster (Pure Python list loop ≈ 48.8 ms)."},
 {id:"d3q14",slide:10,topic:"Linear Algebra",type:"mc",diff:2,q:"Which command computes the matrix (dot) product?",opts:["np.dot() / @","numpy.linalg.inv","numpy.linalg.qr","numpy.linalg.svd"],a:0,ev:"Matrix Product — np.dot() / @ — x.dot(y) or x @ y."},
 {id:"d3s1",slide:9,topic:"Performance",type:"short",diff:2,q:"State the two benchmark numbers from the performance slide.",keys:["48.8","68.7"],ev:"Pure Python list loop ≈ 48.8 ms; NumPy vectorized ≈ 68.7× faster."},
 {id:"d3m1",slide:8,topic:"Universal Functions (ufuncs)",type:"match",diff:2,q:"Match each ufunc category to its example from the slide.",pairs:[["Unary ufuncs","np.sqrt(arr) / np.exp(arr)"],["Binary Operators","np.maximum(x, y) / np.add(x, y)"],["Output Scopes","np.sqrt(arr, out=arr)"]],ev:"Examples are copied from the Fast Element-Wise ufuncs slide."}

d4:[
 {id:"d4q1",slide:3,topic:"Data Sets & Partitioning",type:"mc",diff:1,q:"Because testing a technique on every problem is unfeasible, the common procedure is to…",opts:["Evaluate the technique on a set of standard DM problems (data sets) publicly available","Only test on the company's private data","Skip evaluation entirely","Use the training data as the test data"],a:0,ev:"The common procedure is to evaluate such a technique in a set of standard DM problems (or data sets) publicly available."},
 {id:"d4q2",slide:4,topic:"Data Sets & Partitioning",type:"mc",diff:1,q:"Benchmark data sets are used with one goal:",opts:["To evaluate the performance of a given model over a set of well-known standard problems","To hide results from other researchers","To guarantee 100% accuracy","To replace cross-validation"],a:0,ev:"To evaluate the performance of a given model over a set of well-known standard problems."},
 {id:"d4q3",slide:5,topic:"Data Sets & Partitioning",type:"mc",diff:2,q:"Which statement matches the slide's definition of underfitting?",opts:["The model is poorly adjusted to the data, suffering high error both in training and test (unseen) data","The model is too tightly adjusted, high precision on known cases but poor on unseen data","The model always predicts the majority class","The model has zero training error"],a:0,ev:"Underfitting happens when the model is poorly adjusted to the data, suffering from high error both in training and test (unseen) data."},
 {id:"d4q4",slide:5,topic:"Data Sets & Partitioning",type:"mc",diff:2,q:"Which statement matches the slide's definition of overfitting?",opts:["The model is too tightly adjusted to data, high precision on known cases but poor with unseen data","The model is too simple to capture structure","The model uses only one fold","The model ignores the training data"],a:0,ev:"Overfitting happens when the model is too tightly adjusted to data offering high precision to known cases but behaving poorly with unseen data."},
 {id:"d4q5",slide:7,topic:"Data Sets & Partitioning",type:"tf",diff:2,q:"Overfitting is easy to notice using only the training data.",a:false,ev:"Adjusting such a model to better fit the data may lead to overfitting — the lack of unseen case makes impossible to notice this situation."},
 {id:"d4q6",slide:9,topic:"Cross-Validation",type:"mc",diff:1,q:"In k-Fold Cross Validation (k-FCV), how is the data set partitioned?",opts:["Randomly into k equal size folds/partitions","Into a single training set only","By class label alphabetically","Into two overlapping halves"],a:0,ev:"In k-FCV, the original data set is randomly partitioned into k equal size folds or partitions."},
 {id:"d4q7",slide:9,topic:"Cross-Validation",type:"mc",diff:2,q:"During each k-FCV iteration, which partitions build the model?",opts:["The remaining k − 1 subsamples build the model; one is retained for validation","All k partitions build the model","Only one partition builds the model","None — the model is not rebuilt"],a:0,ev:"One is retained as the validation data for testing the model, and the remaining k − 1 subsamples are used to build the model."},
 {id:"d4q8",slide:11,topic:"Cross-Validation",type:"mc",diff:1,q:"Which values of k are described as the most common?",opts:["5 and 10","2 and 3","50 and 100","1 and 2"],a:0,ev:"The value of k may vary, 5 and 10 being the most common ones."},
 {id:"d4q9",slide:11,topic:"Cross-Validation",type:"tf",diff:2,q:"For smaller data sets, 5-FCV is more frequent while 10-FCV is used for big data sets.",a:true,ev:"If big data sets are being used, 10-FCV is usually utilized; for smaller data sets 5-FCV is more frequent."},
 {id:"d4q10",slide:12,topic:"Cross-Validation",type:"mc",diff:2,q:"What does stratified k-FCV do to avoid disarranging class proportions?",opts:["Places an equal number of samples of each class on each partition","Removes the minority class","Uses only one fold","Doubles the data set"],a:0,ev:"Stratified k-FCV places an equal number of samples of each class on each partition to maintain class distributions equal in all partitions."},
 {id:"d4q11",slide:13,topic:"Cross-Validation",type:"mc",diff:2,q:"In 5×2 CV, how is the whole data set first handled?",opts:["Randomly partitioned into two subsets A and B; build with A/validate with B, then reversed","Split into 10 folds","Left entirely as training data","Sorted by class then split"],a:0,ev:"The whole data set is randomly partitioned in two subsets A and B. The model is first built using A and validated with B; then the process is reversed."},
 {id:"d4q12",slide:15,topic:"Cross-Validation",type:"mc",diff:1,q:"Leave-one-out is described as…",opts:["An extreme case of k-FCV where k equals the number of examples in the data set","A parametric significance test","A performance measure","A normality test"],a:0,ev:"Leave one out is an extreme case of k-FCV: k equals the number of examples in the data set."},
 {id:"d4q13",slide:16,topic:"Performance Measures",type:"mc",diff:2,q:"Which is NOT listed among the well-known binary-class accuracy measures?",opts:["Gradient descent","G-mean","F-score","Cohen's Kappa"],a:0,ev:"Well-known accuracy measures … classification rate, precision, sensitivity, specificity, G-mean, F-score, AUC, Youden's index and Cohen's Kappa."},
 {id:"d4q14",slide:17,topic:"Performance Measures",type:"mc",diff:2,q:"Which two measures are widely used for multi-class problems because of their simplicity?",opts:["Classification rate (accuracy) and Cohen's kappa","Precision and recall","AUC and F-score","G-mean and specificity"],a:0,ev:"Only two measures are widely used … Classification rate (also known as accuracy) … and Cohen's kappa."},
 {id:"d4q15",slide:18,topic:"Performance Measures",type:"mc",diff:2,q:"Cohen's kappa ranges from…",opts:["−1 through 0 (random classification) to 1 (perfect agreement)","0 to 100","1 to 10","−0.5 to 0.5"],a:0,ev:"Cohen's kappa ranges from −1 through 0 (random classification) to 1 (perfect agreement)."},
 {id:"d4q16",slide:18,topic:"Performance Measures",type:"tf",diff:1,q:"A Cohen's kappa of 0 indicates perfect agreement.",a:false,ev:"0 indicates random classification; 1 indicates perfect agreement."},
 {id:"d4s1",slide:11,topic:"Cross-Validation",type:"short",diff:1,q:"Which two values of k are the most common in k-FCV?",keys:["5","10"],ev:"5 and 10 being the most common ones."},
],
d5:[
 {id:"d5q1",slide:1,topic:"Statistical Tests — Overview",type:"tf",diff:1,q:"Observing that one algorithm has higher accuracy than another automatically proves it is the better algorithm.",a:false,ev:"Observing different performance scores does not automatically mean one algorithm is better than the other; performance values vary due to randomness."},
 {id:"d5q2",slide:3,topic:"Parametric Test Conditions",type:"mc",diff:2,q:"Which is NOT one of the three conditions required to safely use parametric tests?",opts:["Independence","Normality","Heteroscedasticity (equal variance)","Discretization"],a:3,ev:"The three conditions are Independence, Normality, and Heteroscedasticity (equality of variances)."},
 {id:"d5q3",slide:2,topic:"Parametric Test Conditions",type:"mc",diff:1,q:"Which are examples of parametric tests?",opts:["t-tests and ANOVA","Wilcoxon and Friedman","Kolmogorov–Smirnov and Shapiro–Wilk","Bonferroni-Dunn and Holm"],a:0,ev:"Parametric methods such as t-tests and ANOVA are based on assumptions about the underlying distribution of the data."},
 {id:"d5q4",slide:2,topic:"Parametric Test Conditions",type:"mc",diff:2,q:"Why are non-parametric tests often preferred for comparing ML algorithms?",opts:["They rely on fewer assumptions about the underlying distribution","They always give higher accuracy","They require the data to be normal","They are only for two algorithms"],a:0,ev:"Nonparametric tests are more robust because they rely on fewer assumptions about the underlying distribution."},
 {id:"d5q5",slide:4,topic:"Parametric Test Conditions",type:"tf",diff:2,q:"k-fold and 5×2 cross-validation provide complete independence between training and testing.",a:false,ev:"k-fold and 5×2 cross-validation do not provide complete independence because training and testing procedures overlap across multiple runs."},
 {id:"d5q6",slide:5,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"Which set are the three normality tests discussed?",opts:["Kolmogorov–Smirnov, Shapiro–Wilk, D'Agostino–Pearson","t-test, ANOVA, Wilcoxon","Friedman, Holm, Hochberg","Levene, Bartlett, Bonferroni"],a:0,ev:"Three normality tests: Kolmogorov–Smirnov, Shapiro–Wilk, and D'Agostino–Pearson."},
 {id:"d5q7",slide:6,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"Which test checks equal variance and is preferred over Bartlett's when normality is questionable?",opts:["Levene's test","Shapiro–Wilk test","Friedman test","Wilcoxon test"],a:0,ev:"Levene's test evaluates equal variance and is preferred over Bartlett's test when normality is questionable because it is more robust."},
 {id:"d5q8",slide:9,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"On a Q-Q plot, what indicates the data is close to normal?",opts:["The points fall roughly along a straight line","The points form a circle","All points sit at the origin","The points are randomly scattered"],a:0,ev:"If the points fall roughly along a straight line, the data is considered close to normal; large deviations indicate departures from normality."},
 {id:"d5q9",slide:12,topic:"Normality & Variance Testing",type:"tf",diff:1,q:"In ML experiments, normality and homoscedasticity are frequently violated, which is why nonparametric tests are recommended.",a:true,ev:"Normality and homoscedasticity are frequently violated in ML experiments, so many researchers recommend nonparametric procedures."},
 {id:"d5q10",slide:16,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:1,q:"The Wilcoxon signed-ranks test is best described as…",opts:["The non-parametric counterpart to the paired t-test","A parametric test like ANOVA","A normality test","A data-partitioning scheme"],a:0,ev:"The Wilcoxon signed-ranks test serves as the nonparametric counterpart to the paired t-test."},
 {id:"d5q11",slide:18,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:2,q:"In the Wilcoxon test, what is the test statistic T?",opts:["The smaller of the two rank sums, T = min(R+, R−)","The larger of the two rank sums","The mean accuracy difference","The number of data sets"],a:0,ev:"The smaller of the two rank sums becomes the test statistic T = min(R+, R−); if T is significantly small the null hypothesis is rejected."},
 {id:"d5q12",slide:15,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:2,q:"What is the family-wise error rate (FWER)?",opts:["The probability of making at least one false discovery among all comparisons","The accuracy of the best algorithm","The number of folds in cross-validation","The variance of the data"],a:0,ev:"The family-wise error rate is the probability of making at least one false discovery among all comparisons."},
 {id:"d5q13",slide:27,topic:"Friedman & Iman–Davenport",type:"mc",diff:2,q:"The Friedman test is a non-parametric analog of which parametric test?",opts:["Repeated-measures (two-way) ANOVA","The paired t-test","Levene's test","Kolmogorov–Smirnov"],a:0,ev:"The Friedman test is a nonparametric analog of the parametric two-way analysis of variance (repeated measures ANOVA)."},
 {id:"d5q14",slide:29,topic:"Friedman & Iman–Davenport",type:"mc",diff:2,q:"How does the Friedman test treat the algorithms on each data set?",opts:["It ranks them (rank 1 = best) and averages the ranks","It sums their raw accuracies","It removes the worst one","It normalizes their scores"],a:0,ev:"Friedman ranks the algorithms on each data set (rank 1 to the best), then computes average ranks and a test statistic."},
 {id:"d5q15",slide:30,topic:"Friedman & Iman–Davenport",type:"mc",diff:3,q:"Why did Iman and Davenport modify the Friedman statistic?",opts:["The Friedman test can be conservative; their version has greater statistical power","To make it parametric","To require normal data","To reduce the number of algorithms"],a:0,ev:"Iman and Davenport proposed a modified Friedman statistic with greater statistical power, because the Friedman test can be conservative."},
 {id:"d5q16",slide:32,topic:"Post-hoc Procedures",type:"mc",diff:2,q:"After the Friedman test rejects the null hypothesis, what does a post-hoc analysis do?",opts:["Identifies which specific algorithms differ","Re-runs cross-validation","Proves all algorithms are equal","Chooses the number of folds"],a:0,ev:"After Friedman rejects the null hypothesis, a post-hoc analysis identifies which specific algorithms are responsible for the result."},
 {id:"d5q17",slide:34,topic:"Post-hoc Procedures",type:"mc",diff:2,q:"Which post-hoc procedure computes a critical difference (CD) and is simple but conservative?",opts:["Bonferroni-Dunn","Holm","Hochberg","Friedman"],a:0,ev:"Bonferroni-Dunn calculates a critical difference (CD); it is simple but tends to be conservative."},
 {id:"d5q18",slide:37,topic:"Post-hoc Procedures",type:"mc",diff:3,q:"Which post-hoc procedure uses a step-up strategy starting from the largest p-value?",opts:["Hochberg","Holm","Bonferroni-Dunn","Levene"],a:0,ev:"The Hochberg procedure uses a step-up strategy, beginning with the largest p-value and working in the opposite direction."},
 {id:"d5q19",slide:35,topic:"Post-hoc Procedures",type:"tf",diff:2,q:"The Holm procedure orders p-values from largest to smallest and has more power than Bonferroni-Dunn.",a:true,ev:"Holm orders the p-values from largest to smallest (step-down) and provides more statistical power than Bonferroni-Dunn."},
 {id:"d5q20",slide:33,topic:"Post-hoc Procedures",type:"mc",diff:1,q:"What can a control algorithm be in a post-hoc comparison?",opts:["A new proposal, the best-performing method, or a benchmark","Only the worst algorithm","Only a random algorithm","The test set"],a:0,ev:"The control algorithm may be a newly proposed method, the best-performing method, or a widely accepted benchmark."},
 {id:"d5s1",slide:3,topic:"Parametric Test Conditions",type:"short",diff:2,q:"Name the three conditions required to safely use parametric tests.",keys:["independence","normality","heteroscedasticity"],ev:"Independence, Normality, and Heteroscedasticity (equality of variances)."},
 {id:"d5m1",slide:34,topic:"Post-hoc Procedures",type:"match",diff:3,q:"Match each post-hoc procedure to its description.",pairs:[["Bonferroni-Dunn","Computes a critical difference (CD); simple but conservative."],["Holm","Step-down: orders p-values largest to smallest; more power than Bonferroni-Dunn."],["Hochberg","Step-up: starts from the largest p-value; often even greater power than Holm."]],ev:"Descriptions are taken from the post-hoc procedures slides."}
],
 d6:[
  {id:"d6q1",slide:1,topic:"Why pandas",type:"tf",diff:1,q:"pandas is designed for tabular data with mixed types (integers, strings, timestamps, floats).",a:true,ev:"pandas is built for tabular structures with mixed metadata types such as integers, strings, timestamps and floats."},
  {id:"d6q2",slide:1,topic:"Why pandas",type:"mc",diff:2,q:"When you operate on two pandas objects with different indexes, pandas…",opts:["performs automatic label-based alignment","aligns by position only","raises an error","drops all labels"],a:0,ev:"pandas provides automatic label-based relational alignment across unmatched index positions."},
  {id:"d6q3",slide:2,topic:"Core structures",type:"mc",diff:1,q:"Which pandas object is a 1D array-like sequence with axis labels?",opts:["Series","DataFrame","Index","ndarray"],a:0,ev:"A Series is a 1D array-like sequence matched with a distinct axis-labels index."},
  {id:"d6q4",slide:2,topic:"Core structures",type:"mc",diff:1,q:"A DataFrame is best described as…",opts:["a 2D structure of ordered, labeled columns","a 1D labeled array","an immutable label sequence","a Python dictionary"],a:0,ev:"A DataFrame is a multi-column, spreadsheet-like 2D structure of ordered labeled columns."},
  {id:"d6q5",slide:2,topic:"Core structures",type:"tf",diff:1,q:"Index objects in pandas are immutable.",a:true,ev:"Index objects are immutable sequences carrying axes metadata for alignment and lookup."},
  {id:"d6q6",slide:3,topic:"Series manipulation",type:"mc",diff:2,q:"What does s[s > 0] return on a Series?",opts:["a boolean-mask selection of matching elements","the sum of the elements","a sorted copy","the index only"],a:0,ev:"A boolean logical mask selects the elements that satisfy the condition, without looping."},
  {id:"d6q7",slide:4,topic:"Selection",type:"mc",diff:2,q:"Which statement about loc and iloc is correct?",opts:["loc is label-based; iloc is integer-based","both are integer-based","both are label-based","loc is integer-based; iloc is label-based"],a:0,ev:"loc selects by label, iloc selects by integer position — explicit handlers that avoid ambiguity."},
  {id:"d6q8",slide:5,topic:"Reindex & drop",type:"mc",diff:2,q:"reset_index() does what?",opts:["resets to an integer index and inserts the old index as a column","deletes the index entirely","sorts the index","drops all rows"],a:0,ev:"reset_index resets to standard integers and inserts the old index as a column."},
  {id:"d6q9",slide:6,topic:"Indexing nuances",type:"tf",diff:2,q:"Label-based slicing in pandas includes the end boundary element, unlike Python list slicing.",a:true,ev:"Label slicing differs from Python lists because the end boundary element is fully included."},
  {id:"d6q10",slide:7,topic:"Arithmetic alignment",type:"mc",diff:2,q:"When adding two DataFrames with mismatched indexes, pandas…",opts:["builds a union index and yields NaNs on mismatch","raises an error","silently keeps only matching labels","fills gaps with zeros"],a:0,ev:"pandas constructs a unified union index under the hood, generating NaNs on mismatch."},
  {id:"d6q11",slide:7,topic:"Arithmetic alignment",type:"mc",diff:2,q:"How do you add two DataFrames but substitute 0 for missing entries instead of NaN?",opts:["df1.add(df2, fill_value=0)","df1 + df2","df1.concat(df2)","df1.join(df2)"],a:0,ev:"Use the arithmetic method with a fill value: df1.add(df2, fill_value=0)."},
  {id:"d6q12",slide:8,topic:"Apply & sort",type:"mc",diff:2,q:"frame.applymap(func) applies a function…",opts:["element-by-element across the DataFrame grid","across whole rows or columns","to the index only","to the column names"],a:0,ev:"applymap applies a scalar function element-by-element; apply works across whole rows/columns."},
  {id:"d6q13",slide:8,topic:"Apply & sort",type:"mc",diff:1,q:"Which method sorts a DataFrame's rows by the values in a column?",opts:["sort_values(by='column')","sort_index()","reindex()","reset_index()"],a:0,ev:"sort_values orders row entries using the elements of selected columns."},
  {id:"d6q14",slide:9,topic:"Performance",type:"tf",diff:1,q:"Vectorized pandas operations are significantly faster than pure Python list math for descriptive stats.",a:true,ev:"Descriptive math over millions of elements is far faster with pandas' vectorized calculations (~60×)."}

 d7:[
  {id:"d7q1",slide:1,topic:"Parsing engines",type:"mc",diff:1,q:"By default, which parsing engine does pandas use for read_csv?",opts:["the C engine (fast, fewer features)","the Python engine","no engine","SQLAlchemy"],a:0,ev:"By default pandas uses the highly optimized C engine; it's fast but has fewer features."},
  {id:"d7q2",slide:1,topic:"Parsing engines",type:"mc",diff:2,q:"Which engine supports multi-character regex delimiters?",opts:["the Python engine","the C engine","the Arrow engine","none of them"],a:0,ev:"The Python fallback engine supports complex features like multi-character regex delimiters, but is slower."},
  {id:"d7q3",slide:2,topic:"Flat-file parsers",type:"mc",diff:1,q:"Which reader handles files whose columns are arranged by static character widths?",opts:["read_fwf","read_csv","read_table","read_json"],a:0,ev:"read_fwf processes fixed-width tables where columns use static character widths."},
  {id:"d7q4",slide:2,topic:"Flat-file parsers",type:"tf",diff:1,q:"read_table can read a tab-separated file when you pass sep='\\t'.",a:true,ev:"read_table loads custom tab-separated tables via explicit parameter flags."},
  {id:"d7q5",slide:3,topic:"Massive datasets",type:"mc",diff:2,q:"To process a very large CSV without loading it all into memory, you use…",opts:["chunksize to stream it in blocks","only nrows","read_json","to_parquet"],a:0,ev:"chunksize retrieves iterative generators so the file streams in blocks instead of loading at once."},
  {id:"d7q6",slide:4,topic:"read_csv config",type:"mc",diff:2,q:"Which read_csv parameter maps specific strings (e.g. 'NULL') to NaN?",opts:["na_values","index_col","skiprows","converters"],a:0,ev:"na_values maps specific strings to standard NaN missing indicators."},
  {id:"d7q7",slide:4,topic:"read_csv config",type:"mc",diff:1,q:"Which parameter chooses the column used as the row index?",opts:["index_col","skiprows","na_values","converters"],a:0,ev:"index_col specifies a column to use as the row index labels."},
  {id:"d7q8",slide:4,topic:"read_csv config",type:"mc",diff:2,q:"converters={'col': int} does what while reading?",opts:["applies a function column-wise to clean values","skips the column","drops nulls","sets the file separator"],a:0,ev:"converters applies dict functions column-wise to clean/convert values on read."},
  {id:"d7q9",slide:6,topic:"Web & semi-structured",type:"mc",diff:1,q:"Which reader scrapes tabular tags out of an HTML page?",opts:["read_html","read_json","read_excel","read_sql"],a:0,ev:"read_html scrapes tabular tags inside HTML pages automatically."},
  {id:"d7q10",slide:7,topic:"Binary formats",type:"mc",diff:2,q:"Which binary format is column-oriented with dense compression, ideal for analytical queries?",opts:["Apache Parquet","Python Pickle","CSV","JSON"],a:0,ev:"Parquet is column-oriented with dense compression, highly efficient for analytical queries."},
  {id:"d7q11",slide:7,topic:"Binary formats",type:"tf",diff:1,q:"Python pickle is recommended for long-term storage across pandas versions.",a:false,ev:"Pickle is quick but is not recommended for long-term storage across versions."},
  {id:"d7q12",slide:8,topic:"Databases",type:"mc",diff:1,q:"How does pandas load rows from a relational database safely?",opts:["read_sql with SQLAlchemy wrappers","manual cursor loops","read_csv","read_html"],a:0,ev:"pandas uses read_sql with SQLAlchemy wrappers, bypassing manual cursor loops."},
  {id:"d7q13",slide:9,topic:"Performance",type:"mc",diff:2,q:"Roughly how much faster is Parquet than the native CSV reader (1,450 ms vs 110 ms)?",opts:["≈13×","≈2×","≈60×","about the same"],a:0,ev:"S = 1,450 / 110 ≈ 13.18×, so Parquet reads roughly 13× faster than the native CSV reader."},
  {id:"d7q14",slide:9,topic:"Performance",type:"tf",diff:2,q:"Faster binary formats generally offer fewer features than slower text parsers.",a:true,ev:"The faster you go, the fewer features you get — some formats are tailored to specific tasks."}
