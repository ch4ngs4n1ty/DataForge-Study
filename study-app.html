{
  id:"d17",
  title:"Data Reduction",
  subtitle:"Cap 6 — data reduction families, the curse of dimensionality (feature selection, PCA, FA, MDS, LLE), data sampling, condensation, squashing, clustering, binning & cardinality",
  week:"w10",
  slides:[
    {n:1,title:"Data Reduction — Chapter Overview",blocks:[
      N("This card merges the title slide, the outline (deck slides 2–3) and the identical section dividers (deck slides 6, 18, 26). Card → deck slide: 2–3→4–5 · 4–14→7–17 · 15–21→19–25 · 22→27."),
      B("Overview",0,null,false),
      B("The Curse of Dimensionality",0,null,false),
      B("Data Sampling",0,null,false),
      B("Binning and Reduction of Cardinality",0,null,false)
    ],
      tr:"Today we begin our study of data reduction. As data sets grow larger and more complex, many machine learning algorithms become slower, more expensive, and sometimes less accurate. Data reduction creates smaller representations of the original data while preserving as much useful information as possible — the goal is not simply to make the data set smaller, but to reduce complexity while keeping the ability to discover the same patterns and build the same models. The chapter covers four topics: the data reduction overview, the curse of dimensionality, data sampling, and binning and cardinality reduction."},
    {n:2,title:"Overview",blocks:[
      B("Data reduction techniques can be applied to achieve a reduced representation of the data set.",0,null,false),
      B("The goal is to provide the mining process with a mechanism to produce the same (or almost the same) outcome when it is applied over reduced data instead of the original data.",0,null,false)
    ],
      tr:"Data reduction techniques create a smaller representation of a data set while trying to preserve its essential characteristics. Ideally, a mining algorithm applied to the reduced set produces results identical or very close to those from the original. Many modern data sets have millions of records and thousands of attributes — the realm of big data — and we may not have the ability or the time to analyze all of it, so sometimes we have to reduce it to get any meaningful information. The problem is, if we reduce the data set wrong, we could lose some of that meaning."},
    {n:3,title:"Overview",blocks:[
      DG("reduction-families"),
      B("Data Reduction techniques are usually categorized into three main families:",0,null,false),
      B("Dimensionality Reduction: ensures the reduction of the number of attributes or random variables in the data set.",1,null,false),
      B("Sample Numerosity Reduction: replaces the original data by an alternative smaller data representation",1,null,false),
      B("Cardinality Reduction: transformations applied to obtain a reduced representation of the original data",1,null,false)
    ],
      tr:"The authors divide data reduction into three major categories. Dimensionality reduction reduces the number of attributes; sample numerosity reduction reduces the number of observations; cardinality reduction reduces the number of possible values a variable can take. So the first is about reducing columns, the second about reducing rows, and the third about reducing the number of unique values in each attribute. Each approach attacks complexity from a different perspective."},
    {n:4,title:"The Curse of Dimensionality",blocks:[
      B("Dimensionality becomes a serious obstacle for the efficiency of most of the DM algorithms.",0,null,false),
      B("It has been estimated that as the number of dimensions increase, the sample size needs to increase exponentially in order to have an effective estimate of multivariate densities.",0,null,false)
    ],
      tr:"We begin with one of the most important motivations for data reduction: the curse of dimensionality — basically, having too many attributes. As the number of attributes increases, many algorithms become less effective. A high-dimensional space becomes increasingly sparse, making relationships among observations harder to estimate, and the amount of data needed to model the problem accurately grows dramatically, often exponentially. More attributes sounds like more information, but some may be noise or mean nothing — there is such a thing as too much data, and it can take too long to process."},
    {n:5,title:"The Curse of Dimensionality",blocks:[
      B("Several dimension reducers have been developed over the years.",0,null,false),
      B("Linear methods:",0,null,false),
      B("Factor analysis",1,null,false),
      B("MultiDimensional Scaling",1,null,false),
      B("Principal Components Analysis",1,null,false),
      B("Nonlinear methods:",0,null,false),
      B("Locally Linear Embedding",1,null,false),
      B("ISOMAP",1,null,false)
    ],
      tr:"Researchers have developed numerous methods to reduce dimensionality. Linear approaches include factor analysis, principal component analysis, and multidimensional scaling; non-linear approaches include locally linear embedding and ISOMAP (caption: “ISO mapping”). Each tries to represent the data with fewer variables while preserving the important information — looking for attributes that won't affect the outcome. Maybe a customer's address doesn't matter, or salary can be derived from job title, so there's no point keeping it."},
    {n:6,title:"The Curse of Dimensionality",blocks:[
      B("Feature Selection methods are aimed at eliminating irrelevant and redundant features, reducing the number of variables in the model.",0,null,false),
      B("To find an optimal subset B that solves the following optimization problem:",0,null,false),
      B("J(B)  criterion function",0,null,false),
      B("A  Original set of Features",0,null,false),
      B("Z  Subset of Features",0,null,false),
      B("d  minimum nº features",0,null,false),
      IMG("Formula: min J(Z)  s.t.  Z ⊂ A,  |Z| = d")
    ],
      tr:"Feature selection is one of the most common dimensionality reduction approaches: remove variables that are irrelevant or redundant. The challenge is determining which subset preserves the most useful information. Most methods look for a smaller subset of attributes that optimizes some evaluation criterion while minimizing the number of variables kept — for example, we may not need zip code because we can get it from city and state."},
    {n:7,title:"The Curse of Dimensionality: Principal Components Analysis",blocks:[
      B("Find a set of linear transformations of the original variables which could describe most of the variance using a relatively fewer number of variables.",0,null,false),
      B("It is usual to keep only the first few principal components that may contain 95% or more of the variance of the original data set.",0,null,false),
      B("PCA is useful when there are too many independent variables and they show high correlation.",0,null,false)
    ],
      tr:"Principal component analysis is one of the most widely used dimensionality reduction techniques. Rather than selecting existing variables, PCA creates new variables called principal components — linear combinations of the original attributes designed to capture as much variation as possible. Often only a few components explain most of the variability, so it's usually OK to keep just the first few principal components that contain 95% or more of the variance. Correlated attributes can be combined into a new one."},
    {n:8,title:"The Curse of Dimensionality: Principal Components Analysis",blocks:[
      B("Procedure:",0,null,false),
      B("Normalize input data.",1,null,false),
      B("Compute k orthonormal vectors (principal components).",1,null,false),
      B("Sort the PCs according to their strength, given by their eigenvalues.",1,null,false),
      B("Reduce data by removing weaker components.",1,null,false)
    ],
      tr:"The PCA process follows four major steps. First, the data is normalized — an important step. Second, the principal components are computed. Third, the components are ranked by importance, measured using energy values (the slide: eigenvalues). Finally, the weaker components are discarded, producing a lower-dimensional representation. So: normalize, compute, rank, and keep only the important ones."},
    {n:9,title:"The Curse of Dimensionality: Principal Components Analysis",blocks:[
      DG("pca-axes"),
      IMG("Figure caption: “PCA. X′ and Y′ are the first two principal components obtained”")
    ],
      tr:"This figure illustrates the idea behind PCA. Although the original data may have many dimensions, much of the variation often lies in only a few directions; PCA identifies those directions and uses them to create a compact representation of the data set."},
    {n:10,title:"The Curse of Dimensionality: Factor Analysis",blocks:[
      B("Similar to PCA in the deduction of a semaller set of variables.",0,null,false),
      B("Different because it does not seek to find transformations for the given attributes. Instead, its goal is to discover hidden factors in the current variables.",0,null,false)
    ],
      tr:"Factor analysis is similar to PCA because both reduce the number of variables. The difference is that PCA creates new transformed variables, while factor analysis tries to identify hidden factors that explain the observed relationships among variables. In other words, PCA is primarily a data reduction tool, while factor analysis is often used to uncover underlying constructs."},
    {n:11,title:"The Curse of Dimensionality: Factor Analysis",blocks:[
      B("The factor analysis problem can be stated as given the attributes A, along with the mean μ, we endeavor to find the set of factors F and the associated loadings L, and therefore the next equation is accurate.",0,null,false),
      IMG("Formula: A − μ = LF + ε")
    ],
      tr:"In factor analysis, observed variables are viewed as being influenced by a smaller number of hidden factors. The objective is to estimate those factors and determine how strongly each original variable depends on them. This approach is common in psychology, marketing research, and the social sciences."},
    {n:12,title:"The Curse of Dimensionality: Factor Analysis",blocks:[
      DG("fa-transform"),
      IMG("Figure: an elongated data cloud on X–Y axes → (arrow) → a compact data cloud on the new X′–Y′ axes")
    ],
      tr:"This figure illustrates how a collection of observed variables can be explained through a smaller set. By replacing many variables with only a few factors, dimensionality can be reduced."},
    {n:13,title:"The Curse of Dimensionality: MultiDimensional Scaling",blocks:[
      B("Method for situating a set of points in a low space such that a classical distance measure (like Euclidean) between them is as close as possible to each pair of points.",0,null,false),
      B("We can compute the distances in a dimensional space of the original data and then to use as input this distance matrix, which then projects it in to a lower-dimensional space so as to preserve these distances.",0,null,false)
    ],
      tr:"Multidimensional scaling seeks to preserve distances among observations. It begins by computing pairwise distances in the original high-dimensional space, then projects the data into a lower-dimensional space while preserving those distances as closely as possible. MDS is especially useful for visualization and exploratory data analysis."},
    {n:14,title:"The Curse of Dimensionality: Locally Linear Embedding",blocks:[
      B("LLE recovers global nonlinear structure from locally linear fits.",0,null,false),
      B("Its main idea is that each local patch of the manifold can be approximated linearly and given enough data, each point can be written as a linear, weighted sum of its neighbors.",0,null,false)
    ],
      tr:"Locally linear embedding is a nonlinear dimensionality reduction technique. The key idea is that, although the global structure of the data may be complex, local neighborhoods can often be approximated by simple linear relationships. LLE preserves these local relationships while constructing a lower-dimensional representation of the whole data set."},
    {n:15,title:"Data Sampling",blocks:[
      B("To reduce the number of instances submitted to the DM algorithm.",0,null,false),
      B("To support the selection of only those cases in which the response is relatively homogeneous.",0,null,false),
      B("To assist regarding the balance of data and occurrence of rare events.",0,null,false),
      B("To divide a data set into three data sets to carry out the subsequent analysis of DM algorithms.",0,null,false)
    ],
      tr:"Now we move from reducing the number of attributes to reducing the number of observations. Data sampling reduces the number of instances submitted to a learning algorithm. Large data sets need more storage, memory, and computation; by selecting representative subsets we can often get similar results at far lower cost. Think of Amazon finding relationships between products — billions, if not trillions, of sales; using all of them would be very expensive, so we don't want to use everything."},
    {n:16,title:"Data Sampling",blocks:[
      B("Forms of data sampling (T  data set, N  nº examples):",0,null,false),
      B("Simple random sample without replacement (SRSWOR) of size s: This is created by drawing s of the N tuples from T (s < N), where the probability of drawing any tuple in T is 1/N.",0,null,false),
      B("Simple random sample with replacement (SRSWR) of size s: Similar to SRSWOR, except that each time a tuple is drawn from T , it is recorded and replaced.",0,null,false)
    ],
      tr:"There are two common forms of simple random sampling. In sampling without replacement, an observation can be selected only once; in sampling with replacement, observations may be selected multiple times. Both try to create samples that accurately represent the original population."},
    {n:17,title:"Data Sampling",blocks:[
      DG("sampling-forms"),
      B("Forms of data sampling (T  data set, N  nº examples):",0,null,false),
      B("Balanced sample: The sample is designed according to a target variable and is forced to have a certain composition according to a predefined criterion.",0,null,false),
      B("Cluster sample: If the tuples in T are grouped into G mutually disjointed clusters, then an SRS of s clusters can be obtained, where s < G.",0,null,false),
      B("Stratified sample: If T is divided into mutually disjointed parts called strata, a stratified sample of T is generated by obtaining an SRS at each stratum",0,null,false)
    ],
      tr:"Several specialized sampling methods are also common. Balanced sampling controls the class proportions; cluster sampling selects entire groups of observations; stratified sampling divides the data into strata and draws samples from each group. These are often preferred because they preserve important characteristics of the original data set."},
    {n:18,title:"Data Sampling:  Data Condensation",blocks:[
      B("It emerges from the fact that naive sampling methods, such as random sampling or stratified sampling, are not suitable for real-world problems with noisy data since the performance of the algorithms may change unpredictably and significantly.",0,null,false),
      B("They attempt to obtain a minimal set which correctly classifies all the original examples.",0,null,false)
    ],
      tr:"Naive sampling methods don't always work well, particularly when data sets contain noise. Data condensation techniques aim to produce a minimal set of examples that still correctly satisfies the original observations — preserving predictive performance while removing unnecessary records."},
    {n:19,title:"Data Sampling:  Data Squashing",blocks:[
      B("A data squashing method seeks to  compress, or “squash”, the data in such a way that a statistical analysis carried out on the compressed data obtains the same outcome that the one obtained with the original data set.",0,null,false),
      B("Schemes:",0,null,false),
      B("Original Data Squashing (DS).",1,null,false),
      B("Likelihood-based Data Squashing (LDS).",1,null,false)
    ],
      tr:"Data squashing compresses a data set into a smaller representation while preserving its statistical properties, so analyses on the compressed data give results very similar to analyses on the original. It focuses on preserving information rather than individual observations. The authors mention two approaches: original data squashing and likelihood-based data squashing."},
    {n:20,title:"Data Sampling:  Data Clustering",blocks:[
      B("Clustering algorithms partition the data examples into groups, or clusters, so that data samples within a cluster are “similar” to one another and different to data examples that belong to other clusters.",0,null,false),
      B("Clusters the data could be used instead of the actual data.",0,null,false)
    ],
      tr:"Clustering can also serve as a data reduction technique. Instead of working with every observation, clusters are created and represented by summaries such as centroids, giving a compact representation of the original data set."},
    {n:21,title:"Data Sampling:  Data Clustering",blocks:[
      DG("cluster-centroids"),
      IMG("Figure: three dashed clusters of points, each with its centroid shown as a filled dot")
    ],
      tr:"Here's the idea of clustering: we cluster the points together and maybe keep just the centroids. That reduces the set quite a bit, but we still have the meaning — the centroid is the meaning. Rather than analyzing thousands of points, we may analyze only a handful of clusters."},
    {n:22,title:"Binning and Reduction of Cardinality",blocks:[
      B("Binning is the process of converting a continuous variable into a set of ranges.",0,null,false),
      B("(0–5,000; 5,001–10,000; 10,001–15,000, . . . , etc.)",0,null,false),
      B("Cardinality reduction of nominal and ordinal variables is the process of combining two or more categories into one new category.",0,null,false),
      B("Binning is the easiest and direct way of discretization.",0,null,false)
    ],
      tr:"The final topic is reducing cardinality — the number of unique values stored in each attribute. Binning converts continuous variables into interval ranges (his example: income 0–50,000, 50,001–100,000, over 100,000; the slide uses 0–5,000, 5,001–10,000…). Cardinality reduction applies the same idea to categories, merging them into broader groups — at RIT, instead of every job title (non-tenure track, tenure track, facility management…) we might group people into faculty, staff, and admin. Binning is one of the simplest forms of discretization (caption: “decentralization”): information is lost, but the result is easier for humans and algorithms to process. The key lesson: done correctly, reducing data does not necessarily mean losing information."}
  ],
  topics:[

  ]
}

    {n:5,title:"Perspectives: Search of a Subset of Features",blocks:[
      B("FS can be considered as a search problem, where each state of the search space corresponds to a concrete subset of features selected.",0,null,false),
      B("The selection can be represented as a binary array, with each element corresponding to the value 1, if the feature is currently selected by the algorithm and 0, if it does not occur.",0,null,false),

    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:6,title:"Perspectives: Search of a Subset of Features",blocks:[
      DG("search-directions"),
      B("Search Directions:",0,null,false),
      B("Sequential Forward Generation (SFG): It starts with an empty set of features S. As the search starts, features are added into S according to some criterion that distinguish the best feature from the others. S grows until it reaches a full set of original features. The stopping criteria can be a threshold for the number of relevant features m or simply the generation of all possible subsets in brute force mode.",1,null,false),
      B("Sequential Backward Generation (SBG): It starts with a full set of features and,iteratively, they are removed one at a time. Here, the criterion must point out the worst or least important feature. By the end, the subset is only composed of a unique feature, which is considered to be the most informative of the whole set. As in the previous case, different stopping criteria can be used.",1,null,false)
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:7,title:"Perspectives: Search of a Subset of Features",blocks:[
      N("The algorithm box on this slide is an image — transcribed below."),
      B("Search Directions:",0,null,false),
      IMG("Algorithm 1 Sequential forward feature set generation - SFG."),
      CODE("function SFG(F - full set, U - measure)\n  initialize: S = {}          ▷ S stores the selected features\n  repeat\n    f = FindNext(F)\n    S = S ∪ {f}\n    F = F − {f}\n  until S satisfies U or F = {}\n  return S\nend function")
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:8,title:"Perspectives: Search of a Subset of Features",blocks:[
      N("The algorithm box on this slide is an image — transcribed below."),
      B("Search Directions:",0,null,false),
      IMG("Algorithm 2 Sequential backward feature set generation - SBG."),
      CODE("function SBG(F - full set, U - measure)\n  initialize: S = {}          ▷ S holds the removed features\n  repeat\n    f = GetNext(F)\n    F = F − {f}\n    S = S ∪ {f}\n  until S does not satisfy U or F = {}\n  return F ∪ {f}\nend function")
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:9,title:"Perspectives: Search of a Subset of Features",blocks:[
      B("Search Directions:",0,null,false),
      B("Bidirectional Generation (BG): Begins the search in both directions, performing SFG and SBG concurrently. They stop in two cases: (1) when one search finds the best subset comprised of m features before it reaches the exact middle, or (2) both searches achieve the middle of the search space. It takes advantage of both SFG and SBG.",1,null,false),
      B("Random Generation (RG): It starts the search in a random direction. The choice of adding or removing a features is a random decision. RGtries to avoid the stagnation into a local optima by not following a fixed way for subset generation. Unlike SFG or SBG, the size of the subset of features cannot be stipulated.",1,null,false)
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:10,title:"Perspectives: Search of a Subset of Features",blocks:[
      N("The algorithm box on this slide is an image — transcribed below."),
      B("Search Directions:",0,null,false),
      IMG("Algorithm 3 Bidirectional feature set generation - BG."),
      CODE("function BG(F_f, F_b - full set, U - measure)\n  initialize: S_f = {}        ▷ S_f holds the selected features\n  initialize: S_b = {}        ▷ S_b holds the removed features\n  repeat\n    f_f = FindNext(F_f)\n    f_b = GetNext(F_b)\n    S_f = S_f ∪ {f_f}\n    F_b = F_b − {f_b}\n    F_f = F_f − {f_f}\n    S_b = S_b ∪ {f_b}\n  until (a) S_f satisfies U or F_f = {} or (b) S_b does not satisfy U or F_b = {}\n  return S_f if (a) or F_b ∪ {f_b} if (b)\nend function")
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:11,title:"Perspectives: Search of a Subset of Features",blocks:[
      N("The algorithm box on this slide is an image — transcribed below."),
      B("Search Directions:",0,null,false),
      IMG("Algorithm 4 Random feature set generation - RG."),
      CODE("function RG(F - full set, U - measure)\n  initialize: S = S_best = {}  ▷ S - subset set\n  initialize: C_best = #(F)    ▷ # - cardinality of a set\n  repeat\n    S = RandGen(F)\n    C = #(S)\n    if C ≤ C_best and S satisfies U then\n      S_best = S\n      C_best = C\n    end if\n  until some stopping criterion is satisfied\n  return S_best               ▷ Best set found so far\nend function")
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:12,title:"Perspectives: Search of a Subset of Features",blocks:[
      N("The sentence “the search space is, independent of…” is incomplete on the slide itself (its formula is missing in the original deck)."),
      DG("search-strategies"),
      B("Search Strategies:",0,null,false),
      B("Exhaustive Search: It corresponds to explore all possible subsets to find the optimal ones. As we said before, the space complexity is  O(2ᴹ). If we establish a threshold m of minimum features to be selected and the direction of search, the search space is, independent of the forward or backward generation. Only exhaustive search can guarantee the optimality. Nevertheless, they are also impractical in real data sets with a high M.",1,null,false),
      B("Heuristic Search: It employs heuristics to carry out the search. Thus, it prevents brute force search, but it will surely find a non-optimal subset of features. It draws a path connecting the beginning and the end of the previous Figure, such in a way of a depth-first search. The maximum length of this path is M and the number of subsets generated is O(M). The choice of the heuristic is crucial to find a closer optimal subset of features in a faster operation.",1,null,false)
    ],
      tr:"No lecture caption for this deck — none was available, so this card has slide content only."},
    {n:13,title:"Perspectives: Search of a Subset of Features",blocks:[
      B("Search Strategies:",0,null,false),
      B("Nondeterministic Search: Complementary combination of the previous two. It is also known as random search strategy and can generate best subsets constantly and keep improving the quality of selected features as time goes by. In each step, the next subset is obtained at random.",1,null,false),
      B("it is unnecessary to wait until the search ends.",2,null,false),
      B("we do not know when the optimal set is obtained, although we know which one is better than the previous one and which one is the best at the moment.",2,null,false)

    {n:14,title:"Perspectives: Selection Criteria",blocks:[

    {n:15,title:"Perspectives: Selection Criteria",blocks:[
      B("Distance Measures.",1,null,false),
      B("Measures of separability, discrimination or divergence measures . The most typical is derived from distance between the class conditional density functions.",2,null,false),
      TBL(["Distance", "Mathematical form"],[["Euclidean distance", "D_e = {Σ_{i=1..m} (x_i − y_i)²}^(1/2)"], ["City-block distance", "D_cb = Σ_{i=1..m} |x_i − y_i|"], ["Cebyshev distance", "D_ch = max_i |x_i − y_i|"], ["Minkowski distance of order m", "D_M = {Σ_{i=1..m} (x_i − y_i)^m}^(1/m)"], ["Quadratic distance Q, positive definite", "D_q = Σ_{i=1..m} Σ_{j=1..m} (x_i − y_i) Q_ij (x_j − y_j)"], ["Canberra distance", "D_ca = Σ_{i=1..m} |x_i − y_i| / (x_i + y_i)"], ["Angular separation", "D_as = Σ_{i=1..m} x_i·y_i / [Σ_{i=1..m} x_i² Σ_{i=1..m} y_i²]^(1/2)"]])

      B("Pearson correlation coefficient:",2,null,false),
      IMG("Formula (Pearson correlation coefficient): ρ(X, Y) = Σ_i (x_i − x̄)(y_i − ȳ) / [Σ_i (x_i − x̄)² Σ_i (y_i − ȳ)²]^(1/2)")

    {n:17,title:"Perspectives: Selection Criteria",blocks:[

      B("Feature Ranking Techniques:",0,null,false),
      IMG("Algorithm 5 A univariate feature ranking algorithm."),
      CODE("function Ranking Algorithm(x - features, U - measure)\n  initialize: list L = {}       ▷ L stores ordered features\n  for each feature x_i, i ∈ {1, . . . , M} do\n    v_i = compute(x_i, U)\n    position x_i into L according to v_i\n  end for\n  return L in decreasing order of feature relevance.\nend function")

      B("Minimum Subset Techniques:",0,null,false),
      IMG("Algorithm 6 A minimum subset algorithm."),
      CODE("function Min-Set Algorithm(x - features, U - measure)\n  initialize: L = {}, stop = false   ▷ S holds the minimum set\n  repeat\n    S_k = SubsetGenerate(x)          ▷ stop can be set here\n    if Legitimacy(S_k, U) is true and #(S_k) < #(S) then\n      S = S_k                        ▷ S is replaced by S_k\n    end if\n  until stop = true\n  return S - the minimum subset of features\nend function")

    {n:5,title:"Training Set Selection vs. Prototype Selection",blocks:[
      B("Several terms have been used for selecting the most relevant data from the training set.",0,null,false),
      B("Instance selection is the most general one and was thought to work with other learning methods, such as decision trees, ANNs or SVMs.",0,null,false),
      B("Nowadays, there are two clear distinctions in the literature: Prototype Selection (PS) and Training Set Selection (TSS).",0,null,false)
    ],
      tr:"Historically, many terms have been used for selecting relevant examples. Today, the literature typically separates prototype selection from training set selection."},

    {n:8,title:"Prototype Selection Taxonomy — Direction of Search",blocks:[
      B("Common properties:",0,null,false),
      B("Direction of Search.",1,null,false),
      B("Incremental. An incremental search begins with an empty subset S, and adds each instance in T R to S if it fulfills some criteria.",2,null,false),
      B("Decremental. The decremental search begins with S = T R, and then searches for instances to remove from S",2,null,false),
      B("Batch. Decremental removing more than one instance.",2,null,false),
      B("Mixed. begins with a pre-selected subset S and iteratively can add or remove any instance which meets the specific criterion",2,null,false),
      B("Fixed. The number of instances is user-defined.",2,null,false)
    ],
      tr:"The first taxonomy category describes how the algorithm searches for prototypes: methods may be incremental, decremental, batched (slide: “Batch”), mixed, or fixed."},
    {n:9,title:"Prototype Selection Taxonomy — Type of Selection",blocks:[
      DG("ps-selection-types"),
      B("Common properties:",0,null,false),
      B("Type of Selection.",1,null,false),
      B("Condensation. retain the points which are closer to the decision boundaries, also called border points.",2,null,false),
      B("Edition. seek to remove border points. They remove points that are noisy or do not agree with their neighbors.",2,null,false),
      B("Hybrid. They try to find the smallest subset S which maintains or even increases the generalization accuracy in test data.",2,null,false)
    ],
      tr:"The second taxonomy category focuses on the purpose of the selection: condensation preserves the boundary points, editing removes the noisy points, and hybrid approaches attempt to balance the goals."},
    {n:10,title:"Prototype Selection Taxonomy — Evaluation of Search",blocks:[
      B("Common properties:",0,null,false),
      B("Evaluation of Search.",1,null,false),
      B("Filter. When the kNN rule is used for partial data to determine the criteria of adding or removing and no leave-one-out validation scheme is used to obtain a good estimation of generalization accuracy.",2,null,false),
      B("Wrapper. When the kNN rule is used for the complete training set with the leave-one-out validation scheme. The conjunction in the use of the two mentioned factors allows us to get a great estimation of generalization accuracy, which helps to obtain better accuracy over test data.",2,null,false)
    ],
      tr:"The third classification criterion concerns evaluation strategy. Filter approaches evaluate local criteria, while wrapper approaches repeatedly estimate the classification performance using leave-one-out validation. This is very similar to feature selection — last week's filtering and wrapping to reduce the set down is the same basic process here."},
    {n:11,title:"Prototype Selection Taxonomy — Criteria to Compare PS Methods",blocks:[

    {n:18,title:"Prototype Selection Taxonomy — Taxonomy",blocks:[
      N("The figure on this slide is an image — reconstructed as SVG and transcribed below (checked visually). Cropped in the source: the Mixed + Wrapper list runs off the bottom of the figure; its last visible entry is a partly cut-off “SVOIS”."),
      H("Taxonomy"),
      DG("ps-taxonomy"),
      CODE("PS Methods\nCondensation → Incremental: CNN, Ullmann, TCNN, MNV, MCNN, GCNN, FCNN, PSC, RNNR, ATISA\nCondensation → Decremental: RNN, SNN, Shrink, MCS, MSS\nCondensation → Batch: IKNN, POP, Reconsistent, TRKNN\nEdition → Decremental: ENN, Multiedit, RNGE, MENN, NCNEdit, ENRBF, ENNTh, LSVM\nEdition → Batch: AllKNN, MoCS, RP-Edit, FRPS\nHybrid → Incremental: IB3, CRIS\nHybrid → Decremental → Filter: VSM, PF, DROP3, PSRCG, Cpruner, SVBPS, NRMCS, EVA\nHybrid → Decremental → Wrapper: BSE\nHybrid → Batch: ICF, HMNEI, CCIS, ISCC, CCV, Bien, BEPS, SIR, D-PS, RDCL\nHybrid → Mixed + Wrapper: Explore, GGA, CerveronTS, EDA, IGA, ZhangTS, CHC, GGA-MSE-CC-FSM, SSMA, CoCoIS, SeqRA, CBIS, MSGA, Ant-PR, SVOIS [cut off]\nHybrid → Fixed + Wrapper: RMHC\nHybrid → Mixed + Filter: CBP, IRB, VISOM, DSC")
    ],
      tr:"This slide summarizes the prototype selection landscape before examining individual algorithms. The sections are condensation, edition (caption: “addition”) and hybrid, and they break down further into incremental, decremental and batch — whether they're fixed and have a wrapper, or mixed and have a wrapper and a filter. There are hundreds of methods for doing this; we are not going to learn all of them, just some basic ideas."},
    {n:19,title:"Description of Methods — Condensation: CNN",blocks:[
      H("Condensation"),
      B("This algorithm finds a subset S of the training set TR such that every member of TR is closer to a member of S of the same class than to a member of S of a different class. It begins by randomly selecting one instance belonging to each output class from TR and putting them in S.Then each instance inT Ris classified using only the instances in S. If an instance is misclassified, it is added to S, thus ensuring that it will be classified correctly. This process is repeated until there are no instances in T R that are misclassified.",0,"Condensed Nearest Neighbor (CNN) —",false)
    ],
      tr:"Condensed nearest neighbor starts with one instance from each class. Whenever an observation is misclassified, it is added to the selected subset, and the process continues until all examples are classified correctly (caption: “are set or classified correctly”). In other words: grab one instance from each class, try to classify, add anything misclassified to the selected subset, and repeat until everything is classified properly."},
    {n:20,title:"Description of Methods — Condensation: FCNN",blocks:[
      H("Condensation"),
      B("The FCNN1 algorithm starts by introducing in S the centroids of each class. Then, for each prototype p in S, its nearest enemy inside its Voronoi region is found, and add to S. This process is performed iteratively until no enemies are found on a single iteration.",0,"Fast Condensed Nearest Neighbor family (FCNN) —",false),
      B("The FCNN2 algorithm is similar to FCNN1 but, instead of adding the nearest enemy on each Voronoi region, is added the centroid of the enemies found in the region.",0,null,false),
      B("The FCNN3 algorithm is similar to FCNN1 but, instead of adding one prototype per region in each iteration, only one prototype is added (the one which belongs to the Voronoi region with most enemies). In FCNN3, S is initialized only with the centroid of the most populated Class.",0,null,false)
    ],
      tr:"FCNN, the Fast Condensed Nearest Neighbor family, improves efficiency by using centroids and nearest enemies to choose prototypes — not nearest neighbors but nearest enemies, “things that aren't supposed to be the same as me.” The professor says these won't be covered in any real detail: there are a lot to cover, so they are discussed only in general."},
    {n:21,title:"Description of Methods — Condensation: RNN",blocks:[
      H("Condensation"),
      B("RNN starts with S = TR and removes each instance from S if such a removal does not cause any other instances in TR to be misclassified by the instances remaining in S. It will always generate a subset of the results of CNN algorithm.",0,"Reduced Nearest Neighbor (RNN) —",false)
    ],
      tr:"Reduced nearest neighbor (caption: “Reduce nearest neighbors”) starts with the complete data set and removes examples whenever they are not necessary for correct classification — it determines that a row isn't needed and doesn't help the classification, so it removes it."},
    {n:22,title:"Description of Methods — Condensation: POP",blocks:[
      H("Condensation"),
      B("This algorithm consists of eliminating the examples that are not within the limits of the regions to which they belong. For it, each attribute is studied separately, sorting and increasing a value, called weakness, associated to each one of the instances, if it is not within a limit. The instances with a value of weakness equal to the number of attributes are eliminated.",0,"Patterns by Ordered Projections (POP) —",false)
    ],
      tr:"POP (caption: “Patterns of Ordered Projections”; slide: “Patterns by Ordered Projections”) examines attributes individually and removes examples that consistently fall outside important regions."},
    {n:23,title:"Description of Methods — Edition: ENN",blocks:[
      H("Edition"),
      B("Wilson developed this algorithm which starts with S = TR and then each instance in S is removed if it does not agree with the majority of its k nearest neighbors.",0,"Edited Nearest Neighbor (ENN) —",false)
    ],
      tr:"Edited nearest neighbor removes instances whose labels disagree with the majority class amongst their nearest neighbors. It is one of the most influential noise-filtering techniques, so it can be used to filter out noise along with data set reduction."},
    {n:24,title:"Description of Methods — Edition: Multiedit",blocks:[
      N("The algorithm box on this slide is an image — transcribed below (checked visually)."),
      H("Edition"),
      B("This method proceeds as follows.",0,"Multiedit —",false),
      CODE("Let S = TR.\nDo\n   Let R = S.\n   Let S = ∅ and randomly split R into b blocks: R_1, ..., R_b,\n   where b > 2\n   For each b_i block\n      Add to S the prototypes from R_{b_i} that are\n      misclassified using the KNN rule with R_{(b_i+1) mod b}.\nWhile S ≠ R.")
    ],
      tr:"Multiedit repeatedly partitions and edits subsets of the data to remove noisy observations."},
    {n:25,title:"Description of Methods — Edition: RNGE",blocks:[
      N("The definition and editing scheme on this slide are an image — transcribed below (checked visually). “if ad only if” — typo preserved from the source."),
      H("Edition"),
      B("A Proximity Graph (PG), G = (V, E), is an undirected graph with a set of vertices V = TR, and a set of edges, E, such that (t_i, t_j) ∈ E if ad only if t_i and t_j satisfy some neighborhood relation. In this case, we say that t_i and t_j are graph neighbors. The graph neighbors of a given point constitute its graph neighborhood. The graph neighborhood of a subset, S ⊆ V, consists of the union of all the graph neighbors of every node in S. The scheme of editing can be expressed in the following way.",0,"Relative Neighborhood Graph Edition (RNGE) —",false),
      B("1. Construct the corresponding PG.",0,null,false),
      B("2. Discard those instances that are misclassified by their graph neighbors (by the usual voting criterion).",0,null,false),
      CODE("(t_i, t_j) ∈ E ⇔ d(t_i, t_j) ≤ max(d(t_i, t_k), d(t_j, t_k)), ∀t_k ∈ T, k ≠ i, j.")
    ],
      tr:"Relative neighborhood graph edition (caption: “addition”) uses graph relationships amongst the instances to identify inconsistent observations and remove them."},
    {n:26,title:"Description of Methods — Edition: All KNN",blocks:[
      H("Edition"),
      B("All KNN is an extension of ENN. The algorithm, for i = 0 to k flags as bad any instance not classified correctly by its i nearest neighbors. When the loop is completed k times, it removes the instances flagged as bad.",0,"All KNN —",false)
    ],
      tr:"All KNN extends ENN (caption: “E and N”) by testing multiple neighborhood sizes; an instance is removed if it is repeatedly misclassified across neighborhood sizes."},
    {n:27,title:"Description of Methods — Hybrid: IB3",blocks:[
      N("The algorithm box on this slide is an image — transcribed below (checked visually)."),
      H("Hybrid"),
      B("The IB3 algorithm proceeds as follows:",0,"Instance-Based Learning Algorithms Family (IB3) —",false),
      CODE("For each instance X_i in TR\n   Let a be the nearest acceptable instance in S to X_i.\n   (if there are no acceptable instances in S,\n   let a be a random instance in S)\n   If class(a) ≠ class(X_i) then add X_i to S.\n   For each instance s in S\n      If s is at least as close to X_i as a is\n         Update the classification record of s\n         and remove s from S its classification\n         record is significantly poor.\nRemove all non-acceptable instance from S.")
    ],
      tr:"Instance-based learning algorithms belong to the instance-based learning family. The algorithm continually evaluates which stored examples are reliable and removes those that are not."},
    {n:28,title:"Description of Methods — Hybrid: DROP",blocks:[
      H("Hybrid"),
      B("Each instance Xi has k nearest neighbors where k is typically a small odd integer. Xi also has a nearest enemy, which is the nearest instance with a different output class. Those instances that have xi as one of their k nearest neighbors are called associates of Xi.",0,"Decremental Reduction Optimization Procedure Family (DROP) —",false)
    ],
      tr:"DROP introduces the concept of associates. Before removing an instance, the algorithm determines whether neighboring examples continue to classify correctly without it."},
    {n:29,title:"Description of Methods — Hybrid: DROP1",blocks:[
      N("The algorithm box on this slide is an image — transcribed below (checked visually)."),
      H("Hybrid"),
      B("DROP1",0,null,false),
      CODE("DROP1 (Training set TR): Selection set S.\nLet S = TR.\nFor each instance X_i in S:\n   Find the k + 1 nearest neighbors of X_i in S.\n   Add X_i to each of its lists of associates.\nFor each instance X_i in S:\n   Let with = # of associates of X_i classified\n   correctly with X_i as a neighbor.\n   Let without = # of associates of X_i classified\n   correctly without X_i.\n   If without ≥ with\n      Remove X_i from S.\n      For each associate a of X_i\n         Remove X_i from a's list of neighbors.\n         Find a new nearest neighbor for a.\n         Add a to its new list of associates.\n      For each neighbor b of X_i\n         Remove X_i from b's lists of associates.\n   Endif\nReturn S.")
    ],
      tr:"DROP1 removes an instance whenever its associates remain correctly classified. This creates a reduced training set while preserving the logical structure."},
    {n:30,title:"Description of Methods — Hybrid: DROP2 / DROP3",blocks:[
      H("Hybrid"),
      B("DROP2: In this method, the removal criterion can be restated as: Remove Xi if at least as many of its associates in TR would be classified correctly without Xi. Using this modification, each instance Xi in the original training set TR continues to maintain a list of its k + 1 nearest neighbors in S, even after Xi is removed from S. DROP2 also changes the order of removal of instances. It initially sorts the instances in S by the distance to their nearest enemy.",0,null,false),
      B("DROP3: It is a combination of DROP2 and ENN algorithms. DROP3 uses a noise-filtering pass before sorting the instances in S (Wilson ENN editing). After this, it works identically to DROP2.",0,null,false)
    ],
      tr:"DROP2 refines the removal criteria and processes examples according to their distance from their nearest enemy; this often produces better reductions than DROP1. DROP3 first applies an ENN filter to remove noise and then performs the DROP2 reduction (caption: “drop to reduction”). This combination greatly improves subset quality."},
    {n:31,title:"Description of Methods — Hybrid: ICF",blocks:[
      N("The two formulas on this slide are an image — transcribed below (checked visually). In the source the Reachability formula overlaps the first line of the next paragraph; the text layer gives that line in full. “Reachabili ty” — spacing preserved from the source."),
      H("Hybrid"),
      B("ICF defines local set L(x) which contain all cases inside largest hypersphere centered in xi such that the hypersphere contains only cases of the same class as instance xi. Authors define two properties, reachability and coverage:",0,"Iterative Case filtering (ICF) —",false),
      CODE("Coverage(X_i) = {X'_i ∈ TR : X_i ∈ L(X'_i)},\n\nReachability(X_i) = {X'_i ∈ TR : X'_i ∈ L(X_i)},"),
      B("In the first phase ICF uses the ENN algorithm to remove the noise from the training set. In the second phase the ICF algorithm removes each instance Xi for which the Reachabili ty(Xi) is bigger than the Coverage(Xi). This procedure is repeated for each instance in TR. After that ICF recalculates reachability and coverage properties and restarts the second phase.",0,null,false)
    ],
      tr:"Iterative case filtering introduces reachability and coverage. Instances are removed when their reachability exceeds their coverage, and the process repeats iteratively."},
    {n:32,title:"Description of Methods — Hybrid: RMHC",blocks:[
      H("Hybrid"),
      B("It randomly selects a subset S from TR which contains a fixed number of instances s (s = %|T R|). In each iteration, the algorithm interchanges an instance from S with another from TR - S. The change is maintained if it offers better accuracy.",0,"Random Mutation Hill Climbing (RMHC) —",false)
    ],
      tr:"Random mutation hill climbing treats prototype selection as an optimization problem: candidate solutions are repeatedly modified, and only improvements are retained."},
    {n:33,title:"Description of Methods — Hybrid: SSMA",blocks:[
      N("The algorithm box on this slide is an image — transcribed below (checked visually)."),
      H("Hybrid"),
      B("Steady-state memetic algorithm (SSMA) —",0,null,false),
      CODE("Initialize population\nWhile (not termination-condition) do\n   Use binary tournament to select two parents\n   Apply crossover operator to create\n   offspring (Off_1, Off_2)\n   Apply mutation to Off_1 and Off_2\n      Evaluate Off_1 and Off_2\n      For each Off_i\n         Invoke Adaptive-P_LS-mechanism to\n         obtain P_LS_i for Off_i\n         If υ(0, 1) < P_LS_i then\n            Perform meme optimization for Off_i\n         End if\n      End for\n   Employ standard replacement for Off_1 and Off_2\nEnd while\nReturn the best chromosome")
    ],
      tr:"The steady-state memetic algorithm combines evolutionary search with local optimization techniques to discover highly effective prototype subsets."},
    {n:34,title:"Related and Advanced Topics — Prototype Generation",blocks:[
      H("Prototype Generation"),
      B("Prototype generation methods are not limited only to select examples from the training set. They could also modify the values of the samples, changing their position in the d-dimensional space considered. Most of them usemerging or divide and conquer strategies to set new artificial samples, or are based on clustering approaches, Learning Vector Quantization hybrids, advanced proposals and evolutionary algorithms based schemes.",0,null,false)
    ],
      tr:"Unlike prototype selection, prototype generation can create entirely new artificial examples rather than simply selecting from existing observations."},

 {id:"d4q4",slide:5,topic:"Data Sets & Partitioning",type:"mc",diff:2,q:"Which statement matches the slide's definition of overfitting?",opts:["The model is too tightly adjusted to data, high precision on known cases but poor with unseen data","The model is too simple to capture structure","The model uses only one fold","The model ignores the training data"],a:0,ev:"Overfitting happens when the model is too tightly adjusted to data offering high precision to known cases but behaving poorly with unseen data."},
 {id:"d4q5",slide:7,topic:"Data Sets & Partitioning",type:"tf",diff:2,q:"Overfitting is easy to notice using only the training data.",a:false,ev:"Adjusting such a model to better fit the data may lead to overfitting — the lack of unseen case makes impossible to notice this situation."},
 {id:"d4q6",slide:9,topic:"Cross-Validation",type:"mc",diff:1,q:"In k-Fold Cross Validation (k-FCV), how is the data set partitioned?",opts:["Randomly into k equal size folds/partitions","Into a single training set only","By class label alphabetically","Into two overlapping halves"],a:0,ev:"In k-FCV, the original data set is randomly partitioned into k equal size folds or partitions."},
 {id:"d4q7",slide:9,topic:"Cross-Validation",type:"mc",diff:2,q:"During each k-FCV iteration, which partitions build the model?",opts:["The remaining k − 1 subsamples build the model; one is retained for validation","All k partitions build the model","Only one partition builds the model","None — the model is not rebuilt"],a:0,ev:"One is retained as the validation data for testing the model, and the remaining k − 1 subsamples are used to build the model."},
 {id:"d4q8",slide:11,topic:"Cross-Validation",type:"mc",diff:1,q:"Which values of k are described as the most common?",opts:["5 and 10","2 and 3","50 and 100","1 and 2"],a:0,ev:"The value of k may vary, 5 and 10 being the most common ones."},
 {id:"d4q9",slide:11,topic:"Cross-Validation",type:"tf",diff:2,q:"For smaller data sets, 5-FCV is more frequent while 10-FCV is used for big data sets.",a:true,ev:"If big data sets are being used, 10-FCV is usually utilized; for smaller data sets 5-FCV is more frequent."},
 {id:"d4q10",slide:12,topic:"Cross-Validation",type:"mc",diff:2,q:"What does stratified k-FCV do to avoid disarranging class proportions?",opts:["Places an equal number of samples of each class on each partition","Removes the minority class","Uses only one fold","Doubles the data set"],a:0,ev:"Stratified k-FCV places an equal number of samples of each class on each partition to maintain class distributions equal in all partitions."},
 {id:"d4q11",slide:13,topic:"Cross-Validation",type:"mc",diff:2,q:"In 5×2 CV, how is the whole data set first handled?",opts:["Randomly partitioned into two subsets A and B; build with A/validate with B, then reversed","Split into 10 folds","Left entirely as training data","Sorted by class then split"],a:0,ev:"The whole data set is randomly partitioned in two subsets A and B. The model is first built using A and validated with B; then the process is reversed."},
 {id:"d4q12",slide:15,topic:"Cross-Validation",type:"mc",diff:1,q:"Leave-one-out is described as…",opts:["An extreme case of k-FCV where k equals the number of examples in the data set","A parametric significance test","A performance measure","A normality test"],a:0,ev:"Leave one out is an extreme case of k-FCV: k equals the number of examples in the data set."},
 {id:"d4q13",slide:16,topic:"Performance Measures",type:"mc",diff:2,q:"Which is NOT listed among the well-known binary-class accuracy measures?",opts:["Gradient descent","G-mean","F-score","Cohen's Kappa"],a:0,ev:"Well-known accuracy measures … classification rate, precision, sensitivity, specificity, G-mean, F-score, AUC, Youden's index and Cohen's Kappa."},
 {id:"d4q14",slide:17,topic:"Performance Measures",type:"mc",diff:2,q:"Which two measures are widely used for multi-class problems because of their simplicity?",opts:["Classification rate (accuracy) and Cohen's kappa","Precision and recall","AUC and F-score","G-mean and specificity"],a:0,ev:"Only two measures are widely used … Classification rate (also known as accuracy) … and Cohen's kappa."},
 {id:"d4q15",slide:18,topic:"Performance Measures",type:"mc",diff:2,q:"Cohen's kappa ranges from…",opts:["−1 through 0 (random classification) to 1 (perfect agreement)","0 to 100","1 to 10","−0.5 to 0.5"],a:0,ev:"Cohen's kappa ranges from −1 through 0 (random classification) to 1 (perfect agreement)."},
 {id:"d4q16",slide:18,topic:"Performance Measures",type:"tf",diff:1,q:"A Cohen's kappa of 0 indicates perfect agreement.",a:false,ev:"0 indicates random classification; 1 indicates perfect agreement."},
 {id:"d4s1",slide:11,topic:"Cross-Validation",type:"short",diff:1,q:"Which two values of k are the most common in k-FCV?",keys:["5","10"],ev:"5 and 10 being the most common ones."},
],
d5:[
 {id:"d5q1",slide:1,topic:"Statistical Tests — Overview",type:"tf",diff:1,q:"Observing that one algorithm has higher accuracy than another automatically proves it is the better algorithm.",a:false,ev:"Observing different performance scores does not automatically mean one algorithm is better than the other; performance values vary due to randomness."},
 {id:"d5q2",slide:3,topic:"Parametric Test Conditions",type:"mc",diff:2,q:"Which is NOT one of the three conditions required to safely use parametric tests?",opts:["Independence","Normality","Heteroscedasticity (equal variance)","Discretization"],a:3,ev:"The three conditions are Independence, Normality, and Heteroscedasticity (equality of variances)."},
 {id:"d5q3",slide:2,topic:"Parametric Test Conditions",type:"mc",diff:1,q:"Which are examples of parametric tests?",opts:["t-tests and ANOVA","Wilcoxon and Friedman","Kolmogorov–Smirnov and Shapiro–Wilk","Bonferroni-Dunn and Holm"],a:0,ev:"Parametric methods such as t-tests and ANOVA are based on assumptions about the underlying distribution of the data."},
 {id:"d5q4",slide:2,topic:"Parametric Test Conditions",type:"mc",diff:2,q:"Why are non-parametric tests often preferred for comparing ML algorithms?",opts:["They rely on fewer assumptions about the underlying distribution","They always give higher accuracy","They require the data to be normal","They are only for two algorithms"],a:0,ev:"Nonparametric tests are more robust because they rely on fewer assumptions about the underlying distribution."},
 {id:"d5q5",slide:4,topic:"Parametric Test Conditions",type:"tf",diff:2,q:"k-fold and 5×2 cross-validation provide complete independence between training and testing.",a:false,ev:"k-fold and 5×2 cross-validation do not provide complete independence because training and testing procedures overlap across multiple runs."},
 {id:"d5q6",slide:5,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"Which set are the three normality tests discussed?",opts:["Kolmogorov–Smirnov, Shapiro–Wilk, D'Agostino–Pearson","t-test, ANOVA, Wilcoxon","Friedman, Holm, Hochberg","Levene, Bartlett, Bonferroni"],a:0,ev:"Three normality tests: Kolmogorov–Smirnov, Shapiro–Wilk, and D'Agostino–Pearson."},
 {id:"d5q7",slide:6,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"Which test checks equal variance and is preferred over Bartlett's when normality is questionable?",opts:["Levene's test","Shapiro–Wilk test","Friedman test","Wilcoxon test"],a:0,ev:"Levene's test evaluates equal variance and is preferred over Bartlett's test when normality is questionable because it is more robust."},
 {id:"d5q8",slide:9,topic:"Normality & Variance Testing",type:"mc",diff:2,q:"On a Q-Q plot, what indicates the data is close to normal?",opts:["The points fall roughly along a straight line","The points form a circle","All points sit at the origin","The points are randomly scattered"],a:0,ev:"If the points fall roughly along a straight line, the data is considered close to normal; large deviations indicate departures from normality."},
 {id:"d5q9",slide:12,topic:"Normality & Variance Testing",type:"tf",diff:1,q:"In ML experiments, normality and homoscedasticity are frequently violated, which is why nonparametric tests are recommended.",a:true,ev:"Normality and homoscedasticity are frequently violated in ML experiments, so many researchers recommend nonparametric procedures."},
 {id:"d5q10",slide:16,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:1,q:"The Wilcoxon signed-ranks test is best described as…",opts:["The non-parametric counterpart to the paired t-test","A parametric test like ANOVA","A normality test","A data-partitioning scheme"],a:0,ev:"The Wilcoxon signed-ranks test serves as the nonparametric counterpart to the paired t-test."},
 {id:"d5q11",slide:18,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:2,q:"In the Wilcoxon test, what is the test statistic T?",opts:["The smaller of the two rank sums, T = min(R+, R−)","The larger of the two rank sums","The mean accuracy difference","The number of data sets"],a:0,ev:"The smaller of the two rank sums becomes the test statistic T = min(R+, R−); if T is significantly small the null hypothesis is rejected."},
 {id:"d5q12",slide:15,topic:"Comparing Two Algorithms (Wilcoxon)",type:"mc",diff:2,q:"What is the family-wise error rate (FWER)?",opts:["The probability of making at least one false discovery among all comparisons","The accuracy of the best algorithm","The number of folds in cross-validation","The variance of the data"],a:0,ev:"The family-wise error rate is the probability of making at least one false discovery among all comparisons."},
 {id:"d5q13",slide:27,topic:"Friedman & Iman–Davenport",type:"mc",diff:2,q:"The Friedman test is a non-parametric analog of which parametric test?",opts:["Repeated-measures (two-way) ANOVA","The paired t-test","Levene's test","Kolmogorov–Smirnov"],a:0,ev:"The Friedman test is a nonparametric analog of the parametric two-way analysis of variance (repeated measures ANOVA)."},
 {id:"d5q14",slide:29,topic:"Friedman & Iman–Davenport",type:"mc",diff:2,q:"How does the Friedman test treat the algorithms on each data set?",opts:["It ranks them (rank 1 = best) and averages the ranks","It sums their raw accuracies","It removes the worst one","It normalizes their scores"],a:0,ev:"Friedman ranks the algorithms on each data set (rank 1 to the best), then computes average ranks and a test statistic."},
 {id:"d5q15",slide:30,topic:"Friedman & Iman–Davenport",type:"mc",diff:3,q:"Why did Iman and Davenport modify the Friedman statistic?",opts:["The Friedman test can be conservative; their version has greater statistical power","To make it parametric","To require normal data","To reduce the number of algorithms"],a:0,ev:"Iman and Davenport proposed a modified Friedman statistic with greater statistical power, because the Friedman test can be conservative."},
 {id:"d5q16",slide:32,topic:"Post-hoc Procedures",type:"mc",diff:2,q:"After the Friedman test rejects the null hypothesis, what does a post-hoc analysis do?",opts:["Identifies which specific algorithms differ","Re-runs cross-validation","Proves all algorithms are equal","Chooses the number of folds"],a:0,ev:"After Friedman rejects the null hypothesis, a post-hoc analysis identifies which specific algorithms are responsible for the result."},
 {id:"d5q17",slide:34,topic:"Post-hoc Procedures",type:"mc",diff:2,q:"Which post-hoc procedure computes a critical difference (CD) and is simple but conservative?",opts:["Bonferroni-Dunn","Holm","Hochberg","Friedman"],a:0,ev:"Bonferroni-Dunn calculates a critical difference (CD); it is simple but tends to be conservative."},
 {id:"d5q18",slide:37,topic:"Post-hoc Procedures",type:"mc",diff:3,q:"Which post-hoc procedure uses a step-up strategy starting from the largest p-value?",opts:["Hochberg","Holm","Bonferroni-Dunn","Levene"],a:0,ev:"The Hochberg procedure uses a step-up strategy, beginning with the largest p-value and working in the opposite direction."},
 {id:"d5q19",slide:35,topic:"Post-hoc Procedures",type:"tf",diff:2,q:"The Holm procedure orders p-values from largest to smallest and has more power than Bonferroni-Dunn.",a:true,ev:"Holm orders the p-values from largest to smallest (step-down) and provides more statistical power than Bonferroni-Dunn."},
 {id:"d5q20",slide:33,topic:"Post-hoc Procedures",type:"mc",diff:1,q:"What can a control algorithm be in a post-hoc comparison?",opts:["A new proposal, the best-performing method, or a benchmark","Only the worst algorithm","Only a random algorithm","The test set"],a:0,ev:"The control algorithm may be a newly proposed method, the best-performing method, or a widely accepted benchmark."},
 {id:"d5s1",slide:3,topic:"Parametric Test Conditions",type:"short",diff:2,q:"Name the three conditions required to safely use parametric tests.",keys:["independence","normality","heteroscedasticity"],ev:"Independence, Normality, and Heteroscedasticity (equality of variances)."},
 {id:"d5m1",slide:34,topic:"Post-hoc Procedures",type:"match",diff:3,q:"Match each post-hoc procedure to its description.",pairs:[["Bonferroni-Dunn","Computes a critical difference (CD); simple but conservative."],["Holm","Step-down: orders p-values largest to smallest; more power than Bonferroni-Dunn."],["Hochberg","Step-up: starts from the largest p-value; often even greater power than Holm."]],ev:"Descriptions are taken from the post-hoc procedures slides."}

 d6:[
  {id:"d6q1",slide:1,topic:"Why pandas",type:"tf",diff:1,q:"pandas is designed for tabular data with mixed types (integers, strings, timestamps, floats).",a:true,ev:"pandas is built for tabular structures with mixed metadata types such as integers, strings, timestamps and floats."},
  {id:"d6q2",slide:1,topic:"Why pandas",type:"mc",diff:2,q:"When you operate on two pandas objects with different indexes, pandas…",opts:["performs automatic label-based alignment","aligns by position only","raises an error","drops all labels"],a:0,ev:"pandas provides automatic label-based relational alignment across unmatched index positions."},
  {id:"d6q3",slide:2,topic:"Core structures",type:"mc",diff:1,q:"Which pandas object is a 1D array-like sequence with axis labels?",opts:["Series","DataFrame","Index","ndarray"],a:0,ev:"A Series is a 1D array-like sequence matched with a distinct axis-labels index."},
  {id:"d6q4",slide:2,topic:"Core structures",type:"mc",diff:1,q:"A DataFrame is best described as…",opts:["a 2D structure of ordered, labeled columns","a 1D labeled array","an immutable label sequence","a Python dictionary"],a:0,ev:"A DataFrame is a multi-column, spreadsheet-like 2D structure of ordered labeled columns."},
  {id:"d6q5",slide:2,topic:"Core structures",type:"tf",diff:1,q:"Index objects in pandas are immutable.",a:true,ev:"Index objects are immutable sequences carrying axes metadata for alignment and lookup."},
  {id:"d6q6",slide:3,topic:"Series manipulation",type:"mc",diff:2,q:"What does s[s > 0] return on a Series?",opts:["a boolean-mask selection of matching elements","the sum of the elements","a sorted copy","the index only"],a:0,ev:"A boolean logical mask selects the elements that satisfy the condition, without looping."},
  {id:"d6q7",slide:4,topic:"Selection",type:"mc",diff:2,q:"Which statement about loc and iloc is correct?",opts:["loc is label-based; iloc is integer-based","both are integer-based","both are label-based","loc is integer-based; iloc is label-based"],a:0,ev:"loc selects by label, iloc selects by integer position — explicit handlers that avoid ambiguity."},
  {id:"d6q8",slide:5,topic:"Reindex & drop",type:"mc",diff:2,q:"reset_index() does what?",opts:["resets to an integer index and inserts the old index as a column","deletes the index entirely","sorts the index","drops all rows"],a:0,ev:"reset_index resets to standard integers and inserts the old index as a column."},
  {id:"d6q9",slide:6,topic:"Indexing nuances",type:"tf",diff:2,q:"Label-based slicing in pandas includes the end boundary element, unlike Python list slicing.",a:true,ev:"Label slicing differs from Python lists because the end boundary element is fully included."},
  {id:"d6q10",slide:7,topic:"Arithmetic alignment",type:"mc",diff:2,q:"When adding two DataFrames with mismatched indexes, pandas…",opts:["builds a union index and yields NaNs on mismatch","raises an error","silently keeps only matching labels","fills gaps with zeros"],a:0,ev:"pandas constructs a unified union index under the hood, generating NaNs on mismatch."},
  {id:"d6q11",slide:7,topic:"Arithmetic alignment",type:"mc",diff:2,q:"How do you add two DataFrames but substitute 0 for missing entries instead of NaN?",opts:["df1.add(df2, fill_value=0)","df1 + df2","df1.concat(df2)","df1.join(df2)"],a:0,ev:"Use the arithmetic method with a fill value: df1.add(df2, fill_value=0)."},
  {id:"d6q12",slide:8,topic:"Apply & sort",type:"mc",diff:2,q:"frame.applymap(func) applies a function…",opts:["element-by-element across the DataFrame grid","across whole rows or columns","to the index only","to the column names"],a:0,ev:"applymap applies a scalar function element-by-element; apply works across whole rows/columns."},
  {id:"d6q13",slide:8,topic:"Apply & sort",type:"mc",diff:1,q:"Which method sorts a DataFrame's rows by the values in a column?",opts:["sort_values(by='column')","sort_index()","reindex()","reset_index()"],a:0,ev:"sort_values orders row entries using the elements of selected columns."},
  {id:"d6q14",slide:9,topic:"Performance",type:"tf",diff:1,q:"Vectorized pandas operations are significantly faster than pure Python list math for descriptive stats.",a:true,ev:"Descriptive math over millions of elements is far faster with pandas' vectorized calculations (~60×)."}

 d7:[
  {id:"d7q1",slide:1,topic:"Parsing engines",type:"mc",diff:1,q:"By default, which parsing engine does pandas use for read_csv?",opts:["the C engine (fast, fewer features)","the Python engine","no engine","SQLAlchemy"],a:0,ev:"By default pandas uses the highly optimized C engine; it's fast but has fewer features."},
  {id:"d7q2",slide:1,topic:"Parsing engines",type:"mc",diff:2,q:"Which engine supports multi-character regex delimiters?",opts:["the Python engine","the C engine","the Arrow engine","none of them"],a:0,ev:"The Python fallback engine supports complex features like multi-character regex delimiters, but is slower."},
  {id:"d7q3",slide:2,topic:"Flat-file parsers",type:"mc",diff:1,q:"Which reader handles files whose columns are arranged by static character widths?",opts:["read_fwf","read_csv","read_table","read_json"],a:0,ev:"read_fwf processes fixed-width tables where columns use static character widths."},
  {id:"d7q4",slide:2,topic:"Flat-file parsers",type:"tf",diff:1,q:"read_table can read a tab-separated file when you pass sep='\\t'.",a:true,ev:"read_table loads custom tab-separated tables via explicit parameter flags."},
  {id:"d7q5",slide:3,topic:"Massive datasets",type:"mc",diff:2,q:"To process a very large CSV without loading it all into memory, you use…",opts:["chunksize to stream it in blocks","only nrows","read_json","to_parquet"],a:0,ev:"chunksize retrieves iterative generators so the file streams in blocks instead of loading at once."},
  {id:"d7q6",slide:4,topic:"read_csv config",type:"mc",diff:2,q:"Which read_csv parameter maps specific strings (e.g. 'NULL') to NaN?",opts:["na_values","index_col","skiprows","converters"],a:0,ev:"na_values maps specific strings to standard NaN missing indicators."},
  {id:"d7q7",slide:4,topic:"read_csv config",type:"mc",diff:1,q:"Which parameter chooses the column used as the row index?",opts:["index_col","skiprows","na_values","converters"],a:0,ev:"index_col specifies a column to use as the row index labels."},
  {id:"d7q8",slide:4,topic:"read_csv config",type:"mc",diff:2,q:"converters={'col': int} does what while reading?",opts:["applies a function column-wise to clean values","skips the column","drops nulls","sets the file separator"],a:0,ev:"converters applies dict functions column-wise to clean/convert values on read."},
  {id:"d7q9",slide:6,topic:"Web & semi-structured",type:"mc",diff:1,q:"Which reader scrapes tabular tags out of an HTML page?",opts:["read_html","read_json","read_excel","read_sql"],a:0,ev:"read_html scrapes tabular tags inside HTML pages automatically."},
  {id:"d7q10",slide:7,topic:"Binary formats",type:"mc",diff:2,q:"Which binary format is column-oriented with dense compression, ideal for analytical queries?",opts:["Apache Parquet","Python Pickle","CSV","JSON"],a:0,ev:"Parquet is column-oriented with dense compression, highly efficient for analytical queries."},
  {id:"d7q11",slide:7,topic:"Binary formats",type:"tf",diff:1,q:"Python pickle is recommended for long-term storage across pandas versions.",a:false,ev:"Pickle is quick but is not recommended for long-term storage across versions."},
  {id:"d7q12",slide:8,topic:"Databases",type:"mc",diff:1,q:"How does pandas load rows from a relational database safely?",opts:["read_sql with SQLAlchemy wrappers","manual cursor loops","read_csv","read_html"],a:0,ev:"pandas uses read_sql with SQLAlchemy wrappers, bypassing manual cursor loops."},
  {id:"d7q13",slide:9,topic:"Performance",type:"mc",diff:2,q:"Roughly how much faster is Parquet than the native CSV reader (1,450 ms vs 110 ms)?",opts:["≈13×","≈2×","≈60×","about the same"],a:0,ev:"S = 1,450 / 110 ≈ 13.18×, so Parquet reads roughly 13× faster than the native CSV reader."},
  {id:"d7q14",slide:9,topic:"Performance",type:"tf",diff:2,q:"Faster binary formats generally offer fewer features than slower text parsers.",a:true,ev:"The faster you go, the fewer features you get — some formats are tailored to specific tasks."}

 d8:[
  {id:"d8q1",slide:1,topic:"Overview",type:"tf",diff:1,q:"Data preparation typically consumes only a small fraction of a project's time compared with modeling.",a:false,ev:"It's usually the reverse — roughly 80% cleaning, 20% analysis."},
  {id:"d8q2",slide:2,topic:"Data integration",type:"mc",diff:1,q:"Combining information from multiple sources into a uniform data set is called…",opts:["data integration","data cleaning","normalization","data reduction"],a:0,ev:"Integrating data from different databases is called data integration; it produces a uniform data set."},
  {id:"d8q3",slide:2,topic:"Data integration",type:"tf",diff:1,q:"Data integration is the final step and guarantees error-free data.",a:false,ev:"Integration is not the final step; missing values and noise may still be present."},
  {id:"d8q4",slide:4,topic:"Data integration",type:"mc",diff:2,q:"When integrating relational data, records from multiple tables are usually…",opts:["flattened into one single record","kept fully normalized","deleted","encrypted"],a:0,ev:"Data from relational databases is flattened — gathered into one single record."},
  {id:"d8q5",slide:5,topic:"Redundant attributes",type:"mc",diff:1,q:"An attribute is redundant when…",opts:["it can be derived from another attribute","it has missing values","it is numeric","it is the index"],a:0,ev:"A redundant attribute can be derived from another attribute or set of them."},
  {id:"d8q6",slide:5,topic:"Redundant attributes",type:"tf",diff:2,q:"Redundant attributes can increase data size and may induce overfitting.",a:true,ev:"Redundancy increments data size and modeling time and may induce overfitting."},
  {id:"d8q7",slide:6,topic:"Correlation measures",type:"mc",diff:2,q:"Which test quantifies correlation among two nominal (categorical) attributes?",opts:["the χ² correlation test","Pearson's r","covariance","Levene's test"],a:0,ev:"The χ² correlation test quantifies correlation among two nominal attributes."},
  {id:"d8q8",slide:7,topic:"Correlation measures",type:"mc",diff:2,q:"For numerical attributes, which coefficient (ranging −1 to +1) measures redundancy?",opts:["Pearson's correlation coefficient","χ²","edit distance","the Jaro algorithm"],a:0,ev:"Pearson's product-moment coefficient is used for numerical attributes; values near ±1 indicate high correlation."},
  {id:"d8q9",slide:7,topic:"Correlation measures",type:"mc",diff:2,q:"A Pearson r near 0 indicates…",opts:["little or no linear relationship","a strong positive relationship","a strong negative relationship","perfect correlation"],a:0,ev:"Values near 0 suggest little or no linear relationship between the attributes."},
  {id:"d8q10",slide:8,topic:"Correlation measures",type:"tf",diff:1,q:"If two variables are independent, their covariance tends toward 0.",a:true,ev:"When variables are independent the covariance tends toward 0."},
  {id:"d8q11",slide:9,topic:"Duplicate tuples",type:"mc",diff:2,q:"Why can duplicate tuples be hard to spot?",opts:["different measurement systems (e.g. metric vs imperial)","identical formatting","exact numeric equality","they never occur"],a:0,ev:"Duplicity is subtle when sources use different measurement systems like metric vs imperial."},
  {id:"d8q12",slide:10,topic:"Duplicate tuples",type:"mc",diff:1,q:"Which is a character-based distance measure for nominal values?",opts:["the Jaro algorithm","Pearson's r","covariance","Levene's test"],a:0,ev:"Jaro is one of the character-based measures (with edit distance, affine gap, q-grams, WHIRL, metaphone, ONCA)."},
  {id:"d8q13",slide:12,topic:"Dedup approaches",type:"mc",diff:2,q:"Which is a strategy for deciding whether two instances are duplicates?",opts:["a probabilistic approach (Fellegi-Sunter)","a t-test","ANOVA","min-max scaling"],a:0,ev:"Approaches include probabilistic (Fellegi-Sunter), supervised, distance-based, and clustering methods."},
  {id:"d8q14",slide:13,topic:"Data cleaning",type:"mc",diff:1,q:"Dirty data broadly includes…",opts:["missing, wrong, and non-standard representations","only missing values","only outliers","only duplicates"],a:0,ev:"Dirty data broadly includes missing data, wrong data, and non-standard representations of the same data."},
  {id:"d8q15",slide:14,topic:"Data cleaning",type:"mc",diff:1,q:"What are the two forms dirty data usually takes?",opts:["missing values (MVs) and noisy data","integers and strings","rows and columns","nominal and numeric"],a:0,ev:"Dirty data usually presents as missing values (MVs) and wrong (noisy) data."},
  {id:"d8q16",slide:15,topic:"Handling dirty data",type:"mc",diff:2,q:"How are missing values (MVs) commonly handled?",opts:["ignore, fill manually/with a constant, or estimate","always delete the whole column","convert them to text","there is no way to handle them"],a:0,ev:"MVs can be ignored, filled in manually or with a constant, or filled by estimation."},
  {id:"d8q17",slide:15,topic:"Handling dirty data",type:"tf",diff:2,q:"You should always remove outliers during cleaning.",a:false,ev:"Not always — in fraud detection the outliers are exactly what you're looking for."}

 d9:[
  {id:"d9q1",slide:1,topic:"Matplotlib API",type:"mc",diff:1,q:"In matplotlib, individual subplots (Axes) are added inside a…",opts:["top-level Figure container","DataFrame","Series","GroupBy object"],a:0,ev:"All plots reside inside a top-level Figure container; Subplots (Axes) are added within it."},
  {id:"d9q2",slide:1,topic:"Matplotlib API",type:"mc",diff:2,q:"What does plt.subplots() return?",opts:["a figure plus a NumPy array of subplot objects","a single Series","a dictionary of colors","a DataFrame"],a:0,ev:"plt.subplots() creates a new figure and returns a NumPy array of the individual subplot objects."},
  {id:"d9q3",slide:2,topic:"Styling",type:"tf",diff:1,q:"In matplotlib you can pass an abbreviated style string like 'g--' to set color and line format at once.",a:true,ev:"You can combine abbreviated color keys and line formats directly, e.g. 'g--'."},
  {id:"d9q4",slide:3,topic:"Ticks & legends",type:"mc",diff:2,q:"Which pair sets axis limits and tick labels?",opts:["xlim and xticks","kind and ax","hue and data","grid and stacked"],a:0,ev:"xlim commands the limits and xticks sets tick label locations."},
  {id:"d9q5",slide:5,topic:"pandas plotting",type:"mc",diff:1,q:"Which df.plot parameter chooses the chart type (bar, line, scatter, pie)?",opts:["kind","ax","legend","subplots"],a:0,ev:"kind selects the chart variant: bar, line, scatter, box, density, or pie."},
  {id:"d9q6",slide:5,topic:"pandas plotting",type:"mc",diff:2,q:"df.plot(subplots=True) does what?",opts:["splits DataFrame columns into individual, stacked subplots","hides the legend","changes the color","sets the index"],a:0,ev:"subplots=True splits the DataFrame's columns into individual, stacked subplots."},
  {id:"d9q7",slide:6,topic:"Plot types",type:"mc",diff:1,q:"What is the default plot type for a pandas Series?",opts:["line","bar","scatter","pie"],a:0,ev:"Line plots are the default option for pandas Series and DataFrames."},
  {id:"d9q8",slide:6,topic:"Plot types",type:"tf",diff:1,q:"barh produces horizontal bars while bar produces vertical bars.",a:true,ev:"bar renders vertical bars, while barh outputs horizontal blocks."},
  {id:"d9q9",slide:7,topic:"seaborn",type:"mc",diff:2,q:"In seaborn, what does the hue parameter do?",opts:["splits a plot by a categorical column","sets the figure size","saves the figure","removes the legend"],a:0,ev:"hue splits plots by a categorical column, applying high-contrast palettes automatically."},
  {id:"d9q10",slide:8,topic:"seaborn",type:"mc",diff:2,q:"What does seaborn's pairplot create?",opts:["a grid of pairwise scatter plots and histograms","a single bar chart","a pie chart","a heatmap only"],a:0,ev:"pairplot creates a grid matrix of pairwise scatter plots and histograms."},
  {id:"d9q11",slide:9,topic:"Performance",type:"mc",diff:2,q:"Which plotting tool is fastest but has the fewest features?",opts:["matplotlib","pandas","seaborn","Excel"],a:0,ev:"matplotlib is fastest; pandas is more feature-friendly but slower; seaborn is slowest but most capable."},
  {id:"d9q12",slide:9,topic:"Performance",type:"tf",diff:1,q:"seaborn is slower than matplotlib but can do more statistical analysis.",a:true,ev:"seaborn is quite a bit slower but can do a lot more statistical analysis with more complex graphs."}
