<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Study — Exact Review &amp; Practice</title>
<style>
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface2:#fbfbfe; --text:#191b2e; --muted:#6b7185;
  --border:#e6e8f0; --primary:#4f46e5; --primary-soft:#eef0ff; --accent:#ea8a2a; --accent-soft:#fbeddb;
  --good:#15a34a; --good-soft:#e7f6ec; --bad:#dc2626; --bad-soft:#fdeaea; --warn:#d97706;
  --shadow:0 1px 2px rgba(20,22,45,.06),0 8px 24px rgba(20,22,45,.05);
  --radius:14px; --radius-sm:10px;
}
[data-theme="dark"]{
  --bg:#0e1120; --surface:#171a2c; --surface2:#1d2136; --text:#e9ebf6; --muted:#98a0b8;
  --border:#282d45; --primary:#7c83ff; --primary-soft:#20233c; --accent:#f0973b; --accent-soft:#33261a;
  --good:#3ecf7f; --good-soft:#152a1f; --bad:#f2726f; --bad-soft:#2c1a1c; --warn:#e0a13c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer}
h1,h2,h3,h4{margin:0; line-height:1.2; letter-spacing:-.01em}
a{color:var(--primary)}
code,.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}

/* Layout */
.app{display:flex; min-height:100vh}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--border);
  padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px}
.brand .logo{
  width:34px; height:34px; border-radius:9px; flex:0 0 34px;
  background:linear-gradient(135deg,var(--accent),var(--primary)); 
}
.brand .name{font-weight:800; font-size:16px; letter-spacing:-.02em}
.brand .sub{font-size:11px; color:var(--muted); font-weight:500}
.nav{display:flex; flex-direction:column; gap:2px; margin-top:6px}
.nav-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; padding:14px 10px 6px}
.nav button{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left; border:none;
  background:transparent; color:var(--text); padding:9px 11px; border-radius:9px; font-size:14px; font-weight:500;
}
.nav button:hover{background:var(--surface2)}
.nav button.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
.nav button .ico{width:17px; text-align:center; opacity:.9}
.sidebar-foot{margin-top:16px; padding-top:14px; border-top:1px solid var(--border)}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--border);
  background:var(--surface); position:sticky; top:0; z-index:20;
}
.topbar .crumb{font-size:13px; color:var(--muted); font-weight:500}
.topbar .crumb b{color:var(--text); font-weight:600}
.search-wrap{margin-left:auto; position:relative; width:min(340px,42vw)}
.search-wrap input{
  width:100%; padding:9px 12px 9px 34px; border:1px solid var(--border); border-radius:10px;
  background:var(--surface2); color:var(--text); font-size:14px;
}
.search-wrap input:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
.search-wrap .si{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted)}
.icon-btn{
  border:1px solid var(--border); background:var(--surface2); color:var(--text);
  width:38px; height:38px; border-radius:10px; font-size:16px; display:grid; place-items:center;
}
.icon-btn:hover{background:var(--primary-soft)}
.content{padding:26px; max-width:1080px; width:100%; margin:0 auto}

/* Cards & bits */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid; gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:880px){.g2,.g3{grid-template-columns:1fr}}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text); padding:9px 15px;
  border-radius:10px; font-weight:600; font-size:14px; transition:.12s;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.accent{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:8px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spread{display:flex; justify-content:space-between; align-items:center; gap:12px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:100px; background:var(--surface2); border:1px solid var(--border); color:var(--muted)}
.pill.p{background:var(--primary-soft); color:var(--primary); border-color:transparent}
.pill.g{background:var(--good-soft); color:var(--good); border-color:transparent}
.pill.b{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.09em; font-weight:700; color:var(--accent)}
.muted{color:var(--muted)}
.progress{height:8px; background:var(--surface2); border:1px solid var(--border); border-radius:100px; overflow:hidden}
.progress > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--primary)); border-radius:100px; transition:width .3s}
.stat{font-size:26px; font-weight:800; letter-spacing:-.02em}
.stat-lbl{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em}
.divider{height:1px; background:var(--border); margin:16px 0}
.tag{font-size:12px; padding:2px 8px; border-radius:6px; background:var(--surface2); border:1px solid var(--border); color:var(--muted); font-weight:600}

/* Slide viewer */
.slide-stage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.slide-top{height:6px; background:linear-gradient(90deg,var(--accent),var(--primary))}
.slide-body{padding:34px 40px 40px}
.slide-kicker{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:8px}
.slide-title{font-size:30px; font-weight:800; letter-spacing:-.02em; margin-bottom:22px}
.slide-content{font-size:16px}
.blk-h{font-weight:700; font-size:18px; margin:18px 0 8px; color:var(--text)}
.blk-p{margin:11px 0}
.blk-note{margin:11px 0; color:var(--muted); font-style:italic}
.blk-img{margin:14px 0; padding:14px 16px; border:1px dashed var(--border); border-radius:10px; background:var(--surface2); color:var(--muted); font-size:14px; display:flex; align-items:center; gap:10px}
ul.bl{list-style:none; margin:8px 0; padding:0}
ul.bl li{position:relative; padding-left:20px; margin:7px 0}
ul.bl li::before{content:""; position:absolute; left:4px; top:10px; width:6px; height:6px; border-radius:2px; background:var(--accent)}
ul.bl li.l1{margin-left:22px}
ul.bl li.l1::before{background:var(--primary); border-radius:50%}
ul.bl li.l2{margin-left:44px}
ul.bl li.l2::before{background:var(--muted); width:5px; height:5px; border-radius:50%}
.blk-lb{font-weight:700}
.kbd{display:inline-block; background:var(--primary-soft); color:var(--primary); padding:2px 8px; border-radius:6px; font-weight:600}
table.slide-tbl{width:100%; border-collapse:collapse; margin:14px 0; font-size:14px}
table.slide-tbl th{background:#12172a; color:#fff; text-align:left; padding:11px 13px; font-weight:700}
[data-theme="dark"] table.slide-tbl th{background:#2a2f4d}
table.slide-tbl td{padding:11px 13px; border-bottom:1px solid var(--border)}
table.slide-tbl tr:nth-child(even) td{background:var(--surface2)}
.blk-bold{font-weight:700}
.blk-code{background:#12172a; color:#e7e9f5; border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; margin:12px 0; font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:13px; line-height:1.5; white-space:pre; overflow-x:auto}
[data-theme="dark"] .blk-code{background:#0c0f1c}
.tr-panel{margin-top:16px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); overflow:hidden}
.tr-panel summary{cursor:pointer; padding:12px 16px; font-weight:700; font-size:14px; list-style:none; display:flex; align-items:center; gap:8px; user-select:none}
.tr-panel summary::-webkit-details-marker{display:none}
.tr-panel summary:hover{background:var(--surface)}
.tr-ico{font-size:15px}
.tr-hint{font-weight:500; color:var(--muted); font-size:13px}
.tr-body{padding:0 18px 16px; font-size:14.5px; line-height:1.6; color:var(--text)}
.tr-panel[open] summary{border-bottom:1px solid var(--border)}
.tr-body{padding-top:12px}
mark{background:#ffe9a8; color:#5a4300; border-radius:3px; padding:0 2px}
[data-theme="dark"] mark{background:#5a4a12; color:#ffe9a8}

/* Reconstructed diagrams (inline SVG) */
.dg-wrap{margin:14px 0; padding:18px 16px 10px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); overflow-x:auto}
.dg-svg{width:100%; height:auto; min-width:540px; display:block}
.dg-cap{font-size:11.5px; color:var(--muted); font-weight:600; text-align:right; margin-top:6px; letter-spacing:.02em}
.dg-box{fill:var(--surface); stroke:var(--border); stroke-width:1.5}
.dg-box.root{fill:var(--primary); stroke:var(--primary)}
.dg-box.cat{fill:var(--primary-soft); stroke:var(--primary); stroke-width:1.5}
.dg-box.stage{fill:var(--primary-soft); stroke:var(--primary); stroke-width:1.5}
.dg-t{fill:var(--text); font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px; font-weight:600}
.dg-t.on{fill:#fff}
.dg-t.cat{fill:var(--primary); font-weight:700}
.dg-t.sm{font-size:13px; font-weight:500}
.dg-line{stroke:var(--muted); stroke-width:1.6; fill:none; opacity:.85}
.dg-line.dash{stroke-dasharray:6 5; opacity:.55}
.dg-arrow{fill:var(--muted)}
.dg-cyl{fill:var(--primary-soft); stroke:var(--primary); stroke-width:1.5}
.dg-cyl-top{fill:var(--surface); stroke:var(--primary); stroke-width:1.5}
.dg-box.out{fill:var(--good-soft); stroke:var(--good); stroke-width:1.5}
.dg-t.out{fill:var(--good); font-weight:700}
.dg-box.parent{fill:var(--surface); stroke:var(--border); stroke-width:1.5; stroke-dasharray:5 3}
.dg-t.parent{fill:var(--muted); font-weight:700; font-size:12px}
.dg-t.sub{font-size:11px; font-weight:600; fill:var(--muted)}
.dg-t.tiny{font-size:10px; font-weight:700}
.dg-t.axis{fill:var(--muted); font-size:12px; font-weight:600}
.dg-t.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.dg-region{fill:var(--muted); font-size:11px; font-weight:700; opacity:.85}
.dg-bar-slow{fill:var(--bad)}
.dg-bar-fast{fill:var(--good)}
.dg-axis{stroke:var(--muted); stroke-width:1.4; fill:none}
.dg-train{stroke:var(--primary); stroke-width:2.6; fill:none}
.dg-test{stroke:var(--bad); stroke-width:2.6; fill:none}
.dg-cell-test{fill:var(--primary); stroke:var(--primary)}
.dg-cell-train{fill:var(--surface2); stroke:var(--border); stroke-width:1.2}

.slide-nav{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap}
.slide-nav .count{font-weight:700; padding:8px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px}
select.jump{padding:9px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-size:14px; font-weight:500}

/* TOC */
.toc{max-height:340px; overflow-y:auto}
.toc button{display:flex; gap:12px; width:100%; text-align:left; border:none; background:transparent; padding:9px 12px; border-radius:9px; color:var(--text); font-size:14px}
.toc button:hover{background:var(--surface2)}
.toc button.done{color:var(--muted)}
.toc .n{width:26px; flex:0 0 26px; color:var(--muted); font-weight:700; font-size:13px}
.toc .dot{width:7px; height:7px; border-radius:50%; background:var(--border); margin-top:7px; flex:0 0 7px}
.toc button.done .dot{background:var(--good)}

/* Quiz */
.q-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px}
.q-meta{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.pill.accent{background:#eef0ff; border-color:#c7ccff; color:#4f46e5; font-weight:700}
.predict-note{margin-top:12px; padding:10px 14px; border-radius:12px; background:#fff8e6; border:1px solid #f2d98a; color:#7a5b00; font-size:12.5px; font-weight:600}
.predict-card{padding:18px 20px; margin-bottom:12px}
.predict-opt{display:flex; gap:9px; align-items:flex-start; padding:8px 12px; border:1.5px solid var(--border); border-radius:10px; margin-bottom:7px; font-size:14px; background:var(--surface)}
.predict-opt.correct{border-color:#15a34a; background:#e7f6ec; color:#0f7a37; font-weight:650}
.predict-mark{display:inline-block; width:16px; color:#15a34a; font-weight:800; flex:0 0 auto}
.predict-ev{margin-top:10px; font-size:12.8px; color:var(--muted); line-height:1.5; border-left:3px solid #15a34a; padding-left:10px}
.predict-base{margin-top:8px; font-size:12.2px; color:#4f46e5; background:#eef0ff; border-radius:8px; padding:7px 10px}
@media (prefers-color-scheme:dark){
  .pill.accent{background:#2a2f52; border-color:#3d4680; color:#aeb6ff}
}
[data-theme="dark"] .pill.accent{background:#2a2f52; border-color:#3d4680; color:#aeb6ff}
[data-theme="dark"] .predict-note{background:#332a12; border-color:#5c4d20; color:#e8c874}
[data-theme="dark"] .predict-opt.correct{background:#123020; border-color:#1f7a4a; color:#7fe0a8}
[data-theme="dark"] .predict-base{background:#242a4d; color:#aeb6ff}
.q-text{font-size:19px; font-weight:700; letter-spacing:-.01em; margin-bottom:20px; line-height:1.4}
.opt{
  display:block; width:100%; text-align:left; border:1.5px solid var(--border); background:var(--surface);
  padding:14px 16px; border-radius:11px; margin-bottom:10px; font-size:15px; font-weight:500; color:var(--text); transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--primary); background:var(--primary-soft)}
.opt.chosen{border-color:var(--primary); background:var(--primary-soft)}
.opt.correct{border-color:var(--good); background:var(--good-soft); color:var(--good); font-weight:600}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft); color:var(--bad); font-weight:600}
.opt .mk{float:right; font-weight:800}
.q-input{width:100%; padding:13px 15px; border:1.5px solid var(--border); border-radius:11px; background:var(--surface2); color:var(--text); font-size:15px; font-family:inherit}
.q-input:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
textarea.q-input{min-height:96px; resize:vertical}
.feedback{margin-top:18px; padding:16px 18px; border-radius:12px; border:1px solid var(--border)}
.feedback.ok{background:var(--good-soft); border-color:transparent}
.feedback.no{background:var(--bad-soft); border-color:transparent}
.feedback .verdict{font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.source-box{margin-top:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:14px}
.source-box .src{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px}
.source-box .quote{font-style:italic; color:var(--text)}
.match-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media(max-width:720px){.match-grid{grid-template-columns:1fr}}
.match-col h4{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px}
.match-item{border:1.5px solid var(--border); background:var(--surface); padding:12px 14px; border-radius:10px; margin-bottom:9px; font-size:14px; font-weight:500}
.match-item.term{cursor:pointer}
.match-item.term:hover{border-color:var(--primary)}
.match-item.term.sel{border-color:var(--primary); background:var(--primary-soft)}
.match-item.term.done{opacity:.5}
.match-item.def{cursor:pointer}
.match-item.def:hover{border-color:var(--primary)}
.match-item.def.paired{border-color:var(--good); background:var(--good-soft)}

/* Flashcards */
.fc-scene{perspective:1400px; max-width:600px; margin:0 auto}
.fc{position:relative; width:100%; min-height:280px; transition:transform .5s; transform-style:preserve-3d; cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); padding:34px; display:flex; flex-direction:column; justify-content:center; text-align:center}
.fc-back{transform:rotateY(180deg); background:var(--surface2)}
.fc-face .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700; margin-bottom:14px}
.fc-front .term{font-size:24px; font-weight:800; letter-spacing:-.02em}
.fc-back .def{font-size:16px; line-height:1.5}
.fc-back .src{font-size:12px; color:var(--muted); margin-top:14px; font-weight:600}

/* Weak table */
table.wk{width:100%; border-collapse:collapse; font-size:14px}
table.wk th{text-align:left; padding:11px 12px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:2px solid var(--border)}
table.wk td{padding:12px; border-bottom:1px solid var(--border); vertical-align:top}
.hist-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:3px}
.hist-dot.c{background:var(--good)} .hist-dot.w{background:var(--bad)}

/* segmented */
.seg{display:inline-flex; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px}
.seg button{border:none; background:transparent; padding:7px 14px; border-radius:8px; font-weight:600; font-size:13px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{border:1.5px solid var(--border); background:var(--surface); padding:8px 14px; border-radius:100px; font-weight:600; font-size:13px; color:var(--text)}
.chip.on{border-color:var(--primary); background:var(--primary-soft); color:var(--primary)}

.empty{text-align:center; padding:50px 20px; color:var(--muted)}
.empty .big{font-size:40px; margin-bottom:10px}
.result-ring{width:120px; height:120px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--primary) var(--pct),var(--surface2) 0); position:relative}
.result-ring::before{content:""; position:absolute; inset:12px; background:var(--surface); border-radius:50%}
.result-ring span{position:relative; font-size:26px; font-weight:800}

.mobile-toggle{display:none}
@media(max-width:820px){
  .sidebar{position:fixed; left:0; top:0; z-index:60; transform:translateX(-100%); transition:.25s; box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:grid}
  .content{padding:18px}
  .slide-body{padding:24px 20px 30px}
  .search-wrap{width:44vw}
}
.backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55}
.backdrop.show{display:block}

/* Cheat sheet */
.cheat-controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.cheat-legend{display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:12.5px}
.cheat-legend strong{font-weight:800}
.cheat{column-count:3; column-gap:12px}
.cheat.roomy{column-count:2}
.cs-deck{break-inside:avoid; column-span:all; -webkit-column-span:all; margin:4px 0 8px; padding:6px 11px; border-radius:8px;
  background:linear-gradient(90deg,var(--accent),var(--primary)); color:#fff; font-weight:800; font-size:13px; letter-spacing:.01em}
.cs-block{break-inside:avoid; border:1px solid var(--border); border-radius:9px; padding:8px 10px; margin:0 0 9px; background:var(--surface)}
.cheat.compact .cs-block{padding:6px 9px; margin-bottom:7px}
.cs-h{display:flex; justify-content:space-between; align-items:baseline; gap:6px; font-weight:800; font-size:12px; margin-bottom:4px; color:var(--primary)}
.cs-h .cs-s{font-size:9px; color:var(--muted); font-weight:700; letter-spacing:.02em}

{
  id:"d3",
  title:"NumPy Basics",
  subtitle:"Chapter 4: Arrays & Vectorized Computation — based on Wes McKinney (3rd Edition)",
  week:"w2",
  slides:[
    {n:1,title:"NumPy Basics",blocks:[
      P("Chapter 4: Arrays & Vectorized Computation"),
      N("BASED ON WES MCKINNEY (3RD EDITION)")
    ],
      tr:"In this lecture, we're going to start with the basics of NumPy. This is chapter 4 from the Wes McKinney book."},
    {n:2,title:"Why NumPy? Vectorization Performance",blocks:[
      H("Contiguous Memory Blocks"),
      P("NumPy stores raw binary array data in contiguous structures within memory, separate from regular Python system references."),
      CODE("# Memory comparison structure setup\narr = np.arange(1000000)\nlst = list(range(1000000))  # Non-contiguous pointers"),
      H("The Power of Vectorization"),
      P("Batch operations run on comprehensive array chunks simultaneously without the usage of standard slower Python loop constructs."),
      CODE("# Parallel C execution scales array\narr * 2  # Vectorized\n[x * 2 for x in lst]  # Slow interpreter loop")
    ],
      tr:"So why are we going to use NumPy? NumPy has great vector performance or array performance. Python has lists and dictionaries, but those are not very efficient. A list in Python is not stored as a continuous array of pointers — it can be all over the place, which has issues when we're doing data processing; we want to be as fast as possible. NumPy stores raw binary array data in continuous structures within actual memory, so when I'm accessing 10 million items they are all in order. In Python it stores them all over the place, so as I iterate I may have to jump all over memory. If we create an array with np.arange, it makes enough space for those integers in a contiguous block of memory. When Python makes a list of the same numbers it puts some here, some there — every time you access the next element you seek to a new spot in memory, and that seek costs CPU cycles. The real power comes when executing things: to multiply everything by 2 in Python you loop over every item; in NumPy you just say the array times 2, and it jumps along really quickly multiplying those, and sometimes it can parallelize them because it knows they're all in order."},
    {n:3,title:"Methods for Creating ndarrays",blocks:[
      H("Array Casting"),
      P("Functions like np.array accept nested lists, tuples, or sequence iterables, automatically inferring data types."),
      CODE("data = [6, 7.5, 8, 0]\narr = np.array(data)"),
      H("Initialized Creators"),
      P("Methods like zeros and ones generate specific matrix dimensions initialized with static elements."),
      CODE("np.zeros((3, 6))\nnp.ones(10) * 5"),
      H("Interval Iterators"),
      P("np.arange creates a sequence array, while np.empty allocates uninitialized contiguous memory."),
      CODE("np.arange(15)\nnp.empty((2, 3, 2))")
    ],
      tr:"There are many ways for creating ndarrays. We can do array casting: put data into a Python list and say numpy.array with that data, and now I have an ndarray. I can create empty vectors and populate them — an array of zeros, or an array of ones multiplied by 5. We can do intervals and sequences. And remember, when it creates these arrays they're all continuous in memory, which will be important as we move along."},
    {n:4,title:"Understanding NumPy dtypes",blocks:[
      TBL(["Numeric Type Group", "Type Name Code", "Casting API Command", "Underlying Machine Bit-Width & Description"],[["Signed Integers","int8, int32, int64","arr.astype(np.int32)","Signed integers from 8-bit to 64-bit precision limits."],["Unsigned Integers","uint8, uint32, uint64","arr.astype(np.uint64)","Non-negative integers only, ideal for memory optimization."],["Floating Point","float32, float64","arr.astype(np.float64)","Double precision float64 matches standard Python float parameters."],["Non-Numerical dtypes","bool, string_, unicode_","arr.astype(np.bool_)","Fixed-length representations for text and logical values."]])
    ],
      tr:"Let's talk about NumPy data types — there are a lot, even more than on this screen. We have signed integers, unsigned integers, floating point, and non-numerical data types. In Python we do not initially give it data types; it determines the type on its own. But in data analytics we want to keep the data size as small as possible and we want control of that. If you make an integer you're probably making a 64-bit int even though you may only need eight of those bits. With NumPy we can make an 8-bit int, a 32-bit int, a 64-bit int. If I know I'll only ever have numbers 1 through 10, I might use an 8-bit int. We can also unsign them: if age is never negative I might make it an unsigned 8-bit integer. Same with floating points — 32-bit or 64-bit. And we can tell the array its type — say it's a 32-bit int — and from that point on it will only accept 32-bit ints."},
    {n:5,title:"Element-Wise Array Arithmetic",blocks:[
      H("Broadcasting and Vector Scaling"),
      P("Calculations operate element-wise directly across dimensional bounds without requiring explicit loop nesting."),
      CODE("# Multi-dimensional element calculations\narr = np.array([[1., 2.], [3., 4.]])\narr * arr  # Element multiplication [[1,4], [9,16]]\n1 / arr  # Reciprocal calculations")
    ],
      tr:"There are many ways to manipulate stuff: we can have multi-dimensional arrays and do mathematics on them, including reciprocal calculations. If arr holds two sub-pieces of data, arr times arr takes every element and multiplies it by itself — 1 and 2 times itself gives 1 and 4; 3 and 4 times itself. It does NOT do 1 and 2 times 3 and 4. I can also do reciprocals: 1 divided by the array computes the reciprocal of every element. Notice I didn't have to write any loops — otherwise arr times arr would need a double-nested loop. NumPy handles all that more efficiently."},
    {n:6,title:"Basic Slicing & Array Views",blocks:[
      H("No-Copy View Slicing"),
      P("Slices serve directly as active \"views\" over the source matrix bounds instead of spawning detached variable clones. Modifications instantly mutate the parent."),
      CODE("# View-based mutations\narr = np.arange(10)\narr_slice = arr[5:8]\narr_slice[1] = 12345  # Directly alters arr"),
      H("Eager Memory Copies"),
      P("NumPy prevents performance bottlenecks by restricting copy cycles for large data structures. Force explicit allocations using the copy method."),
      CODE("# Safely decouple arrays via copy\narr_copy = arr[5:8].copy()\narr_copy[:] = 64  # Leaves arr intact")
    ],
      tr:"We can also do basic slicing and views. A no-copy view slice is just a direct slice — it doesn't make a copy, it makes a view, and modifying the view modifies the original parent. Make an array of 10 items, take a slice, set position 1, and it directly alters arr. If we want an eager copy — actually copy so we don't modify the original — we put dot copy on the end. Without dot copy we get a no-copy slice. In Python a slice would make a copy, which is wasted memory; in NumPy we're not making a copy unless we explicitly tell it to."},
    {n:7,title:"Boolean & Fancy Indexing",blocks:[
      H("Boolean Vectorized Masks"),
      P("Logical statements on string or numeric arrays yield boolean arrays acting as instant data-filtering overlays. Boolean masking always copies data."),
      CODE("# Filter matrix rows on name match\nnames = np.array(['Bob', 'Joe', 'Will'])\ndata = np.random.standard_normal((3, 4))\ndata[names == 'Bob']"),
      H("Fancy Integer Indexing"),
      P("Extract subsets out of order by passing structured coordinate lists or indices natively. Fancy indexing always copies array values."),
      CODE("# Extract rows 4, 3, 0, 6 in order\narr = np.empty((8, 4))\narr[[4, 3, 0, 6]]\narr[[-3, -1]]  # Count from end")
    ],
      tr:"We can do a bunch of stuff with Booleans. Logical statements on string or numerical arrays yield Boolean arrays. If I check name == 'Bob', it gives me an array telling me all of them that are equal to Bob. Then there are ways to do fancy indexing and all of that. There's a lot of power behind NumPy."},
    {n:8,title:"Fast Element-Wise ufuncs",blocks:[
      H("Unary ufuncs"),
      P("Execute single-array operations. Computes rapid element values directly in optimized C."),
      CODE("np.sqrt(arr)\nnp.exp(arr)"),
      H("Binary Operators"),
      P("Compute results across dual input array dimensions simultaneously on execution."),
      CODE("np.maximum(x, y)\nnp.add(x, y)"),
      H("Output Scopes"),
      P("Direct calculation outputs into specified target buffers, bypassing memory cycles."),
      CODE("np.sqrt(arr, out=arr)")
    ],
      tr:"There are a bunch of useful functions. We can execute single-array options — numpy.sqrt of arr rapidly finds the square root of the array. These are unary functions and it's very efficient; the Python version would loop through every element, jumping all over memory. We can do binary operations too — find the maximum, add things. And we can control how and where we output it. There are a lot of useful things built into NumPy."},
    {n:9,title:"Numerical Vectorization Performance",blocks:[
      DG("numpy-perf"),
      P("Vectorized performance evaluation:"),
      CODE("# Native loop slow approach\n[x * 2 for x in my_list]\n\n# Vectorized numpy syntax\nmy_arr * 2\n\n# Average Speedup: ~68.7x faster"),
      N("Benchmarking element scaling operations across 1M records highlights NumPy's massive speed efficiency, reducing runtime operations substantially.")
    ],
      tr:"Let's look at performance, because there's a huge difference. We benchmark element-scaling operations across a million records. The native Python loop multiplies every x by 2; the vectorized NumPy way does exactly the same thing. But the Python way took 48.8 milliseconds — small, but if you're doing millions of these a day you'll notice. NumPy is about 68.7 times faster — less than a millisecond — a huge performance boost. NumPy is going to be very fast."},
    {n:10,title:"Linear Algebra & Matrix Math",blocks:[
      TBL(["Algebraic Method", "Standard Command Syntax", "Matrix Execution Example", "Mathematical Functionality & Use Cases"],[["Matrix Product","np.dot() / @","x.dot(y) or x @ y","Computes the dot product of two arrays for multi-dimensional operations."],["Matrix Inversion","numpy.linalg.inv","inv(X)","Calculates the mathematical inverse of a standard square matrix model."],["QR Decomposition","numpy.linalg.qr","q, r = qr(X)","Computes the QR decomposition parameters for a targeted multidimensional matrix."],["Decompositions","numpy.linalg.svd","u, s, vh = svd(X)","Computes the Singular Value Decomposition (SVD) for advanced data processing."]])
    ],
      tr:"We can do a bunch of linear algebra and matrix math, so you don't have to compute that yourself. You can do dot products, inverse calculations, and a bunch of decompositions. A lot of things are already built into NumPy, and it's doing it on these vectors, which are super fast."},
    {n:11,title:"Case Study: Random Walks",blocks:[
      DG("random-walk")
    ],
      tr:"We're not going to worry about the case study. I forgot why I put this slide in here. If you have any questions, please feel free to email me."},
    {n:12,title:"Questions?",blocks:[
      P("This concludes Chapter 4. We are now ready to progress to Chapter 5 to explore structured tabular datasets using pandas."),
      N("Official Book Repository: github.com/wesm/pydata-book")
    ],

{
  id:"d4",
  title:"Data Sets and Proper Statistical Analysis",
  subtitle:"Data Mining Techniques — data set partitioning, performance measures & statistical tests",
  week:"w2",
  slides:[
    {n:1,title:"Data Sets and Proper Statistical Analysis of Data Mining Techniques",blocks:[
      N("Title slide")
    ],
      tr:"So this week, we're going to talk about data sets and proper statistical analysis of data mining techniques."},
    {n:2,title:"Data Sets and Proper Statistical Analysis of Data Mining Techniques",blocks:[
      N("This one card merges the deck's repeated outline / section-transition slides (originally slides 2–3 and the dividers before each section)."),
      B("Data Sets and Partitions",0,null,false),
      B("Using Statistical Tests to Compare Methods",0,null,false),
      B("Conditions for the Safe Use of Parametric Tests",1,null,false),
      B("Normality Test over the Group of Data Sets and Algorithms",1,null,false),
      B("Non-parametric Tests for Comparing Two Algorithms in Multiple Data Set Analysis",1,null,false),
      B("Non-parametric Tests for Multiple Comparisons Among More than Two Algorithms",1,null,false)
    ],
      tr:"Throughout this course we've discussed how data mining algorithms discover patterns from data. However, building a model is only the first step. Once a model is created we must determine whether it actually performs well and whether it performs better than competing models. How should we evaluate the model? How can we estimate how well it will perform on new data? If one algorithm gets 92% accuracy and another 90%, is that difference meaningful, or could it simply be due to chance? This chapter covers six major topics that form the experimental methodology: first, data set partitioning; then statistical testing to compare methods; the assumptions required for parametric tests, including normality and independence; nonparametric techniques; and finally methods for comparing multiple algorithms simultaneously while controlling statistical error rates."},
    {n:3,title:"Data Sets and Partitions",blocks:[
      B("The ultimate goal of any DM process is to be applied to real life problems",0,null,false),
      B("Testing a technique in every problem is unfeasible",0,null,false),
      B("The common procedure is to evaluate such a technique in a set of standard DM problems (or data sets) publicly available",0,null,false)
    ],
      tr:"First we talk about data sets and partitioning. The purpose of all these techniques is to produce reliable conclusions about algorithm performance. The ultimate goal of any data mining process is to be applied to real-world problems — fraud detection, medical diagnoses, recommendation systems like Netflix recommending a movie, quality control. Ideally we would test every algorithm on every possible problem, but in practice that's impossible because there are countless data sets and many are private or unavailable. So the research community relies on benchmark data sets — publicly available data sets that have become standard evaluation tools — so researchers can compare results, reproduce experiments, and establish a shared understanding."},
    {n:4,title:"Data Set Partitioning",blocks:[
      B("The benchmark data sets are used with one goal:",0,null,false),
      B("To evaluate the performance of a given model over a set of well-known standard problems",0,null,true),
      B("However the data must be correctly used in order to avoid bias in the results",0,null,false)
    ],
      tr:"The primary purpose of benchmark data is to provide an objective basis for evaluation. However, simply selecting a benchmark data set is not enough. The way we use that data set has a tremendous impact on the reliability of the results. If one researcher separates training and testing data correctly while another evaluates a model on the same data used for training, their reported performance values may differ."},
    {n:5,title:"Data Set Partitioning",blocks:[
      B("If the whole data set is used for both build and validate the model generated by a ML algorithm we have no clue about how the model will behave with new, unseen cases",0,null,false),
      B("Two main problems may arise by using the same data to train and evaluate the model:",0,null,false),
      B("Underfitting happens when the model is poorly adjusted to the data, suffering from high error both in training and test (unseen) data",1,null,true),
      B("Overfitting happens when the model is too tightly adjusted to data offering high precision to known cases but behaving poorly with unseen data.",1,null,true)
    ],
      tr:"When the same data is used for both training and evaluation, we lose the ability to measure generalized performance. Two major problems can result. The first is underfitting: the model is too simple to capture the actual structure of the data, and performs poorly on both training and unseen data. The second is overfitting: the model learns detail, noise, and random variation specific to the training set, appears highly accurate during training, but performs poorly on new unseen data."},
    {n:6,title:"Data Set Partitioning",blocks:[
      DG("uf-of")
    ],
      tr:"So this diagram illustrates the situations. The model underfits when it's too simple — it fails to capture the pattern, and there's a lot of error even in training samples when complexity is low. With overfitting, as the model gets more complex it has less error on training samples but more error on unseen samples. Beyond the perfect model, the training error keeps going down and it looks like a great model, but the error on real-world examples goes through the roof."},
    {n:7,title:"Data Set Partitioning",blocks:[
      B("By using the whole data we may be aware of underfitting problems due to a low performance of the model.",0,null,false),
      B("The lack of data will also cause underfitting",1,null,false),
      B("Adjusting such a model to better fit the data may lead to overfitting",0,null,false),
      B("the lack of unseen case makes impossible to notice this situation",1,null,false),
      B("Overfitting may also appear due other reasons like noise",1,null,false)
    ],
      tr:"If we evaluate the model only using training data, underfitting can often be detected because performance is poor. Overfitting is much harder to identify, because the model may seem extremely accurate — it has seen all the data and is fitted to every case. For that reason, validation using unseen data is essential: evaluating on cases not used during training gives a much more realistic picture of how the model will behave in practice."},
    {n:8,title:"Data Set Partitioning",blocks:[
      B("In order to:",0,null,false),
      B("control the model’s performance",1,null,false),
      B("avoid overfitting",1,null,false),
      B("to have a generalizable estimation of the quality of the model obtained",1,null,false),
      B("several partitioning schemes are introduced in the literature",0,null,false),
      B("How to partition the data is a key issue as it will largely influence in the performance of the methods",0,null,false),
      B("Performing a bad partitioning will surely lead to incomplete and/or biased behavior about the model being evaluated.",0,null,false)
    ],
      tr:"To control the model's performance, avoid overfitting, and get a generalizable estimation of the quality of the model, several partitioning schemes are introduced. We need a training set and a testing set: we use the training set to train and the testing set to validate. We don't want to test the model with the same data we trained it with."},
    {n:9,title:"Data Set Partitioning: k-FCV",blocks:[
      B("The most common one is k-Fold Cross Validation (k-FCV):",0,null,false),
      B("In k-FCV, the original data set is randomly partitioned into k equal size folds or partitions",1,null,false),
      B("From the k partitions, one is retained as the validation data for testing the model, and the remaining k − 1 subsamples are used to build the model.",1,null,false),
      B("As we have k partitions, the process is repeated k times with each of the k subsamples used exactly once as the validation data.",1,null,false)
    ],
      tr:"The first and most common one is k-fold cross-validation. The data set is divided into k equally sized subsections called folds. During each iteration one fold serves as the testing set while the remaining folds are the training set. This continues until every fold has served as the testing set exactly once, and the final performance estimate is typically the average of the results from all iterations."},
    {n:10,title:"Data Set Partitioning: k-FCV",blocks:[
      DG("kfcv")
    ],
      tr:"This is just an image of how it works. This is all of our data; we divide it into k folds. In one evaluation this fold becomes the testing set and the rest become the training values, then we evaluate. We repeat so each fold serves once as the tester, then aggregate the statistics to determine how accurate the model really is. This way we're not overfitting, because some examples are held back to test the model."},
    {n:11,title:"Data Set Partitioning: k-FCV",blocks:[
      B("The value of k may vary, 5 and 10 being the most common ones",0,null,false),
      B("k needs to be adjusted to avoid to generate a small test partition poorly populated with examples that may bias the performance measures used.",0,null,false),
      B("If big data sets are being used, 10-FCV is usually utilized",1,null,false),
      B("For smaller data sets 5-FCV is more frequent",1,null,false)
    ],
      tr:"How do we choose the k? The value of k may vary; 5 and 10 are the most common. A larger k generally increases the amount of training data available during each iteration, which may improve the model, but it also increases computational cost. In practice, 10-fold cross-validation is the most commonly reported configuration for big data sets; for really small data sets we'd probably use 5."},
    {n:12,title:"Data Set Partitioning: k-FCV",blocks:[
      B("Simple k-FCV may also lead to disarranging the proportion of examples from each class in the test partition",0,null,false),
      B("The most commonly employed method in the literature to avoid this problem is stratified k-FCV",0,null,false),
      B("It places an equal number of samples of each class on each partition to maintain class distributions equal in all partitions",1,null,false)
    ],
      tr:"Simple cross-validation may also disarrange the proportion of examples of each class in each test partition. If some class only appears in one partition, that's a problem. The most commonly employed method to avoid this is stratified cross-validation, which places an equal number of samples of each class in each partition to keep the class distribution balanced — so we manipulate the data a little instead of selecting randomly."},
    {n:13,title:"Data Set Partitioning: 5×2 CV",blocks:[
      B("The whole data set is randomly partitioned in two subsets A and B.",0,null,false),
      B("The model is first built using A and validated with B",1,null,false),
      B("Then the process is reversed with the model built with B and tested with A",1,null,false),
      B("This partitioning process is repeated as desired",0,null,false),
      B("the performance measure in each step is aggregated every time the process is repeated",1,null,false)
    ],
      tr:"In 5×2 cross-validation the whole data set is randomly partitioned into two subsets, A and B. The model is first built using A and validated with B; then the process is reversed, built with B and tested with A. This produces two evaluation results, and the entire procedure is repeated five times using different random partitions. Because the split produces completely separate training and testing data, this approach is frequently used in algorithm-comparison studies."},
    {n:14,title:"Data Set Partitioning: 5×2 CV",blocks:[
      DG("cv52")
    ],
      tr:"Let's look at how it works: we partition into two pieces, use test value 1 with training data, then training data with test value 2, and aggregate the results. We repeat this five times, randomly divided each time. With giant data sets it's very rare that all of one class ends up on one side, so there's a good chance all classes are represented."},
    {n:15,title:"Data Set Partitioning: Leave one out",blocks:[
      B("Is an extreme case of k-FCV  k equals the number of examples in the data set",0,null,false),
      B("In each step only one instance is used to test the model whereas the rest of instances are used to learn it.",0,null,false)
    ],
      tr:"Leave-one-out cross-validation is an extreme version of k-fold where k equals the number of examples in the data set. Each step uses only one instance to test the model while the rest are used to learn it. If there are 1,000 observations it creates 1,000 folds. The major advantage is that almost all available data is used for training; the primary disadvantage is the computational cost — training thousands of models can be very expensive."},
    {n:16,title:"Performance Measures",blocks:[
      B("Predictive processes like classification and regression rely in a measure of how well the model fits the data",0,null,false),
      B("In classification literature we can observe that most of the performance measures are designed for binary-class problems",0,null,false),
      B("Well-known accuracy measures for binary-class problems are classification rate, precision, sensitivity, specificity, G-mean, F-score, AUC, Youden’s index γ and Cohen’s Kappa",0,null,false)
    ],
      tr:"Now the performance measures. Once we've chosen a validation strategy and generated predictions, we need a way of measuring how well the model performed. Simply making predictions is not enough — we must quantify their quality. Several metrics are common in data mining, including classification accuracy, precision, sensitivity or recall, specificity, G-mean, F-score, area under the curve, and Cohen's kappa. Each emphasizes a different aspect, and the choice depends on the problem."},
    {n:17,title:"Performance Measures",blocks:[
      B("Some of the two-class accuracy measures have been adapted for multi-class problems.",0,null,false),
      B("An example is approximating multi-class ROC analysis",0,null,false),
      B("is theoretically possible but its computation is still restrictive",1,null,false),
      B("Only two measures are widely used because of their simplicity and successful application when the number of classes is large enough",0,null,false),
      B("Classification rate (also known as accuracy): is the number of successful hits relative to the total number of classifications",1,null,false),
      B("Cohen’s kappa",1,null,false)
    ],
      tr:"Many performance measures were originally developed for binary classification problems with only two classes, such as positive versus negative or fraud versus non-fraud. When data sets contain multiple classes, evaluation becomes more complicated. Two measures are particularly common in multi-class studies: classification accuracy and Cohen's kappa. Accuracy remains popular because it's easy to understand and communicate to non-specialists."},
    {n:18,title:"Performance Measures",blocks:[
      B("Cohen’s kappa is an alternative to classification rate, a method, known for decades, that compensates for random hits. Using the resulting confusion matrix, Cohen’s kappa measure can be obtained using the following expression:",0,null,false),
      B("Cohen’s kappa ranges from −1 (total agreement) through 0 (random classification) to 1 (perfect agreement)",0,null,false),
      IMG("Formula: Cohen's kappa (from the confusion matrix)")
    ],
      tr:"Now Cohen's kappa — an alternative to the classification rate. If a classifier appears to perform well, how much of that is due to actual learning and how much could have happened by chance? Suppose a data set has 90% of examples from one class; a classifier could get 90% accuracy just by always predicting the majority class. In fraud detection, 99% is non-fraud, so always predicting non-fraud is 99% accurate — that's a problem. Kappa corrects this by incorporating the agreement expected due to random guessing. A value of 1 is perfect agreement, 0 is equivalent to random guessing, and negative values are worse than random guessing. That's where we'll leave this lecture; next week we move into using statistical tests to compare these methods."}
  ],
